name: Sync Tenzir Skill

on:
  schedule:
    # Daily; the docs deploy continuously via Cloudflare, so a daily pull
    # keeps the skill fresh without cross-repo plumbing.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to sync the documentation from"
        required: false
        default: "https://tenzir.com"
        type: string
      release:
        description: "Docs release whose agent map to copy, such as 7.0.0, or latest"
        required: false
        default: "latest"
        type: string

permissions:
  contents: write

concurrency:
  group: "sync-tenzir-skill"
  cancel-in-progress: false

jobs:
  # Scheduled runs only fire on the default branch. Branches that carry the
  # skill for an unreleased version, such as tenzir-7, set their own
  # release default; start their sync from here so they stay fresh too.
  sync-branches:
    name: Start syncs on version branches
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCHES: tenzir-7
    steps:
      - name: Dispatch existing branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in $BRANCHES; do
            if gh api "repos/${{ github.repository }}/branches/$branch" --silent 2>/dev/null; then
              gh workflow run sync-tenzir-skill.yaml --repo "${{ github.repository }}" --ref "$branch"
            fi
          done

  sync:
    name: Copy tenzir
    runs-on: ubuntu-latest

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.TENZIR_GITHUB_APP_ID }}
          private-key: ${{ secrets.TENZIR_GITHUB_APP_PRIVATE_KEY }}
          owner: tenzir

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Copy tenzir skill
        id: copy
        shell: bash
        env:
          BASE_URL: ${{ inputs.base_url || 'https://tenzir.com' }}
          RELEASE: ${{ inputs.release || 'latest' }}
        run: |
          set -euo pipefail
          uv run scripts/copy-tenzir-skill.py \
            --base-url "$BASE_URL" \
            --release "$RELEASE" \
            --output-dir skills/tenzir

      - name: Validate skills
        shell: bash
        run: scripts/validate-skills

      - name: Stage changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- skills/tenzir

      - name: Commit changes
        uses: planetscale/ghcommit-action@v0.2.0
        with:
          commit_message: "Sync tenzir skill from ${{ steps.copy.outputs.source }}"
          repo: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          empty: false
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

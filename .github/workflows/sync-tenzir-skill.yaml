name: Sync Tenzir Skill

on:
  schedule:
    # Daily; the docs deploy continuously via Cloudflare, so a daily pull
    # keeps the skill fresh without cross-repo plumbing.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site to sync the documentation from"
        required: false
        default: "https://tenzir.com"
        type: string
      llms_path:
        description: "Index to build from: /llms.txt for the latest release, /docs/v<version>/llms.txt for one release"
        required: false
        default: "/llms.txt"
        type: string

permissions:
  contents: write

concurrency:
  group: "sync-tenzir-skill"
  cancel-in-progress: false

jobs:
  # Scheduled runs only fire on the default branch. Branches that carry the
  # skill for an unreleased version, such as tenzir-7, set their own
  # llms_path default; start their sync from here so they stay fresh too.
  sync-branches:
    name: Start syncs on version branches
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCHES: tenzir-7
    steps:
      - name: Dispatch existing branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in $BRANCHES; do
            if gh api "repos/${{ github.repository }}/branches/$branch" --silent 2>/dev/null; then
              gh workflow run sync-tenzir-skill.yaml --repo "${{ github.repository }}" --ref "$branch"
            fi
          done

  sync:
    name: Rebuild tenzir
    runs-on: ubuntu-latest

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.TENZIR_GITHUB_APP_ID }}
          private-key: ${{ secrets.TENZIR_GITHUB_APP_PRIVATE_KEY }}
          owner: tenzir

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Download docs pages
        shell: bash
        env:
          BASE_URL: ${{ inputs.base_url || 'https://tenzir.com' }}
          LLMS_PATH: ${{ inputs.llms_path || '/llms.txt' }}
        run: |
          set -euo pipefail

          base="${BASE_URL%/}"
          mkdir -p /tmp/tenzir-skill
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/llms.txt "$base$LLMS_PATH"

          # llms.txt is the manifest: every documentation page appears as a
          # markdown link. The generator navigates a docs-map heading tree,
          # so convert first. Docs pages live under /docs/ on the website, or
          # under /docs/v<version>/ for a single release, but at the tree root
          # for the skill generator; integration pages keep their
          # integrations/ prefix. Skip the changelog and pages outside the
          # docs tree.
          uv run scripts/llms-txt-to-docs-map.py /tmp/llms.txt /tmp/docs-map.md

          grep -oE "$base/[A-Za-z0-9./_-]+\.md" /tmp/docs-map.md \
            | sort -u > /tmp/urls.txt

          download() {
            local url="$1" path
            path="${url#"$base"/}"
            case "$path" in
              docs/*)
                path="${path#docs/}"
                if [[ $path =~ ^v[0-9]+\.[0-9]+\.[0-9]+/ ]]; then
                  path="${path#*/}"
                fi
                ;;
              integrations/*) ;;
              *) return 0 ;;
            esac
            mkdir -p "/tmp/tenzir-skill/$(dirname "$path")"
            curl -fsSL --retry 3 --retry-all-errors \
              -o "/tmp/tenzir-skill/$path" "$url"
          }
          export -f download
          export base

          xargs -P 8 -n 1 -I {} bash -c 'download "$@"' _ {} < /tmp/urls.txt
          echo "Downloaded $(find /tmp/tenzir-skill -name '*.md' | wc -l) pages"

      - name: Rebuild tenzir skill
        shell: bash
        run: |
          set -euo pipefail
          uv run scripts/generate-tenzir-skill.py \
            --input-dir /tmp/tenzir-skill \
            --docs-map /tmp/docs-map.md \
            --output-dir skills/tenzir

      - name: Validate skills
        shell: bash
        run: scripts/validate-skills

      - name: Stage changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- skills/tenzir

      - name: Commit changes
        uses: planetscale/ghcommit-action@v0.2.0
        with:
          commit_message: "Sync tenzir skill from ${{ inputs.base_url || 'https://tenzir.com' }}${{ inputs.llms_path || '/llms.txt' }}"
          repo: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          empty: false
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

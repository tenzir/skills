  action:
    caption: Action
    requirement: optional
    profile: security_control
    definition: v1.4.0/classes/base_event.yaml
  action_id:
    caption: Action ID
    requirement: recommended
    profile: security_control
    definition: v1.4.0/classes/base_event.yaml
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event.
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Query
        description: The DNS query request.
      '2':
        caption: Response
        description: The DNS query response.
      '6':
        caption: Traffic
        description: Bidirectional DNS request and response traffic.
      '99':
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  activity_name:
    caption: Activity
    requirement: optional
    definition: v1.4.0/classes/base_event.yaml

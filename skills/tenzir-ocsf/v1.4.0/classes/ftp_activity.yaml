# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: ftp_activity
caption: FTP Activity
uid: 4008
category: network
category_uid: 4
extends: network
description: File Transfer Protocol (FTP) Activity events report file transfers between a server and a client as seen on the network.
profiles: [cloud, container, data_classification, datetime, host, load_balancer, network_proxy, osint, security_control]
constraints:
  at_least_one: [dst_endpoint, src_endpoint]
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event.
    enum:
      0:
        caption: Unknown
        description: The event activity is unknown.
      1:
        caption: Put
        description: File upload to the FTP or SFTP site.
      2:
        caption: Get
        description: File download from the FTP or SFTP site.
      3:
        caption: Poll
        description: Poll directory for specific file(s) or folder(s) at the FTP or SFTP site location.
      4:
        caption: Delete
        description: Delete file(s) from the FTP or SFTP site.
      5:
        caption: Rename
        description: Rename the file(s) in the FTP or SFTP site.
      6:
        caption: List
        description: List files in a specified directory.
      99:
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event.
    enum:
      4:
        caption: Network Activity
        description: Network Activity events.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event.
    enum:
      4008:
        caption: FTP Activity
        description: File Transfer Protocol (FTP) Activity events report file transfers between a server and a client as seen on the network.

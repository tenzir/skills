name: dhcp_activity
caption: DHCP Activity
uid: 4004
category: network
category_uid: 4
extends: network
description: DHCP Activity events report MAC to IP assignment via DHCP from a client or server.
profiles: [cloud, container, data_classification, datetime, host, load_balancer, network_proxy, osint, security_control]
constraints:
  at_least_one: [dst_endpoint, src_endpoint]

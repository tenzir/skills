# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: authentication
caption: Authentication
uid: 3002
category: iam
category_uid: 3
extends: iam
description: Authentication events report authentication session activities such as user attempts a logon or logoff, successfully or otherwise.
profiles: [cloud, container, data_classification, datetime, host, osint, security_control]
constraints:
  at_least_one: [service, dst_endpoint]
associations:
  actor.user: [src_endpoint]
  dst_endpoint: [user]
  src_endpoint: [actor.user]
  user: [dst_endpoint]
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event.
    enum:
      0:
        caption: Unknown
        description: The event activity is unknown.
      1:
        caption: Logon
        description: A new logon session was requested.
      2:
        caption: Logoff
        description: A logon session was terminated and no longer exists.
      3:
        caption: Authentication Ticket
        description: A Kerberos authentication ticket (TGT) was requested.
      4:
        caption: Service Ticket Request
        description: A Kerberos service ticket was requested.
      5:
        caption: Service Ticket Renew
        description: A Kerberos service ticket was renewed.
      6:
        caption: Preauth
        description: A preauthentication stage was engaged.
      99:
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event.
    enum:
      3:
        caption: Identity & Access Management
        description: Identity & Access Management (IAM) events relate to the supervision of the system's authentication and access control model. Examples of such events are the success or failure of authentication, granting of authority, password change, entity change, privileged use etc.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event.
    enum:
      3002:
        caption: Authentication
        description: Authentication events report authentication session activities such as user attempts a logon or logoff, successfully or otherwise.
  cloud: {caption: Cloud, type: object_t, object: cloud, requirement: required, group: primary, profile: cloud, from: base_event}
  metadata: {caption: Metadata, type: object_t, object: metadata, requirement: required, group: context, from: base_event}
  osint: {caption: OSINT, type: object_t, object: osint, array: true, requirement: required, group: primary, profile: osint, from: base_event}
  severity_id: {caption: Severity ID, type: integer_t, requirement: required, group: classification, sibling: severity, enum: {0: Unknown, 1: Informational, 2: Low, 3: Medium, 4: High, 5: Critical, 6: Fatal, 99: Other}, from: base_event}
  time: {caption: Event Time, type: timestamp_t, requirement: required, group: occurrence, from: base_event}
  type_uid:
    caption: Type ID
    type: long_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event/finding type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
  user:
    caption: User
    type: object_t
    object: user
    requirement: required
    group: primary
    observable: 21
    description: The subject (user/role or account) to authenticate.
  action_id: {caption: Action ID, type: integer_t, requirement: recommended, group: primary, profile: security_control, sibling: action, enum: {0: Unknown, 1: Allowed, 2: Denied, 3: Observed, 4: Modified, 99: Other}, from: base_event}
  actor: {caption: Actor, type: object_t, object: actor, requirement: recommended, group: context, from: iam}
  auth_protocol:
    caption: Auth Protocol
    type: string_t
    requirement: recommended
    group: primary
    description: The authentication protocol as defined by the caption of `auth_protocol_id`. In the case of `Other`, it is defined by the event source.
  auth_protocol_id:
    caption: Auth Protocol ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: auth_protocol
    description: The normalized identifier of the authentication protocol used to create the user session.
    enum:
      0:
        caption: Unknown
        description: The authentication protocol is unknown.
      1:
        caption: NTLM
      2:
        caption: Kerberos
      3:
        caption: Digest
      4:
        caption: OpenID
      5:
        caption: SAML
      6:
        caption: OAUTH 2.0
      7:
        caption: PAP
      8:
        caption: CHAP
      9:
        caption: EAP
      10:
        caption: RADIUS
      11:
        caption: Basic Authentication
      99:
        caption: Other
        description: The authentication protocol is not mapped. See the `auth_protocol` attribute, which contains a data source specific value.
  certificate:
    caption: Certificate
    type: object_t
    object: certificate
    requirement: recommended
    group: primary
    description: The certificate associated with the authentication or pre-authentication (Kerberos).
  confidence_id: {caption: Confidence ID, type: integer_t, requirement: recommended, group: context, profile: security_control, sibling: confidence, enum: {0: Unknown, 1: Low, 2: Medium, 3: High, 99: Other}, from: base_event}
  device: {caption: Device, type: object_t, object: device, requirement: recommended, group: primary, profile: host, observable: 20, from: base_event}
  disposition_id:
    caption: Disposition ID
    type: integer_t
    requirement: recommended
    group: primary
    profile: security_control
    sibling: disposition
    enum:
      0: Unknown
      1: Allowed
      2: Blocked
      3: Quarantined
      4: Isolated
      5: Deleted
      6: Dropped
      7: Custom Action
      8: Approved
      9: Restored
      10: Exonerated
      11: Corrected
      12: Partially Corrected
      13: Uncorrected
      14: Delayed
      15: Detected
      16: No Action
      17: Logged
      18: Tagged
      19: Alert
      20: Count
      21: Reset
      22: Captcha
      23: Challenge
      24: Access Revoked
      25: Rejected
      26: Unauthorized
      27: Error
      99: Other
    from: base_event
  dst_endpoint:
    caption: Destination Endpoint
    type: object_t
    object: network_endpoint
    requirement: recommended
    group: primary
    observable: 20
    description: The endpoint to which the authentication was targeted.
  is_alert: {caption: Alert, type: boolean_t, requirement: recommended, group: primary, profile: security_control, from: base_event}
  is_mfa:
    caption: Multi Factor Authentication
    type: boolean_t
    requirement: recommended
    group: primary
    description: Indicates whether Multi Factor Authentication was used during authentication.
  is_remote:
    caption: Remote
    type: boolean_t
    requirement: recommended
    group: primary
    description: The attempted authentication is over a remote connection.
  logon_type:
    caption: Logon Type
    type: string_t
    requirement: recommended
    group: primary
    description: The logon type, normalized to the caption of the logon_type_id value. In the case of 'Other', it is defined by the event source.
  logon_type_id:
    caption: Logon Type ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: logon_type
    description: The normalized logon type identifier.
    enum:
      0:
        caption: Unknown
        description: The logon type is unknown.
      1:
        caption: System
        description: Used only by the System account, for example at system startup.
      2:
        caption: Interactive
        description: A local logon to device console.
      3:
        caption: Network
        description: A user or device logged onto this device from the network.
      4:
        caption: Batch
        description: A batch server logon, where processes may be executing on behalf of a user without their direct intervention.
      5:
        caption: OS Service
        description: A logon by a service or daemon that was started by the OS.
      7:
        caption: Unlock
        description: A user unlocked the device.
      8:
        caption: Network Cleartext
        description: A user logged on to this device from the network. The user's password in the authentication package was not hashed.
      9:
        caption: New Credentials
        description: A caller cloned its current token and specified new credentials for outbound connections. The new logon session has the same local identity, but uses different credentials for other network connections.
      10:
        caption: Remote Interactive
        description: A remote logon using Terminal Services or remote desktop application.
      11:
        caption: Cached Interactive
        description: A user logged on to this device with network credentials that were stored locally on the device and the domain controller was not contacted to verify the credentials.
      12:
        caption: Cached Remote Interactive
        description: Same as Remote Interactive. This is used for internal auditing.
      13:
        caption: Cached Unlock
        description: Workstation logon.
      99:
        caption: Other
        description: The logon type is not mapped. See the `logon_type` attribute, which contains a data source specific value.
  message: {caption: Message, type: string_t, requirement: recommended, group: primary, from: base_event}
  observables: {caption: Observables, type: object_t, object: observable, array: true, requirement: recommended, group: primary, from: base_event}
  service:
    caption: Service
    type: object_t
    object: service
    requirement: recommended
    group: primary
    description: The service or gateway to which the user or process is being authenticated
  session:
    caption: Session
    type: object_t
    object: session
    requirement: recommended
    group: primary
    description: The authenticated user or service session.
  src_endpoint: {caption: Source Endpoint, type: object_t, object: network_endpoint, requirement: recommended, group: primary, observable: 20, from: iam}
  status: {caption: Status, type: string_t, requirement: recommended, group: primary, from: base_event}
  status_code: {caption: Status Code, type: string_t, requirement: recommended, group: primary, from: base_event}
  status_detail:
    caption: Status Detail
    type: string_t
    requirement: recommended
    group: primary
    description: |-
      The details about the authentication request. For example, possible details for Windows logon or logoff events are:

      - Success

      - LOGOFF_USER_INITIATED
      - LOGOFF_OTHER

      - Failure

      - USER_DOES_NOT_EXIST
      - INVALID_CREDENTIALS
      - ACCOUNT_DISABLED
      - ACCOUNT_LOCKED_OUT
      - PASSWORD_EXPIRED
  status_id: {caption: Status ID, type: integer_t, requirement: recommended, group: primary, sibling: status, enum: {0: Unknown, 1: Success, 2: Failure, 99: Other}, from: base_event}
  timezone_offset: {caption: Timezone Offset, type: integer_t, requirement: recommended, group: occurrence, from: base_event}
  action: {caption: Action, type: string_t, requirement: optional, group: primary, profile: security_control, from: base_event}
  activity_name: {caption: Activity, type: string_t, requirement: optional, group: classification, from: base_event}
  api: {caption: API Details, type: object_t, object: api, requirement: optional, group: context, profile: cloud, from: base_event}
  attacks: {caption: MITRE ATT&CK® Details, type: object_t, object: attack, array: true, requirement: optional, group: primary, profile: security_control, from: base_event}
  auth_factors:
    caption: Authentication Factors
    type: object_t
    object: auth_factor
    array: true
    requirement: optional
    group: context
    description: Describes a category of methods used for identity verification in an authentication attempt.
  authorizations: {caption: Authorization Information, type: object_t, object: authorization, array: true, requirement: optional, group: primary, profile: security_control, from: base_event}
  category_name:
    caption: Category
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event category name, as defined by category_uid value: `Identity & Access Management`.'
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event class name, as defined by class_uid value: `Authentication`.'
  confidence: {caption: Confidence, type: string_t, requirement: optional, group: context, profile: security_control, from: base_event}
  confidence_score: {caption: Confidence Score, type: integer_t, requirement: optional, group: context, profile: security_control, from: base_event}
  count: {caption: Count, type: integer_t, requirement: optional, group: occurrence, from: base_event}
  disposition: {caption: Disposition, type: string_t, requirement: optional, group: primary, profile: security_control, from: base_event}
  duration: {caption: Duration Milliseconds, type: long_t, requirement: optional, group: occurrence, from: base_event}
  end_time: {caption: End Time, type: timestamp_t, requirement: optional, group: occurrence, from: base_event}
  end_time_dt: {caption: End Time, type: datetime_t, requirement: optional, group: occurrence, profile: datetime, from: base_event}
  enrichments: {caption: Enrichments, type: object_t, object: enrichment, array: true, requirement: optional, group: context, from: base_event}
  firewall_rule: {caption: Firewall Rule, type: object_t, object: firewall_rule, requirement: optional, group: primary, profile: security_control, from: base_event}
  http_request: {caption: HTTP Request, type: object_t, object: http_request, requirement: optional, group: context, from: iam}
  http_response: {caption: HTTP Response, type: object_t, object: http_response, requirement: optional, group: context, from: iam}
  is_cleartext:
    caption: Cleartext Credentials
    type: boolean_t
    requirement: optional
    group: context
    description: |-
      Indicates whether the credentials were passed in clear text.

      Note: True if the credentials were passed in a clear text protocol such as FTP or TELNET, or if Windows detected that a user's logon password was passed to the authentication package in clear text.
  is_new_logon:
    caption: New Logon
    type: boolean_t
    requirement: optional
    group: context
    description: Indicates logon is from a device not seen before or a first time account logon.
  logon_process:
    caption: Logon Process
    type: object_t
    object: process
    requirement: optional
    group: context
    observable: 25
    description: The trusted process that validated the authentication credentials.
  malware: {caption: Malware, type: object_t, object: malware, array: true, requirement: optional, group: primary, profile: security_control, from: base_event}
  policy: {caption: Policy, type: object_t, object: policy, requirement: optional, group: primary, profile: security_control, from: base_event}
  raw_data: {caption: Raw Data, type: string_t, requirement: optional, group: context, from: base_event}
  risk_details: {caption: Risk Details, type: string_t, requirement: optional, group: context, profile: security_control, from: base_event}
  risk_level: {caption: Risk Level, type: string_t, requirement: optional, group: context, profile: security_control, from: base_event}
  risk_level_id: {caption: Risk Level ID, type: integer_t, requirement: optional, group: context, profile: security_control, sibling: risk_level, enum: {0: Info, 1: Low, 2: Medium, 3: High, 4: Critical, 99: Other}, from: base_event}
  risk_score: {caption: Risk Score, type: integer_t, requirement: optional, group: context, profile: security_control, from: base_event}
  severity: {caption: Severity, type: string_t, requirement: optional, group: classification, from: base_event}
  start_time: {caption: Start Time, type: timestamp_t, requirement: optional, group: occurrence, from: base_event}
  start_time_dt: {caption: Start Time, type: datetime_t, requirement: optional, group: occurrence, profile: datetime, from: base_event}
  time_dt: {caption: Event Time, type: datetime_t, requirement: optional, group: occurrence, profile: datetime, from: base_event}
  type_name: {caption: Type Name, type: string_t, requirement: optional, group: classification, from: base_event}
  unmapped: {caption: Unmapped Data, type: object_t, object: object, requirement: optional, group: context, from: base_event}

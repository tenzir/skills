# Attributes with a `definition` path are inherited unchanged. Read that file
# for their type, object, description, enum, and observable.
name: network_endpoint
caption: Network Endpoint
extends: endpoint
observable: 20
description: The Network Endpoint object describes characteristics of a network endpoint. These can be a source or destination of a network connection.
profiles: [container]
constraints:
  at_least_one: [ip, uid, name, hostname, svc_name, instance_uid, interface_uid, interface_name, domain]
referenced_by:
  classes:
    account_change: [src_endpoint]
    airborne_broadcast_activity: [dst_endpoint, src_endpoint]
    api_activity: [dst_endpoint, src_endpoint]
    authentication: [dst_endpoint, src_endpoint]
    authorize_session: [dst_endpoint, src_endpoint]
    data_security_finding: [dst_endpoint, src_endpoint]
    datastore_activity: [dst_endpoint, src_endpoint]
    dhcp_activity: [dst_endpoint, src_endpoint]
    dns_activity: [dst_endpoint, src_endpoint]
    drone_flights_activity: [dst_endpoint, src_endpoint]
    email_activity: [dst_endpoint, src_endpoint]
    entity_management: [src_endpoint]
    event_log_actvity: [dst_endpoint, src_endpoint]
    file_hosting: [dst_endpoint, src_endpoint]
    ftp_activity: [dst_endpoint, src_endpoint]
    group_management: [src_endpoint]
    http_activity: [dst_endpoint, src_endpoint]
    network_activity: [dst_endpoint, src_endpoint]
    network_file_activity: [dst_endpoint, src_endpoint]
    ntp_activity: [dst_endpoint, src_endpoint]
    rdp_activity: [dst_endpoint, src_endpoint]
    smb_activity: [dst_endpoint, src_endpoint]
    ssh_activity: [dst_endpoint, src_endpoint]
    tunnel_activity: [dst_endpoint, src_endpoint]
    user_access: [src_endpoint]
    web_resource_access_activity: [src_endpoint]
    web_resources_activity: [dst_endpoint, src_endpoint]
  objects:
    endpoint_connection: [network_endpoint]
    evidences: [dst_endpoint, src_endpoint]
    load_balancer: [dst_endpoint]
attributes:
  agent_list:
    caption: Agent List
    requirement: optional
    definition: v1.4.0/objects/endpoint.yaml
  autonomous_system:
    caption: Autonomous System
    type: object_t
    object: autonomous_system
    requirement: optional
    description: The Autonomous System details associated with an IP address.
  container:
    caption: Container
    requirement: recommended
    profile: container
    definition: v1.4.0/objects/endpoint.yaml
  domain:
    caption: Domain
    requirement: optional
    definition: v1.4.0/objects/endpoint.yaml
  hostname:
    caption: Hostname
    requirement: recommended
    definition: v1.4.0/objects/endpoint.yaml
  hw_info:
    caption: Hardware Info
    requirement: optional
    definition: v1.4.0/objects/endpoint.yaml
  instance_uid:
    caption: Instance ID
    requirement: recommended
    definition: v1.4.0/objects/endpoint.yaml
  interface_name:
    caption: Network Interface Name
    requirement: recommended
    definition: v1.4.0/objects/endpoint.yaml
  interface_uid:
    caption: Network Interface ID
    requirement: recommended
    definition: v1.4.0/objects/endpoint.yaml
  intermediate_ips:
    caption: Intermediate IP Addresses
    type: ip_t
    array: true
    requirement: optional
    observable: 2
    description: The intermediate IP Addresses. For example, the IP addresses in the HTTP X-Forwarded-For header.
  ip:
    caption: IP Address
    requirement: recommended
    definition: v1.4.0/objects/endpoint.yaml
  location:
    caption: Geo Location
    requirement: optional
    definition: v1.4.0/objects/endpoint.yaml
  mac:
    caption: MAC Address
    requirement: optional
    definition: v1.4.0/objects/endpoint.yaml
  name:
    caption: Name
    requirement: recommended
    definition: v1.4.0/objects/endpoint.yaml
  namespace_pid:
    caption: Namespace PID
    requirement: recommended
    profile: container
    definition: v1.4.0/objects/endpoint.yaml
  os:
    caption: OS
    requirement: optional
    definition: v1.4.0/objects/endpoint.yaml
  owner:
    caption: Owner
    requirement: recommended
    definition: v1.4.0/objects/endpoint.yaml
  port:
    caption: Port
    type: port_t
    requirement: recommended
    observable: 11
    description: The port used for communication within the network connection.
  proxy_endpoint:
    caption: Proxy Endpoint
    type: object_t
    object: network_proxy
    requirement: optional
    observable: 20
    description: The network proxy information pertaining to a specific endpoint. This can be used to describe information pertaining to network address translation (NAT).
  subnet_uid:
    caption: Subnet UID
    requirement: optional
    definition: v1.4.0/objects/endpoint.yaml
  svc_name:
    caption: Service Name
    type: string_t
    requirement: recommended
    description: The service name in service-to-service connections. For example, AWS VPC logs the pkt-src-aws-service and pkt-dst-aws-service fields identify the connection is coming from or going to an AWS service.
  type:
    caption: Type
    type: string_t
    requirement: optional
    description: 'The network endpoint type. For example: `unknown`, `server`, `desktop`, `laptop`, `tablet`, `mobile`, `virtual`, `browser`, or `other`.'
  type_id:
    caption: Type ID
    type: integer_t
    requirement: recommended
    sibling: type
    description: The network endpoint type ID.
    enum:
      '0':
        caption: Unknown
        description: The type is unknown.
      '1':
        caption: Server
        description: A [server](https://d3fend.mitre.org/dao/artifact/d3f:Server/).
      '2':
        caption: Desktop
        description: A [desktop computer](https://d3fend.mitre.org/dao/artifact/d3f:DesktopComputer/).
      '3':
        caption: Laptop
        description: A [laptop computer](https://d3fend.mitre.org/dao/artifact/d3f:LaptopComputer/).
      '4':
        caption: Tablet
        description: A [tablet computer](https://d3fend.mitre.org/dao/artifact/d3f:TabletComputer/).
      '5':
        caption: Mobile
        description: A [mobile phone](https://d3fend.mitre.org/dao/artifact/d3f:MobilePhone/).
      '6':
        caption: Virtual
        description: A [virtual machine](https://d3fend.mitre.org/dao/artifact/d3f:VirtualizationSoftware/).
      '7':
        caption: IOT
        description: An [IOT (Internet of Things) device](https://www.techtarget.com/iotagenda/definition/IoT-device).
      '8':
        caption: Browser
        description: A [web browser](https://d3fend.mitre.org/dao/artifact/d3f:Browser/).
      '9':
        caption: Firewall
        description: A [networking firewall](https://d3fend.mitre.org/dao/artifact/d3f:Firewall/).
      '10':
        caption: Switch
        description: A [networking switch](https://d3fend.mitre.org/dao/artifact/d3f:Switch/).
      '11':
        caption: Hub
        description: A [networking hub](https://en.wikipedia.org/wiki/Ethernet_hub).
      '12':
        caption: Router
        description: A [networking router](https://d3fend.mitre.org/dao/artifact/d3f:Router/).
      '13':
        caption: IDS
        description: An [intrusion detection system](https://d3fend.mitre.org/dao/artifact/d3f:IntrusionDetectionSystem/).
      '14':
        caption: IPS
        description: An [intrusion prevention system](https://d3fend.mitre.org/dao/artifact/d3f:IntrusionPreventionSystem/).
      '15':
        caption: Load Balancer
        description: A  [Load Balancer device.](https://en.wikipedia.org/wiki/Load_balancing_(computing))
      '99':
        caption: Other
        description: The type is not mapped. See the `type` attribute, which contains a data source specific value.
  uid:
    caption: Unique ID
    requirement: recommended
    definition: v1.4.0/objects/endpoint.yaml
  vlan_uid:
    caption: VLAN
    requirement: optional
    definition: v1.4.0/objects/endpoint.yaml
  vpc_uid:
    caption: VPC UID
    requirement: optional
    definition: v1.4.0/objects/endpoint.yaml
  zone:
    caption: Network Zone
    requirement: optional
    definition: v1.4.0/objects/endpoint.yaml

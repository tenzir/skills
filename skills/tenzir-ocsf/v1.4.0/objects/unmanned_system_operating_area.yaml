name: unmanned_system_operating_area
caption: Unmanned System Operating Area
extends: location
observable: 26
description: The Unmanned System Operating Area object describes details about a precise area of operations for a UAS flight or mission.
profiles: [datetime]
constraints:
  at_least_one: [city, country, postal_code, region]
referenced_by:
  classes:
    airborne_broadcast_activity: [unmanned_system_operating_area]
    drone_flights_activity: [unmanned_system_operating_area]
attributes:
  aerial_height:
    caption: Aerial Height
    type: string_t
    requirement: optional
    from: location
    description: 'Expressed as either height above takeoff location or height above ground level (AGL) for a UAS current location. This value is provided in meters and must have a minimum resolution of 1 m. Special Values: `Invalid`, `No Value`, or `Unknown: -1000 m`.'
  altitude_ceiling:
    caption: Altitude Ceiling
    type: string_t
    requirement: optional
    description: 'Maximum altitude (WGS-84 HAE) for a group or an Intent-Based Network Participant. Measured in meters. Special Values: `Invalid`, `No Value`, or `Unknown: -1000 m`.'
  altitude_floor:
    caption: Altitude Floor
    type: string_t
    requirement: optional
    description: 'Minimum altitude (WGS-84 HAE) for a group or an Intent-Based Network Participant. Measured in meters. Special Values: `Invalid`, `No Value`, or `Unknown: -1000 m`.'
  city:
    caption: City
    type: string_t
    requirement: recommended
    from: location
    description: The name of the city.
  continent:
    caption: Continent
    type: string_t
    requirement: recommended
    from: location
    description: The name of the continent.
  coordinates:
    caption: Coordinates
    type: float_t
    array: true
    requirement: optional
    from: location
    deprecated:
      since: 1.2.0
      message: Use specific `lat, long` attributes instead.
    description: 'A two-element array, containing a longitude/latitude pair. The format conforms with [GeoJSON](https://geojson.org). For example: `[-73.983, 40.719]`.'
  count:
    caption: Count
    type: integer_t
    requirement: recommended
    description: Indicates the number of UAS in the operating area.
  country:
    caption: Country
    type: string_t
    requirement: recommended
    from: location
    observable: 14
    description: |-
      The ISO 3166-1 Alpha-2 country code.

      Note: The two letter country code should be capitalized. For example: `US` or `CA`.
    references:
    - description: ISO 3166-1 alpha-2 codes
      url: https://www.iso.org/obp/ui/#iso:pub:PUB500001:en
  desc:
    caption: Description
    type: string_t
    requirement: optional
    from: location
    description: The description of the geographical location.
  end_time:
    caption: End Time
    type: timestamp_t
    requirement: optional
    description: The date and time at which a group or an Intent-Based Network Participant operation ends. (This field is only applicable to Network Remote ID.)
  end_time_dt:
    caption: End Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The date and time at which a group or an Intent-Based Network Participant operation ends. (This field is only applicable to Network Remote ID.)
  geodetic_altitude:
    caption: Geodetic Altitude
    type: string_t
    requirement: optional
    from: location
    description: 'The aircraft distance above or below the ellipsoid as measured along a line that passes through the aircraft and is normal to the surface of the WGS-84 ellipsoid. This value is provided in meters and must have a minimum resolution of 1 m. Special Values: `Invalid`, `No Value`, or `Unknown: -1000 m`.'
  geodetic_vertical_accuracy:
    caption: Geodetic Vertical Accuracy
    type: string_t
    requirement: optional
    from: location
    description: Provides quality/containment on geodetic altitude. This is based on ADS-B Geodetic Vertical Accuracy (GVA). Measured in meters.
  geohash:
    caption: Geohash
    type: string_t
    requirement: optional
    from: location
    description: |-
      Geohash of the geo-coordinates (latitude and longitude).

      [Geohashing](https://en.wikipedia.org/wiki/Geohash) is a geocoding system used to encode geographic coordinates in decimal degrees, to a single string.
  horizontal_accuracy:
    caption: Horizontal Accuracy
    type: string_t
    requirement: optional
    from: location
    description: Provides quality/containment on horizontal position. This is based on ADS-B NACp. Measured in meters.
  is_on_premises:
    caption: On Premises
    type: boolean_t
    requirement: optional
    from: location
    description: The indication of whether the location is on premises.
  isp:
    caption: ISP
    type: string_t
    requirement: optional
    from: location
    description: The name of the Internet Service Provider (ISP).
  lat:
    caption: Latitude
    type: float_t
    requirement: optional
    from: location
    description: 'The geographical Latitude coordinate represented in Decimal Degrees (DD). For example: `42.361145`.'
  locations:
    caption: Operating Polygon
    type: object_t
    object: location
    array: true
    requirement: recommended
    observable: 26
    description: A list of Position Location Information (PLI) (latitude/longitude pairs) defining the area where a group or Intent-Based Network Participant operation is taking place. (This field is only applicable to Network Remote ID.)
  long:
    caption: Longitude
    type: float_t
    requirement: optional
    from: location
    description: 'The geographical Longitude coordinate represented in Decimal Degrees (DD). For example: `-71.057083`.'
  postal_code:
    caption: Postal Code
    type: string_t
    requirement: optional
    from: location
    description: The postal code of the location.
  pressure_altitude:
    caption: Pressure Altitude
    type: string_t
    requirement: optional
    from: location
    description: 'The uncorrected barometric pressure altitude (based on reference standard 29.92 inHg, 1013.25 mb) provides a reference for algorithms that utilize ''altitude deltas'' between aircraft. This value is provided in meters and must have a minimum resolution of 1 m.. Special Values: `Invalid`, `No Value`, or `Unknown: -1000 m`.'
  provider:
    caption: Provider
    type: string_t
    requirement: optional
    from: location
    description: The provider of the geographical location data.
  radius:
    caption: Operating Area Radius
    type: string_t
    requirement: optional
    description: 'Farthest horizontal distance from the reported location at which any UA in a group may be located (meters). Also allows defining the area where an Intent-Based Network Participant operation is taking place. Default: 0 m.'
  region:
    caption: Region
    type: string_t
    requirement: optional
    from: location
    description: The alphanumeric code that identifies the principal subdivision (e.g. province or state) of the country. For example, 'CH-VD' for the Canton of Vaud, Switzerland
    references:
    - description: ISO Region Codes
      url: https://www.iso.org/iso-3166-country-codes.html
    - description: U.S. Region Codes
      url: https://www.iso.org/obp/ui/#iso:code:3166:US
  start_time:
    caption: Start Time
    type: timestamp_t
    requirement: optional
    description: The date and time at which a group or an Intent-Based Network Participant operation starts. (This field is only applicable to Network Remote ID.)
  start_time_dt:
    caption: Start Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The date and time at which a group or an Intent-Based Network Participant operation starts. (This field is only applicable to Network Remote ID.)
  type:
    caption: Type
    type: string_t
    requirement: optional
    description: The type of operating area. For example, `Takeoff Location`, `Fixed Location`, `Dynamic Location`.
  type_id:
    caption: Type ID
    type: integer_t
    requirement: recommended
    sibling: type
    description: The operating area type identifier.
    enum:
      '0':
        caption: Unknown/Undeclared
        description: The UA type is empty or not declared.
      '1':
        caption: Takeoff Location
      '2':
        caption: Fixed Location
      '3':
        caption: Dynamic Location
      '99':
        caption: Other
        description: The type is not mapped. See the `type` attribute, which contains a data source specific value.

name: compliance
caption: Compliance
extends: object
description: The Compliance object contains information about Industry and Regulatory Framework standards, controls and requirements.
profiles: [data_classification]
referenced_by:
  classes:
    compliance_finding: [compliance]
    security_finding: [compliance]
attributes:
  compliance_references:
    caption: Compliance Standard References
    type: object_t
    object: kb_article
    array: true
    requirement: optional
    description: A list of reference KB articles that provide information to help organizations understand, interpret, and implement compliance standards. They provide guidance, best practices, and examples.
  compliance_standards:
    caption: 'Compliance Standards: Details'
    type: object_t
    object: kb_article
    array: true
    requirement: optional
    description: A list of established guidelines or criteria that define specific requirements an organization must follow.
  control:
    caption: Security Control
    type: string_t
    requirement: recommended
    description: A Control is prescriptive, prioritized, and simplified set of best practices that one can use to strengthen their cybersecurity posture. e.g. AWS SecurityHub Controls, CIS Controls.
  control_parameters:
    caption: Control Parameters
    type: object_t
    object: key_value_object
    array: true
    requirement: optional
    description: The list of control parameters evaluated in a Compliance check.
  requirements:
    caption: Compliance Requirements
    type: string_t
    array: true
    requirement: optional
    description: A list of requirements associated to a specific control in an industry or regulatory framework. e.g. `NIST.800-53.r5 AU-10`
  standards:
    caption: 'Compliance Standards: List'
    type: string_t
    array: true
    requirement: required
    description: Compliance standards are a set of criteria organizations can follow to protect sensitive and confidential information. e.g. `NIST SP 800-53, CIS AWS Foundations Benchmark v1.4.0, ISO/IEC 27001`
  status:
    caption: Status
    type: string_t
    requirement: recommended
    description: The resultant status of the compliance check normalized to the caption of the `status_id` value. In the case of 'Other', it is defined by the event source.
  status_code:
    caption: Status Code
    type: string_t
    requirement: optional
    description: The resultant status code of the compliance check.
  status_detail:
    caption: Status Detail
    type: string_t
    requirement: optional
    deprecated:
      since: 1.4.0
      message: Use the  `status_details`  attribute instead.
    description: The contextual description of the `status, status_code` values.
  status_details:
    caption: Status Details
    type: string_t
    array: true
    requirement: optional
    description: A list of contextual descriptions of the `status, status_code` values.
  status_id:
    caption: Status ID
    type: integer_t
    requirement: recommended
    sibling: status
    description: The normalized status identifier of the compliance check.
    enum:
      '0':
        caption: Unknown
        description: The status is unknown.
      '1':
        caption: Pass
        description: The compliance check passed for all the evaluated resources.
      '2':
        caption: Warning
        description: The compliance check did not yield a result due to missing information.
      '3':
        caption: Fail
        description: The compliance check failed for at least one of the evaluated resources.
      '99':
        caption: Other
        description: The event status is not mapped. See the `status` attribute, which contains a data source specific value.

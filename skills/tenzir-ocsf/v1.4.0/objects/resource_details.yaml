# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: resource_details
caption: Resource Details
extends: _resource
description: The Resource Details object describes details about resources that were affected by the activity/event.
profiles: [cloud, data_classification]
constraints:
  at_least_one: [name, uid]
referenced_by:
  classes:
    api_activity: [resources]
    cloud_resources_inventory_info: [resources]
    compliance_finding: [resource, resources]
    data_security_finding: [resources]
    detection_finding: [resources]
    group_management: [resource]
    security_finding: [resources]
    user_access: [resource]
    vulnerability_finding: [resource, resources]
attributes:
  data_classification: {caption: Data Classification, type: object_t, object: data_classification, requirement: recommended, group: context, profile: data_classification, deprecated: {since: 1.4.0, message: Use the attribute `data_classifications` instead}, from: _resource}
  data_classifications: {caption: Data Classification, type: object_t, object: data_classification, array: true, requirement: recommended, group: context, profile: data_classification, from: _resource}
  hostname:
    caption: Hostname
    type: hostname_t
    requirement: recommended
    observable: 1
    description: The fully qualified name of the resource.
  ip:
    caption: IP Address
    type: ip_t
    requirement: recommended
    observable: 2
    description: The IP address of the resource, in either IPv4 or IPv6 format.
  name:
    caption: Name
    type: string_t
    requirement: recommended
    observable: 38
    description: The name of the resource.
  owner:
    caption: Owner
    type: object_t
    object: user
    requirement: recommended
    observable: 21
    description: The identity of the service or user account that owns the resource.
  uid: {caption: Unique ID, type: string_t, requirement: recommended, from: _resource}
  agent_list:
    caption: Agent List
    type: object_t
    object: agent
    array: true
    requirement: optional
    description: A list of `agent` objects associated with a device, endpoint, or resource.
  cloud_partition:
    caption: Cloud Partition
    type: string_t
    requirement: optional
    profile: cloud
    description: 'The canonical cloud partition name to which the region is assigned (e.g. AWS Partitions: aws, aws-cn, aws-us-gov).'
  criticality:
    caption: Criticality
    type: string_t
    requirement: optional
    description: The criticality of the resource as defined by the event source.
  data: {caption: Data, type: json_t, requirement: optional, from: _resource}
  group:
    caption: Group
    type: object_t
    object: group
    requirement: optional
    description: The name of the related resource group.
  labels: {caption: Labels, type: string_t, array: true, requirement: optional, from: _resource}
  namespace:
    caption: Namespace
    type: string_t
    requirement: optional
    description: The namespace is useful when similar entities exist that you need to keep separate.
  region:
    caption: Region
    type: string_t
    requirement: optional
    profile: cloud
    description: The cloud region of the resource.
  tags: {caption: Tags, type: object_t, object: key_value_object, array: true, requirement: optional, from: _resource}
  type: {caption: Type, type: string_t, requirement: optional, from: _resource}
  version:
    caption: Version
    type: string_t
    requirement: optional
    description: The version of the resource. For example `1.2.3`.

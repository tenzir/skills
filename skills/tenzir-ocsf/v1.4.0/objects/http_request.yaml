  classes:
    account_change: [http_request]
    api_activity: [http_request]
    authentication: [http_request]
    authorize_session: [http_request]
    datastore_activity: [http_request]
    dhcp_activity: [proxy_http_request]
    dns_activity: [proxy_http_request]
    entity_management: [http_request]
    ftp_activity: [proxy_http_request]
    group_management: [http_request]
    http_activity: [http_request, proxy_http_request]
    network_activity: [proxy_http_request]
    network_file_activity: [proxy_http_request]

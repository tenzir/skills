attributes:
  version:
    caption: Version
    type: string_t
    requirement: recommended
    description: The [ATT&CK® Matrix](https://attack.mitre.org/wiki/ATT&CK_Matrix) version.
  sub_technique:
    caption: Sub Technique
    type: object_t
    object: sub_technique
    requirement: optional
    description: The Sub Technique object describes the sub technique ID and/or name associated to an attack, as defined by [ATT&CK® Matrix](https://attack.mitre.org/wiki/ATT&CK_Matrix).
  tactic:
    caption: Tactic
    type: object_t
    object: tactic
    requirement: optional
    description: The Tactic object describes the tactic ID and/or name that is associated to an attack, as defined by [ATT&CK® Matrix](https://attack.mitre.org/wiki/ATT&CK_Matrix).
  tactics:
    caption: Tactics
    type: object_t
    object: tactic
    array: true
    requirement: optional
    deprecated:
      since: 1.1.0
      message: Use the `tactic` attribute instead.
    description: The Tactic object describes the tactic ID and/or tactic name that are associated with the attack technique, as defined by [ATT&CK® Matrix](https://attack.mitre.org/wiki/ATT&CK_Matrix).
  technique:
    caption: Technique
    type: object_t
    object: technique
    requirement: optional
    description: The Technique object describes the technique ID and/or name associated to an attack, as defined by [ATT&CK® Matrix](https://attack.mitre.org/wiki/ATT&CK_Matrix).

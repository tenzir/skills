name: email
caption: Email
extends: object
observable: 22
description: The Email object describes the email metadata such as sender, recipients, and direction, and can include embedded URLs and files.
profiles: [data_classification]
constraints:
  at_least_one: [from, to]
references:
- description: D3FEND™ Ontology d3f:Email.
  url: https://d3fend.mitre.org/dao/artifact/d3f:Email/
referenced_by:
  classes:
    email_activity: [email]
  objects:
    evidences: [email]
    managed_entity: [email]
    osint: [email]
attributes:
  data_classification:
    caption: Data Classification
    type: object_t
    object: data_classification
    requirement: recommended
    group: context
    profile: data_classification
    deprecated:
      since: 1.4.0
      message: Use the attribute `data_classifications` instead
    description: The Data Classification object includes information about data classification levels and data category types.
  data_classifications:
    caption: Data Classification
    type: object_t
    object: data_classification
    array: true
    requirement: recommended
    group: context
    profile: data_classification
    description: A list of Data Classification objects, that include information about data classification levels and data category types, indentified by a classifier.
  from:
    caption: From
    type: email_t
    requirement: recommended
    observable: 5
    description: The machine-readable email header From values, as defined by RFC 5322. For example `example.user@usersdomain.com`
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322
  message_uid:
    caption: Message UID
    type: string_t
    requirement: recommended
    description: The email header Message-ID value, as defined by RFC 5322.
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322
  reply_to:
    caption: Reply To
    type: email_t
    requirement: recommended
    observable: 5
    deprecated:
      since: 1.4.0
      message: Use the  `reply_to_mailboxes`  attribute instead.
    description: The machine-readable email header Reply-To values, as defined by RFC 5322. For example `example.user@usersdomain.com`
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322
  size:
    caption: Size
    type: long_t
    requirement: recommended
    description: The size in bytes of the email, including attachments.
  smtp_from:
    caption: SMTP From
    type: email_t
    requirement: recommended
    observable: 5
    deprecated:
      since: 1.4.0
      message: Use the  `from`  attribute instead.
    description: The value of the SMTP MAIL FROM command.
  smtp_to:
    caption: SMTP To
    type: email_t
    array: true
    requirement: recommended
    observable: 5
    deprecated:
      since: 1.4.0
      message: Use the  `to`  attribute instead.
    description: The value of the SMTP envelope RCPT TO command.
  subject:
    caption: Subject
    type: string_t
    requirement: recommended
    description: The email header Subject value, as defined by RFC 5322.
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322
  to:
    caption: To
    type: email_t
    array: true
    requirement: recommended
    observable: 5
    description: The machine-readable email header To values, as defined by RFC 5322. For example `example.user@usersdomain.com`
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322
  uid:
    caption: Email Thread UID
    type: string_t
    requirement: recommended
    description: The unique identifier of the email thread.
  cc:
    caption: Cc
    type: email_t
    array: true
    requirement: optional
    observable: 5
    description: The machine-readable email header Cc values, as defined by RFC 5322. For example `example.user@usersdomain.com`.
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322
  cc_mailboxes:
    caption: Cc Mailboxes
    type: string_t
    array: true
    requirement: optional
    description: The human-readable email header Cc Mailbox values. For example `'Example User <example.user@usersdomain.com>'`.
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322#section-3.4
  delivered_to:
    caption: Delivered To
    type: email_t
    requirement: optional
    observable: 5
    deprecated:
      since: 1.4.0
      message: Use the  `delivered_to_list`  attribute instead.
    description: The machine-readable Delivered-To email header field. For example `example.user@usersdomain.com`
  delivered_to_list:
    caption: Delivered To
    type: email_t
    array: true
    requirement: optional
    observable: 5
    description: The machine-readable Delivered-To email header values. For example `example.user@usersdomain.com`
    references:
    - description: RFC 9228
      url: https://www.rfc-editor.org/rfc/rfc9228
  files:
    caption: Files
    type: object_t
    object: file
    array: true
    requirement: optional
    observable: 24
    description: The files embedded or attached to the email.
  from_mailbox:
    caption: From Mailbox
    type: string_t
    requirement: optional
    description: The human-readable email header From Mailbox value. For example `'Example User <example.user@usersdomain.com>'`.
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322#section-3.4
  http_headers:
    caption: HTTP Headers
    type: object_t
    object: http_header
    array: true
    requirement: optional
    description: Additional HTTP headers of an HTTP request or response.
  raw_header:
    caption: Raw Header
    type: string_t
    requirement: optional
    description: The email authentication header.
  reply_to_mailboxes:
    caption: Reply To Mailboxes
    type: string_t
    array: true
    requirement: optional
    description: The human-readable email header Reply To Mailbox values. For example `'Example User <example.user@usersdomain.com>'`.
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322#section-3.4
  to_mailboxes:
    caption: To Mailboxes
    type: string_t
    array: true
    requirement: optional
    description: The human-readable email header To Mailbox values. For example `'Example User <example.user@usersdomain.com>'`.
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322#section-3.4
  urls:
    caption: URLs
    type: object_t
    object: url
    array: true
    requirement: optional
    observable: 23
    description: The URLs embedded in the email.
  x_originating_ip:
    caption: X-Originating-IP
    type: ip_t
    array: true
    requirement: optional
    observable: 2
    description: The X-Originating-IP header identifying the emails originating IP address(es).

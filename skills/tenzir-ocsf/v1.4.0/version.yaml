    objects: [advisory, aircraft, classifier_details, discovery_details, encryption_details, environment_variable, key_value_object, long_string, occurrence_details, process_entity, sbom, scim, script, software_component, span, sso, startup_item, trace, unmanned_aerial_system, unmanned_system_operating_area, vendor_attributes]
    profiles: [incident, trace]
  removed:

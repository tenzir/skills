# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: network_file_activity
caption: Network File Activity
uid: 4010
category: network
category_uid: 4
extends: network
deprecated:
  since: 1.1.0
  message: Use the new `file_hosting` class in the Application category.
  superseded_by: [file_hosting]
description: Network File Activity events report file activities traversing the network, including file storage services such as Box, MS OneDrive, or Google Drive.
profiles: [ai_operation, cloud, container, data_classification, datetime, host, load_balancer, network_proxy, osint, record_integrity, security_control]
constraints:
  at_least_one: [dst_endpoint, src_endpoint]
references:
- description: D3FEND™ Ontology d3f:NetworkEvent
  url: https://d3fend.mitre.org/event/d3f:NetworkEvent/
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event. Each event class defines its own set of activity values. Use `0` (Unknown) when the activity cannot be determined. Use `99` (Other) when the activity does not match any defined value, in which case `activity_name` must be populated with the source-specific label.
    enum:
      0:
        caption: Unknown
        description: The event activity is unknown.
      1:
        caption: Upload
        description: Upload a file.
      2:
        caption: Download
        description: Download a file.
      3:
        caption: Update
        description: Update a file.
      4:
        caption: Delete
        description: Delete a file.
      5:
        caption: Rename
        description: Rename a file.
      6:
        caption: Copy
        description: Copy a file.
      7:
        caption: Move
        description: Move a file.
      8:
        caption: Restore
        description: Restore a file.
      9:
        caption: Preview
        description: Preview a file.
      10:
        caption: Lock
        description: Lock a file.
      11:
        caption: Unlock
        description: Unlock a file.
      12:
        caption: Share
        description: Share a file.
      13:
        caption: Unshare
        description: Unshare a file.
      14:
        caption: Open
        description: Open a file.
      15:
        caption: Sync
        description: Mark a file or folder to sync with a computer.
      16:
        caption: Unsync
        description: Mark a file or folder to not sync with a computer.
      99:
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  actor:
    caption: Actor
    type: object_t
    object: actor
    requirement: required
    group: primary
    description: The actor that performed the activity on the target file.
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event. Each event class belongs to exactly one category. Producers and mappers must set this to the category defined by the event class being used.
    enum:
      4:
        caption: Network Activity
        description: Network Activity events.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event. Producers and mappers must set this to the `uid` defined in the event class definition. For example, `Detection Finding` is `2004`.
    enum:
      4010:
        caption: Network File Activity
        description: Network File Activity events report file activities traversing the network, including file storage services such as Box, MS OneDrive, or Google Drive.
  cloud: {caption: Cloud, type: object_t, object: cloud, requirement: required, group: primary, profile: cloud, from: base_event}
  file:
    caption: File
    type: object_t
    object: file
    requirement: required
    group: primary
    observable: 24
    description: The file that is the target of the activity.
  metadata: {caption: Metadata, type: object_t, object: metadata, requirement: required, group: context, from: base_event}

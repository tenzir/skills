# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: module_activity
caption: Module Activity
uid: 1005
category: system
category_uid: 1
extends: system
description: Module Activity events report when an endpoint process acts on a `module`.
profiles: [ai_operation, cloud, container, data_classification, datetime, host, osint, record_integrity, security_control]
associations:
  actor.user: [device]
  device: [actor.user]
references:
- description: D3FEND™ Ontology d3f:LoadLibraryEvent
  url: https://d3fend.mitre.org/event/d3f:LoadLibraryEvent/
- description: D3FEND™ Ontology d3f:UnloadLibraryEvent
  url: https://d3fend.mitre.org/event/d3f:UnloadLibraryEvent/
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event. Each event class defines its own set of activity values. Use `0` (Unknown) when the activity cannot be determined. Use `99` (Other) when the activity does not match any defined value, in which case `activity_name` must be populated with the source-specific label.
    enum:
      0:
        caption: Unknown
        description: The event activity is unknown.
      1:
        caption: Load
        description: The target module was loaded.
        references:
        - description: 'Guidance on the use of "Module Activity: Load" and "Process Activity: Inject".'
          url: https://github.com/ocsf/ocsf-docs/blob/main/faqs/schema-faq.md#when-should-i-use-a-module-activity-load-event-and-when-should-i-use-a-process-activity-inject-event
      2:
        caption: Unload
        description: The target module was unloaded.
      3:
        caption: Invoke
        description: A function exported from the target module was invoked.
      99:
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  actor:
    caption: Actor
    type: object_t
    object: actor
    requirement: required
    group: primary
    description: The actor that performed the activity on the target `module`. For example, the process that loaded a module into memory.
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event. Each event class belongs to exactly one category. Producers and mappers must set this to the category defined by the event class being used.
    enum:
      1:
        caption: System Activity
        description: System Activity events.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event. Producers and mappers must set this to the `uid` defined in the event class definition. For example, `Detection Finding` is `2004`.
    enum:
      1005:
        caption: Module Activity
        description: Module Activity events report when an endpoint process acts on a `module`.

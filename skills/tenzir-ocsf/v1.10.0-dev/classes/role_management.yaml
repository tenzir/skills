# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: role_management
caption: Role Management
uid: 3008
category: iam
category_uid: 3
extends: iam
description: 'Role Management events report lifecycle management of a role, as well as privileges, policies, credentials, and resources associated with the role. There are two ways updates to the state of a role may be expressed: Using the `Update` activity, for example when updating multiple items at one time, the `updated_role` reflects the changes made to `iam_role`. Using discrete activities, such as `Assign Privileges` the state change is expressed by the `privileges` attribute. Optionally, on success, the `updated_role` reflects the new state of the role. Roles assigned or removed from users and groups are expressed by the `User Management` and `Group Management` classes. Role Management events also cover roles bound to AI agents, e.g., an agent''s role being created, updated, or having privileges, resources, policies, or credentials granted, revoked, attached, detached, added, or removed. The `ai_agent` attribute identifies the agent associated with `iam_role`.'
profiles: [ai_operation, cloud, container, data_classification, datetime, host, osint, record_integrity, security_control]
references:
- description: D3FEND™ Ontology d3f:PermissionGrantingEvent
  url: https://d3fend.mitre.org/event/d3f:PermissionGrantingEvent/
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event. Each event class defines its own set of activity values. Use `0` (Unknown) when the activity cannot be determined. Use `99` (Other) when the activity does not match any defined value, in which case `activity_name` must be populated with the source-specific label.
    enum:
      0:
        caption: Unknown
        description: The event activity is unknown.
      1:
        caption: Create
        description: Create a role. Use `iam_role` as the role to be created.
      2:
        caption: Update
        description: Update a role. The updated role details should be populated in the `updated_role` attribute.
      3:
        caption: Delete
        description: Delete a role. Use `iam_role` as the role to be deleted.
      4:
        caption: Assign Privileges
        description: Assign privileges to a role. Use `privileges` to be assigned to `iam_role`.
      5:
        caption: Remove Privileges
        description: Remove privileges from a role. Use `privileges` to be removed from `iam_role`.
      6:
        caption: Assign Resources
        description: Assign resources to a role. Use `resources` to be assigned to `iam_role`.
      7:
        caption: Remove Resources
        description: Remove resources from a role. Use `resources` to be removed from `iam_role`.
      8:
        caption: Attach Policies
        description: Attach one or more policies to a role. Use `policies` to be attached to `iam_role`.
      9:
        caption: Detach Policies
        description: Detach one or more policies from a role. Use `policies` to be detached from `iam_role`.
      10:
        caption: Add Programmatic Credentials
        description: Add credentials to a role. Use `programmatic_credentials` to be added to `iam_role`.
      11:
        caption: Remove Programmatic Credentials
        description: Remove credentials from a role. Use `programmatic_credentials` to be removed from `iam_role`.
      99:
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event. Each event class belongs to exactly one category. Producers and mappers must set this to the category defined by the event class being used.
    enum:
      3:
        caption: Identity & Access Management
        description: Identity & Access Management (IAM) events relate to the supervision of the system's authentication and access control model. Examples of such events are the success or failure of authentication, granting of authority, password change, entity change, privileged use etc.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event. Producers and mappers must set this to the `uid` defined in the event class definition. For example, `Detection Finding` is `2004`.
    enum:
      3008:
        caption: Role Management
        description: 'Role Management events report lifecycle management of a role, as well as privileges, policies, credentials, and resources associated with the role. There are two ways updates to the state of a role may be expressed: Using the `Update` activity, for example when updating multiple items at one time, the `updated_role` reflects the changes made to `iam_role`. Using discrete activities, such as `Assign Privileges` the state change is expressed by the `privileges` attribute. Optionally, on success, the `updated_role` reflects the new state of the role. Roles assigned or removed from users and groups are expressed by the `User Management` and `Group Management` classes. Role Management events also cover roles bound to AI agents, e.g., an agent''s role being created, updated, or having privileges, resources, policies, or credentials granted, revoked, attached, detached, added, or removed. The `ai_agent` attribute identifies the agent associated with `iam_role`.'

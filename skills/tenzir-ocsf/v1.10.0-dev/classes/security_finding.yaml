# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: security_finding
caption: Security Finding
uid: 2001
category: findings
category_uid: 2
extends: base_event
deprecated:
  since: 1.1.0
  message: 'Use the new specific classes according to the use-case: `vulnerability_finding`, `compliance_finding`, `detection_finding`, `incident_finding`, `data_security_finding`.'
  superseded_by: [vulnerability_finding, compliance_finding, detection_finding, incident_finding, data_security_finding]
description: Security Finding events describe findings, detections, anomalies, alerts and/or actions performed by security products
profiles: [cloud, container, data_classification, datetime, host, osint, record_integrity, security_control]
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event. Each event class defines its own set of activity values. Use `0` (Unknown) when the activity cannot be determined. Use `99` (Other) when the activity does not match any defined value, in which case `activity_name` must be populated with the source-specific label.
    enum:
      0:
        caption: Unknown
        description: The event activity is unknown.
      1:
        caption: Create
        description: A security finding was created.
      2:
        caption: Update
        description: A security finding was updated.
      3:
        caption: Close
        description: A security finding was closed.
      99:
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event. Each event class belongs to exactly one category. Producers and mappers must set this to the category defined by the event class being used.
    enum:
      2:
        caption: Findings
        description: Findings events report findings, detections, and possible resolutions of malware, anomalies, or other actions performed by security products.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event. Producers and mappers must set this to the `uid` defined in the event class definition. For example, `Detection Finding` is `2004`.
    enum:
      2001:
        caption: Security Finding
        description: Security Finding events describe findings, detections, anomalies, alerts and/or actions performed by security products
  cloud: {caption: Cloud, type: object_t, object: cloud, requirement: required, group: primary, profile: cloud, from: base_event}
  finding:
    caption: Finding
    type: object_t
    object: finding
    requirement: required
    group: primary
    description: The Finding object provides details about a finding/detection generated by a security tool.
  metadata: {caption: Metadata, type: object_t, object: metadata, requirement: required, group: context, from: base_event}
  osint: {caption: OSINT, type: object_t, object: osint, array: true, requirement: required, group: primary, profile: osint, from: base_event}
  severity_id: {caption: Severity ID, type: integer_t, requirement: required, group: classification, sibling: severity, enum: {0: Unknown, 1: Informational, 2: Low, 3: Medium, 4: High, 5: Critical, 6: Fatal, 99: Other}, from: base_event}
  state_id:
    caption: State ID
    type: integer_t
    requirement: required
    group: context
    sibling: state
    description: The normalized state identifier of a security finding.
    enum:
      0:
        caption: Unknown
        description: The state is unknown.
      1:
        caption: New
        description: The finding is new and yet to be reviewed.
      2:
        caption: In Progress
        description: The finding is under review.
      3:
        caption: Suppressed
        description: The finding was reviewed, considered as a false positive and is now suppressed.
      4:
        caption: Resolved
        description: The finding was reviewed and remediated and is now considered resolved.
      99:
        caption: Other
        description: The state is not mapped. See the `state` attribute, which contains a data source specific value.
  time: {caption: Event Time, type: timestamp_t, requirement: required, group: occurrence, from: base_event}
  type_uid:
    caption: Type ID
    type: long_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event/finding type ID. It identifies the event''s semantics and structure. Producers and mappers must compute this as `class_uid * 100 + activity_id`. It uniquely identifies the combination of event class and activity across the entire schema. For example, `Detection Finding: Create` is `200401`.'
  action_id: {caption: Action ID, type: integer_t, requirement: recommended, group: primary, profile: security_control, sibling: action, enum: {0: Unknown, 1: Allowed, 2: Denied, 3: Observed, 4: Modified, 99: Other}, from: base_event}
  analytic:
    caption: Analytic
    type: object_t
    object: analytic
    requirement: recommended
    group: primary
    description: The analytic technique used to analyze and derive insights from the data or information that led to the finding or conclusion.
  confidence:
    caption: Confidence
    type: string_t
    requirement: recommended
    group: primary
    description: The confidence, normalized to the caption of the confidence_id value. In the case of 'Other', it is defined by the event source.
  confidence_id:
    caption: Confidence ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: confidence
    description: The normalized confidence refers to the accuracy of the security control or alert. An analytic with a low confidence means that the alerts may be noisy or may not be malicious in nature.
    enum:
      0:
        caption: Unknown
        description: The normalized confidence is unknown.
      1:
        caption: Low
      2:
        caption: Medium
      3:
        caption: High
      99:
        caption: Other
        description: The confidence is not mapped to the defined enum values. See the `confidence` attribute, which contains a data source specific value.
  confidence_score:
    caption: Confidence Score
    type: integer_t
    requirement: recommended
    group: primary
    description: The confidence score as reported by the source or assigned by the analyst expressed on a source-specific numeric scale. This score provides finer-grained confidence information than the categorical `confidence_id` value. If `confidence_id` is 99 'Other', it should reflect the the same assessment as `confidence` if both are populated.
  device: {caption: Device, type: object_t, object: device, requirement: recommended, group: primary, profile: host, observable: 20, from: base_event}
  disposition_id:
    caption: Disposition ID
    type: integer_t
    requirement: recommended
    group: primary
    profile: security_control
    sibling: disposition
    enum:
      0: Unknown
      1: Allowed
      2: Blocked
      3: Quarantined
      4: Isolated
      5: Deleted
      6: Dropped
      7: Custom Action
      8: Approved
      9: Restored
      10: Exonerated
      11: Corrected
      12: Partially Corrected
      13: Uncorrected
      14: Delayed
      15: Detected
      16: No Action
      17: Logged
      18: Tagged
      19: Alert
      20: Count
      21: Reset
      22: Captcha
      23: Challenge
      24: Access Revoked
      25: Rejected
      26: Unauthorized
      27: Error
      99: Other
    from: base_event
  impact:
    caption: Impact
    type: string_t
    requirement: recommended
    group: primary
    description: The impact , normalized to the caption of the impact_id value. In the case of 'Other', it is defined by the event source.
  impact_id:
    caption: Impact ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: impact
    description: The normalized impact of the incident or finding. Per NIST, this is the magnitude of harm that can be expected to result from the consequences of unauthorized disclosure, modification, destruction, or loss of information or information system availability.
    enum:
      0:
        caption: Unknown
        description: The normalized impact is unknown.
      1:
        caption: Low
        description: The magnitude of harm is low.
      2:
        caption: Medium
        description: The magnitude of harm is moderate.
      3:
        caption: High
        description: The magnitude of harm is high.
      4:
        caption: Critical
        description: The magnitude of harm is high and the scope is widespread.
      99:
        caption: Other
        description: The impact is not mapped. See the `impact` attribute, which contains a data source specific value.
    references:
    - description: NIST SP 800-172 from FIPS 199
      url: https://doi.org/10.6028/NIST.FIPS.199
    - description: NIST Computer Security Resource Center
      url: https://doi.org/10.6028/NIST.FIPS.199
  impact_score:
    caption: Impact Score
    type: integer_t
    requirement: recommended
    group: primary
    description: The impact as an integer value of the finding, valid range 0-100.
  is_alert: {caption: Alert, type: boolean_t, requirement: recommended, group: primary, profile: security_control, from: base_event}
  message: {caption: Message, type: string_t, requirement: recommended, group: primary, from: base_event}
  observables: {caption: Observables, type: object_t, object: observable, array: true, requirement: recommended, group: primary, from: base_event}
  resources:
    caption: Resources Array
    type: object_t
    object: resource_details
    array: true
    requirement: recommended
    group: primary
    description: Describes details about resources that were affected by the activity/event.
  risk_level:
    caption: Risk Level
    type: string_t
    requirement: recommended
    group: primary
    description: The risk level, normalized to the caption of the risk_level_id value.
  risk_level_id:
    caption: Risk Level ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: risk_level
    description: The normalized risk level id.
    enum:
      0:
        caption: Info
      1:
        caption: Low
      2:
        caption: Medium
      3:
        caption: High
      4:
        caption: Critical
      99:
        caption: Other
        description: The risk level is not mapped. See the `risk_level` attribute, which contains a data source specific value.
  risk_score:
    caption: Risk Score
    type: integer_t
    requirement: recommended
    group: primary
    description: The risk score as reported by the event source.
  status: {caption: Status, type: string_t, requirement: recommended, group: primary, from: base_event}
  status_code: {caption: Status Code, type: string_t, requirement: recommended, group: primary, from: base_event}
  status_detail: {caption: Status Detail, type: string_t, requirement: recommended, group: primary, from: base_event}
  status_id: {caption: Status ID, type: integer_t, requirement: recommended, group: primary, sibling: status, enum: {0: Unknown, 1: Success, 2: Failure, 99: Other}, from: base_event}
  timezone_offset: {caption: Timezone Offset, type: integer_t, requirement: recommended, group: occurrence, from: base_event}
  action: {caption: Action, type: string_t, requirement: optional, group: primary, profile: security_control, from: base_event}
  activity_name: {caption: Activity, type: string_t, requirement: optional, group: classification, from: base_event}
  actor: {caption: Actor, type: object_t, object: actor, requirement: optional, group: primary, profile: host, from: base_event}
  api: {caption: API Details, type: object_t, object: api, requirement: optional, group: context, profile: cloud, from: base_event}
  attacks:
    caption: MITRE ATT&CK® and ATLAS™ Details
    type: object_t
    object: attack
    array: true
    requirement: optional
    group: context
    description: An array of attack objects, each describing a tactic, technique, and/or sub-technique associated with the Finding.
    references:
    - description: MITRE ATT&CK®
      url: https://attack.mitre.org
  attestation_list: {caption: Attestation List, type: object_t, object: attestation, array: true, requirement: optional, group: context, profile: record_integrity, from: base_event}
  authorizations: {caption: Authorization Information, type: object_t, object: authorization, array: true, requirement: optional, group: primary, profile: security_control, from: base_event}
  category_name:
    caption: Category
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event category name, as defined by category_uid value: `Findings`.'
  cis_csc:
    caption: CIS CSC
    type: object_t
    object: cis_csc
    array: true
    requirement: optional
    group: context
    deprecated:
      since: 1.5.0
      message: Use the `cis_control` object instead.
      superseded_by: [cis_control]
    description: The CIS Critical Security Controls is a list of top 20 actions and practices an organization’s security team can take on such that cyber attacks or malware, are minimized and prevented.
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event class name, as defined by class_uid value: `Security Finding`.'
  compliance:
    caption: Compliance
    type: object_t
    object: compliance
    requirement: optional
    group: context
    description: The compliance object provides context to compliance findings (e.g., a check against a specific regulatory or best practice framework such as CIS, NIST etc.) and contains compliance related details.
  count: {caption: Count, type: integer_t, requirement: optional, group: occurrence, from: base_event}
  data_sources:
    caption: Data Sources
    type: string_t
    array: true
    requirement: optional
    group: context
    description: A list of data sources utilized in generation of the finding.
  disposition: {caption: Disposition, type: string_t, requirement: optional, group: primary, profile: security_control, from: base_event}
  duration: {caption: Duration Milliseconds, type: long_t, requirement: optional, group: occurrence, from: base_event}
  end_time: {caption: End Time, type: timestamp_t, requirement: optional, group: occurrence, from: base_event}
  end_time_dt: {caption: End Time, type: datetime_t, requirement: optional, group: occurrence, profile: datetime, from: base_event}
  enrichments: {caption: Enrichments, type: object_t, object: enrichment, array: true, requirement: optional, group: context, from: base_event}
  evidence:
    caption: Evidence
    type: json_t
    requirement: optional
    group: context
    deprecated:
      since: 1.1.0
      message: Use the `evidences` attribute instead.
      superseded_by: [evidences]
    description: The data the finding exposes to the analyst.
  firewall_rule: {caption: Firewall Rule, type: object_t, object: firewall_rule, requirement: optional, group: primary, profile: security_control, from: base_event}
  kill_chain:
    caption: Kill Chain
    type: object_t
    object: kill_chain_phase
    array: true
    requirement: optional
    group: context
    description: The Kill Chain provides a detailed description of each phase and its associated activities within the broader context of a cyber attack.
    references:
    - description: Cyber Kill Chain®
      url: https://www.lockheedmartin.com/en-us/capabilities/cyber/cyber-kill-chain.html
  malware:
    caption: Malware
    type: object_t
    object: malware
    array: true
    requirement: optional
    group: context
    description: A list of Malware objects, describing details about the identified malware.
  malware_scan_info: {caption: Malware Scan Info, type: object_t, object: malware_scan_info, requirement: optional, group: primary, profile: security_control, from: base_event}
  nist:
    caption: NIST List
    type: string_t
    array: true
    requirement: optional
    group: context
    description: The NIST Cybersecurity Framework recommendations for managing the cybersecurity risk.
  policy: {caption: Policy, type: object_t, object: policy, requirement: optional, group: primary, profile: security_control, from: base_event}
  process:
    caption: Process
    type: object_t
    object: process
    requirement: optional
    group: context
    observable: 25
    description: The process object.
  raw_data: {caption: Raw Data, type: string_t, requirement: optional, group: context, from: base_event}
  raw_data_hash: {caption: Raw Data Hash, type: object_t, object: fingerprint, requirement: optional, group: context, observable: 30, from: base_event}
  raw_data_size: {caption: Raw Data Size, type: long_t, requirement: optional, group: context, from: base_event}
  risk_details: {caption: Risk Details, type: string_t, requirement: optional, group: context, profile: security_control, from: base_event}
  severity: {caption: Severity, type: string_t, requirement: optional, group: classification, from: base_event}
  start_time: {caption: Start Time, type: timestamp_t, requirement: optional, group: occurrence, from: base_event}
  start_time_dt: {caption: Start Time, type: datetime_t, requirement: optional, group: occurrence, profile: datetime, from: base_event}
  state:
    caption: State
    type: string_t
    requirement: optional
    group: context
    description: The normalized state of a security finding.
  time_dt: {caption: Event Time, type: datetime_t, requirement: optional, group: occurrence, profile: datetime, from: base_event}
  type_name: {caption: Type Name, type: string_t, requirement: optional, group: classification, from: base_event}
  unmapped: {caption: Unmapped Data, type: object_t, object: object, requirement: optional, group: context, from: base_event}
  vulnerabilities:
    caption: Vulnerabilities
    type: object_t
    object: vulnerability
    array: true
    requirement: optional
    group: context
    description: This object describes vulnerabilities reported in a security finding.

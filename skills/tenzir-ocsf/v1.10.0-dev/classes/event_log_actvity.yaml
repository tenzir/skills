name: event_log_actvity
caption: Event Log Activity
uid: 1008
category: system
category_uid: 1
extends: system
description: Event Log Activity events report actions pertaining to the system's event logging service(s), such as disabling logging or clearing the log data.
profiles: [ai_operation, cloud, container, data_classification, datetime, host, osint, record_integrity, security_control]
constraints:
  at_least_one: [file, log_name, log_provider, log_type, log_type_id]
associations:
  actor.user: [device]
  device: [actor.user]
references:
- description: D3FEND™ Ontology d3f:EventLogEvent
  url: https://d3fend.mitre.org/event/d3f:EventLogEvent/
attributes:
  action:
    caption: Action
    requirement: optional
    profile: security_control
    definition: v1.10.0-dev/classes/base_event.yaml
  action_id:
    caption: Action ID
    requirement: recommended
    profile: security_control
    definition: v1.10.0-dev/classes/base_event.yaml
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event. Each event class defines its own set of activity values. Use `0` (Unknown) when the activity cannot be determined. Use `99` (Other) when the activity does not match any defined value, in which case `activity_name` must be populated with the source-specific label.
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Clear
        description: Clear the event log database, file, or cache.
      '2':
        caption: Delete
        description: Delete the event log database, file, or cache.
      '3':
        caption: Export
        description: Export the event log database, file, or cache.
      '4':
        caption: Archive
        description: Archive the event log database, file, or cache.
      '5':
        caption: Rotate
        description: Rotate the event log database, file, or cache.
      '6':
        caption: Start
        description: Start the event logging service.
      '7':
        caption: Stop
        description: Stop the event logging service.
      '8':
        caption: Restart
        description: Restart the event logging service.
      '9':
        caption: Enable
        description: Enable the event logging service.
      '10':
        caption: Disable
        description: Disable the event logging service.
      '99':
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  activity_name:
    caption: Activity
    requirement: optional
    definition: v1.10.0-dev/classes/base_event.yaml

name: authorize_session
caption: Authorize Session
uid: 3003
category: iam
category_uid: 3
extends: iam
description: Authorize Session events report privileges, groups or roles assigned to a new user session, usually at login time.
profiles: [ai_operation, cloud, container, data_classification, datetime, host, osint, record_integrity, security_control]
constraints:
  at_least_one: [privileges, groups, iam_roles]
associations:
  session: [user]
  user: [session]
references:
- description: D3FEND™ Ontology d3f:AuthorizationEvent
  url: https://d3fend.mitre.org/event/d3f:AuthorizationEvent/

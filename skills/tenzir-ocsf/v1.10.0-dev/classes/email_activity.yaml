# Attributes with a `definition` path are inherited unchanged. Read that file
# for their type, object, description, enum, and observable.
name: email_activity
caption: Email Activity
uid: 4009
category: network
category_uid: 4
extends: base_event
supersedes:
- name: email_file_activity
  since: 1.3.0
- name: email_url_activity
  since: 1.3.0
description: Email Activity events report SMTP protocol and email activities including those with embedded URLs and files. See the `Email` object for details.
profiles: [ai_operation, cloud, container, data_classification, datetime, host, osint, record_integrity, security_control]
references:
- description: D3FEND™ Ontology d3f:EmailEvent
  url: https://d3fend.mitre.org/event/d3f:EmailEvent/
attributes:
  action:
    caption: Action
    requirement: optional
    profile: security_control
    definition: v1.10.0-dev/classes/base_event.yaml
  action_id:
    caption: Action ID
    requirement: recommended
    profile: security_control
    definition: v1.10.0-dev/classes/base_event.yaml
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event. Each event class defines its own set of activity values. Use `0` (Unknown) when the activity cannot be determined. Use `99` (Other) when the activity does not match any defined value, in which case `activity_name` must be populated with the source-specific label.
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Send
      '2':
        caption: Receive
      '3':
        caption: Scan
        description: 'Email being scanned (example: security scanning)'
      '4':
        caption: Trace
        description: Follow an email message as it travels through an organization. The `message_trace_uid` should be populated when selected.
        references:
        - description: For example Office 365 Email Message Trace
          url: href='https://learn.microsoft.com/en-us/Exchange/monitoring/trace-an-email-message/message-trace-modern-eac
      '5':
        caption: MTA Relay
        description: Email processed by an MTA, typically combining send, receive, and scan operations into a single activity.
      '99':
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  activity_name:
    caption: Activity
    requirement: optional
    definition: v1.10.0-dev/classes/base_event.yaml
  actor:
    caption: Actor
    requirement: optional
    profile: host

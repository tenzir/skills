name: dns_zone_transfer_activity
caption: DNS Zone Transfer Activity
uid: 4015
category: network
category_uid: 4
extends: network
description: 'DNS Zone Transfer Activity events report the bulk replication of a DNS zone between name servers, as seen on the network. This includes full transfers (AXFR), incremental transfers (IXFR), and change notifications (NOTIFY). Unlike `DNS Activity`, which reports per-name queries and answers, this class captures whole-zone semantics: SOA serials, the records that make up the zone, and the multi-message streams that carry them.'
profiles: [ai_operation, cloud, container, data_classification, datetime, host, load_balancer, network_proxy, osint, record_integrity, security_control]
constraints:
  at_least_one: [dst_endpoint, src_endpoint]
references:
- description: RFC 5936 — DNS Zone Transfer Protocol (AXFR).
  url: https://www.rfc-editor.org/rfc/rfc5936
- description: RFC 1995 — Incremental Zone Transfer in DNS (IXFR).
  url: https://www.rfc-editor.org/rfc/rfc1995
- description: RFC 1996 — A Mechanism for Prompt Notification of Zone Changes (NOTIFY).
  url: https://www.rfc-editor.org/rfc/rfc1996
- description: RFC 1035 — Domain Names, Implementation and Specification.
  url: https://www.rfc-editor.org/rfc/rfc1035
- description: RFC 2845 — Secret Key Transaction Authentication for DNS (TSIG).
  url: https://www.rfc-editor.org/rfc/rfc2845
- description: RFC 6895 — Domain Name System (DNS) IANA Considerations (response codes).
  url: https://www.rfc-editor.org/rfc/rfc6895

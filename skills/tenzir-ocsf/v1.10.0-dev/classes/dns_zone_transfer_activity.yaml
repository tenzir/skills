  dns_zone:
    caption: DNS Zone
    type: hostname_t
    requirement: recommended
    group: primary
    observable: 1
    description: 'The DNS zone being transferred, i.e., the zone apex. This is the QNAME present in every message of the transfer or NOTIFY. The message role is conveyed by `activity_id` and the transfer type (AXFR or IXFR) by `transfer_type_id`. For example: `example.com`.'

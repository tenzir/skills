    requirement: optional
    group: context
    description: The Additional section of this DNS message, carrying any supplementary resource records (such as an EDNS OPT pseudo-record) and an optional TSIG record. Because `activity_id` distinguishes the request from the response, each event represents a single DNS message with a single Additional section. The TSIG record authenticating the message is available via `dns_additional.tsig`; a `BADKEY` or `BADSIG` error commonly indicates an unauthorized transfer attempt.

        caption: 'DNS Zone Transfer Activity: Unknown'
      '401501':
        caption: 'DNS Zone Transfer Activity: Transfer Request'
        description: A request from a secondary name server to transfer a zone. Whether a full (AXFR) or incremental (IXFR) transfer was requested is conveyed by `transfer_type_id`.
      '401502':
        caption: 'DNS Zone Transfer Activity: Transfer Response'
        description: A zone transfer response message from the primary name server. A single transfer may be delivered as a stream of multiple response messages. Whether the delivered data is a full (AXFR) or incremental (IXFR) transfer is conveyed by `transfer_type_id`; note that a server may answer an IXFR request with a full transfer when it cannot produce a delta.
      '401503':
        caption: 'DNS Zone Transfer Activity: Notify'
        description: A NOTIFY exchange, comprising the primary name server's notification that the zone has changed and the secondary's acknowledgement, reported as a single record rather than as separate messages. NOTIFY has no transfer type; the outcome of the acknowledgement is conveyed by `status_id`.
      '401504':
        caption: 'DNS Zone Transfer Activity: Transfer'
        description: A zone transfer reported as a single summary record rather than as separate request and response messages. Used by sources, such as name server logs, that emit one event per transfer with the zone, record count, byte count, duration, and peer. Whether the transfer was full (AXFR) or incremental (IXFR) is conveyed by `transfer_type_id`; whether it succeeded is conveyed by `status_id`.

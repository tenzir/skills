  transaction_id:
    caption: DNS Transaction ID
    type: integer_t
    requirement: recommended
    group: primary
    description: The 16-bit DNS transaction identifier assigned by the client and echoed unchanged in the server response. This value is the same for both the request and response messages.
  transfer_type:
    caption: Transfer Type
    type: string_t
    requirement: recommended
    group: primary
    description: The zone transfer type, normalized to the caption of the `transfer_type_id` value. In the case of 'Other', it is defined by the event source.
  transfer_type_id:
    caption: Transfer Type ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: transfer_type
    description: The normalized identifier of the zone transfer type. On a `Transfer Request` this is the type requested; on a `Transfer Response` or `Transfer` activity this is the type actually delivered.
    enum:
      0:
        caption: Unknown
        description: The transfer type is unknown. For example, the event source reports a transfer without indicating whether it was full or incremental, or the message has no transfer type (such as a NOTIFY).
      1:
        caption: Full Transfer (AXFR)
        description: A full zone transfer, in which the primary name server sends the complete contents of the zone.
      2:
        caption: Incremental Transfer (IXFR)
        description: An incremental zone transfer, in which the primary name server sends only the changes since the secondary's known SOA serial.
      99:
        caption: Other
        description: The transfer type is not mapped. See the `transfer_type` attribute, which contains a data source specific value.

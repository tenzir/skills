      '26':
        caption: Order Patch
        description: The ORDERPATCH method changes the ordering of members in an ordered collection.
      '27':
        caption: PRI
        description: The PRI method appears in the HTTP/2 connection preface to confirm the protocol.
      '28':
        caption: Property Find
        description: The PROPFIND method retrieves properties defined on the specified resource.
      '29':
        caption: Property Patch
        description: The PROPPATCH method sets and/or removes properties defined on the specified resource.
      '30':
        caption: Query
        description: The QUERY method performs a safe query request that can include a request body.
      '31':
        caption: Rebind
        description: The REBIND method moves a binding from one collection to another.
      '32':
        caption: Report
        description: The REPORT method retrieves a report about the specified resource.
      '33':
        caption: Search
        description: The SEARCH method searches a resource or collection using the request payload.
      '34':
        caption: Unbind
        description: The UNBIND method removes a binding from the specified collection resource.
      '35':
        caption: Un-Check Out

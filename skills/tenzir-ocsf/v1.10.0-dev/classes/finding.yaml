# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: finding
caption: Finding
category: findings
abstract: true
extends: base_event
description: The Finding event is a generic event that defines a set of attributes available in the Findings category.
profiles: [cloud, datetime, host, incident, osint, record_integrity, security_control]
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the finding activity. Use `1` (Create) when a finding is first generated, `2` (Update) when an existing finding is modified (e.g., severity change, new evidence), and `3` (Close) when a finding is resolved or dismissed.
    enum:
      0:
        caption: Unknown
        description: The event activity is unknown.
      1:
        caption: Create
        description: A finding was created.
      2:
        caption: Update
        description: A finding was updated.
      3:
        caption: Close
        description: A finding was closed.
      99:
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  category_uid: {caption: Category ID, type: integer_t, requirement: required, group: classification, sibling: category_name, enum: {0: Uncategorized}, from: base_event}
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event. Producers and mappers must set this to the `uid` defined in the event class definition. For example, `Detection Finding` is `2004`.
    enum:
      0:
        caption: Base Event
  cloud: {caption: Cloud, type: object_t, object: cloud, requirement: required, group: primary, profile: cloud, from: base_event}
  finding_info:
    caption: Finding Information
    type: object_t
    object: finding_info
    requirement: required
    group: primary
    description: Describes the supporting information about a generated finding.
  metadata: {caption: Metadata, type: object_t, object: metadata, requirement: required, group: context, from: base_event}
  osint: {caption: OSINT, type: object_t, object: osint, array: true, requirement: required, group: primary, profile: osint, from: base_event}
  severity_id: {caption: Severity ID, type: integer_t, requirement: required, group: classification, sibling: severity, enum: {0: Unknown, 1: Informational, 2: Low, 3: Medium, 4: High, 5: Critical, 6: Fatal, 99: Other}, from: base_event}
  time:
    caption: Event Time
    type: timestamp_t
    requirement: required
    group: occurrence
    description: The finding time - when the finding was first created, updated, or closed; not when the underlying activity occurred. For the time range of related events contributing to the finding (`finding_info.related_events[]`), use `start_time` and `end_time`. For the times when the finding was created (`activity_id` = 1) or resolved (`activity_id` = 2 or 3 and `status_id` = 4), populate `finding_info.created_time` or `finding_info.resolved_time` with this value.
  type_uid: {caption: Type ID, type: long_t, requirement: required, group: classification, sibling: type_name, from: base_event}
  action_id: {caption: Action ID, type: integer_t, requirement: recommended, group: primary, profile: security_control, sibling: action, enum: {0: Unknown, 1: Allowed, 2: Denied, 3: Observed, 4: Modified, 99: Other}, from: base_event}
  confidence_id:
    caption: Confidence ID
    type: integer_t
    requirement: recommended
    group: context
    sibling: confidence
    description: The normalized confidence refers to the accuracy of the analytics that produced the finding. An analytic with a low confidence means that the finding scope is wide and may create finding reports that are noisy or may not be malicious in nature.
    enum:
      0:
        caption: Unknown
        description: The normalized confidence is unknown.
      1:
        caption: Low
      2:
        caption: Medium
      3:
        caption: High
      99:
        caption: Other
        description: The confidence is not mapped to the defined enum values. See the `confidence` attribute, which contains a data source specific value.
  disposition_id:
    caption: Disposition ID
    type: integer_t
    requirement: recommended
    group: primary
    profile: security_control
    sibling: disposition
    enum:
      0: Unknown
      1: Allowed
      2: Blocked
      3: Quarantined
      4: Isolated
      5: Deleted
      6: Dropped
      7: Custom Action
      8: Approved
      9: Restored
      10: Exonerated
      11: Corrected
      12: Partially Corrected
      13: Uncorrected
      14: Delayed
      15: Detected
      16: No Action
      17: Logged
      18: Tagged
      19: Alert
      20: Count
      21: Reset
      22: Captcha
      23: Challenge
      24: Access Revoked
      25: Rejected
      26: Unauthorized
      27: Error
      99: Other
    from: base_event
  impact:
    caption: Impact
    type: string_t
    requirement: recommended
    group: primary
    profile: incident
    description: The impact , normalized to the caption of the impact_id value. In the case of 'Other', it is defined by the event source.
  impact_id:
    caption: Impact ID
    type: integer_t
    requirement: recommended
    group: primary
    profile: incident
    sibling: impact
    description: The normalized impact of the incident or finding. Per NIST, this is the magnitude of harm that can be expected to result from the consequences of unauthorized disclosure, modification, destruction, or loss of information or information system availability.
    enum:
      0:
        caption: Unknown
        description: The normalized impact is unknown.
      1:
        caption: Low
        description: The magnitude of harm is low.
      2:
        caption: Medium
        description: The magnitude of harm is moderate.
      3:
        caption: High
        description: The magnitude of harm is high.
      4:
        caption: Critical
        description: The magnitude of harm is high and the scope is widespread.
      99:
        caption: Other
        description: The impact is not mapped. See the `impact` attribute, which contains a data source specific value.
    references:
    - description: NIST SP 800-172 from FIPS 199
      url: https://doi.org/10.6028/NIST.FIPS.199
    - description: NIST Computer Security Resource Center
      url: https://doi.org/10.6028/NIST.FIPS.199
  impact_score:
    caption: Impact Score
    type: integer_t
    requirement: recommended
    group: primary
    profile: incident
    description: The impact as an integer value of the finding, valid range 0-100.
  is_alert: {caption: Alert, type: boolean_t, requirement: recommended, group: primary, profile: security_control, from: base_event}
  message: {caption: Message, type: string_t, requirement: recommended, group: primary, from: base_event}
  observables: {caption: Observables, type: object_t, object: observable, array: true, requirement: recommended, group: primary, from: base_event}
  priority_id:
    caption: Priority ID
    type: integer_t
    requirement: recommended
    group: context
    profile: incident
    sibling: priority
    description: The normalized priority. Priority identifies the relative importance of the incident or finding. It is a measurement of urgency.
    enum:
      0:
        caption: Unknown
        description: No priority is assigned.
      1:
        caption: Low
        description: Application or personal procedure is unusable, where a workaround is available or a repair is possible.
      2:
        caption: Medium
        description: Non-critical function or procedure is unusable or hard to use causing operational disruptions with no direct impact on a service's availability. A workaround is available.
      3:
        caption: High
        description: Critical functionality or network access is interrupted, degraded or unusable, having a severe impact on services availability. No acceptable alternative is possible.
      4:
        caption: Critical
        description: Interruption making a critical functionality inaccessible or a complete network interruption causing a severe impact on services availability. There is no possible alternative.
      99:
        caption: Other
        description: The priority is not normalized.
  resources:
    caption: Affected Resources
    type: object_t
    object: resource_details
    array: true
    requirement: recommended
    group: context
    description: Describes details about resources that were the target of the activity that triggered the finding.
  src_url:
    caption: Source URL
    type: url_t
    requirement: recommended
    group: primary
    profile: incident
    observable: 6
    description: A Url link used to access the original incident.
  status_code: {caption: Status Code, type: string_t, requirement: recommended, group: primary, from: base_event}
  status_detail: {caption: Status Detail, type: string_t, requirement: recommended, group: primary, from: base_event}
  status_id:
    caption: Status ID
    type: integer_t
    requirement: recommended
    group: context
    sibling: status
    description: 'The normalized finding lifecycle status identifier. Unlike the status of an activity event, which indicates the success or failure of the activity, finding status tracks the review and triage workflow: whether the finding is new, being investigated, suppressed, or resolved. Producers should set this to reflect the current state of the finding in their system (e.g., `1` for newly created findings, `4` when remediated).'
    enum:
      0:
        caption: Unknown
        description: The status is unknown.
      1:
        caption: New
        description: The Finding is new and yet to be reviewed.
      2:
        caption: In Progress
        description: The Finding is under review.
      3:
        caption: Suppressed
        description: The Finding was reviewed, determined to be benign or a false positive and is now suppressed.
      4:
        caption: Resolved
        description: The Finding was reviewed, remediated and is now considered resolved.
      5:
        caption: Archived
        description: The Finding was archived.
      6:
        caption: Deleted
        description: The Finding was deleted. For example, it might have been created in error.
      99:
        caption: Other
        description: The status is not mapped. See the `status` attribute, which contains a data source specific value.
  timezone_offset: {caption: Timezone Offset, type: integer_t, requirement: recommended, group: occurrence, from: base_event}
  verdict:
    caption: Verdict
    type: string_t
    requirement: recommended
    group: primary
    profile: incident
    description: The verdict assigned to an Incident finding.
  verdict_id:
    caption: Verdict ID
    type: integer_t
    requirement: recommended
    group: primary
    profile: incident
    sibling: verdict
    description: The normalized verdict of an Incident.
    enum:
      0:
        caption: Unknown
        description: The type is unknown.
      1:
        caption: False Positive
        description: The incident is a false positive.
      2:
        caption: True Positive
        description: The incident is a true positive.
      3:
        caption: Disregard
        description: The incident can be disregarded as it is unimportant, an error or accident.
      4:
        caption: Suspicious
        description: The incident is suspicious.
      5:
        caption: Benign
        description: The incident is benign.
      6:
        caption: Test
        description: The incident is a test.
      7:
        caption: Insufficient Data
        description: The incident has insufficient data to make a verdict.
      8:
        caption: Security Risk
        description: The incident is a security risk.
      9:
        caption: Managed Externally
        description: The incident remediation or required actions are managed externally.
      10:
        caption: Duplicate
        description: The incident is a duplicate.
      99:
        caption: Other
        description: The type is not mapped. See the `type` attribute, which contains a data source specific value.
  action: {caption: Action, type: string_t, requirement: optional, group: primary, profile: security_control, from: base_event}
  activity_name:
    caption: Activity
    type: string_t
    requirement: optional
    group: classification
    description: The finding activity name, as defined by the `activity_id`. When `activity_id` is `99` (Other), this must contain the source-specific activity label.
  actor: {caption: Actor, type: object_t, object: actor, requirement: optional, group: primary, profile: host, from: base_event}
  additional_firewall_rules: {caption: Additional Security Control Rules, type: object_t, object: firewall_rule_evaluation, array: true, requirement: optional, group: primary, profile: security_control, from: base_event}
  api: {caption: API Details, type: object_t, object: api, requirement: optional, group: context, profile: cloud, from: base_event}
  assignee:
    caption: Assignee
    type: object_t
    object: user
    requirement: optional
    group: context
    profile: incident
    observable: 21
    description: The details of the user assigned to an Incident.
  assignee_group:
    caption: Assignee Group
    type: object_t
    object: group
    requirement: optional
    group: context
    profile: incident
    description: The details of the group assigned to an Incident.
  attacks: {caption: MITRE ATT&CK® and ATLAS™ Details, type: object_t, object: attack, array: true, requirement: optional, group: primary, profile: security_control, from: base_event}
  attestation_list: {caption: Attestation List, type: object_t, object: attestation, array: true, requirement: optional, group: context, profile: record_integrity, from: base_event}
  authorizations: {caption: Authorization Information, type: object_t, object: authorization, array: true, requirement: optional, group: primary, profile: security_control, from: base_event}
  category_name: {caption: Category, type: string_t, requirement: optional, group: classification, from: base_event}
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event class name, as defined by the `class_uid` value. The value must match the caption defined for the corresponding `class_uid` (e.g., `"Detection Finding"` for `class_uid: 2004`).'
  comment:
    caption: Comment
    type: string_t
    requirement: optional
    group: context
    deprecated:
      since: 1.9.0
      message: Use the `notes` attribute instead.
      superseded_by: [notes]
    description: A user provided comment about the finding.
  confidence:
    caption: Confidence
    type: string_t
    requirement: optional
    group: context
    description: The confidence, normalized to the caption of the confidence_id value. In the case of 'Other', it is defined by the event source.
  confidence_score:
    caption: Confidence Score
    type: integer_t
    requirement: optional
    group: context
    description: The confidence score as reported by the source or assigned by the analyst expressed on a source-specific numeric scale. This score provides finer-grained confidence information than the categorical `confidence_id` value. If `confidence_id` is 99 'Other', it should reflect the the same assessment as `confidence` if both are populated.
  count: {caption: Count, type: integer_t, requirement: optional, group: occurrence, from: base_event}
  device:
    caption: Device
    type: object_t
    object: device
    requirement: optional
    group: context
    observable: 20
    description: |-
      Describes the affected device/host. It can be used in conjunction with `resources` or when there are multiple devices affected. E.g. The role of the device as target or actor, specific details about a cloud resource compute instance, etc.

      If a single device is the source of the finding, use the `Host` profile and populate `device`.
  disposition: {caption: Disposition, type: string_t, requirement: optional, group: primary, profile: security_control, from: base_event}
  duration: {caption: Duration Milliseconds, type: long_t, requirement: optional, group: occurrence, from: base_event}
  end_time:
    caption: End Time
    type: timestamp_t
    requirement: optional
    group: occurrence
    description: The time of the most recent event or finding that contributed to this finding.
  enrichments: {caption: Enrichments, type: object_t, object: enrichment, array: true, requirement: optional, group: context, from: base_event}
  firewall_rule: {caption: Security Control Rule, type: object_t, object: firewall_rule, requirement: optional, group: primary, profile: security_control, from: base_event}
  is_declared_incident:
    caption: Declared Incident
    type: boolean_t
    requirement: optional
    group: context
    profile: incident
    description: Indicates that the Finding (or Incident Finding) is declared to be an incident, subject to the meaning of incident to an organization.
  is_suspected_breach:
    caption: Suspected Breach
    type: boolean_t
    requirement: optional
    group: context
    profile: incident
    description: A determination based on analytics as to whether a potential breach was found.
  malware: {caption: Malware, type: object_t, object: malware, array: true, requirement: optional, group: primary, profile: security_control, from: base_event}
  malware_scan_info: {caption: Malware Scan Info, type: object_t, object: malware_scan_info, requirement: optional, group: primary, profile: security_control, from: base_event}
  notes:
    caption: Notes
    type: object_t
    object: note
    array: true
    requirement: optional
    group: context
    description: Additional notes related to the finding. Each note in the array can include a comment, the user who made the comment, the time when the note was created, and the time when the note was last modified (typically by the same user). Notes can be used to provide additional context, explanations, or observations by analysts related to the finding over time.
  policy: {caption: Policy, type: object_t, object: policy, requirement: optional, group: primary, profile: security_control, from: base_event}
  priority:
    caption: Priority
    type: string_t
    requirement: optional
    group: context
    profile: incident
    description: The priority, normalized to the caption of the priority_id value. In the case of 'Other', it is defined by the event source.
  raw_data: {caption: Raw Data, type: string_t, requirement: optional, group: context, from: base_event}
  raw_data_hash: {caption: Raw Data Hash, type: object_t, object: fingerprint, requirement: optional, group: context, observable: 30, from: base_event}
  raw_data_size: {caption: Raw Data Size, type: long_t, requirement: optional, group: context, from: base_event}
  risk_details: {caption: Risk Details, type: string_t, requirement: optional, group: context, profile: security_control, from: base_event}
  risk_level: {caption: Risk Level, type: string_t, requirement: optional, group: context, profile: security_control, from: base_event}
  risk_level_id: {caption: Risk Level ID, type: integer_t, requirement: optional, group: context, profile: security_control, sibling: risk_level, enum: {0: Info, 1: Low, 2: Medium, 3: High, 4: Critical, 99: Other}, from: base_event}
  risk_score: {caption: Risk Score, type: integer_t, requirement: optional, group: context, profile: security_control, from: base_event}
  severity: {caption: Severity, type: string_t, requirement: optional, group: classification, from: base_event}
  start_time:
    caption: Start Time
    type: timestamp_t
    requirement: optional
    group: occurrence
    description: The time of the earliest event or finding that contributed to this finding.
  status:
    caption: Status
    type: string_t
    requirement: optional
    group: context
    description: The finding lifecycle status label, normalized to the caption of the `status_id` value. When `status_id` is `99` (Other), this must contain the source-specific status label.
  ticket:
    caption: Ticket
    type: object_t
    object: ticket
    requirement: optional
    group: context
    profile: incident
    deprecated:
      since: 1.5.0
      message: Use `tickets` instead.
      superseded_by: [tickets]
    description: The linked ticket in the ticketing system.
  tickets:
    caption: Tickets
    type: object_t
    object: ticket
    array: true
    requirement: optional
    group: context
    profile: incident
    description: The associated ticket(s) in the ticketing system. Each ticket contains details like ticket ID, status, etc.
  type_name: {caption: Type Name, type: string_t, requirement: optional, group: classification, from: base_event}
  unmapped: {caption: Unmapped Data, type: object_t, object: object, requirement: optional, group: context, from: base_event}
  vendor_attributes:
    caption: Vendor Attributes
    type: object_t
    object: vendor_attributes
    requirement: optional
    group: context
    description: |-
      The Vendor Attributes object can be used to represent values of attributes populated by the Vendor/Finding Provider. It can help distinguish between the vendor-provided values and consumer-updated values, of key attributes like `severity_id`.
      The original finding producer should not populate this object. It should be populated by consuming systems that support data mutability.

  ticket: {caption: Ticket, type: object_t, object: ticket, requirement: optional, group: context, profile: incident, deprecated: {since: 1.5.0, message: Use `tickets` instead., superseded_by: [tickets]}, from: finding}
  tickets: {caption: Tickets, type: object_t, object: ticket, array: true, requirement: optional, group: context, profile: incident, from: finding}
  time_dt:
    caption: Event Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: finding
    description: The finding time - when the finding was first created, updated, or closed; not when the underlying activity occurred. For the time range of related events contributing to the finding (`finding_info.related_events[]`), use `start_time` and `end_time`. For the times when the finding was created (`activity_id` = 1) or resolved (`activity_id` = 2 or 3 and `status_id` = 4), populate `finding_info.created_time` or `finding_info.resolved_time` with this value.

# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: detection_finding
caption: Detection Finding
uid: 2004
category: findings
category_uid: 2
extends: finding
supersedes:
- name: security_finding
  since: 1.1.0
description: |-
  A Detection Finding describes detections or alerts generated by security products using correlation engines, detection engines or other methodologies.
  Note: If the event producer is a security control, the `Security Control` profile should be applied and its `attacks` information, if present, should be duplicated into the `finding_info` object.
  Note: If the Finding is an incident, i.e. requires incident workflow, also apply the `Incident` profile or aggregate the finding into an `Incident Finding`.

  Note: Findings are mutable and as such have a lifecycle, via `Update` activities. When modeling atomic alerts, you are encouraged to consider using the `Security Control` profile with the activity event associated with the alert. See the referenced article below.
profiles: [cloud, container, data_classification, datetime, host, incident, osint, record_integrity, security_control]
references:
- description: How to Model Alerts with OCSF
  url: https://github.com/ocsf/ocsf-docs/blob/main/articles/modeling-alerts.md
attributes:
  activity_id: {caption: Activity ID, type: integer_t, requirement: required, group: classification, sibling: activity_name, enum: {0: Unknown, 1: Create, 2: Update, 3: Close, 99: Other}, from: finding}
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event. Each event class belongs to exactly one category. Producers and mappers must set this to the category defined by the event class being used.
    enum:
      2:
        caption: Findings
        description: Findings events report findings, detections, and possible resolutions of malware, anomalies, or other actions performed by security products.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event. Producers and mappers must set this to the `uid` defined in the event class definition. For example, `Detection Finding` is `2004`.
    enum:
      2004:
        caption: Detection Finding
        description: |-
          A Detection Finding describes detections or alerts generated by security products using correlation engines, detection engines or other methodologies.
          Note: If the event producer is a security control, the `Security Control` profile should be applied and its `attacks` information, if present, should be duplicated into the `finding_info` object.
          Note: If the Finding is an incident, i.e. requires incident workflow, also apply the `Incident` profile or aggregate the finding into an `Incident Finding`.

          Note: Findings are mutable and as such have a lifecycle, via `Update` activities. When modeling atomic alerts, you are encouraged to consider using the `Security Control` profile with the activity event associated with the alert. See the referenced article below.
  cloud: {caption: Cloud, type: object_t, object: cloud, requirement: required, group: primary, profile: cloud, from: base_event}
  finding_info: {caption: Finding Information, type: object_t, object: finding_info, requirement: required, group: primary, from: finding}
  metadata: {caption: Metadata, type: object_t, object: metadata, requirement: required, group: context, from: base_event}
  osint: {caption: OSINT, type: object_t, object: osint, array: true, requirement: required, group: primary, profile: osint, from: base_event}
  severity_id: {caption: Severity ID, type: integer_t, requirement: required, group: classification, sibling: severity, enum: {0: Unknown, 1: Informational, 2: Low, 3: Medium, 4: High, 5: Critical, 6: Fatal, 99: Other}, from: base_event}
  time: {caption: Event Time, type: timestamp_t, requirement: required, group: occurrence, from: finding}
  type_uid:
    caption: Type ID
    type: long_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event/finding type ID. It identifies the event''s semantics and structure. Producers and mappers must compute this as `class_uid * 100 + activity_id`. It uniquely identifies the combination of event class and activity across the entire schema. For example, `Detection Finding: Create` is `200401`.'
  action_id: {caption: Action ID, type: integer_t, requirement: recommended, group: primary, profile: security_control, sibling: action, enum: {0: Unknown, 1: Allowed, 2: Denied, 3: Observed, 4: Modified, 99: Other}, from: base_event}
  confidence_id:
    caption: Confidence ID
    type: integer_t
    requirement: recommended
    group: context
    sibling: confidence
    description: The normalized confidence refers to the accuracy of the analytics that produced the finding. An analytic with a low confidence means that the finding scope is wide and may create finding reports that are noisy or may not be malicious in nature.
    enum:
      0:
        caption: Unknown
        description: The normalized confidence is unknown.
      1:
        caption: Low
      2:
        caption: Medium
      3:
        caption: High
      99:
        caption: Other
        description: The confidence is not mapped to the defined enum values. See the `confidence` attribute, which contains a data source specific value.
  disposition_id:
    caption: Disposition ID
    type: integer_t
    requirement: recommended
    group: primary
    profile: security_control
    sibling: disposition
    enum:
      0: Unknown
      1: Allowed
      2: Blocked
      3: Quarantined
      4: Isolated
      5: Deleted
      6: Dropped
      7: Custom Action
      8: Approved
      9: Restored
      10: Exonerated
      11: Corrected
      12: Partially Corrected
      13: Uncorrected
      14: Delayed
      15: Detected
      16: No Action
      17: Logged
      18: Tagged
      19: Alert
      20: Count
      21: Reset
      22: Captcha
      23: Challenge
      24: Access Revoked
      25: Rejected
      26: Unauthorized
      27: Error
      99: Other
    from: base_event
  evidences:
    caption: Evidence Artifacts
    type: object_t
    object: evidences
    array: true
    requirement: recommended
    group: primary
    description: Describes various evidence artifacts associated to the activity/activities that triggered a security detection.
  is_alert:
    caption: Alert
    type: boolean_t
    requirement: recommended
    group: primary
    description: Indicates that the event is considered to be an alertable signal. For example, an `activity_id` of 'Create' could constitute an alertable signal and the value would be `true`, while 'Close' likely would not and either omit the attribute or set its value to `false`. Note that other events with the `security_control` profile may also be deemed alertable signals and may also carry `is_alert = true` attributes.
  message: {caption: Message, type: string_t, requirement: recommended, group: primary, from: base_event}
  observables: {caption: Observables, type: object_t, object: observable, array: true, requirement: recommended, group: primary, from: base_event}
  priority_id: {caption: Priority ID, type: integer_t, requirement: recommended, group: context, profile: incident, sibling: priority, enum: {0: Unknown, 1: Low, 2: Medium, 3: High, 4: Critical, 99: Other}, from: finding}
  resources:
    caption: Affected Resources
    type: object_t
    object: resource_details
    array: true
    requirement: recommended
    group: primary
    description: Describes details about resources that were the target of the activity that triggered the finding.
  src_url: {caption: Source URL, type: url_t, requirement: recommended, group: primary, profile: incident, observable: 6, from: finding}
  status_code: {caption: Status Code, type: string_t, requirement: recommended, group: primary, from: base_event}
  status_detail: {caption: Status Detail, type: string_t, requirement: recommended, group: primary, from: base_event}
  status_id: {caption: Status ID, type: integer_t, requirement: recommended, group: context, sibling: status, enum: {0: Unknown, 1: New, 2: In Progress, 3: Suppressed, 4: Resolved, 5: Archived, 6: Deleted, 99: Other}, from: finding}
  timezone_offset: {caption: Timezone Offset, type: integer_t, requirement: recommended, group: occurrence, from: base_event}
  verdict: {caption: Verdict, type: string_t, requirement: recommended, group: primary, profile: incident, from: finding}
  verdict_id: {caption: Verdict ID, type: integer_t, requirement: recommended, group: primary, profile: incident, sibling: verdict, enum: {0: Unknown, 1: False Positive, 2: True Positive, 3: Disregard, 4: Suspicious, 5: Benign, 6: Test, 7: Insufficient Data, 8: Security Risk, 9: Managed Externally, 10: Duplicate, 99: Other}, from: finding}
  action: {caption: Action, type: string_t, requirement: optional, group: primary, profile: security_control, from: base_event}
  activity_name: {caption: Activity, type: string_t, requirement: optional, group: classification, from: finding}
  actor: {caption: Actor, type: object_t, object: actor, requirement: optional, group: primary, profile: host, from: base_event}
  additional_firewall_rules: {caption: Additional Security Control Rules, type: object_t, object: firewall_rule_evaluation, array: true, requirement: optional, group: primary, profile: security_control, from: base_event}
  anomaly_analyses:
    caption: Anomaly Analyses
    type: object_t
    object: anomaly_analysis
    array: true
    requirement: optional
    group: context
    description: Describes baseline information about normal activity patterns, along with any detected deviations or anomalies that triggered this finding.
  api: {caption: API Details, type: object_t, object: api, requirement: optional, group: context, profile: cloud, from: base_event}
  assignee: {caption: Assignee, type: object_t, object: user, requirement: optional, group: context, profile: incident, observable: 21, from: finding}
  assignee_group: {caption: Assignee Group, type: object_t, object: group, requirement: optional, group: context, profile: incident, from: finding}
  attacks: {caption: MITRE ATT&CK® and ATLAS™ Details, type: object_t, object: attack, array: true, requirement: optional, group: primary, profile: security_control, from: base_event}
  attestation_list: {caption: Attestation List, type: object_t, object: attestation, array: true, requirement: optional, group: context, profile: record_integrity, from: base_event}
  authorizations: {caption: Authorization Information, type: object_t, object: authorization, array: true, requirement: optional, group: primary, profile: security_control, from: base_event}
  category_name:
    caption: Category
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event category name, as defined by category_uid value: `Findings`.'
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event class name, as defined by class_uid value: `Detection Finding`.'
  comment: {caption: Comment, type: string_t, requirement: optional, group: context, deprecated: {since: 1.9.0, message: Use the `notes` attribute instead., superseded_by: [notes]}, from: finding}
  confidence:
    caption: Confidence
    type: string_t
    requirement: optional
    group: context
    description: The confidence, normalized to the caption of the confidence_id value. In the case of 'Other', it is defined by the event source.
  confidence_score:
    caption: Confidence Score
    type: integer_t
    requirement: optional
    group: context
    description: The confidence score as reported by the source or assigned by the analyst expressed on a source-specific numeric scale. This score provides finer-grained confidence information than the categorical `confidence_id` value. If `confidence_id` is 99 'Other', it should reflect the the same assessment as `confidence` if both are populated.
  count: {caption: Count, type: integer_t, requirement: optional, group: occurrence, from: base_event}
  device: {caption: Device, type: object_t, object: device, requirement: optional, group: context, observable: 20, from: finding}
  disposition: {caption: Disposition, type: string_t, requirement: optional, group: primary, profile: security_control, from: base_event}
  duration: {caption: Duration Milliseconds, type: long_t, requirement: optional, group: occurrence, from: base_event}
  end_time: {caption: End Time, type: timestamp_t, requirement: optional, group: occurrence, from: finding}
  end_time_dt:
    caption: End Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: finding
    description: The time of the most recent event or finding that contributed to this finding.
  enrichments: {caption: Enrichments, type: object_t, object: enrichment, array: true, requirement: optional, group: context, from: base_event}
  firewall_rule: {caption: Security Control Rule, type: object_t, object: firewall_rule, requirement: optional, group: primary, profile: security_control, from: base_event}
  impact:
    caption: Impact
    type: string_t
    requirement: optional
    group: context
    description: The impact , normalized to the caption of the impact_id value. In the case of 'Other', it is defined by the event source.
  impact_id:
    caption: Impact ID
    type: integer_t
    requirement: optional
    group: context
    sibling: impact
    description: The normalized impact of the incident or finding. Per NIST, this is the magnitude of harm that can be expected to result from the consequences of unauthorized disclosure, modification, destruction, or loss of information or information system availability.
    enum:
      0:
        caption: Unknown
        description: The normalized impact is unknown.
      1:
        caption: Low
        description: The magnitude of harm is low.
      2:
        caption: Medium
        description: The magnitude of harm is moderate.
      3:
        caption: High
        description: The magnitude of harm is high.
      4:
        caption: Critical
        description: The magnitude of harm is high and the scope is widespread.
      99:
        caption: Other
        description: The impact is not mapped. See the `impact` attribute, which contains a data source specific value.
    references:
    - description: NIST SP 800-172 from FIPS 199
      url: https://doi.org/10.6028/NIST.FIPS.199
    - description: NIST Computer Security Resource Center
      url: https://doi.org/10.6028/NIST.FIPS.199
  impact_score:
    caption: Impact Score
    type: integer_t
    requirement: optional
    group: context
    description: The impact as an integer value of the finding, valid range 0-100.
  is_declared_incident: {caption: Declared Incident, type: boolean_t, requirement: optional, group: context, profile: incident, from: finding}
  is_suspected_breach: {caption: Suspected Breach, type: boolean_t, requirement: optional, group: context, profile: incident, from: finding}
  likelihood:
    caption: Likelihood
    type: string_t
    requirement: optional
    group: context
    description: The likelihood, normalized to the caption of the `likelihood_id` value. In the case of 'Other', it is defined by the event source.
  likelihood_id:
    caption: Likelihood ID
    type: integer_t
    requirement: optional
    group: context
    sibling: likelihood
    description: The normalized likelihood of the finding, representing a subjective assessment of the probability that the reported threat activity will occur or succeed.
    enum:
      0:
        caption: Unknown
        description: The normalized likelihood is unknown.
      1:
        caption: Very Low
        description: The probability that the reported threat activity will occur or succeed is very low.
      2:
        caption: Low
        description: The probability that the reported threat activity will occur or succeed is low.
      3:
        caption: Moderate
        description: The probability that the reported threat activity will occur or succeed is moderate.
      4:
        caption: High
        description: The probability that the reported threat activity will occur or succeed is high.
      5:
        caption: Very High
        description: The probability that the reported threat activity will occur or succeed is very high.
      99:
        caption: Other
        description: The likelihood is not mapped to the defined enum values. See the `likelihood` attribute, which contains a data source specific value.
    references:
    - description: NIST SP 800-30 Rev. 1, Guide for Conducting Risk Assessments
      url: https://doi.org/10.6028/NIST.SP.800-30r1
    - description: NIST Computer Security Resource Center
      url: https://csrc.nist.gov/glossary/term/likelihood
  likelihood_score:
    caption: Likelihood Score
    type: integer_t
    requirement: optional
    group: context
    description: The likelihood score as reported by the event source.

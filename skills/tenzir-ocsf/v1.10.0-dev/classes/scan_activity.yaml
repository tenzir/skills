name: scan_activity
caption: Scan Activity
uid: 6007
category: application
category_uid: 6
extends: application
description: Scan events report the start, completion, and results of a scan job. The scan event includes the number of items that were scanned and the number of detections that were resolved.
profiles: [ai_operation, cloud, container, data_classification, datetime, host, osint, record_integrity, security_control]
attributes:
  action:
    caption: Action
    requirement: optional
    profile: security_control
    definition: v1.10.0-dev/classes/base_event.yaml
  action_id:
    caption: Action ID
    requirement: recommended
    profile: security_control

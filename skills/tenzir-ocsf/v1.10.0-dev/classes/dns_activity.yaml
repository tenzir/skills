name: dns_activity
caption: DNS Activity
uid: 4003
category: network
category_uid: 4
extends: network
description: DNS Activity events report DNS queries and answers as seen on the network.
profiles: [ai_operation, cloud, container, data_classification, datetime, host, load_balancer, network_proxy, osint, record_integrity, security_control]
constraints:
  at_least_one: [dst_endpoint, src_endpoint]
references:
- description: D3FEND™ Ontology d3f:DNSEvent
  url: https://d3fend.mitre.org/event/d3f:DNSEvent/

  query_additional:
    caption: DNS Query Additional Section
    type: object_t
    object: dns_section
    requirement: optional
    group: context
    description: The Additional section of the DNS query message sent by the client, containing supplementary resource records and an optional TSIG record. A DNS message has at most one TSIG record; for a transaction with both query and response, the query TSIG is in `query_additional.tsig` and the response TSIG is in `response_additional.tsig`.
  query_time:
    caption: Query Time
    type: timestamp_t
    requirement: recommended
    group: occurrence
    description: The Domain Name System (DNS) query time.
  query_time_dt:

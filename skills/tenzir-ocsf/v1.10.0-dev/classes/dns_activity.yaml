    caption: DNS Opcode
    type: string_t
    requirement: optional
    group: context
    description: The DNS opcode specifies the type of the query message.
  opcode_id:
    caption: DNS Opcode ID
    type: integer_t
    requirement: recommended
    group: primary
    description: The DNS opcode ID specifies the normalized query message type as defined in RFC 5395.
    enum:
      '0':
        caption: Query
        description: Standard query
      '1':
        caption: Inverse Query
        description: Inverse query, obsolete
      '2':
        caption: Status
        description: Server status request
      '3':
        caption: Reserved
        description: Reserved, not used
      '4':
        caption: Notify
        description: Zone change notification
      '5':
        caption: Update
        description: Dynamic DNS update
      '6':
        caption: DSO Message
        description: DNS Stateful Operations (DSO)
      '99':
        caption: Other
        description: The DNS Opcode is not defined by the RFC. See the `opcode` attribute, which contains a data source specific value.

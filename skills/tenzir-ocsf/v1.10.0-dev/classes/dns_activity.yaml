  flag_ids:
    caption: DNS Header Flags
    type: integer_t
    array: true
    requirement: recommended
    group: primary
    sibling: flags
    description: The list of DNS message header flag IDs. For Query events, populated from the query header (RD, CD). For Response and Traffic events, populated from the response header, which is the complete and authoritative source as it echoes all client-set flags and adds server-set flags.
    enum:
      '0':
        caption: Unknown
        description: The flag is unknown.
      '1':
        caption: Authoritative Answer
        description: The responding server is authoritative for the domain. Set by the server in responses only.
      '2':
        caption: Truncated Response
        description: The response was truncated because it exceeded the maximum UDP message size.
      '3':
        caption: Recursion Desired
        description: The client requests that the server perform recursive resolution. Set by the client and echoed in the response.
      '4':
        caption: Recursion Available
        description: The server supports recursive resolution. Set by the server in responses.
      '5':
        caption: Authentic Data
        description: All data in the response has been cryptographically verified (DNSSEC). Set by the server.
      '6':
        caption: Checking Disabled
        description: The client requests that the server disable DNSSEC validation. Set by the client and echoed in the response.
      '99':
        caption: Other
        description: The flag is not mapped. See the `flags` attribute, which contains a data source specific value.
  flags:
    caption: DNS Header Flags
    type: string_t
    array: true
    requirement: optional
    group: context
    description: The list of DNS message header flags, normalized to the captions of the `flag_ids` values.

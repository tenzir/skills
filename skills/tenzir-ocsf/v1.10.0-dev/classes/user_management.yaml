  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event. The target of each activity is the `user` attribute.
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Create
        description: Create a user. Populate the `user` object with details of the user.
      '2':
        caption: Update
        description: Update the user. The updated user details should be populated in the `updated_user` attribute.
      '3':
        caption: Delete
        description: Delete the user.
      '4':
        caption: Enable
        description: Enable the user.
      '5':
        caption: Disable
        description: Disable the user.
      '6':
        caption: Lock
        description: Lock out the user.
      '7':
        caption: Unlock
        description: Unlock a previously locked out user.
      '8':
        caption: Password Change
        description: An attempt to change the user's password.
      '9':
        caption: Password Reset
        description: An attempt to reset the user's password.
      '10':
        caption: Attach Policies
        description: Attach one or more IAM Policies to the user. Use `policies` as policies to be attached.
      '11':
        caption: Detach Policies
        description: Detach one or more IAM Policies from the user. Use `policies` as policies to be detached.
      '12':
        caption: Enable MFA Factors
        description: Enable one or more authentication factors for the user. Use `auth_factors` as factors to be enabled.
      '13':
        caption: Disable MFA Factors
        description: Disable one or more authentication factors for the user. Use `auth_factors` as factors to be disabled.
      '14':
        caption: Assign Privileges
        description: Assign privileges to the user. Use `privileges` as privileges to be assigned.
      '15':
        caption: Remove Privileges
        description: Remove privileges from the user. Use `privileges` as privileges to be removed.
      '16':
        caption: Assign Roles
        description: Assign one or more roles to the user. Use `iam_roles` as roles to be assigned.
      '17':
        caption: Remove Roles
        description: Remove one or more roles from the user. Use `iam_roles` as roles to be removed.
      '18':
        caption: Add Programmatic Credentials
        description: Add credentials to a role. Use `programmatic_credentials` as credentials to be added.
      '19':
        caption: Remove Programmatic Credentials
        description: Remove credentials from a role. Use `programmatic_credentials` as credentials to be removed.
      '99':
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.

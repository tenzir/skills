# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: process_activity
caption: Process Activity
uid: 1007
category: system
category_uid: 1
extends: system
description: Process Activity events report when a process launches, injects, opens or terminates another process, successful or otherwise.
profiles: [ai_operation, cloud, container, data_classification, datetime, host, osint, record_integrity, security_control]
associations:
  actor.user: [device]
  device: [actor.user]
references:
- description: D3FEND™ Ontology d3f:ProcessEvent
  url: https://d3fend.mitre.org/event/d3f:ProcessEvent/
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event. Each event class defines its own set of activity values. Use `0` (Unknown) when the activity cannot be determined. Use `99` (Other) when the activity does not match any defined value, in which case `activity_name` must be populated with the source-specific label.
    enum:
      0:
        caption: Unknown
        description: The event activity is unknown.
      1:
        caption: Launch
        description: A request by the actor to launch another process. Refer to the `launch_type_id` attribute for details of the specific launch type.
      2:
        caption: Terminate
        description: A request by the actor to terminate a process. This activity is most commonly reflexive, this being the case when a process exits at its own initiation. Note too that Windows security products cannot always identify the actor in the case of inter-process termination. In this case, `actor.process` and `process` refer to the exiting process, i.e. indistinguishable from the reflexive case.
      3:
        caption: Open
        description: A request by the actor to obtain a handle or descriptor to a process with the aim of performing further actions upon that process. The target is usually a different process but this activity can also be reflexive.
      4:
        caption: Inject
        description: A request by the actor to execute code within the context of a process. The target is usually a different process but this activity can also be reflexive. Refer to the `injection_type_id` attribute for details of the specific injection type.
        references:
        - description: 'Guidance on the use of "Module Activity: Load" and "Process Activity: Inject".'
          url: https://github.com/ocsf/ocsf-docs/blob/main/faqs/schema-faq.md#when-should-i-use-a-module-activity-load-event-and-when-should-i-use-a-process-activity-inject-event
      5:
        caption: Set User ID
        description: A request by the actor to change its user identity by invoking the `setuid()` system call. Common programs like `su` and `sudo` use this mechanism. Note that the impersonation mechanism on Windows is not directly equivalent because it acts at the thread level.
      99:
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
    references:
    - description: setuid() man page
      url: https://www.man7.org/linux/man-pages/man2/setuid.2.html
  actor:
    caption: Actor
    type: object_t
    object: actor
    requirement: required
    group: primary
    description: The actor that performed the activity on the target `process`. For example, the process that started a new process or injected code into another process.
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event. Each event class belongs to exactly one category. Producers and mappers must set this to the category defined by the event class being used.
    enum:
      1:
        caption: System Activity
        description: System Activity events.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event. Producers and mappers must set this to the `uid` defined in the event class definition. For example, `Detection Finding` is `2004`.
    enum:
      1007:
        caption: Process Activity
        description: Process Activity events report when a process launches, injects, opens or terminates another process, successful or otherwise.
  cloud: {caption: Cloud, type: object_t, object: cloud, requirement: required, group: primary, profile: cloud, from: base_event}
  device: {caption: Device, type: object_t, object: device, requirement: required, group: primary, observable: 20, from: system}
  metadata: {caption: Metadata, type: object_t, object: metadata, requirement: required, group: context, from: base_event}
  osint: {caption: OSINT, type: object_t, object: osint, array: true, requirement: required, group: primary, profile: osint, from: base_event}
  process:
    caption: Process
    type: object_t
    object: process
    requirement: required
    group: primary
    observable: 25
    description: The process that was launched, injected into, opened, or terminated.
  severity_id: {caption: Severity ID, type: integer_t, requirement: required, group: classification, sibling: severity, enum: {0: Unknown, 1: Informational, 2: Low, 3: Medium, 4: High, 5: Critical, 6: Fatal, 99: Other}, from: base_event}
  time: {caption: Event Time, type: timestamp_t, requirement: required, group: occurrence, from: base_event}
  type_uid:
    caption: Type ID
    type: long_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event/finding type ID. It identifies the event''s semantics and structure. Producers and mappers must compute this as `class_uid * 100 + activity_id`. It uniquely identifies the combination of event class and activity across the entire schema. For example, `Detection Finding: Create` is `200401`.'
  action_id: {caption: Action ID, type: integer_t, requirement: recommended, group: primary, profile: security_control, sibling: action, enum: {0: Unknown, 1: Allowed, 2: Denied, 3: Observed, 4: Modified, 99: Other}, from: base_event}
  actual_permissions:
    caption: Actual Permissions
    type: integer_t
    requirement: recommended
    group: primary
    description: The permissions that were granted to the process in a platform-native format.
  ai_model: {caption: AI Model, type: object_t, object: ai_model, requirement: recommended, group: context, profile: ai_operation, from: system}
  confidence_id: {caption: Confidence ID, type: integer_t, requirement: recommended, group: context, profile: security_control, sibling: confidence, enum: {0: Unknown, 1: Low, 2: Medium, 3: High, 99: Other}, from: base_event}
  disposition_id:
    caption: Disposition ID
    type: integer_t
    requirement: recommended
    group: primary
    profile: security_control
    sibling: disposition
    enum:
      0: Unknown
      1: Allowed
      2: Blocked
      3: Quarantined
      4: Isolated
      5: Deleted
      6: Dropped
      7: Custom Action
      8: Approved
      9: Restored
      10: Exonerated
      11: Corrected
      12: Partially Corrected
      13: Uncorrected
      14: Delayed
      15: Detected
      16: No Action
      17: Logged
      18: Tagged
      19: Alert
      20: Count
      21: Reset
      22: Captcha
      23: Challenge
      24: Access Revoked
      25: Rejected
      26: Unauthorized
      27: Error
      99: Other
    from: base_event
  exit_code:
    caption: Exit Code
    type: integer_t
    requirement: recommended
    group: primary
    description: The exit code reported by a process when it terminates. The convention is that zero indicates success and any non-zero exit code indicates that some error occurred.
  injection_type:
    caption: Injection Type
    type: string_t
    requirement: recommended
    group: primary
    description: The process injection method, normalized to the caption of the injection_type_id value. In the case of 'Other', it is defined by the event source.
  injection_type_id:
    caption: Injection Type ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: injection_type
    description: The normalized identifier of the process injection method.
    enum:
      0:
        caption: Unknown
        description: The injection type is unknown.
      1:
        caption: Remote Thread
      2:
        caption: Load Library
      3:
        caption: Queue APC
      4:
        caption: Ptrace
        description: The actor injected code using the process trace system call, for example by attaching to the target process and writing to its memory or registers with `PTRACE_POKETEXT`, `PTRACE_POKEDATA` or `PTRACE_SETREGS`.
      99:
        caption: Other
        description: The injection type is not mapped. See the `injection_type` attribute, which contains a data source specific value.
    references:
    - description: ptrace(2), process trace system call
      url: https://man7.org/linux/man-pages/man2/ptrace.2.html
  is_alert: {caption: Alert, type: boolean_t, requirement: recommended, group: primary, profile: security_control, from: base_event}
  launch_type:
    caption: Launch Type
    type: string_t
    requirement: recommended
    group: primary
    description: The specific type of `Launch` activity, normalized to the caption of the `launch_type_id` value. In the case of `Other` it is defined by the event source.
  launch_type_id:
    caption: Launch Type ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: launch_type
    description: The normalized identifier for the specific type of `Launch` activity.
    enum:
      0:
        caption: Unknown
        description: The launch type is unknown or not specified.
      1:
        caption: Spawn
        description: Denotes that the `Launch` event represents atomic creation of a new process on Windows. This launch type ID may also be used to represent both steps of Unix process creation in a single `Launch` event.
      2:
        caption: Fork
        description: Denotes that the `Launch` event represents the "fork" step of Unix process creation, where a process creates a clone of itself in a parent-child relationship. WSL1 pico processes on Windows also use the 2-step Unix model.
      3:
        caption: Exec
        description: Denotes that the `Launch` event represents the "exec" step of Unix process creation, where a process replaces its executable image, command line, and environment. WSL1 pico processes on Windows also use the 2-step Unix model.
      99:
        caption: Other
        description: The launch type is not mapped. See the `launch_type` attribute, which contains a data source specific value.
    references:
    - description: fork() man page
      url: https://www.man7.org/linux/man-pages/man2/fork.2.html
    - description: execve() man page
      url: https://www.man7.org/linux/man-pages/man2/execve.2.html
  message: {caption: Message, type: string_t, requirement: recommended, group: primary, from: base_event}
  module:
    caption: Module
    type: object_t
    object: module
    requirement: recommended
    group: primary
    description: The module that was injected by the actor process.
  observables: {caption: Observables, type: object_t, object: observable, array: true, requirement: recommended, group: primary, from: base_event}
  requested_permissions:
    caption: Requested Permissions
    type: integer_t
    requirement: recommended
    group: primary
    description: The permissions mask that was requested by the process.
  status: {caption: Status, type: string_t, requirement: recommended, group: primary, from: base_event}
  status_code: {caption: Status Code, type: string_t, requirement: recommended, group: primary, from: base_event}
  status_detail: {caption: Status Detail, type: string_t, requirement: recommended, group: primary, from: base_event}
  status_id: {caption: Status ID, type: integer_t, requirement: recommended, group: primary, sibling: status, enum: {0: Unknown, 1: Success, 2: Failure, 99: Other}, from: base_event}
  terminating_signal:
    caption: Terminating Signal
    type: string_t
    requirement: recommended
    group: primary
    description: The name of the signal that terminated the process, or that was sent to terminate it, normalized to the caption of the `terminating_signal_id` value. In the case of 'Other', it is defined by the event source.
  terminating_signal_id:
    caption: Terminating Signal ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: terminating_signal
    description: The normalized identifier of the signal that terminated the process, or that was sent to terminate it. Signals are defined by POSIX and are used on Unix-like operating systems. The values follow the Linux signal numbers on x86 and ARM processors. Signal numbers differ between processor architectures and operating systems, so on other platforms the signal is mapped by its name. Only the POSIX signals whose default action is to terminate the process are listed; any other signal maps to 'Other'.
    enum:
      0:
        caption: Unknown
        description: The signal is unknown.
      1:
        caption: SIGHUP
        description: Hangup. The controlling terminal was closed or its controlling process ended.
      2:
        caption: SIGINT
        description: Terminal interrupt signal, for example Ctrl+C.
      3:
        caption: SIGQUIT
        description: Terminal quit signal. The process ends with a core dump.
      4:
        caption: SIGILL
        description: Illegal instruction. The process ends with a core dump.
      5:
        caption: SIGTRAP
        description: Trace or breakpoint trap. The process ends with a core dump.
      6:
        caption: SIGABRT
        description: Process abort signal, for example from `abort()`. The process ends with a core dump.
      7:
        caption: SIGBUS
        description: Access to an undefined portion of a memory object. The process ends with a core dump.
      8:
        caption: SIGFPE
        description: Erroneous arithmetic operation. The process ends with a core dump.
      9:
        caption: SIGKILL
        description: Kill signal. It cannot be caught or ignored.
      10:
        caption: SIGUSR1
        description: User-defined signal 1.
      11:
        caption: SIGSEGV
        description: Invalid memory reference. The process ends with a core dump.
      12:
        caption: SIGUSR2
        description: User-defined signal 2.
      13:
        caption: SIGPIPE
        description: Write on a pipe with no one to read it.
      14:
        caption: SIGALRM
        description: Alarm clock.
      15:
        caption: SIGTERM
        description: Termination signal. This is the default signal sent to ask a process to end.
      24:
        caption: SIGXCPU
        description: CPU time limit exceeded. The process ends with a core dump.
      25:
        caption: SIGXFSZ
        description: File size limit exceeded. The process ends with a core dump.
      26:
        caption: SIGVTALRM
        description: Virtual timer expired.
      31:
        caption: SIGSYS
        description: Bad system call. The process ends with a core dump.
      99:
        caption: Other
        description: The signal is not mapped. See the `terminating_signal` attribute, which contains an event source specific value, for example a real-time signal.
    references:
    - description: signal(7), overview of signals and signal numbers by architecture
      url: https://man7.org/linux/man-pages/man7/signal.7.html
    - description: POSIX signal.h, standard signals and their default actions
      url: https://pubs.opengroup.org/onlinepubs/9799919799/basedefs/signal.h.html

    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event. Producers and mappers must set this to the `uid` defined in the event class definition. For example, `Detection Finding` is `2004`.
    enum:
      '6002':
        caption: Application Lifecycle
        description: Application Lifecycle events report installation, removal, start, stop of an application or service.

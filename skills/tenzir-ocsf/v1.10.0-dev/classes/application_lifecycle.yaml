    group: context
    deprecated:
      since: 1.9.0
      message: Use the `application` attribute instead.
      superseded_by: [application]
    description: The application that was affected by the lifecycle event.  This also applies to self-updating application systems.
  application:
    caption: Application
    type: object_t
    object: application
    requirement: recommended
    group: primary
    description: The application that was affected by the lifecycle event. This also applies to self-updating application systems. Product identity, such as vendor and version, can be conveyed via the nested `product` attribute.

name: application_lifecycle
caption: Application Lifecycle
uid: 6002
category: application
category_uid: 6
extends: application
description: Application Lifecycle events report installation, removal, start, stop of an application or service.
profiles: [ai_operation, cloud, container, data_classification, datetime, host, osint, record_integrity, security_control]
constraints:
  at_least_one: [app, application]
references:
- description: D3FEND™ Ontology d3f:ApplicationEvent
  url: https://d3fend.mitre.org/event/d3f:ApplicationEvent/
attributes:
  action:
    caption: Action
    requirement: optional
    profile: security_control
    definition: v1.10.0-dev/classes/base_event.yaml
  action_id:
    caption: Action ID

# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: network_activity
caption: Network Activity
uid: 4001
category: network
category_uid: 4
extends: network
description: Network Activity events report network connection and traffic activity.
profiles: [ai_operation, cloud, container, data_classification, datetime, host, load_balancer, network_proxy, osint, record_integrity, security_control]
constraints:
  at_least_one: [dst_endpoint, src_endpoint]
references:
- description: D3FEND™ Ontology d3f:NetworkConnectionEvent
  url: https://d3fend.mitre.org/event/d3f:NetworkConnectionEvent/
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event. Each event class defines its own set of activity values. Use `0` (Unknown) when the activity cannot be determined. Use `99` (Other) when the activity does not match any defined value, in which case `activity_name` must be populated with the source-specific label.
    enum:
      0:
        caption: Unknown
        description: The event activity is unknown.
      1:
        caption: Open
        description: A new network connection was opened.
      2:
        caption: Close
        description: The network connection was closed.
      3:
        caption: Reset
        description: The network connection was abnormally terminated or closed by a middle device like firewalls.
      4:
        caption: Fail
        description: The network connection failed. For example a connection timeout or no route to host.
      5:
        caption: Refuse
        description: The network connection was refused. For example an attempt to connect to a server port which is not open.
      6:
        caption: Traffic
        description: Network traffic report.
      7:
        caption: Listen
        description: A network endpoint began listening for new network connections.
      99:
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event. Each event class belongs to exactly one category. Producers and mappers must set this to the category defined by the event class being used.
    enum:
      4:
        caption: Network Activity
        description: Network Activity events.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event. Producers and mappers must set this to the `uid` defined in the event class definition. For example, `Detection Finding` is `2004`.
    enum:
      4001:
        caption: Network Activity
        description: Network Activity events report network connection and traffic activity.
  cloud: {caption: Cloud, type: object_t, object: cloud, requirement: required, group: primary, profile: cloud, from: base_event}
  metadata: {caption: Metadata, type: object_t, object: metadata, requirement: required, group: context, from: base_event}
  osint: {caption: OSINT, type: object_t, object: osint, array: true, requirement: required, group: primary, profile: osint, from: base_event}
  severity_id: {caption: Severity ID, type: integer_t, requirement: required, group: classification, sibling: severity, enum: {0: Unknown, 1: Informational, 2: Low, 3: Medium, 4: High, 5: Critical, 6: Fatal, 99: Other}, from: base_event}
  time: {caption: Event Time, type: timestamp_t, requirement: required, group: occurrence, from: base_event}
  type_uid:
    caption: Type ID
    type: long_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event/finding type ID. It identifies the event''s semantics and structure. Producers and mappers must compute this as `class_uid * 100 + activity_id`. It uniquely identifies the combination of event class and activity across the entire schema. For example, `Detection Finding: Create` is `200401`.'
  action_id: {caption: Action ID, type: integer_t, requirement: recommended, group: primary, profile: security_control, sibling: action, enum: {0: Unknown, 1: Allowed, 2: Denied, 3: Observed, 4: Modified, 99: Other}, from: base_event}
  ai_model: {caption: AI Model, type: object_t, object: ai_model, requirement: recommended, group: context, profile: ai_operation, from: network}
  confidence_id: {caption: Confidence ID, type: integer_t, requirement: recommended, group: context, profile: security_control, sibling: confidence, enum: {0: Unknown, 1: Low, 2: Medium, 3: High, 99: Other}, from: base_event}
  connection_info: {caption: Connection Info, type: object_t, object: network_connection_info, requirement: recommended, group: primary, from: network}
  device: {caption: Device, type: object_t, object: device, requirement: recommended, group: primary, profile: host, observable: 20, from: base_event}
  disposition_id:
    caption: Disposition ID
    type: integer_t
    requirement: recommended
    group: primary
    profile: security_control
    sibling: disposition
    enum:
      0: Unknown
      1: Allowed
      2: Blocked
      3: Quarantined
      4: Isolated
      5: Deleted
      6: Dropped
      7: Custom Action
      8: Approved
      9: Restored
      10: Exonerated
      11: Corrected
      12: Partially Corrected
      13: Uncorrected
      14: Delayed
      15: Detected
      16: No Action
      17: Logged
      18: Tagged
      19: Alert
      20: Count
      21: Reset
      22: Captcha
      23: Challenge
      24: Access Revoked
      25: Rejected
      26: Unauthorized
      27: Error
      99: Other
    from: base_event
  dst_endpoint:
    caption: Destination Endpoint
    type: object_t
    object: network_endpoint
    requirement: recommended
    group: primary
    observable: 20
    description: The destination endpoint of the network activity — typically the responder. In bi-flow or asymmetric flow scenarios, this endpoint may represent the true initiator of the original communication. Use `initiator_id` to determine which endpoint actually initiated the communication.
  initiator_id:
    caption: Initiator ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: initiator
    description: The normalized identifier of the endpoint that initiated the network communication. Use this field to disambiguate source and destination roles in bi-directional or asymmetric flow scenarios.
    enum:
      0:
        caption: Unknown
      1:
        caption: Source Endpoint
        description: The `src_endpoint` is the true initiator and the source/destination assignment is correct.
      2:
        caption: Destination Endpoint
        description: The `dst_endpoint` is the true initiator and the source/destination assignment is reversed.
      99:
        caption: Other
  is_alert: {caption: Alert, type: boolean_t, requirement: recommended, group: primary, profile: security_control, from: base_event}
  is_src_dst_assignment_known:
    caption: Source/Destination Assignment Known
    type: boolean_t
    requirement: recommended
    group: primary
    deprecated:
      since: 1.9.0
      message: Use `initiator_id` instead, which provides richer semantics for bi-flow and asymmetric flow scenarios.
      superseded_by: [initiator_id]
    description: '`true` denotes that `src_endpoint` and `dst_endpoint` correctly identify the initiator and responder respectively. `false` denotes that the event source has arbitrarily assigned one peer to `src_endpoint` and the other to `dst_endpoint`, in other words that initiator and responder are not being asserted. This can occur, for example, when the event source is a network appliance that has not observed the initiation of a given connection. In the absence of this attribute, interpretation of the initiator and responder is implementation-specific.'

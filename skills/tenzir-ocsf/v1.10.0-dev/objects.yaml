- name: ai_model
  caption: AI Model
  extends: _entity
  group: Other
  summary: The AI Model object describes the characteristics of an AI/ML model.
  path: v1.10.0-dev/objects/ai_model.yaml
- name: ai_status
  caption: AI Status
  extends: object
  group: Other

objects:
- name: _entity
  caption: Entity
  abstract: true
  extends: object
  group: Base
  summary: The Entity object is an unordered collection of attributes, with a name and unique identifier.
  path: v1.10.0-dev/objects/_entity.yaml
- name: _resource
  caption: Resource
  abstract: true
  extends: _entity
  group: Base
  summary: The Resource object contains attributes that provide information about a particular resource.
  path: v1.10.0-dev/objects/_resource.yaml

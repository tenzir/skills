  path: v1.10.0-dev/objects/access_analysis_result.yaml
- name: account
  caption: Account
  extends: _entity
  group: Identity & Access
  summary: The Account object contains details about the account that initiated or performed a specific activity within a system or application.
  path: v1.10.0-dev/objects/account.yaml
- name: actor
  caption: Actor
  extends: object
  group: Identity & Access
  summary: The Actor object contains details about the user, role, application, service, or process that initiated or performed a specific activity.
  path: v1.10.0-dev/objects/actor.yaml
- name: additional_restriction
  caption: Additional Restriction
  extends: object
  group: Other
  summary: The Additional Restriction object describes supplementary access controls and guardrails that constrain or limit granted permissions beyond the primary policy.
  path: v1.10.0-dev/objects/additional_restriction.yaml
- name: advisory
  caption: Advisory
  extends: object
  group: Other
  summary: The Advisory object represents publicly disclosed cybersecurity vulnerabilities defined in a Security advisory. e.g.
  path: v1.10.0-dev/objects/advisory.yaml
- name: affected_code
  caption: Affected Code
  extends: object

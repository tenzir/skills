  extends: package
  group: File & Data
  summary: The Affected Package object describes details about a software package identified as affected by a vulnerability/vulnerabilities.
  path: v1.10.0-dev/objects/affected_package.yaml
- name: agent
  caption: Agent
  extends: object
  group: Device & Host

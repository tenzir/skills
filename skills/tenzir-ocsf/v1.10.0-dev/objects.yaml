  path: v1.10.0-dev/objects/agent.yaml
- name: ai_agent
  caption: AI Agent
  extends: _entity
  group: Other
  summary: An autonomous AI agent that performs tasks under delegated authority.
  path: v1.10.0-dev/objects/ai_agent.yaml
- name: ai_capability
  caption: AI Capability
  extends: _entity
  group: Other
  summary: 'The AI Capability object describes a callable capability invoked by or on behalf of an AI system: a tool, a resource, or a prompt, in the sense of the Model Context Protocol (MCP) primitives.'

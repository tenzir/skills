  caption: Data Classification
  description: The Data Classification profile adds attributes to specific resource objects, allowing users to describe information about classifiers & data classification results.
  applies_to:
    objects: [database, databucket, email, file, metadata, product, resource_details, web_resource, win/win_resource]
  attributes:
    data_classification:
      caption: Data Classification
      type: object_t
      object: data_classification
      requirement: recommended
      group: context
      deprecated:
        since: 1.4.0
        message: Use the attribute `data_classifications` instead
        superseded_by: [data_classifications]

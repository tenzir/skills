datetime:
  caption: Date/Time
  description: When applied, this profile adds a sibling attribute of data type `datetime_t` (RFC-3339 string) wherever a `timestamp_t` attribute appears in the event class. This provides human-readable date/time representations alongside the epoch-millisecond timestamps. For example, `time` (`timestamp_t`) would gain a `time_dt` (`datetime_t`) sibling such as `"1985-04-12T23:20:50.52Z"`.
  applies_to:
    classes: [account_change, admin_group_query, airborne_broadcast_activity, api_activity, application_error, application_lifecycle, application_security_posture_finding, authentication, authorize_session, base_event, clipboard_activity, cloud_resources_inventory_info, compliance_finding, config_state, data_security_finding, datastore_activity, detection_finding, device_config_state_change, device_power_state_activity, dhcp_activity, dns_activity, dns_zone_transfer_activity, drone_flights_activity, email_activity, email_file_activity, email_url_activity, entity_management, event_log_actvity, evidence_info, file_activity, file_hosting, file_query, file_remediation_activity, folder_query, ftp_activity, group_management, http_activity, iam_analysis_finding, incident_finding, inventory_info, job_query, kernel_activity, kernel_extension_activity, kernel_object_query, memory_activity, module_activity, module_query, network_activity, network_connection_query, network_file_activity, network_remediation_activity, networks_query, ntp_activity, osint_inventory_info, patch_state, peripheral_activity, peripheral_device_query, process_activity, process_query, process_remediation_activity, rdp_activity, remediation_activity, role_management, scan_activity, scheduled_job_activity, script_activity, security_finding, service_query, session_query, smb_activity, software_info, ssh_activity, startup_item_query, tunnel_activity, user_access, user_inventory, user_management, user_query, vulnerability_finding, web_resource_access_activity, web_resources_activity, win/prefetch_query, win/registry_key_activity, win/registry_key_query, win/registry_value_activity, win/registry_value_query, win/windows_resource_activity, win/windows_service_activity]
  attributes: {}
host:
  caption: Host
  description: Adds host and actor context to event classes. Apply this profile when the event originates from or is observed on a specific host or device, and when the initiating user, process, or service is known. All event classes include this profile by default through the base event.
  applies_to:
    classes: [account_change, admin_group_query, airborne_broadcast_activity, api_activity, application_error, application_lifecycle, application_security_posture_finding, authentication, authorize_session, base_event, clipboard_activity, cloud_resources_inventory_info, compliance_finding, config_state, data_security_finding, datastore_activity, detection_finding, device_config_state_change, device_power_state_activity, dhcp_activity, dns_activity, dns_zone_transfer_activity, drone_flights_activity, email_activity, email_file_activity, email_url_activity, entity_management, event_log_actvity, evidence_info, file_activity, file_hosting, file_query, file_remediation_activity, folder_query, ftp_activity, group_management, http_activity, iam_analysis_finding, incident_finding, inventory_info, job_query, kernel_activity, kernel_extension_activity, kernel_object_query, memory_activity, module_activity, module_query, network_activity, network_connection_query, network_file_activity, network_remediation_activity, networks_query, ntp_activity, osint_inventory_info, patch_state, peripheral_activity, peripheral_device_query, process_activity, process_query, process_remediation_activity, rdp_activity, remediation_activity, role_management, scan_activity, scheduled_job_activity, script_activity, security_finding, service_query, session_query, smb_activity, software_info, ssh_activity, startup_item_query, tunnel_activity, user_access, user_inventory, user_management, user_query, vulnerability_finding, web_resource_access_activity, web_resources_activity, win/prefetch_query, win/registry_key_activity, win/registry_key_query, win/registry_value_activity, win/registry_value_query, win/windows_resource_activity, win/windows_service_activity]
  attributes:
    actor:
      caption: Actor
      type: object_t
      object: actor
      requirement: optional
      group: primary
      description: The user, process, or service that initiated the activity on the host. For system-level events this is typically a process; for IAM events it is typically a user or role.
    device:
      caption: Device
      type: object_t
      object: device
      requirement: recommended
      group: primary
      observable: 20
      description: The host or device where the activity was observed. Populate with details such as hostname, IP address, OS, and hardware identifiers when available from the source.
incident:
  caption: Incident
  description: The attributes that add incident handling semantics to a Finding.
  applies_to:
    classes: [application_security_posture_finding, compliance_finding, data_security_finding, detection_finding, iam_analysis_finding, incident_finding, vulnerability_finding]
  attributes:
    assignee:
      caption: Assignee
      type: object_t
      object: user
      requirement: optional
      group: context
      observable: 21
      description: The details of the user assigned to an Incident.
    assignee_group:
      caption: Assignee Group
      type: object_t
      object: group
      requirement: optional
      group: context
      description: The details of the group assigned to an Incident.
    confidence:
      caption: Confidence
      type: string_t
      requirement: optional
      group: context
      description: The confidence, normalized to the caption of the confidence_id value. In the case of 'Other', it is defined by the event source.
    confidence_id:
      caption: Confidence ID
      type: integer_t
      requirement: recommended
      group: context
      sibling: confidence
      description: The normalized confidence refers to the accuracy of the analytics that produced the alert or finding. See specific usage.
      enum:
        0:
          caption: Unknown
          description: The normalized confidence is unknown.
        1:
          caption: Low
        2:
          caption: Medium
        3:
          caption: High
        99:
          caption: Other
          description: The confidence is not mapped to the defined enum values. See the `confidence` attribute, which contains a data source specific value.
    impact:
      caption: Impact
      type: string_t
      requirement: recommended
      group: primary
      description: The impact , normalized to the caption of the impact_id value. In the case of 'Other', it is defined by the event source.
    impact_id:
      caption: Impact ID
      type: integer_t
      requirement: recommended
      group: primary
      sibling: impact
      description: The normalized impact of the incident or finding. Per NIST, this is the magnitude of harm that can be expected to result from the consequences of unauthorized disclosure, modification, destruction, or loss of information or information system availability.
      enum:
        0:
          caption: Unknown
          description: The normalized impact is unknown.
        1:
          caption: Low
          description: The magnitude of harm is low.
        2:
          caption: Medium
          description: The magnitude of harm is moderate.
        3:
          caption: High
          description: The magnitude of harm is high.
        4:
          caption: Critical
          description: The magnitude of harm is high and the scope is widespread.
        99:
          caption: Other
          description: The impact is not mapped. See the `impact` attribute, which contains a data source specific value.
      references:
      - description: NIST SP 800-172 from FIPS 199
        url: https://doi.org/10.6028/NIST.FIPS.199
      - description: NIST Computer Security Resource Center
        url: https://doi.org/10.6028/NIST.FIPS.199
    impact_score:
      caption: Impact Score
      type: integer_t
      requirement: recommended
      group: primary
      description: The impact as an integer value of the finding, valid range 0-100.
    is_declared_incident:
      caption: Declared Incident
      type: boolean_t
      requirement: optional
      group: context
      description: Indicates that the Finding (or Incident Finding) is declared to be an incident, subject to the meaning of incident to an organization.
    is_suspected_breach:
      caption: Suspected Breach
      type: boolean_t
      requirement: optional
      group: context
      description: A determination based on analytics as to whether a potential breach was found.
    priority:
      caption: Priority
      type: string_t
      requirement: optional
      group: context
      description: The priority, normalized to the caption of the priority_id value. In the case of 'Other', it is defined by the event source.
    priority_id:
      caption: Priority ID
      type: integer_t
      requirement: recommended
      group: context
      sibling: priority
      description: The normalized priority. Priority identifies the relative importance of the incident or finding. It is a measurement of urgency.
      enum:
        0:
          caption: Unknown
          description: No priority is assigned.
        1:
          caption: Low
          description: Application or personal procedure is unusable, where a workaround is available or a repair is possible.
        2:
          caption: Medium
          description: Non-critical function or procedure is unusable or hard to use causing operational disruptions with no direct impact on a service's availability. A workaround is available.
        3:
          caption: High
          description: Critical functionality or network access is interrupted, degraded or unusable, having a severe impact on services availability. No acceptable alternative is possible.
        4:
          caption: Critical
          description: Interruption making a critical functionality inaccessible or a complete network interruption causing a severe impact on services availability. There is no possible alternative.
        99:
          caption: Other
          description: The priority is not normalized.
    src_url:
      caption: Source URL
      type: url_t
      requirement: recommended
      group: primary
      observable: 6
      description: A Url link used to access the original incident.
    ticket:
      caption: Ticket
      type: object_t
      object: ticket
      requirement: optional
      group: context
      deprecated:
        since: 1.5.0
        message: Use `tickets` instead.
        superseded_by: [tickets]
      description: The linked ticket in the ticketing system.
    tickets:
      caption: Tickets
      type: object_t
      object: ticket
      array: true
      requirement: optional
      group: context
      description: The associated ticket(s) in the ticketing system. Each ticket contains details like ticket ID, status, etc.
    verdict:
      caption: Verdict
      type: string_t
      requirement: recommended
      group: primary
      description: The verdict assigned to an Incident finding.
    verdict_id:
      caption: Verdict ID
      type: integer_t
      requirement: recommended
      group: primary
      sibling: verdict
      description: The normalized verdict of an Incident.
      enum:
        0:
          caption: Unknown
          description: The type is unknown.
        1:
          caption: False Positive
          description: The incident is a false positive.
        2:
          caption: True Positive
          description: The incident is a true positive.
        3:
          caption: Disregard
          description: The incident can be disregarded as it is unimportant, an error or accident.
        4:
          caption: Suspicious
          description: The incident is suspicious.
        5:
          caption: Benign
          description: The incident is benign.
        6:
          caption: Test
          description: The incident is a test.
        7:
          caption: Insufficient Data
          description: The incident has insufficient data to make a verdict.
        8:
          caption: Security Risk
          description: The incident is a security risk.
        9:
          caption: Managed Externally
          description: The incident remediation or required actions are managed externally.
        10:
          caption: Duplicate
          description: The incident is a duplicate.
        99:
          caption: Other
          description: The type is not mapped. See the `type` attribute, which contains a data source specific value.

ai_operation:
  caption: AI Operation
  description: AI-specific attributes for model operations, retrieval systems, and agent activities. e.g. model_name, total_token_counts etc.
  applies_to:
    classes: [account_change, api_activity, application_error, application_lifecycle, authentication, authorize_session, clipboard_activity, datastore_activity, device_power_state_activity, dhcp_activity, dns_activity, dns_zone_transfer_activity, email_activity, entity_management, event_log_actvity, file_activity, file_hosting, ftp_activity, group_management, http_activity, kernel_activity, kernel_extension_activity, memory_activity, module_activity, network_activity, network_file_activity, ntp_activity, peripheral_activity, process_activity, rdp_activity, role_management, scan_activity, scheduled_job_activity, script_activity, smb_activity, ssh_activity, tunnel_activity, user_access, user_management, web_resource_access_activity, web_resources_activity, win/registry_key_activity, win/registry_value_activity, win/windows_resource_activity, win/windows_service_activity]
  attributes:
    ai_agent:
      caption: AI Agent
      type: object_t
      object: ai_agent
      requirement: optional
      group: context
      description: The autonomous AI agent that performed this operation. Carries model identity via `ai_agent.ai_model`. Populate when the action was performed by an agent rather than a direct model call.
    ai_capability:
      caption: AI Capability
      type: object_t
      object: ai_capability
      requirement: optional
      group: context
      description: 'The AI capability invoked in this operation: a tool, resource, or prompt, in the sense of the MCP primitives. Records the capability''s identity, kind, provenance, declared contracts, and declared safety hints. Transport details remain on the event''s transport attributes (e.g., `api`, `http_request`), and affected objects remain in `resources`. Producers deriving `activity_id` from the capability''s declared hints (e.g., mapping a declared read-only tool to `Read`) should note the hints are self-declared and unverified; when the observed operation contradicts the declaration, classify by observed behavior.'
    ai_model:
      caption: AI Model
      type: object_t
      object: ai_model
      requirement: recommended
      group: context
      description: The AI model involved in this operation. Use for direct model invocations where no autonomous agent is involved. For agent-mediated operations, model identity is carried within `ai_agent.ai_model` instead.
    ai_status:
      caption: AI Status
      type: object_t
      object: ai_status
      requirement: optional
      group: context
      description: Per-operation outcome scalars for this operation, such as the stop reason and the permission check result, grouped in the `ai_status` object so they do not proliferate as discrete attributes at the event root. Additional outcome attributes may be added to the object in later versions.
    delegation:
      caption: Delegation
      type: object_t
      object: delegation
      requirement: optional
      group: context
      description: The delegation under whose authority this AI operation was performed. Links the event to a durable authorization context independent of traces and sessions, enabling correlation of all events executed under the same delegated authority.
    message_context:
      caption: Message Context
      type: object_t
      object: message_context
      requirement: optional
      group: context
      description: Communication context for AI system interactions including protocols, roles, clients, and session information for MCP and other AI communication systems.

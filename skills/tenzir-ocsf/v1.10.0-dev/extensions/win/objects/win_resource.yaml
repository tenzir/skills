  uid:
    caption: Unique ID
    type: resource_uid_t
    requirement: recommended
    observable: 10
    description: The Windows provided handle identifier for the resource object
  uid_alt:
    caption: Alternate ID
    type: resource_uid_t
    requirement: optional
    from: _resource
    observable: 10
    description: The alternative unique identifier of the resource.
  uid_numeric:
    caption: Numeric Unique ID
    type: long_t
    requirement: optional
    from: _entity
    description: |-
      The `uid` attribute in numeric form where applicable.
      Note: Producers may populate `uid_numeric` only in addition to `uid` and not as an alternative to it.

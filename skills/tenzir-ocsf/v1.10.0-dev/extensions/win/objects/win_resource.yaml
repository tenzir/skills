name: win/win_resource
caption: Windows Resource
extension: win
extends: _resource
description: The Windows resource object describes a resource object managed by Windows, such as mutant or timer.
profiles: [data_classification, datetime]
constraints:
  at_least_one: [name, uid]
referenced_by:
  classes:
    win/windows_resource_activity: [win_resource]
attributes:
  created_time:
    caption: Created Time
    type: timestamp_t
    requirement: optional
    from: _resource
    description: The time when the resource was created.
  created_time_dt:
    caption: Created Time
    type: datetime_t
    requirement: optional
    profile: datetime
    from: _resource
    description: The time when the resource was created.
  data:
    caption: Data
    type: json_t
    requirement: optional
    from: _resource
    description: Additional data describing the resource.
  data_classification:
    caption: Data Classification
    type: object_t
    object: data_classification
    requirement: recommended
    group: context
    profile: data_classification
    from: _resource
    deprecated:
      since: 1.4.0
      message: Use the attribute `data_classifications` instead
      superseded_by: [data_classifications]
    description: The Data Classification object includes information about data classification levels and data category types.
  data_classifications:
    caption: Data Classification
    type: object_t
    object: data_classification
    array: true
    requirement: recommended
    group: context
    profile: data_classification
    from: _resource
    description: A list of Data Classification objects, that include information about data classification levels and data category types, identified by a classifier.
  details:
    caption: Details
    type: string_t
    requirement: optional
    description: The string detailing the attributes of the resource object.
  labels:
    caption: Labels
    type: string_t
    array: true
    requirement: optional
    from: _resource
    description: The list of labels associated to the resource.
  modified_time:
    caption: Modified Time
    type: timestamp_t
    requirement: optional
    from: _resource
    description: The time when the resource was last modified.
  modified_time_dt:
    caption: Modified Time
    type: datetime_t
    requirement: optional
    profile: datetime
    from: _resource
    description: The time when the resource was last modified.
  name:
    caption: Name
    type: string_t
    requirement: recommended
    description: The name of the resource object.
  svc_name:
    caption: Service Name
    type: string_t
    requirement: optional
    description: The Windows service acting as the object server for the resource object, such as Security or Security Account Manager.
  tags:
    caption: Tags
    type: object_t
    object: key_value_object
    array: true
    requirement: optional
    from: _resource
    description: The list of tags; `{key:value}` pairs associated to the resource.
  type:
    caption: Type
    type: string_t
    requirement: optional
    description: The type of the Windows resource object.
  type_id:
    caption: Type ID
    type: integer_t
    requirement: required
    sibling: type
    description: The normalized type identifier of the Windows resource object accessed.
    enum:
      '0':
        caption: Unknown
        description: The resource object type is unknown.
      '1':
        caption: Directory
        references:
        - description: Object Manager Directory Objects
          url: https://learn.microsoft.com/en-us/windows-hardware/drivers/kernel/object-directories
      '2':
        caption: Event
        references:
        - description: Event Objects and CreateEvent Function
          url: https://learn.microsoft.com/en-us/windows/win32/sync/event-objects
      '3':
        caption: Timer
        references:
        - description: Timer Objects and CreateWaitableTimer Function
          url: https://learn.microsoft.com/en-us/windows/win32/sync/waitable-timer-objects
      '4':
        caption: Device
        references:
        - description: Device Objects and I/O Manager
          url: https://learn.microsoft.com/en-us/windows-hardware/drivers/kernel/device-objects-and-device-stacks
      '5':
        caption: Mutant
        references:
        - description: Mutex Objects and CreateMutex Function
          url: https://learn.microsoft.com/en-us/windows/win32/sync/mutex-objects
      '6':
        caption: Type
      '7':

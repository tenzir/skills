name: affected_package
caption: Affected Software Package
extends: package
description: The Affected Package object describes details about a software package identified as affected by a vulnerability/vulnerabilities.
profiles: [data_classification]
references:
- description: D3FEND™ Ontology d3f:SoftwarePackage.
  url: https://d3fend.mitre.org/dao/artifact/d3f:SoftwarePackage/
referenced_by:
  objects:
    vulnerability: [affected_packages]
attributes:
  architecture:
    caption: Architecture
    type: string_t
    requirement: recommended
    from: package
    description: Architecture is a shorthand name describing the type of computer hardware the packaged software is meant to run on.
  cpe_name:
    caption: The product CPE identifier
    type: string_t
    requirement: optional
    from: package
    description: 'The Common Platform Enumeration (CPE) name. For example: `cpe:/a:apple:safari:16.2`.'
    references:
    - description: NIST Products
      url: https://nvd.nist.gov/products/cpe
  epoch:
    caption: Epoch
    type: integer_t
    requirement: optional
    from: package
    description: The software package epoch. Epoch is a way to define weighted dependencies based on version numbers.
  fixed_in_version:
    caption: Fixed In Version
    type: string_t
    requirement: optional
    description: The software package version in which a reported vulnerability was patched/fixed.
  hash:
    caption: Hash
    type: object_t
    object: fingerprint
    requirement: optional
    from: package
    observable: 30
    description: Cryptographic hash to identify the binary instance of a software component. This can include any component such file, package, or library.
  license:
    caption: Software License
    type: string_t
    requirement: optional
    from: package
    description: The software license applied to this package.
    references:
    - description: SPDX License List
      url: https://spdx.org/licenses/
  license_url:
    caption: Software License URL
    type: url_t
    requirement: optional
    from: package
    observable: 6
    description: The URL pointing to the license applied on package or software. This is typically a `LICENSE.md` file within a repository.
  name:
    caption: Name
    type: string_t
    requirement: required
    from: package
    description: The software package name.
  package_manager:
    caption: Package Manager
    type: string_t
    requirement: optional
    from: package
    description: The software packager manager utilized to manage a package on a system, e.g. npm, yum, dpkg etc.
  package_manager_url:
    caption: Package Manager URL
    type: url_t
    requirement: optional
    from: package
    observable: 6
    description: The URL of the package or library at the package manager, or the specific URL or URI of an internal package manager link such as `AWS CodeArtifact` or `Artifactory`.
  path:
    caption: Path
    type: file_path_t
    requirement: optional
    observable: 45
    description: The installation path of the affected package.
  purl:
    caption: Package URL
    type: string_t
    requirement: optional
    from: package
    description: A purl is a URL string used to identify and locate a software package in a mostly universal and uniform way across programming languages, package managers, packaging conventions, tools, APIs and databases.
  release:
    caption: Software Release Details
    type: string_t
    requirement: optional
    from: package
    description: Release is the number of times a version of the software has been packaged.
  remediation:
    caption: Remediation Guidance
    type: object_t
    object: remediation
    requirement: optional
    description: Describes the recommended remediation steps to address identified issue(s).
  src_url:
    caption: Source URL
    type: url_t
    requirement: optional
    from: package
    observable: 6
    description: The link to the specific library or package such as within `GitHub`, this is different from the link to the package manager where the library or package is hosted.
  type:
    caption: Type
    type: string_t
    requirement: optional
    from: package
    description: The type of software package, normalized to the caption of the `type_id` value. In the case of 'Other', it is defined by the source.
  type_id:
    caption: Type ID
    type: integer_t
    requirement: recommended
    from: package
    sibling: type
    description: The type of software package.
    enum:
      '0':
        caption: Unknown
        description: The type is unknown.
      '1':
        caption: Application
        description: An application software package.
      '2':
        caption: Operating System
        description: An operating system software package.
      '99':
        caption: Other
        description: The type is not mapped. See the `type` attribute, which contains a data source specific value.
  uid:
    caption: Package UID
    type: string_t
    requirement: optional
    from: package
    description: A unique identifier for the package or library reported by the source tool. E.g., the `libId` within the `sbom` field of an OX Security Issue or the SPDX `components.*.bom-ref`.
  vendor_name:
    caption: Vendor Name
    type: string_t
    requirement: optional
    from: package
    description: The name of the vendor who published the software package.
  version:
    caption: Version
    type: string_t
    requirement: required
    from: package
    description: The software package version.

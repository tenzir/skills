name: cvss
caption: CVSS Score
extends: object
description: The Common Vulnerability Scoring System (CVSS) object provides a way to capture the principal characteristics of a vulnerability and produce a numerical score reflecting its severity.
references:
- description: Common Vulnerability Scoring System (CVSS)
  url: https://www.first.org/cvss/
referenced_by:
  objects:
    cve: [cvss]
attributes:
  base_score:
    caption: Base Score
    type: float_t
    requirement: required
    description: 'The CVSS base score. For example: `9.1`.'
  depth:
    caption: CVSS Depth
    type: string_t
    requirement: recommended
    description: The CVSS depth represents a depth of the equation used to calculate CVSS score.
    enum:
      Base:
        caption: Base
      Environmental:
        caption: Environmental
      Temporal:
        caption: Temporal
  metrics:
    caption: Metrics
    type: object_t
    object: metric
    array: true
    requirement: optional
    description: 'The Common Vulnerability Scoring System metrics. This attribute contains information on the CVE''s impact. If the CVE has been analyzed, this attribute will contain any CVSSv2 or CVSSv3 information associated with the vulnerability. For example: `{ {"Access Vector", "Network"}, {"Access Complexity", "Low"}, ...}`.'
  overall_score:
    caption: Overall Score
    type: float_t
    requirement: recommended
    description: 'The CVSS overall score, impacted by base, temporal, and environmental metrics. For example: `9.1`.'
  severity:
    caption: Severity
    type: string_t
    requirement: optional
    description: |-
      The Common Vulnerability Scoring System (CVSS) Qualitative Severity Rating. A textual representation of the numeric score.

      CVSS v2.0

      - Low (0.0 – 3.9)
      - Medium (4.0 – 6.9)
      - High (7.0 – 10.0)

      CVSS v3.0

      - None (0.0)
      - Low (0.1 - 3.9)
      - Medium (4.0 - 6.9)
      - High (7.0 - 8.9)
      - Critical (9.0 - 10.0)
  src_url:
    caption: Source URL
    type: url_t
    requirement: optional
    observable: 6
    description: 'The source URL for the CVSS score. For example: `https://nvd.nist.gov/vuln/detail/CVE-2021-44228`'
  vector_string:
    caption: Vector String
    type: string_t
    requirement: optional
    description: 'The CVSS vector string is a text representation of a set of CVSS metrics. It is commonly used to record or transfer CVSS metric information in a concise form. For example: `3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:H`.'
  vendor_name:
    caption: Vendor Name
    type: string_t
    requirement: recommended
    description: 'The vendor that provided the CVSS score. For example: `NVD, REDHAT` etc.'
  version:
    caption: Version
    type: string_t
    requirement: required
    description: 'The CVSS version. For example: `3.1`.'

# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: unmanned_system_operating_area
caption: Unmanned System Operating Area
extends: location
observable: 26
description: The Unmanned System Operating Area object describes details about a precise area of operations for a UAS flight or mission.
profiles: [datetime]
constraints:
  at_least_one: [city, country, postal_code, region]
referenced_by:
  classes:
    airborne_broadcast_activity: [unmanned_system_operating_area]
    drone_flights_activity: [unmanned_system_operating_area]
attributes:
  city: {caption: City, type: string_t, requirement: recommended, from: location}
  continent: {caption: Continent, type: string_t, requirement: recommended, from: location}
  count:
    caption: Count
    type: integer_t
    requirement: recommended
    description: Indicates the number of UAS in the operating area.
  country: {caption: Country, type: string_t, requirement: recommended, observable: 14, from: location}
  locations:
    caption: Operating Polygon
    type: object_t
    object: location
    array: true
    requirement: recommended
    observable: 26
    description: A list of Position Location Information (PLI) (latitude/longitude pairs) defining the area where a group or Intent-Based Network Participant operation is taking place. (This field is only applicable to Network Remote ID.)
  postal_code: {caption: Postal Code, type: string_t, requirement: recommended, from: location}
  region: {caption: Region, type: string_t, requirement: recommended, from: location}
  type_id:
    caption: Type ID
    type: integer_t
    requirement: recommended
    sibling: type
    description: The operating area type identifier.
    enum:
      0:
        caption: Unknown/Undeclared
        description: The UA type is empty or not declared.
      1:
        caption: Takeoff Location
      2:
        caption: Fixed Location
      3:
        caption: Dynamic Location
      99:
        caption: Other
        description: The type is not mapped. See the `type` attribute, which contains a data source specific value.
  aerial_height: {caption: Aerial Height, type: string_t, requirement: optional, from: location}
  altitude_ceiling:
    caption: Altitude Ceiling
    type: string_t
    requirement: optional
    description: 'Maximum altitude (WGS-84 HAE) for a group or an Intent-Based Network Participant. Measured in meters. Special Values: `Invalid`, `No Value`, or `Unknown: -1000 m`.'
  altitude_floor:
    caption: Altitude Floor
    type: string_t
    requirement: optional
    description: 'Minimum altitude (WGS-84 HAE) for a group or an Intent-Based Network Participant. Measured in meters. Special Values: `Invalid`, `No Value`, or `Unknown: -1000 m`.'
  coordinates: {caption: Coordinates, type: float_t, array: true, requirement: optional, deprecated: {since: 1.2.0, message: Use the `lat` and `long` attributes instead., superseded_by: [lat, long]}, from: location}
  desc: {caption: Description, type: string_t, requirement: optional, from: location}
  end_time:
    caption: End Time
    type: timestamp_t
    requirement: optional
    description: The date and time at which a group or an Intent-Based Network Participant operation ends. (This field is only applicable to Network Remote ID.)
  end_time_dt:
    caption: End Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The date and time at which a group or an Intent-Based Network Participant operation ends. (This field is only applicable to Network Remote ID.)
  geodetic_altitude: {caption: Geodetic Altitude, type: string_t, requirement: optional, from: location}
  geodetic_vertical_accuracy: {caption: Geodetic Vertical Accuracy, type: string_t, requirement: optional, from: location}
  geohash: {caption: Geohash, type: string_t, requirement: optional, from: location}
  horizontal_accuracy: {caption: Horizontal Accuracy, type: string_t, requirement: optional, from: location}
  is_on_premises: {caption: On-Premises, type: boolean_t, requirement: optional, from: location}
  isp: {caption: ISP Name, type: string_t, requirement: optional, deprecated: {since: 1.5.0, message: Use the `network_endpoint.isp` or `whois.isp` attribute according to your use-case., superseded_by: [network_endpoint.isp, whois.isp]}, from: location}
  lat: {caption: Latitude, type: float_t, requirement: optional, from: location}
  long: {caption: Longitude, type: float_t, requirement: optional, from: location}
  pressure_altitude: {caption: Pressure Altitude, type: string_t, requirement: optional, from: location}
  provider: {caption: Provider, type: string_t, requirement: optional, from: location}
  radius:
    caption: Operating Area Radius
    type: string_t
    requirement: optional
    description: 'Farthest horizontal distance from the reported location at which any UA in a group may be located (meters). Also allows defining the area where an Intent-Based Network Participant operation is taking place. Default: 0 m.'
  start_time:
    caption: Start Time
    type: timestamp_t
    requirement: optional
    description: The date and time at which a group or an Intent-Based Network Participant operation starts. (This field is only applicable to Network Remote ID.)
  start_time_dt:
    caption: Start Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The date and time at which a group or an Intent-Based Network Participant operation starts. (This field is only applicable to Network Remote ID.)
  type:
    caption: Type
    type: string_t
    requirement: optional
    description: The type of operating area. For example, `Takeoff Location`, `Fixed Location`, `Dynamic Location`.

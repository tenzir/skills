name: device_hw_info
caption: Device Hardware Info
extends: object
description: The Device Hardware Information object contains details and specifications of the physical components that make up a device. This information provides an overview of the hardware capabilities, configuration, and characteristics of the device.
referenced_by:
  objects:
    device: [hw_info]
    endpoint: [hw_info]
    network_endpoint: [hw_info]
    network_proxy: [hw_info]
    unmanned_aerial_system: [hw_info]
attributes:
  bios_date:
    caption: BIOS Date
    type: string_t
    requirement: optional
    description: 'The BIOS date. For example: `03/31/16`.'
  bios_manufacturer:
    caption: BIOS Manufacturer
    type: string_t
    requirement: optional
    description: 'The BIOS manufacturer. For example: `LENOVO`.'
  bios_ver:
    caption: BIOS Version
    type: string_t
    requirement: optional
    description: 'The BIOS version. For example: `LENOVO G5ETA2WW (2.62)`.'
  chassis:
    caption: Chassis
    type: string_t
    requirement: optional
    description: The chassis type describes the system enclosure or physical form factor. For example, as described for a Windows chassis type.
    references:
    - description: Windows Chassis Types
      url: https://docs.microsoft.com/en-us/windows/win32/cimwin32prov/win32-systemenclosure
  cores:
    caption: Cores
    type: integer_t
    requirement: optional
    description: The total number of processor cores across all installed CPUs on the system. For per-CPU core detail, use `cpu_info_list`.
  cpu_architecture:
    caption: CPU Architecture
    type: string_t
    requirement: optional
    deprecated:
      since: 1.9.0
      message: Use `cpu_info_list[*].cpu_architecture` instead.
      superseded_by: ['cpu_info_list[*].cpu_architecture']
    description: The CPU architecture, normalized to the caption of the `cpu_architecture_id` value. In the case of `Other`, it is defined by the source.
  cpu_architecture_id:
    caption: CPU Architecture ID
    type: integer_t
    requirement: optional
    sibling: cpu_architecture
    deprecated:
      since: 1.9.0
      message: Use `cpu_info_list[*].cpu_architecture_id` instead.
      superseded_by: ['cpu_info_list[*].cpu_architecture_id']
    description: The normalized identifier of the CPU architecture.
    enum:
      '0':
        caption: Unknown
        description: The CPU architecture is unknown.
      '1':
        caption: x86
        description: CPU uses the x86 ISA. For bitness, refer to `cpu_bits`.
      '2':
        caption: ARM
        description: CPU uses the ARM ISA. For bitness, refer to `cpu_bits`.
      '3':
        caption: RISC-V
        description: CPU uses the RISC-V ISA. For bitness, refer to `cpu_bits`.
      '99':
        caption: Other
        description: The CPU architecture is not mapped. See the `cpu_architecture` attribute, which contains a data source specific value.
  cpu_bits:
    caption: CPU Bits
    type: integer_t
    requirement: optional
    deprecated:
      since: 1.9.0
      message: Use `cpu_info_list[*].cpu_bits` instead.
      superseded_by: ['cpu_info_list[*].cpu_bits']
    description: 'The cpu architecture, the number of bits used for addressing in memory. For example: `32` or `64`.'
  cpu_cores:
    caption: CPU Cores
    type: integer_t
    requirement: optional
    deprecated:
      since: 1.9.0
      message: Use `cpu_info_list[*].cores` instead.
      superseded_by: ['cpu_info_list[*].cores']
    description: 'The number of processor cores in all installed processors. For Example: `42`.'
  cpu_count:
    caption: CPU Count
    type: integer_t
    requirement: optional
    description: The number of physical processors on a system. For per-CPU detail, use `cpu_info_list`.
  cpu_info_list:
    caption: CPU Information
    type: object_t
    object: cpu_info
    array: true
    requirement: optional
    description: A list of `cpu_info` objects, each describing a physical CPU package installed in the device. Use with `cpu_count`.
  cpu_speed:
    caption: Processor Speed
    type: integer_t
    requirement: optional
    deprecated:
      since: 1.9.0
      message: Use `cpu_info_list[*].speed_mhz` instead.
      superseded_by: ['cpu_info_list[*].speed_mhz']
    description: 'The speed of the processor in Mhz. For Example: `4200`.'
  cpu_type:
    caption: Processor Type
    type: string_t
    requirement: optional
    deprecated:
      since: 1.9.0
      message: Use `cpu_info_list[*].model` and `cpu_info_list[*].vendor_name` instead.
      superseded_by: ['cpu_info_list[*].model', 'cpu_info_list[*].vendor_name']
    description: 'The processor type. For example: `x86 Family 6 Model 37 Stepping 5`.'
  desktop_display:
    caption: Desktop Display
    type: object_t
    object: display
    requirement: optional
    description: The desktop display affiliated with the event
  gpu_count:
    caption: GPU Count
    type: integer_t
    requirement: optional
    description: The number of graphics processors on a system. For per-GPU detail, use `gpu_info_list`.
  gpu_info_list:
    caption: GPU information
    type: object_t
    object: gpu_info
    array: true
    requirement: optional
    description: A list of GPU objects describing the hardware properties of each graphics processor installed on the device. Use with `gpu_count`.
  keyboard_info:
    caption: Keyboard Information
    type: object_t
    object: keyboard_info
    requirement: optional
    description: The keyboard detailed information.
  ram_size:
    caption: RAM Size
    type: integer_t
    requirement: optional
    description: 'The total amount of installed RAM, in Megabytes. For example: `2048`.'
  serial_number:
    caption: Serial Number
    type: string_t
    requirement: optional
    observable: 37
    description: The device manufacturer serial number.
  uuid:
    caption: UUID
    type: uuid_t
    requirement: optional
    description: The device manufacturer assigned universally unique hardware identifier. For SMBIOS compatible devices such as those running Linux and Windows, it is the UUID member of the System Information structure in the SMBIOS information. For macOS devices, it is the Hardware UUID (also known as IOPlatformUUID in the I/O Registry).
    references:
    - description: SMBIOS Specification
      url: https://www.dmtf.org/standards/smbios
    - description: Linux DMI Table Decoder documentation
      url: https://linux.die.net/man/8/dmidecode
    - description: Windows Win32_ComputerSystemProduct documentation
      url: https://learn.microsoft.com/en-us/windows/win32/cimwin32prov/win32-computersystemproduct
    - description: Apple Wiki (Mac Hardware UUID)
      url: https://theapplewiki.com/wiki/UDID#Mac
    - description: macOS I/O Registry source code reference to IOPlatformUUID
      url: https://github.com/apple-oss-distributions/xnu/blob/8d741a5de7ff4191bf97d57b9f54c2f6d4a15585/iokit/IOKit/IOKitKeys.h#L264-L265
  vendor_name:
    caption: Vendor Name
    type: string_t
    requirement: optional
    description: The device manufacturer.

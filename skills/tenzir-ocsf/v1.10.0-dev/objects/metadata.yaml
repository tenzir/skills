attributes:
  correlation_uid:
    caption: Correlation UID
    type: string_t
    requirement: optional
    description: A unique identifier used to correlate this OCSF event with other related OCSF events, distinct from the event's `uid` value. This enables linking multiple OCSF events that are part of the same activity, transaction, or security incident across different systems or time periods.
  data_classification:
    caption: Data Classification
    type: object_t
    object: data_classification
    requirement: recommended
    group: context
    profile: data_classification
    deprecated:
      since: 1.4.0
      message: Use the attribute `data_classifications` instead
      superseded_by: [data_classifications]
    description: The Data Classification object includes information about data classification levels and data category types.
  data_classifications:
    caption: Data Classification
    type: object_t
    object: data_classification
    array: true
    requirement: recommended
    group: context
    profile: data_classification
    description: A list of Data Classification objects, that include information about data classification levels and data category types, identified by a classifier.
  debug:
    caption: Debug Information
    type: string_t
    array: true
    requirement: optional
    description: Debug information about non-fatal issues with this OCSF event. Each issue is a line in this string array.
  event_code:
    caption: Event Code
    type: string_t
    requirement: optional
    description: The identifier of the original event. For example the numerical Windows Event Code or Cisco syslog code.
  extension:
    caption: Schema Extension
    type: object_t
    object: extension
    requirement: optional
    deprecated:
      since: 1.1.0
      message: Use the `extensions` attribute instead.
      superseded_by: [extensions]
    description: The schema extension used to create the event.
  extensions:
    caption: Schema Extensions
    type: object_t
    object: extension
    array: true
    requirement: optional
    description: The schema extensions used to create the event.
  is_truncated:
    caption: Is Truncated
    type: boolean_t
    requirement: optional
    description: Indicates whether the OCSF event data has been truncated due to size limitations. When `true`, some event data may have been omitted to fit within system constraints.
  labels:
    caption: Labels
    type: string_t
    array: true
    requirement: optional
    description: 'The list of labels attached to the event. For example: `["sample", "dev"]`'
  log_facility:
    caption: Log Facility
    type: string_t
    requirement: optional
    description: The syslog facility, normalized to the caption of the `log_facility_id` value. In the case of 'Other', it is defined by the event source.
  log_facility_id:
    caption: Log Facility ID
    type: integer_t
    requirement: optional
    sibling: log_facility
    description: 'The facility of the source syslog message, identifying the originating subsystem that generated it. The facility is independent of severity and is not recoverable from `severity_id`. A relay may rewrite or regenerate a message, so this reflects the source (original) facility rather than a value guaranteed to be stable across hops, and it should be populated only when the source is syslog or an equivalent facility mapping is unambiguous. There is no `Unknown` value: `0` is the kernel (`kern`) facility, so an absent or malformed PRI must not be mapped to `0`; use `99` (Other) for a known nonstandard or source-defined facility.'
    enum:
      '0':
        caption: kern
        description: Kernel messages.
      '1':
        caption: user
        description: User-level messages.
      '2':
        caption: mail
        description: Mail system.
      '3':
        caption: daemon
        description: System daemons.
      '4':
        caption: auth
        description: Security and authorization messages.
      '5':
        caption: syslog
        description: Messages generated internally by the syslog process.
      '6':
        caption: lpr
        description: Line printer subsystem.
      '7':
        caption: news
        description: Network news subsystem.
      '8':
        caption: uucp
        description: UUCP subsystem.
      '9':
        caption: cron
        description: Clock daemon.
      '10':
        caption: authpriv
        description: Security and authorization messages, distinguished from facility 4 by convention and conventionally reserved for privileged access.
      '11':
        caption: ftp
        description: FTP daemon.
      '12':
        caption: ntp
        description: NTP subsystem.
      '13':
        caption: audit
        description: Log audit.
      '14':
        caption: console
        description: Console messages, per the RFC 5427 SyslogFacility mapping. RFC 5424 Table 1 lists facility 14 as 'log alert'.
      '15':
        caption: cron2
        description: A second cron or clock daemon facility used by some systems such as Solaris, distinct from facility 9, per the RFC 5427 SyslogFacility mapping. RFC 5424 Table 1 lists facility 15 as 'clock daemon'.
      '16':
        caption: local0
        description: Local use 0.
      '17':
        caption: local1
        description: Local use 1.
      '18':
        caption: local2
        description: Local use 2.
      '19':
        caption: local3
        description: Local use 3.
      '20':
        caption: local4
        description: Local use 4.
      '21':
        caption: local5
        description: Local use 5.
      '22':
        caption: local6
        description: Local use 6.
      '23':
        caption: local7
        description: Local use 7.
      '99':
        caption: Other
        description: The facility is not mapped. See the `log_facility` attribute, which contains a data source specific value.
    references:
    - description: RFC 5424, Section 6.2.1, Syslog Message Facility (numeric facility range)
      url: https://datatracker.ietf.org/doc/html/rfc5424#section-6.2.1
    - description: RFC 5427, SyslogFacility textual convention (canonical facility label-to-code mapping)
      url: https://datatracker.ietf.org/doc/html/rfc5427
  log_format:
    caption: Log Source Format
    type: string_t
    requirement: optional
    description: The format of data in the log where the data originated. For example CSV, XML, Windows Multiline, JSON, syslog or Cisco Log Schema.
  log_level:
    caption: Log Level
    type: string_t
    requirement: optional
    description: The level at which an event was logged. This can be log provider specific. For example the audit level.
  log_name:
    caption: Log Name
    type: string_t
    requirement: recommended
    description: The event log name, typically for the consumer of the event. For example, the storage bucket name, SIEM repository index name, etc.
  log_provider:
    caption: Log Provider
    type: string_t
    requirement: optional
    description: The logging provider or logging service that logged the event. For example AWS CloudWatch or Splunk.
  log_source:
    caption: Log Source
    type: string_t
    requirement: optional
    description: The log system or component where the data originated. For example, a file path, syslog server name or a Windows hostname and logging subsystem such as Security.
  log_version:
    caption: Log Version
    type: string_t
    requirement: optional
    description: The event log schema version of the original event. For example the syslog version or the Cisco Log Schema version
  logged_time:
    caption: Logged Time
    type: timestamp_t
    requirement: optional
    description: The ultimate logged time in the event pipeline - when the event reached its final destination (e.g., SIEM, data lake). If `loggers` is populated, this should match the `logged_time` of the last entry in the `loggers` array. This is distinct from `time` (when the activity occurred) and `processed_time` (when an intermediate system processed the event).
  logged_time_dt:
    caption: Logged Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The ultimate logged time in the event pipeline - when the event reached its final destination (e.g., SIEM, data lake). If `loggers` is populated, this should match the `logged_time` of the last entry in the `loggers` array. This is distinct from `time` (when the activity occurred) and `processed_time` (when an intermediate system processed the event).
  loggers:
    caption: Loggers
    type: object_t
    object: logger
    array: true
    requirement: optional
    description: An ordered array of Logger objects describing each hop in the event pipeline between the source and its final destination. Each entry captures the logging product, device, and timestamps (`logged_time`, `transmit_time`) at that stage. The last entry's `logged_time` should match `metadata.logged_time`.
  modified_time:
    caption: Modified Time
    type: timestamp_t
    requirement: optional
    description: The time when the event was last modified or enriched.
  modified_time_dt:
    caption: Modified Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the event was last modified or enriched.
  original_event_uid:
    caption: Original Event ID
    type: string_t
    requirement: optional
    description: The unique identifier assigned to the event in its original logging system before transformation to OCSF format. This field preserves the source system's native event identifier, enabling traceability back to the raw log entry. For example, a Windows Event Record ID, a syslog message ID, a Splunk _cd value, or a database transaction log sequence number.
  original_time:
    caption: Original Time
    type: string_t
    requirement: recommended
    description: The original event time as reported by the event source, preserved as a pass-through string in its native format (e.g., Syslog timestamp, Windows event time). This is not normalized to `timestamp_t` - the normalized equivalent is the base event `time` attribute. Omit if the event is generated rather than collected via logs.
  processed_time:
    caption: Processed Time
    type: timestamp_t
    requirement: optional
    description: The time when the event was processed by an intermediate system (e.g., ETL pipeline, event processor) before reaching its final destination. Can be used with `logged_time` to calculate queuing duration via `total_queued_duration`.
  processed_time_dt:
    caption: Processed Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the event was processed by an intermediate system (e.g., ETL pipeline, event processor) before reaching its final destination. Can be used with `logged_time` to calculate queuing duration via `total_queued_duration`.
  product:
    caption: Product
    type: object_t
    object: product
    requirement: required
    description: The product that reported the event.
  profiles:
    caption: Profiles
    type: string_t
    array: true
    requirement: optional
    description: The list of profiles used to create the event. Profiles should be referenced by their `name` attribute for core profiles, or `extension/name` for profiles from extensions.
  reporter:
    caption: Reporter
    type: object_t
    object: reporter
    requirement: recommended
    description: The entity from which the event or finding was first reported.
  sequence:
    caption: Sequence Number
    type: integer_t
    requirement: optional
    description: Sequence number of the event. The sequence number is a value available in some events, to make the exact ordering of events unambiguous, regardless of the event time precision.
  source:
    caption: Source
    type: string_t
    requirement: optional
    description: The source of the event or finding. This can be any distinguishing name for the logical origin of the data — for example, 'CloudTrail Events', or a use case like 'Attack Simulations' or 'Vulnerability Scans'.
  tags:
    caption: Tags
    type: object_t
    object: key_value_object
    array: true
    requirement: optional
    description: The list of tags; `{key:value}` pairs associated to the event.
  tenant_uid:
    caption: Tenant UID
    type: string_t
    requirement: recommended
    description: The unique tenant identifier.
  total_queued_duration:
    caption: Total Queued Duration
    type: object_t
    object: timespan
    requirement: optional
    description: The amount of time an event spent in a queue awaiting processing. In this case, the value is the difference between `processed_time` and `logged_time`. This duration is inclusive of all queues between the originator of the event and the intended long-term storage destination of the event.
  transformation_info_list:
    caption: Transformation Info
    type: object_t
    object: transformation_info
    array: true
    requirement: optional
    description: An array of transformation info that describes the mappings or transforms applied to the data.
  transmit_time:
    caption: Transmission Time
    type: timestamp_t
    requirement: optional
    description: The time when the event was transmitted from the logging device to it's next destination.
  transmit_time_dt:
    caption: Transmission Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the event was transmitted from the logging device to it's next destination.
  type:
    caption: Type
    type: string_t
    requirement: optional
    description: The type of the event or finding as a subset of the `source` of the event. This can be any distinguishing characteristic of the data. For example 'Management Events' or 'Device Penetration Test'.
  uid:
    caption: Event UID
    type: string_t
    requirement: optional
    description: A unique identifier assigned to the OCSF event. This ID is specific to the OCSF event itself and is distinct from the original event identifier in the source system (see `original_event_uid`).
  untruncated_size:
    caption: Untruncated Size
    type: integer_t
    requirement: optional
    description: The original size of the OCSF event data in kilobytes before any truncation occurred. This field is typically populated when `is_truncated` is `true` to indicate the full size of the original event.
  version:
    caption: Version
    type: string_t
    requirement: required
    description: 'The version of the OCSF schema, using Semantic Versioning Specification (SemVer). For example: `1.0.0`. Event consumers use the version to determine the available event attributes.'
    references:
    - description: Semantic Versioning Specification (SemVer)
      url: https://semver.org

name: ai_status
caption: AI Status
extends: object
description: Container for per-operation outcome scalars contributed by the `ai_operation` profile. Holds outcomes reported by the model or agent runtime, such as why a completion stopped or the result of a permission check, so they do not proliferate as discrete attributes at the event root. Additional outcome attributes may be added to this object in later versions.

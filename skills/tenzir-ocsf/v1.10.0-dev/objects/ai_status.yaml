attributes:
  permission_result:
    caption: Permission Result
    type: string_t
    requirement: optional
    description: The outcome of the agent runtime's permission check for this operation, as reported by the runtime. Normalized to the caption of the `permission_result_id` value; when the value is 'Other', this carries the runtime's native label.
  permission_result_id:
    caption: Permission Result ID
    type: integer_t
    requirement: optional
    sibling: permission_result
    description: The normalized outcome of the agent runtime's permission check for this operation, as reported by the runtime. Producers map their runtime's native value into this set; when the value is 'Other', set `permission_result` to the runtime's native label.
    enum:
      '0':
        caption: Unknown
        description: The permission check outcome could not be determined, so the authorization state of the operation is not established.
      '1':
        caption: Allowed
        description: The agent runtime's permission check permitted the operation to proceed.
      '2':
        caption: Denied
        description: The agent runtime's permission check refused the operation.
      '99':
        caption: Other
        description: The permission result is not mapped. See the `permission_result` attribute, which contains a data source specific value.
  stop_reason:
    caption: Stop Reason
    type: string_t
    requirement: optional
    description: The reason the model completion ended, as reported by the event source. Normalized to the caption of the `stop_reason_id` value (e.g. `Token Limit`); when the value is 'Other', this carries the event source's native label (e.g. `recitation`, `malformed_function_call`).
  stop_reason_id:
    caption: Stop Reason ID
    type: integer_t
    requirement: recommended
    sibling: stop_reason
    description: 'The normalized reason the model completion ended. Producers map their runtime''s native value into this set. Populate on completion events; when the value is ''Other'', set `stop_reason` to the event source''s native label. Because completion behavior is bound to the configuration that produced it, a shift in this attribute''s distribution is more meaningful when weighed against that configuration: `ai_model.version` for direct model invocations, and `ai_agent.version`, `ai_agent.charter`, and `ai_agent.instance_uid` for agent-mediated operations.'
    enum:
      '0':
        caption: Unknown
        description: The completion ended without the producer being able to determine why, so the state of the operation at termination is not established.
      '1':
        caption: End of Turn
        description: 'The model reached the end of its turn: it completed its response naturally or emitted a configured stop sequence, and is not waiting on anything further.'
      '2':
        caption: Token Limit
        description: The completion was truncated by a token or length limit before the model finished, so the response is incomplete.
      '3':
        caption: Tool Use
        description: The completion paused to invoke a tool. The turn is not finished; the model expects the tool result and will continue.
      '4':
        caption: Session Stop
        description: The completion ended because the session or connection carrying it terminated - for example the caller cancelled, the client disconnected, or the transport closed - rather than because the model reached a stopping point. The session state at termination is therefore known, which distinguishes this from `Unknown` and lets a consumer decide whether the operation needs investigation or can simply be reclaimed.
      '5':
        caption: Content Filter
        description: The completion was stopped by a safety, policy, or content moderation mechanism rather than by the model reaching a stopping point or by the caller. This includes a refusal raised by a safety classifier and a guardrail intervening on the request or the response.
      '6':
        caption: Sub-Agent Stop
        description: The completion ended because the sub-agent performing it was stopped - the parent agent terminated the child, the child's task was cancelled, or the sub-agent's budget or step limit was exhausted - rather than because the model reached a stopping point. Distinct from `Session Stop`, which is the session or transport carrying the completion terminating. Not for use on an event that itself records a sub-agent stopping; on such an event this attribute records why that sub-agent stopped.
      '99':
        caption: Other
        description: The stop reason is not mapped. See the `stop_reason` attribute, which contains a data source specific value.

# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: image
caption: Image
extends: _entity
description: The Image object provides a description of a specific Virtual Machine (VM) or Container image.
references:
- description: D3FEND™ Ontology d3f:ContainerImage
  url: https://d3fend.mitre.org/dao/artifact/d3f:ContainerImage/
referenced_by:
  objects:
    container: [image]
    device: [image]
attributes:
  uid:
    caption: Unique ID
    type: string_t
    requirement: required
    description: 'The unique image ID. For example: `77af4d6b9913`.'
  name:
    caption: Name
    type: string_t
    requirement: recommended
    description: 'The image name. For example: `elixir`.'
  labels:
    caption: Labels
    type: string_t
    array: true
    requirement: optional
    description: The list of labels associated to the image.
  path:
    caption: Path
    type: file_path_t
    requirement: optional
    observable: 45
    description: The full path to the image file.
  tag:
    caption: Image Tag
    type: string_t
    requirement: optional
    deprecated:
      since: 1.4.0
      message: Use the `labels` or `tags` attribute instead.
      superseded_by: [labels, tags]
    description: 'The image tag. For example: `1.11-alpine`.'
  tags:
    caption: Tags
    type: object_t
    object: key_value_object
    array: true
    requirement: optional
    description: The list of tags; `{key:value}` pairs associated to the image.
  uid_numeric: {caption: Numeric Unique ID, type: long_t, requirement: optional, from: _entity}

# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: dns_answer
caption: DNS Answer
extends: dns_resource_record
description: The DNS Answer object represents a specific response provided by the Domain Name System (DNS) when querying for information about a domain or performing a DNS operation. It encapsulates the relevant details and data returned by the DNS server in response to a query.
references:
- description: D3FEND™ Ontology d3f:InboundInternetDNSResponseTraffic.
  url: https://d3fend.mitre.org/dao/artifact/d3f:InboundInternetDNSResponseTraffic/
- description: RFC 1035 — DNS Implementation and Specification.
  url: https://www.rfc-editor.org/rfc/rfc1035.txt
referenced_by:
  classes:
    dns_activity: [answers]
  objects:
    osint: [answers]
attributes:
  rdata: {caption: DNS RData, type: string_t, requirement: required, from: dns_resource_record}
  class: {caption: Resource Record Class, type: string_t, requirement: recommended, from: dns_resource_record}
  flag_ids:
    caption: DNS Header Flags
    type: integer_t
    array: true
    requirement: recommended
    sibling: flags
    deprecated:
      since: 1.9.0
      message: Use `dns_activity.flag_ids` instead.
      superseded_by: [dns_activity.flag_ids]
    description: The list of DNS answer header flag IDs.
    enum:
      0:
        caption: Unknown
        description: The flag is unknown.
      1:
        caption: Authoritative Answer
      2:
        caption: Truncated Response
      3:
        caption: Recursion Desired
      4:
        caption: Recursion Available
      5:
        caption: Authentic Data
      6:
        caption: Checking Disabled
      99:
        caption: Other
        description: The flag is not mapped. See the `flags` attribute, which contains a data source specific value.
  hostname: {caption: Hostname, type: hostname_t, requirement: recommended, observable: 1, from: dns_resource_record}
  packet_uid:
    caption: Packet UID
    type: integer_t
    requirement: recommended
    deprecated:
      since: 1.9.0
      message: Use `dns_activity.transaction_id` instead.
      superseded_by: [dns_activity.transaction_id]
    description: The DNS packet identifier assigned by the program that generated the query. The identifier is copied to the response.
  ttl: {caption: TTL, type: integer_t, requirement: recommended, from: dns_resource_record}
  type: {caption: Resource Record Type, type: string_t, requirement: recommended, from: dns_resource_record}
  flags:
    caption: DNS Header Flags
    type: string_t
    array: true
    requirement: optional
    deprecated:
      since: 1.9.0
      message: Use `dns_activity.flags` instead.
      superseded_by: [dns_activity.flags]
    description: The list of DNS answer header flags.

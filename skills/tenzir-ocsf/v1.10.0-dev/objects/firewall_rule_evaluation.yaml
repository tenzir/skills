attributes:
  name: {caption: Name, type: string_t, requirement: recommended, from: firewall_rule}
  uid: {caption: Unique ID, type: string_t, requirement: recommended, from: firewall_rule}
  action:
    caption: Action
    type: string_t
    requirement: optional
    description: The normalized caption of `action_id`. When `action_id` is `99` (Other), this attribute contains the source-specific action.
  action_id:
    caption: Action ID
    type: integer_t
    requirement: optional
    sibling: action
    description: The normalized action reported for this security control rule evaluation. An unknown action may still correspond to a known disposition. Refer to `disposition_id` for the outcome of this evaluation.
    enum:
      0:
        caption: Unknown
        description: The action is unknown. The disposition may still be known.
      1:
        caption: Allowed
        description: The activity was allowed by this rule evaluation.
      2:
        caption: Denied
        description: The activity was denied by this rule evaluation.
      3:
        caption: Observed
        description: The activity was observed, but neither explicitly allowed nor denied by this rule evaluation.
      4:
        caption: Modified
        description: The activity was modified, adjusted, or corrected by this rule evaluation.
      99:
        caption: Other
        description: The action is not mapped. See the `action` attribute, which contains the source-specific action.
  category: {caption: Category, type: string_t, requirement: optional, from: rule}
  condition: {caption: Condition, type: string_t, requirement: optional, from: firewall_rule}
  desc: {caption: Description, type: string_t, requirement: optional, from: firewall_rule}
  disposition:
    caption: Disposition
    type: string_t
    requirement: optional
    description: The normalized caption of `disposition_id`. When `disposition_id` is `99` (Other), this attribute contains the source-specific disposition.
  disposition_id:
    caption: Disposition ID
    type: integer_t
    requirement: optional
    sibling: disposition
    description: The normalized outcome reported for this security control rule evaluation. This disposition does not imply the event-level disposition.
    enum:
      0:
        caption: Unknown
        description: The disposition is unknown.
      1:
        caption: Allowed
        description: Granted access or allowed the action to the protected resource.
      2:
        caption: Blocked
        description: Denied access or blocked the action to the protected resource.
      3:
        caption: Quarantined
        description: A suspicious file or other content was moved to a benign location.
      4:
        caption: Isolated
        description: A session was isolated on the network or within a browser.
      5:
        caption: Deleted
        description: A file or other content was deleted.
      6:
        caption: Dropped
        description: The request was detected as a threat and resulted in the connection being dropped.
      7:
        caption: Custom Action
        description: A custom action was executed such as running of a command script. Use the `message` attribute of the base class for details.
      8:
        caption: Approved
        description: A request or submission was approved. For example, when a form was properly filled out and submitted. This is distinct from `1` 'Allowed'.
      9:
        caption: Restored
        description: A quarantined file or other content was restored to its original location.
      10:
        caption: Exonerated
        description: A suspicious or risky entity was deemed to no longer be suspicious (re-scored).
      11:
        caption: Corrected
        description: A corrupt file or configuration was corrected.
      12:
        caption: Partially Corrected
        description: A corrupt file or configuration was partially corrected.
      13:
        caption: Uncorrected
        description: A corrupt file or configuration was not corrected.
      14:
        caption: Delayed
        description: An operation was delayed, for example if a restart was required to finish the operation.
      15:
        caption: Detected
        description: Suspicious activity or a policy violation was detected without further action.
      16:
        caption: No Action
        description: The outcome of an operation had no action taken.
      17:
        caption: Logged
        description: The operation or action was logged without further action.
      18:
        caption: Tagged
        description: A file or other entity was marked with extended attributes.
      19:
        caption: Alert
        description: The rule evaluation detected a threat and produced a notification without itself blocking the activity. Other rule evaluations may determine the event-level outcome.
      20:
        caption: Count
        description: Counted the request or activity but did not determine whether to allow it or block it.
      21:
        caption: Reset
        description: The request was detected as a threat and resulted in the connection being reset.
      22:
        caption: Captcha
        description: Required the end user to solve a CAPTCHA puzzle to prove that a human being is sending the request.
      23:
        caption: Challenge
        description: Ran a silent challenge that required the client session to verify that it's a browser, and not a bot.
      24:
        caption: Access Revoked
        description: 'The requestor''s access has been revoked due to security policy enforcements. Note: use the `Host` profile if the `User` or `Actor` requestor is not present in the event class.'
      25:
        caption: Rejected
        description: A request or submission was rejected. For example, when a form was improperly filled out and submitted. This is distinct from `2` 'Blocked'.
      26:
        caption: Unauthorized
        description: An attempt to access a resource was denied due to an authorization check that failed. This is a more specific disposition than `2` 'Blocked' and can be complemented with the `authorizations` attribute for more detail.
      27:
        caption: Error
        description: An error occurred during the processing of the activity or request. Use the `message` attribute of the base class for details.
      99:
        caption: Other
        description: The disposition is not mapped. See the `disposition` attribute, which contains a data source specific value.
  duration: {caption: Duration Milliseconds, type: long_t, requirement: optional, from: firewall_rule}
  match_details: {caption: Match Details, type: string_t, array: true, requirement: optional, from: firewall_rule}
  match_location: {caption: Match Location, type: string_t, requirement: optional, from: firewall_rule}
  rate_limit: {caption: Rate Limit, type: integer_t, requirement: optional, from: firewall_rule}
  sensitivity: {caption: Sensitivity, type: string_t, requirement: optional, from: firewall_rule}
  type: {caption: Type, type: string_t, requirement: optional, from: rule}
  uid_numeric: {caption: Numeric Unique ID, type: long_t, requirement: optional, from: _entity}
  version: {caption: Version, type: string_t, requirement: optional, from: rule}

# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: firewall_rule_evaluation
caption: Security Control Rule Evaluation
extends: firewall_rule
description: The Security Control Rule Evaluation object describes a reported evaluation of a security control rule, including its properties, match context, and action and disposition. The action and disposition apply to this evaluation and do not imply the event-level outcome.

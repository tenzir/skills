# Attributes with a `definition` path are inherited unchanged. Read that file
# for their type, object, description, enum, and observable.
name: d3f_technique
caption: Defensive Technique
extends: _entity
description: The Defensive Technique object describes the leaf defensive technique ID and/or name associated to a countermeasure.
constraints:
  at_least_one: [name, uid]
references:
- description: D3FEND™ Matrix
  url: https://d3fend.mitre.org
referenced_by:
  objects:
    d3fend: [d3f_technique]
attributes:
  name:
    caption: Name
    type: string_t
    requirement: recommended
    description: 'The name of the defensive technique. For example: `IO Port Restriction`.'
  src_url:
    caption: Source URL
    type: url_t
    requirement: optional
    observable: 6
    description: 'The versioned permalink of the defensive technique. For example: `https://d3fend.mitre.org/technique/d3f:IOPortRestriction/`'
    references:
    - description: 'Example: IOPortRestriction technique'
      url: https://d3fend.mitre.org/technique/d3f:IOPortRestriction/
  uid:
    caption: Unique ID
    type: string_t
    requirement: recommended
    description: 'The unique identifier of the defensive technique. For example: `D3-IOPR`.'
  uid_numeric:
    caption: Numeric Unique ID
    requirement: optional
    definition: v1.10.0-dev/objects/_entity.yaml

name: os
caption: Operating System (OS)
extends: object
description: The Operating System (OS) object describes characteristics of an OS, such as Linux or Windows.
references:
- description: D3FEND™ Ontology d3f:OperatingSystem
  url: https://d3fend.mitre.org/dao/artifact/d3f:OperatingSystem/
referenced_by:
  objects:
    advisory: [os]
    device: [os]
    endpoint: [os]
    kb_article: [os]
    network_endpoint: [os]
    network_proxy: [os]
attributes:
  name:
    caption: Name
    type: string_t
    requirement: required
    description: The operating system name.
  type_id:
    caption: Type ID
    type: integer_t
    requirement: required
    sibling: type
    description: The type identifier of the operating system.
    enum:
      0:
        caption: Unknown
        description: The type is unknown.
      99:
        caption: Other
        description: The type is not mapped. See the `type` attribute, which contains a data source specific value.
      100:
        caption: Windows
      101:
        caption: Windows Mobile
      200:
        caption: Linux
      201:
        caption: Android
      300:
        caption: macOS
      301:
        caption: iOS
      302:
        caption: iPadOS
      400:
        caption: Solaris
      401:
        caption: AIX
      402:
        caption: HP-UX
  sp_name:
    caption: OS Service Pack
    type: string_t
    requirement: recommended
    description: The name of the latest Service Pack.
  sp_ver:
    caption: OS Service Pack Version
    type: integer_t
    requirement: recommended
    description: The version number of the latest Service Pack.
  version:
    caption: Version
    type: string_t
    requirement: recommended
    description: 'The version of the OS running on the device that originated the event. For example: "Windows 10", "OS X 10.7", or "iOS 9".'
  build:
    caption: OS Build
    type: string_t
    requirement: optional
    description: The operating system build number.
  country:
    caption: Country
    type: string_t
    requirement: optional
    observable: 14
    description: |-
      The operating system country code, as defined by the ISO 3166-1 standard (Alpha-2 code).

      Note: The two letter country code should be capitalized. For example: `US` or `CA`.
    references:
    - description: ISO 3166-1 alpha-2 codes
      url: https://www.iso.org/obp/ui/#iso:pub:PUB500001:en
  cpe_name:
    caption: The product CPE identifier
    type: string_t
    requirement: optional
    description: 'The Common Platform Enumeration (CPE) name. For example: `cpe:/a:apple:safari:16.2`.'
    references:
    - description: NIST Products
      url: https://nvd.nist.gov/products/cpe
  cpu_bits:
    caption: CPU Bits
    type: integer_t
    requirement: optional
    description: 'The cpu architecture, the number of bits used for addressing in memory. For example: `32` or `64`.'
  edition:
    caption: OS Edition
    type: string_t
    requirement: optional
    description: 'The operating system edition. For example: `Professional`.'
  kernel_release:
    caption: Kernel Release
    type: string_t
    requirement: optional
    description: The kernel release of the operating system. On Unix-based systems, this is determined from the `uname -r` command output, for example "5.15.0-122-generic".
  lang:
    caption: Language
    type: string_t
    requirement: optional
    description: 'The two letter lower case language codes, as defined by ISO 639-1. For example: `en` (English), `de` (German), or `fr` (French).'
    references:
    - description: ISO 639-1
      url: https://en.wikipedia.org/wiki/ISO_639-1
  type:
    caption: Type
    type: string_t
    requirement: optional
    description: The type of the operating system.

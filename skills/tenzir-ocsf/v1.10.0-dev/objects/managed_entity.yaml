# Attributes with a `definition` path are inherited unchanged. Read that file
# for their type, object, description, enum, and observable.
name: managed_entity
caption: Managed Entity
extends: _entity
description: The Managed Entity object describes the type and version of an entity, such as a user, device, or policy. For types in the `type_id` enum list, an associated attribute should be populated. If the type of entity is not in the `type_id` list, information can be put into the `data` attribute, `type_id` should be 'Other' and the `type` attribute should label the entity type.
profiles: [container, data_classification]
constraints:
  at_least_one: [name, uid, device, group, org, policy, user]
referenced_by:
  classes:
    entity_management: [entity, entity_result, updated_entity]
attributes:
  data:
    caption: Data
    type: json_t
    requirement: optional
    description: The managed entity content as a JSON object.
  device:
    caption: Device
    type: object_t
    object: device
    requirement: recommended
    observable: 20
    description: An addressable device, computer system or host.
  email:
    caption: Email
    type: object_t
    object: email
    requirement: recommended
    observable: 22
    description: The email object.
  group:
    caption: Group
    type: object_t
    object: group
    requirement: recommended
    description: The group object associated with an entity such as user, policy, or rule.
  location:
    caption: Geo Location
    type: object_t
    object: location
    requirement: optional
    observable: 26
    description: The detailed geographical location usually associated with an IP address.
  name:
    caption: Name
    type: string_t
    requirement: recommended
    description: The name of the managed entity. It should match the name of the specific entity object's name if populated, or the name of the managed entity if the `type_id` is 'Other'.
  org:
    caption: Organization
    type: object_t
    object: organization
    requirement: recommended
    description: The Organization object containing details about the managed organizational entity. This object includes properties such as the organization name, unique identifier, type, and other organizational metadata. This attribute should be populated when `type_id` is `4` (Organization).
  policy:
    caption: Policy
    type: object_t
    object: policy
    requirement: recommended
    description: Describes details of a managed policy.
  type:
    caption: Type
    type: string_t
    requirement: recommended
    description: 'The managed entity type. For example: `Policy`, `User`, `Organization`, `Device`.'
  type_id:
    caption: Type ID
    type: integer_t
    requirement: recommended
    sibling: type
    description: The type of the Managed Entity. It is recommended to also populate the `type` attribute with the associated label, or the source specific name if `Other`.
    enum:
      '0':
        caption: Unknown
        description: The type is unknown.
      '1':
        caption: Device
        description: A managed Device entity. This item corresponds to population of the `device` attribute.
      '2':
        caption: User
        description: A managed User entity. This item corresponds to population of the `user` attribute.
      '3':
        caption: Group
        description: A managed Group entity. This item corresponds to population of the `group` attribute.
      '4':
        caption: Organization
        description: A managed Organization entity. This item corresponds to population of the `org` attribute.
      '5':
        caption: Policy
        description: A managed Policy entity. This item corresponds to population of the `policy` attribute.
      '6':
        caption: Email
        description: A managed Email entity. This item corresponds to population of the `email` attribute.
      '7':
        caption: Network Zone
        description: A managed Network Zone entity. Populate the `name` attribute with the zone name and/or the `uid` attribute with the zone ID. Additional zone information can be added to the `data` attribute.
      '99':
        caption: Other
        description: The type is not mapped. See the `type` attribute, which contains a data source specific value.
  uid:
    caption: Unique ID
    type: string_t
    requirement: recommended
    description: The identifier of the managed entity. It should match the `uid` of the specific entity's object UID if populated, or the source specific ID if the `type_id` is 'Other'.
  uid_numeric:
    caption: Numeric Unique ID
    requirement: optional
    definition: v1.10.0-dev/objects/_entity.yaml
  user:
    caption: User
    type: object_t
    object: user
    requirement: recommended
    observable: 21
    description: The user that pertains to the event or object.
  version:
    caption: Version
    type: string_t
    requirement: recommended
    description: 'The version of the managed entity. For example: `1.2.3`.'

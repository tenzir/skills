attributes:
  app_name:
    caption: Application Name
    type: string_t
    requirement: recommended
    deprecated:
      since: 1.9.0
      message: Use the `application.name` attribute instead.
      superseded_by: [application.name]
    description: The client application or service that initiated the activity. This can be in conjunction with the `user` if present. Note that `app_name` is distinct from the `process` if present.
  app_uid:
    caption: Application ID
    type: string_t
    requirement: recommended
    deprecated:
      since: 1.9.0
      message: Use the `application.uid` attribute instead.
      superseded_by: [application.uid]
    description: The unique identifier of the client application or service that initiated the activity. This can be in conjunction with the `user` if present. Note that `app_name` is distinct from the `process.pid` or `process.uid` if present.
  application:
    caption: Application
    type: object_t
    object: application
    requirement: recommended
    description: The client application or service that initiated the activity. This can be in conjunction with the `user` if present. Note that `application` is distinct from the `process` if present.
  iam_role:
    caption: IAM Role
    type: object_t
    object: iam_role
    requirement: recommended
    description: The actor's role, or as an alternative to `user` or `process` when the role is serving as a security principal for the operation that initiated the activity.
  invoked_by:
    caption: Invoked by
    type: string_t
    requirement: recommended
    deprecated:
      since: 1.2.0
      message: Use the `application` attribute instead.
      superseded_by: [application]
    description: The name of the service that invoked the activity as described in the event.
  process:
    caption: Process
    type: object_t
    object: process
    requirement: recommended
    observable: 25
    description: The process that initiated the activity.
  session:
    caption: Session
    type: object_t
    object: session
    requirement: recommended
    description: The user session from which the activity was initiated.
  user:
    caption: User
    type: object_t
    object: user
    requirement: recommended
    observable: 21
    description: The user that initiated the activity or the user context from which the activity was initiated.
  authorizations:
    caption: Authorization Information
    type: object_t
    object: authorization
    array: true
    requirement: optional
    description: Provides details about an authorization, such as authorization outcome, and any associated policies related to the activity/event.
  idp:
    caption: Identity Provider
    type: object_t
    object: idp
    requirement: optional
    description: This object describes details about the Identity Provider used.

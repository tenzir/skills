attributes:
  uid:
    caption: Delegation ID
    type: string_t
    requirement: required
    description: Unique identifier for this delegation context. Must be stable across the lifetime of the delegation and generated by a trusted issuing authority (e.g., an OAuth authorization server, cloud STS, IAM broker, or orchestration gateway) rather than self-asserted by the delegate. All events executed under this delegation share this identifier.
  created_time:
    caption: Created Time
    type: timestamp_t
    requirement: recommended
    description: The time when the delegation was issued by the issuing authority.
  issuer_uid:
    caption: Issuer ID
    type: string_t
    requirement: recommended
    description: The unique identifier of the trusted issuing authority (e.g., an OAuth authorization server, cloud STS, IAM broker, orchestration gateway, or SDK wrapper) that generated this delegation. Enables verification that delegation IDs were issued by an authorized component rather than self-asserted by the delegate.
  audience:
    caption: Audience
    type: string_t
    requirement: optional
    description: The service or resource this delegation may be exercised against - the relying party that should accept it, and that should reject it if presented anywhere else. When the delegation is carried by an issued token, this is the audience the token names, typically a URI or service identifier for the relying party. The issuer populates it at delegation time from the grant it minted, so an issuer that scopes a delegation to a particular relying party already holds the value; issuers that mint unscoped delegations omit it, which is why the attribute is optional. Note this is the party the authority is exercised on, not the party that later reads or audits the record - a delegation restricted to one payments API keeps that restriction on record regardless of who consumes the event afterwards.
    references:
    - description: JSON Web Token (JWT) Audience Claim.
      url: https://datatracker.ietf.org/doc/html/rfc7519#section-4.1.3
  created_time_dt:
    caption: Created Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the delegation was issued by the issuing authority.
  expiration_time:
    caption: Expiration Time
    type: timestamp_t
    requirement: optional
    description: The time when this delegation's granted authority expires. After this time the delegation no longer conveys authority, independent of any revocation.
  expiration_time_dt:
    caption: Expiration Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when this delegation's granted authority expires. After this time the delegation no longer conveys authority, independent of any revocation.
  parent_uid:
    caption: Parent Delegation ID
    type: string_t
    requirement: optional
    description: The delegation identifier of the parent delegation, if this delegation was created by re-delegating authority to another party (e.g., a downstream service or automated process). This creates a parent-child relationship that enables tracking the complete chain of delegation ancestry. Does not indicate that the delegate was instantiated or spawned by the parent's delegate; that relationship, if any, is tracked separately.
  scopes:
    caption: Scopes
    type: string_t
    array: true
    requirement: optional
    description: The authorization scopes granted at this delegation node, bounding what the delegate is authorized to do on the principal's behalf (e.g., OAuth scope labels). Comparing a delegation's scopes with its parent's scopes reveals scope attenuation across the chain.

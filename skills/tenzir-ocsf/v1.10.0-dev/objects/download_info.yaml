name: download_info
caption: Download Info
extends: object
description: The Download Info object contains metadata pertaining to a downloaded file.
profiles: [container]
constraints:
  at_least_one: [src_endpoint, src_url, type_id]
references:
- description: File download metadata on Windows
  url: https://en.wikipedia.org/wiki/Mark_of_the_Web
- description: File download metadata on macOS
  url: https://developer.apple.com/documentation/coreservices/kmditemwherefroms?language=objc
referenced_by:
  objects:
    file: [download_info]
attributes:
  referrer:
    caption: HTTP Referrer
    type: string_t
    requirement: optional
    description: The URL that referred to `src_url`. This is typically the URL of a web page containing a download link.
  src_endpoint:
    caption: Source Endpoint
    type: object_t
    object: network_endpoint
    requirement: recommended
    observable: 20
    description: Information about the network endpoint from which the file was downloaded.
  src_url:
    caption: Source URL
    type: url_t
    requirement: recommended
    observable: 6
    description: The URL from which the file was downloaded.
  type:
    caption: Type
    type: string_t
    requirement: optional
    description: The download type, normalized to the caption of the `type_id` value. In the case of 'Other', it is defined by the event source.
  type_id:
    caption: Type ID
    type: integer_t
    requirement: recommended
    sibling: type
    description: The download type ID. The values correspond to the five permitted values of the `ZoneId` property in the Mark of the Web metadata of a downloaded file on Windows. Note however that each numeric value is 1 greater than its `ZoneId` equivalent.
    enum:
      '0':
        caption: Unknown
        description: The file's download type is unknown.
      '1':
        caption: Local Machine
        description: The file was downloaded from a server running on device.
      '2':
        caption: Intranet
        description: The file was downloaded from an intranet server.
      '3':
        caption: Trusted
        description: The file was downloaded from a trusted server.
      '4':
        caption: Internet
        description: The file was downloaded from an internet server.
      '5':
        caption: Untrusted
        description: The file was downloaded from an untrusted server.
      '99':
        caption: Other
        description: The file's download type is not mapped. See the `type` attribute, which contains an event source specific value.

attributes:
  mitigation:
    caption: MITRE Mitigation
    type: object_t
    object: mitigation
    requirement: optional
    description: The Mitigation object describes the MITRE ATT&CK® or ATLAS™ Mitigation ID and/or name that is associated to an attack.
    references:
    - description: ATT&CK® Matrix
      url: https://attack.mitre.org
    - description: ATLAS™ Matrix
      url: https://atlas.mitre.org/matrices/ATLAS
  sub_technique:
    caption: MITRE Sub-technique
    type: object_t
    object: sub_technique
    requirement: recommended
    description: The Sub-technique object describes the MITRE ATT&CK® or ATLAS™ Sub-technique ID and/or name associated to an attack.
    references:
    - description: ATT&CK® Matrix
      url: https://attack.mitre.org
    - description: ATLAS™ Matrix
      url: https://atlas.mitre.org/matrices/ATLAS
  tactic:
    caption: MITRE Tactic
    type: object_t
    object: tactic
    requirement: recommended
    description: The Tactic object describes the Tactic ID and/or name associated to an attack.
    references:
    - description: ATT&CK® Matrix
      url: https://attack.mitre.org
    - description: ATLAS™ Matrix
      url: https://atlas.mitre.org/matrices/ATLAS
  tactics:
    caption: Tactics
    type: object_t
    object: tactic
    array: true
    requirement: optional
    deprecated:
      since: 1.1.0
      message: Use the `tactic` attribute instead.
      superseded_by: [tactic]
    description: The Tactics associated with the attack technique.
    references:
    - description: ATT&CK® Matrix
      url: https://attack.mitre.org/wiki/ATT&CK_Matrix
  technique:
    caption: MITRE Technique
    type: object_t
    object: technique
    requirement: recommended
    description: The Technique object describes the MITRE ATT&CK® or ATLAS™ Technique ID and/or name associated to an attack.
    references:
    - description: ATT&CK® Matrix
      url: https://attack.mitre.org
    - description: ATLAS™ Matrix
      url: https://atlas.mitre.org/matrices/ATLAS
  version:
    caption: Version
    type: string_t
    requirement: recommended
    description: The ATT&CK® or ATLAS™ Matrix version.

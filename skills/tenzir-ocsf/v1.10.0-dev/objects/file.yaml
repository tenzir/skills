name: file
caption: File
extends: _entity
observable: 24
description: The File object represents the metadata associated with a file stored in a computer system. It encompasses information about the file itself, including its attributes, properties, and organizational details.
profiles: [container, data_classification, datetime, cloud]
references:
- description: D3FEND™ Ontology d3f:File
  url: https://next.d3fend.mitre.org/dao/artifact/d3f:File/
referenced_by:
  classes:
    data_security_finding: [file]
    email_file_activity: [file]
    event_log_actvity: [file]
    file_activity: [file, file_result]
    file_hosting: [file, file_result]
    file_query: [file]
    file_remediation_activity: [file]
    folder_query: [folder]
    ftp_activity: [file]
    http_activity: [file]
    network_file_activity: [file]
    rdp_activity: [file]
    smb_activity: [file]
    ssh_activity: [file]
  objects:
    affected_code: [file]
    ai_agent: [charter]
    databucket: [file]
    email: [files]
    evidences: [file]
    job: [file]
    job_action: [file]
    kernel_driver: [file]
    malware: [files]
    module: [file]
    osint: [file]
    process: [file]
    query_evidence: [file, folder]
    script: [file]
attributes:
  accessed_time:
    caption: Accessed Time
    type: timestamp_t
    requirement: optional
    description: The time when the file was last accessed.
  accessed_time_dt:
    caption: Accessed Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the file was last accessed.
  accessor:
    caption: Accessor
    type: object_t
    object: user
    requirement: optional
    observable: 21
    description: The name of the user who last accessed the object.
  attributes:
    caption: Attributes
    type: integer_t
    requirement: optional
    description: The bitmask value that represents the file attributes.
  company_name:
    caption: Company Name
    type: string_t
    requirement: optional
    description: 'The name of the company that published the file. For example: `Microsoft Corporation`.'
  confidentiality:
    caption: Confidentiality
    type: string_t
    requirement: optional
    description: The file content confidentiality, normalized to the confidentiality_id value. In the case of 'Other', it is defined by the event source.
  confidentiality_id:
    caption: Confidentiality ID
    type: integer_t
    requirement: optional
    sibling: confidentiality
    description: The normalized identifier of the file content confidentiality indicator.
    enum:
      '0':
        caption: Unknown
        description: The confidentiality is unknown.
      '1':
        caption: Not Confidential
      '2':
        caption: Confidential
      '3':
        caption: Secret
      '4':
        caption: Top Secret
      '5':
        caption: Private
      '6':
        caption: Restricted
      '99':
        caption: Other
        description: The confidentiality is not mapped. See the `confidentiality` attribute, which contains a data source specific value.
  created_time:
    caption: Created Time
    type: timestamp_t
    requirement: optional
    description: The time when the file was created.
  created_time_dt:
    caption: Created Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the file was created.
  creator:
    caption: Creator
    type: object_t
    object: user
    requirement: optional
    observable: 21
    description: The user that created the file.
  data_classification:
    caption: Data Classification
    type: object_t
    object: data_classification
    requirement: recommended
    group: context
    profile: data_classification
    deprecated:
      since: 1.4.0
      message: Use the attribute `data_classifications` instead
      superseded_by: [data_classifications]
    description: The Data Classification object includes information about data classification levels and data category types.
  data_classifications:
    caption: Data Classification
    type: object_t
    object: data_classification
    array: true
    requirement: recommended
    group: context
    profile: data_classification
    description: A list of Data Classification objects, that include information about data classification levels and data category types, identified by a classifier.
  desc:
    caption: Description
    type: string_t
    requirement: optional
    description: 'The description of the file, as returned by file system. For example: the description as returned by the Unix file command or the Windows file type.'
  download_info:
    caption: Download Info
    type: object_t
    object: download_info
    requirement: optional
    description: Information pertaining to a downloaded file.
  drive_type:
    caption: Drive Type
    type: string_t
    requirement: optional
    description: The drive type, normalized to the caption of the `drive_type_id` value. In the case of `Other`, it is defined by the source.
  drive_type_id:
    caption: Drive Type ID
    type: integer_t
    requirement: optional
    sibling: drive_type
    description: Identifies the type of a disk drive, i.e. fixed, removable, etc.
    enum:
      '0':
        caption: Unknown
        description: The drive type is unknown.
      '1':
        caption: Removable
        description: The drive has removable media; for example, a floppy drive, thumb drive, or flash card reader.
      '2':
        caption: Fixed
        description: The drive has fixed media; for example, a hard disk drive or flash drive.
      '3':
        caption: Remote
        description: The drive is a remote (network) drive.
      '4':
        caption: CD-ROM
        description: The drive is a CD-ROM drive.
      '5':
        caption: RAM Disk
        description: The drive is a RAM disk.
      '99':
        caption: Other
        description: The drive type is not mapped. See the `drive_type` attribute, which contains a data source specific value.
  encryption_details:
    caption: Encryption Details
    type: object_t
    object: encryption_details
    requirement: optional
    description: The encryption details of the file. Should be populated if the file is encrypted.
  ext:
    caption: File Extension
    type: string_t
    requirement: recommended
    description: 'The extension of the file, excluding the leading dot. For example: `exe` from `svchost.exe`, or `gz` from `export.tar.gz`.'
  hashes:
    caption: Hashes
    type: object_t
    object: fingerprint
    array: true
    requirement: recommended
    observable: 30
    description: An array of hash attributes.
  imported_symbols:
    caption: Imported Symbols
    type: string_t
    array: true
    requirement: optional
    description: A list of symbols imported by the executable file.
  internal_name:
    caption: Internal Name
    type: string_t
    requirement: optional
    description: The name of the file as identified within the file itself. This contrasts with the name by which the file is known on disk. Where available, the internal name is widely used by security practitioners and detection content because the on-disk file name is not reliable. On the Windows OS, most PE files contain a `VERSIONINFO` resource from which the internal name can be obtained. On macOS, binaries can optionally embed a copy of the application's `Info.plist` file which in turn contains the name of the executable.
    references:
    - description: VERSIONINFO resource
      url: https://learn.microsoft.com/en-us/windows/win32/menurc/versioninfo-resource
    - description: Info.plist file
      url: https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Introduction/Introduction.html
  is_deleted:
    caption: Deleted
    type: boolean_t
    requirement: optional
    description: Indicates if the file was deleted from the filesystem.
  is_encrypted:
    caption: Encrypted
    type: boolean_t
    requirement: optional
    description: Indicates if the file is encrypted.
  is_public:
    caption: Public
    type: boolean_t
    requirement: optional
    profile: cloud
    description: Indicates if the file is publicly accessible. For example in an object's public access in AWS S3
  is_readonly:
    caption: Read-Only
    type: boolean_t
    requirement: optional
    description: Indicates that the file cannot be modified.
  is_system:
    caption: System
    type: boolean_t
    requirement: optional
    description: The indication of whether the object is part of the operating system.
  mime_type:
    caption: MIME type
    type: string_t
    requirement: optional
    description: The Multipurpose Internet Mail Extensions (MIME) type of the file, if applicable.
  modified_time:
    caption: Modified Time
    type: timestamp_t
    requirement: optional
    description: The time when the file was last modified.
  modified_time_dt:
    caption: Modified Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the file was last modified.
  modifier:
    caption: Modifier
    type: object_t
    object: user
    requirement: optional
    observable: 21
    description: The user that last modified the file.
  name:
    caption: Name
    type: file_name_t
    requirement: required
    observable: 7
    description: 'The name of the file. For example: `svchost.exe`'
  owner:
    caption: Owner
    type: object_t
    object: user
    requirement: optional
    observable: 21
    description: The user that owns the file/object.
  parent_folder:
    caption: Parent Folder
    type: string_t
    requirement: optional
    description: 'The parent folder in which the file resides. For example: `c:\windows\system32`'
  path:
    caption: Path
    type: file_path_t
    requirement: recommended
    observable: 45
    description: 'The full path to the file. For example: `c:\windows\system32\svchost.exe`.'
  product:
    caption: Product
    type: object_t
    object: product
    requirement: optional
    description: The product that created or installed the file.
  security_descriptor:
    caption: Security Descriptor
    type: string_t
    requirement: optional
    description: The object security descriptor.
  signature:
    caption: Digital Signature
    type: object_t
    object: digital_signature
    requirement: optional
    deprecated:
      since: 1.8.0
      message: Use the `signatures` attribute.
      superseded_by: [signatures]
    description: The digital signature of the file.
  signatures:
    caption: Digital Signatures
    type: object_t
    object: digital_signature
    array: true
    requirement: optional
    description: A collection of `Digital Signature` objects.
  size:
    caption: Size
    type: long_t
    requirement: optional
    description: The size of data, in bytes.
  storage_class:
    caption: Storage Class
    type: string_t
    requirement: optional
    profile: cloud
    description: 'The storage class of the file. For example in AWS S3: `STANDARD, STANDARD_IA, GLACIER`.'
  tags:
    caption: Tags
    type: object_t
    object: key_value_object
    array: true
    requirement: optional
    description: The list of tags; `{key:value}` pairs associated to the file.
  type:
    caption: Type
    type: string_t
    requirement: optional
    description: The file type.
  type_id:
    caption: Type ID
    type: integer_t
    requirement: required
    sibling: type
    description: The file type ID. Note the distinction between a `Regular File` and an `Executable File`. If the distinction is not known, or not indicated by the log, use `Regular File`. In this case, it should not be assumed that a Regular File is not executable.
    enum:
      '0':
        caption: Unknown
        description: The type is unknown.
      '1':
        caption: Regular File
      '2':
        caption: Folder
      '3':
        caption: Character Device
      '4':
        caption: Block Device
      '5':
        caption: Local Socket
      '6':
        caption: Named Pipe
      '7':
        caption: Symbolic Link
      '8':
        caption: Executable File
      '99':
        caption: Other
        description: The type is not mapped. See the `type` attribute, which contains a data source specific value.
  uid:
    caption: Unique ID
    type: string_t
    requirement: optional
    description: The unique identifier of the file as defined by the storage system, such the file system file ID.
  uid_numeric:
    caption: Numeric Unique ID
    type: long_t
    requirement: optional
    from: _entity
    description: |-
      The `uid` attribute in numeric form where applicable.
      Note: Producers may populate `uid_numeric` only in addition to `uid` and not as an alternative to it.
  uri:
    caption: File URI
    type: url_t
    requirement: optional
    observable: 6
    description: The file URI, such as those reporting by static analysis tools. E.g., `file:///C:/dev/sarif/sarif-tutorials/samples/Introduction/simple-example.js`
    references:
    - description: RFC 3986
      url: https://datatracker.ietf.org/doc/html/rfc3986
  url:
    caption: URL
    type: object_t
    object: url
    requirement: optional
    observable: 23
    description: The URL of the file, when applicable.
  version:
    caption: Version
    type: string_t
    requirement: optional
    description: 'The file version. For example: `8.0.7601.17514`.'
  volume:
    caption: Volume
    type: string_t
    requirement: optional
    description: The volume on the storage device where the file is located.
  xattributes:
    caption: Extended Attributes
    type: object_t
    object: object
    requirement: optional
    description: |-
      An unordered collection of zero or more name/value pairs where each pair represents a file or folder extended attribute.

      For example: Windows alternate data stream attributes (ADS stream name, ADS size, etc.), user-defined or application-defined attributes, ACL, owner, primary group, etc. Examples from DCS:

      - ads_name
      - ads_size
      - dacl
      - owner
      - primary_group
      - link_name - name of the link associated to the file.
      - hard_link_count - the number of links that are associated to the file.

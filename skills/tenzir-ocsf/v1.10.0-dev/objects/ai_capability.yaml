# Attributes with a `definition` path are inherited unchanged. Read that file
# for their type, object, description, enum, and observable.
name: ai_capability
caption: AI Capability
extends: _entity
description: 'The AI Capability object describes a callable capability invoked by or on behalf of an AI system: a tool, a resource, or a prompt, in the sense of the Model Context Protocol (MCP) primitives. It records the invariant, advertised description of the capability - its identity, kind, provenance, declared contracts, and declared safety hints - not the per-call argument values or results, which are carried by the transport objects (e.g., `api.request.data` / `api.response.data`). The object is protocol-neutral: MCP is the motivating binding, but a framework-native function tool or a model provider''s built-in tool populates the same shape, omitting the MCP-specific attributes. Distinguished from the `product` object, which describes the security product that generated the telemetry.'
constraints:
  at_least_one: [name, uid]
references:
- description: Model Context Protocol specification - server primitives (tools, resources, prompts) and tool annotations
  url: https://modelcontextprotocol.io/specification
- description: MCP 2026-07-28 Release Candidate - cacheScope/ttlMs (SEP-2549) and the Tasks extension
  url: https://blog.modelcontextprotocol.io/posts/2026-07-28-release-candidate/
referenced_by:
  classes:
    account_change: [ai_capability]
    api_activity: [ai_capability]
    application_error: [ai_capability]
    application_lifecycle: [ai_capability]
    authentication: [ai_capability]
    authorize_session: [ai_capability]
    clipboard_activity: [ai_capability]
    datastore_activity: [ai_capability]
    device_power_state_activity: [ai_capability]
    dhcp_activity: [ai_capability]
    dns_activity: [ai_capability]

# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: win/win_resource
caption: Windows Resource
extension: win
extends: _resource
description: The Windows resource object describes a resource object managed by Windows, such as mutant or timer.
profiles: [data_classification, datetime]
constraints:
  at_least_one: [name, uid]
referenced_by:
  classes:
    win/windows_resource_activity: [win_resource]
attributes:
  type_id:
    caption: Type ID
    type: integer_t
    requirement: required
    sibling: type
    description: The normalized type identifier of the Windows resource object accessed.
    enum:
      0:
        caption: Unknown
        description: The resource object type is unknown.
      1:
        caption: Directory
      2:
        caption: Event
      3:
        caption: Timer
      4:
        caption: Device
      5:
        caption: Mutant
      6:
        caption: Type
      7:
        caption: File
      8:
        caption: Token
      9:
        caption: Thread
      10:
        caption: Section
      11:
        caption: WindowStation
      12:
        caption: DebugObject
      13:
        caption: FilterCommunicationPort
      14:
        caption: EventPair
      15:
        caption: Driver
      16:
        caption: IoCompletion
      17:
        caption: Controller
      18:
        caption: SymbolicLink
      19:
        caption: WmiGuid
      20:
        caption: Process
      21:
        caption: Profile
      22:
        caption: Desktop
      23:
        caption: KeyedEvent
      24:
        caption: Adapter
      25:
        caption: Key
      26:
        caption: WaitablePort
      27:
        caption: Callback
      28:
        caption: Semaphore
      29:
        caption: Job
      30:
        caption: Port
      31:
        caption: FilterConnectionPort
      32:
        caption: ALPC Port
      33:
        caption: SAM_ALIAS
      34:
        caption: SAM_GROUP
      35:
        caption: SAM_USER
      36:
        caption: SAM_DOMAIN
      37:
        caption: SAM_SERVER
      99:
        caption: Other
        description: The resource object type is not mapped. See the `type` attribute, which may contain a data source specific value.
  data_classification: {caption: Data Classification, type: object_t, object: data_classification, requirement: recommended, group: context, profile: data_classification, deprecated: {since: 1.4.0, message: Use the attribute `data_classifications` instead}, from: _resource}
  data_classifications: {caption: Data Classification, type: object_t, object: data_classification, array: true, requirement: recommended, group: context, profile: data_classification, from: _resource}
  name:
    caption: Name
    type: string_t
    requirement: recommended
    description: The name of the resource object.
  uid:
    caption: Unique ID
    type: resource_uid_t
    requirement: recommended
    observable: 10
    description: The Windows provided handle identifier for the resource object
  created_time: {caption: Created Time, type: timestamp_t, requirement: optional, from: _resource}
  created_time_dt:
    caption: Created Time
    type: datetime_t
    requirement: optional
    profile: datetime
    from: _resource
    description: The time when the resource was created.
  data: {caption: Data, type: json_t, requirement: optional, from: _resource}
  details:
    caption: Details
    type: string_t
    requirement: optional
    description: The string detailing the attributes of the resource object.
  labels: {caption: Labels, type: string_t, array: true, requirement: optional, from: _resource}
  modified_time: {caption: Modified Time, type: timestamp_t, requirement: optional, from: _resource}
  modified_time_dt:
    caption: Modified Time
    type: datetime_t
    requirement: optional
    profile: datetime
    from: _resource
    description: The time when the resource was last modified.
  svc_name:
    caption: Service Name
    type: string_t
    requirement: optional
    description: The Windows service acting as the object server for the resource object, such as Security or Security Account Manager.
  tags: {caption: Tags, type: object_t, object: key_value_object, array: true, requirement: optional, from: _resource}
  type:
    caption: Type
    type: string_t
    requirement: optional
    description: The type of the Windows resource object.
  uid_alt: {caption: Alternate ID, type: resource_uid_t, requirement: optional, observable: 10, from: _resource}

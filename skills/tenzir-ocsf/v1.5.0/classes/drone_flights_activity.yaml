name: drone_flights_activity
caption: Drone Flights Activity
uid: 8001
category: unmanned_systems
category_uid: 8
extends: unmanned_systems
description: 'Drone Flights Activity events report the activity of Unmanned Aerial Systems (UAS), their Operators, and mission-planning and authorization metadata as reported by the UAS platforms themselves, by Counter-UAS (CUAS) systems, or other remote monitoring or sensing infrastructure. Based on the Remote ID defined in Standard Specification for Remote ID and Tracking (ASTM Designation: F3411-22a) [ASTM F3411-22a](https://cdn.standards.iteh.ai/samples/112830/71297057ac42432880a203654f213709/ASTM-F3411-22a.pdf)'
profiles: [cloud, container, data_classification, datetime, host, osint, security_control]
constraints:

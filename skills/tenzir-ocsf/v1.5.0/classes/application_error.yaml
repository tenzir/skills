# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: application_error
caption: Application Error
uid: 6008
category: application
category_uid: 6
extends: application
description: Application Error events describe issues with an applications. The error message should be put in the event's `message` attribute. The `metadata.product` attribute can be used to capture the originating application information. The `host` profile can used to include the generating device information. This class is helpful (and originally intended for) applications that generate and/or handle OCSF events. This class can also be used for errors in upstream products and services.
profiles: [cloud, container, data_classification, datetime, host, osint, security_control]
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event.
    enum:
      0:
        caption: Unknown
        description: The event activity is unknown.
      1:
        caption: General Error
        description: The application has experienced an error.
      2:
        caption: Translation Error
        description: The application has experienced an error translating (mapping) a raw event to OCSF. Including the original raw event in the raw_data field is highly recommended.
      99:
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event.
    enum:
      6:
        caption: Application Activity
        description: Application Activity events report detailed information about the behavior of applications and services.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event.
    enum:
      6008:
        caption: Application Error

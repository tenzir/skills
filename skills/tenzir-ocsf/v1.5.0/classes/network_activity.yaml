name: network_activity
caption: Network Activity
uid: 4001
category: network
category_uid: 4
extends: network
description: Network Activity events report network connection and traffic activity.
profiles: [cloud, container, data_classification, datetime, host, load_balancer, network_proxy, osint, security_control]
constraints:
  at_least_one: [dst_endpoint, src_endpoint]
attributes:
  action:
    caption: Action
    requirement: optional
    profile: security_control

# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: process_activity
caption: Process Activity
uid: 1007
category: system
category_uid: 1
extends: system
description: Process Activity events report when a process launches, injects, opens or terminates another process, successful or otherwise.
profiles: [cloud, container, data_classification, datetime, host, osint, security_control]
associations:
  actor.user: [device]
  device: [actor.user]
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event.
    enum:
      0:
        caption: Unknown
        description: The event activity is unknown.
      1:
        caption: Launch
      2:
        caption: Terminate
      3:
        caption: Open
      4:
        caption: Inject
      5:
        caption: Set User ID
      99:
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  actor:
    caption: Actor
    type: object_t
    object: actor
    requirement: required
    group: primary
    description: The actor that performed the activity on the target `process`. For example, the process that started a new process or injected code into another process.
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event.
    enum:
      1:
        caption: System Activity
        description: System Activity events.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event.
    enum:
      1007:
        caption: Process Activity
        description: Process Activity events report when a process launches, injects, opens or terminates another process, successful or otherwise.

name: authorize_session
caption: Authorize Session
uid: 3003
category: iam
category_uid: 3
extends: iam
description: Authorize Session events report privileges or groups assigned to a new user session, usually at login time.
profiles: [cloud, container, data_classification, datetime, host, osint, security_control]
constraints:
  just_one: [privileges, group]
associations:
  session: [user]
  user: [session]

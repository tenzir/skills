name: script
caption: Script
extends: object
description: The Script object describes a script or command that can be executed by a shell, script engine, or interpreter. Examples include Bash, JavsScript, PowerShell, Python, VBScript, etc. Note that the term script here denotes not only a script contained within a file but also a script or command typed interactively by a user, supplied on the command line, or provided by some other file-less mechanism.
profiles: [data_classification]
references:
- description: D3FEND™ Ontology d3f:ExecutableScript.
  url: https://d3fend.mitre.org/dao/artifact/d3f:ExecutableScript/
referenced_by:
  classes:
    script_activity: [script]
  objects:
    evidences: [script]
    osint: [script]
attributes:
  file:
    caption: File
    type: object_t
    object: file
    requirement: optional
    observable: 24
    description: Present if this script is associated with a file. Not present in the case of a file-less script.
  hashes:
    caption: Hashes
    type: object_t
    object: fingerprint
    array: true
    requirement: recommended
    observable: 30
    description: An array of the script's cryptographic hashes. Note that these hashes are calculated on the script in its original encoding, and not on the normalized UTF-8 encoding found in the `script_content` attribute.
  name:
    caption: Name
    type: string_t
    requirement: optional
    description: Unique identifier for the script or macro, independent of the containing file, used for tracking, auditing, and security analysis.
  parent_uid:
    caption: Parent Unique ID
    type: string_t
    requirement: optional
    description: This attribute relates a sub-script to a parent script having the matching `uid` attribute. In the case of PowerShell, sub-script execution can be identified by matching the activity correlation ID of the raw ETW events provided by the OS.
  script_content:
    caption: Script Content
    type: object_t
    object: long_string
    requirement: required
    observable: 36
    description: The script content, normalized to UTF-8 encoding irrespective of its original encoding. When emitting this attribute, it may be appropriate to truncate large scripts. When consuming this attribute, large scripts should be anticipated.
  type:
    caption: Type
    type: string_t
    requirement: optional
    description: The script type, normalized to the caption of the `type_id` value. In the case of 'Other', it is defined by the event source.
  type_id:
    caption: Type ID
    type: integer_t
    requirement: required
    sibling: type
    description: The normalized script type ID.
    enum:
      '0':
        caption: Unknown
        description: The script type is unknown.
      '1':
        caption: Windows Command Prompt
      '2':
        caption: PowerShell
      '3':
        caption: Python
      '4':
        caption: JavaScript
      '5':
        caption: VBScript
      '6':
        caption: Unix Shell
      '7':
        caption: VBA
      '99':
        caption: Other
        description: The script type is not mapped. See the `type` attribute which contains an event source specific value.
  uid:
    caption: Unique ID
    type: string_t
    requirement: optional
    description: Some script engines assign a unique ID to each individual execution of a given script. This attribute captures that unique ID. In the case of PowerShell, the unique ID corresponds to the `ScriptBlockId` in the raw ETW events provided by the OS.

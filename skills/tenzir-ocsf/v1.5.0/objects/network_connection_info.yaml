name: network_connection_info
caption: Network Connection Information
extends: object
description: The Network Connection Information object describes characteristics of an OSI Transport Layer communication, including TCP and UDP.
references:
- description: D3FEND™ Ontology d3f:NetworkSession
  url: https://d3fend.mitre.org/dao/artifact/d3f:NetworkSession/
referenced_by:
  classes:
    airborne_broadcast_activity: [connection_info]
    dhcp_activity: [connection_info, proxy_connection_info]
    dns_activity: [connection_info, proxy_connection_info]
    drone_flights_activity: [connection_info]
    file_hosting: [connection_info]
    ftp_activity: [connection_info, proxy_connection_info]
    http_activity: [connection_info, proxy_connection_info]
    network_activity: [connection_info, proxy_connection_info]
    network_connection_query: [connection_info]
    network_file_activity: [connection_info, proxy_connection_info]
    network_remediation_activity: [connection_info]
    ntp_activity: [connection_info, proxy_connection_info]
    rdp_activity: [connection_info, proxy_connection_info]
    smb_activity: [connection_info, proxy_connection_info]
    ssh_activity: [connection_info, proxy_connection_info]
    tunnel_activity: [connection_info, proxy_connection_info]
    web_resource_access_activity: [proxy_connection_info]
    web_resources_activity: [proxy_connection_info]
  objects:
    evidences: [connection_info]
    query_evidence: [connection_info]
attributes:
  boundary:
    caption: Boundary
    type: string_t
    requirement: optional
    description: |-
      The boundary of the connection, normalized to the caption of 'boundary_id'. In the case of 'Other', it is defined by the event source.

      For cloud connections, this translates to the traffic-boundary(same VPC, through IGW, etc.). For traditional networks, this is described as Local, Internal, or External.
  boundary_id:
    caption: Boundary ID
    type: integer_t
    requirement: recommended
    sibling: boundary
    description: |-
      The normalized identifier of the boundary of the connection.

      For cloud connections, this translates to the traffic-boundary (same VPC, through IGW, etc.). For traditional networks, this is described as Local, Internal, or External.
    enum:
      '0':
        caption: Unknown
        description: The connection boundary is unknown.
      '1':
        caption: Localhost
        description: Local network traffic on the same endpoint.
      '2':
        caption: Internal
        description: Internal network traffic between two endpoints inside network.
      '3':
        caption: External
        description: External network traffic between two endpoints on the Internet or outside the network.
      '4':
        caption: Same VPC
        description: Through another resource in the same VPC
      '5':
        caption: Internet/VPC Gateway
        description: Through an Internet gateway or a gateway VPC endpoint
      '6':
        caption: Virtual Private Gateway
        description: Through a virtual private gateway
      '7':
        caption: Intra-region VPC
        description: Through an intra-region VPC peering connection
      '8':
        caption: Inter-region VPC
        description: Through an inter-region VPC peering connection
      '9':
        caption: Local Gateway
        description: Through a local gateway
      '10':
        caption: Gateway VPC
        description: Through a gateway VPC endpoint (Nitro-based instances only)
      '11':
        caption: Internet Gateway
        description: Through an Internet gateway (Nitro-based instances only)
      '99':
        caption: Other
        description: The boundary is not mapped. See the `boundary` attribute, which contains a data source specific value.
  community_uid:
    caption: Community ID
    type: string_t
    requirement: optional
    description: The Community ID of the network connection.
    references:
    - description: Community ID definition.
      url: https://github.com/corelight/community-id-spec
  direction:
    caption: Direction
    type: string_t
    requirement: optional
    description: The direction of the initiated connection, traffic, or email, normalized to the caption of the direction_id value. In the case of 'Other', it is defined by the event source.
  direction_id:
    caption: Direction ID
    type: integer_t
    requirement: required
    sibling: direction
    description: The normalized identifier of the direction of the initiated connection, traffic, or email.
    enum:
      '0':
        caption: Unknown
        description: The connection direction is unknown.
      '1':
        caption: Inbound
        description: Inbound network connection. The connection was originated from the Internet or outside network, destined for services on the inside network.
      '2':
        caption: Outbound
        description: Outbound network connection. The connection was originated from inside the network, destined for services on the Internet or outside network.
      '3':
        caption: Lateral
        description: Lateral network connection. The connection was originated from inside the network, destined for services on the inside network.
      '99':
        caption: Other
        description: The direction is not mapped. See the `direction` attribute, which contains a data source specific value.
  flag_history:
    caption: Connection Flag History
    type: string_t
    requirement: optional
    description: The Connection Flag History summarizes events in a network connection. For example flags  `ShAD`  representing SYN, SYN/ACK, ACK and Data exchange.
    references:
    - description: Zeek History
      url: https://docs.zeek.org/en/master/scripts/base/protocols/conn/main.zeek.html#detailed-interface:~:text=Records%20the%20state%20history%20of%20connections%20as%20a%20string%20of%20letters.%20The%20meaning%20of%20those%20letters%20is
  protocol_name:
    caption: Protocol Name
    type: string_t
    requirement: recommended
    description: 'The IP protocol name in lowercase, as defined by the Internet Assigned Numbers Authority (IANA). For example: `tcp` or `udp`.'
    references:
    - description: IANA Protocol Numbers
      url: https://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml
  protocol_num:
    caption: Protocol Number
    type: integer_t
    requirement: recommended
    description: 'The IP protocol number, as defined by the Internet Assigned Numbers Authority (IANA). For example: `6` for TCP and `17` for UDP.'
    references:
    - description: IANA Protocol Numbers
      url: https://www.iana.org/assignments/protocol-numbers/protocol-numbers.xhtml
  protocol_ver:
    caption: IP Version
    type: string_t
    requirement: optional
    description: The Internet Protocol version.
  protocol_ver_id:
    caption: IP Version ID
    type: integer_t
    requirement: recommended
    sibling: protocol_ver
    description: The Internet Protocol version identifier.
    enum:
      '0':
        caption: Unknown
        description: The protocol version is unknown.
      '4':
        caption: Internet Protocol version 4 (IPv4)
      '6':
        caption: Internet Protocol version 6 (IPv6)
      '99':
        caption: Other
        description: The protocol version is not mapped. See the `protocol_ver` attribute, which contains a data source specific value.
  session:
    caption: Session
    type: object_t
    object: session
    requirement: optional
    description: The authenticated user or service session.
  tcp_flags:
    caption: TCP Flags
    type: integer_t
    requirement: optional
    description: The network connection TCP header flags (i.e., control bits).
  uid:
    caption: Connection UID
    type: string_t
    requirement: recommended
    description: The unique identifier of the connection.

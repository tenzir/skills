# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: site_zone
caption: Site Zone
extends: _entity
description: 'The Site Zone object describes a site zone: a defined area within a physical site that shares a common security posture, such as a perimeter, a public lobby, or a restricted area. It is distinct from the `zone` attribute, which describes a network zone.'
constraints:
  at_least_one: [name, uid]
referenced_by:
  objects:
    physical_site: [site_zone]
attributes:
  name: {caption: Name, type: string_t, requirement: recommended, from: _entity}
  type_id:
    caption: Type ID
    type: integer_t
    requirement: recommended
    group: classification
    sibling: type
    description: 'The normalized classification of the site zone by security posture. These are generic tiers by security posture. Regime-specific tiers map onto them rather than extending the list: for example, a controlled, limited, or protected area maps to Restricted, and an exclusion, vital, or material access area maps to Critical. Carry the native tier name in `type`.'
    enum:
      0:
        caption: Unknown
        description: The zone type is unknown.
      1:
        caption: Perimeter
        description: The outer boundary of the site.
      2:
        caption: Public
        description: An area open to the public.
      3:
        caption: Restricted
        description: An area restricted to authorized persons.
      4:
        caption: Critical
        description: An area containing critical assets.
      5:
        caption: Transitional
        description: A lobby, corridor, or other transitional space.
      6:
        caption: External
        description: An outdoor area within the site boundary.
      99:
        caption: Other
        description: The zone type is not mapped. See the `type` attribute, which contains a data source specific value.
    references:
    - description: 'DoD 5200.08-R, Physical Security Program: restricted areas (controlled, limited, exclusion)'
      url: https://www.esd.whs.mil/Portals/54/Documents/DD/issuances/dodm/520008rm.pdf
    - description: '10 CFR 73.2, NRC definitions: protected area, vital area, material access area'
      url: https://www.ecfr.gov/current/title-10/chapter-I/part-73/subpart-A/section-73.2
  uid: {caption: Unique ID, type: string_t, requirement: recommended, from: _entity}
  is_armed:
    caption: Armed
    type: boolean_t
    requirement: optional
    description: Indicates whether the intrusion detection or alarm system protecting the site zone was armed (active) at the time of the event. `false` means it was disarmed.
  type:
    caption: Type
    type: string_t
    requirement: optional
    description: The site zone type, normalized to the caption of the `type_id` value. In the case of 'Other', it is defined by the event source.
  uid_numeric: {caption: Numeric Unique ID, type: long_t, requirement: optional, from: _entity}

# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: file_activity
caption: File System Activity
uid: 1001
category: system
category_uid: 1
extends: system
description: File System Activity events report when a process performs an action on a file or folder.
profiles: [cloud, container, data_classification, datetime, host, osint, security_control]
associations:
  actor.user: [device]
  device: [actor.user]
references:
- description: D3FEND™ Ontology d3f:FileEvent
  url: https://d3fend.mitre.org/event/d3f:FileEvent/
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event.
    enum:
      0:
        caption: Unknown
        description: The event activity is unknown.
      1:
        caption: Create
        description: A request to create a new file on a file system.
      2:
        caption: Read
        description: A request to read data from a file on a file system.
      3:
        caption: Update
        description: A request to write data to a file on a file system.
      4:
        caption: Delete
        description: A request to delete a file on a file system.
      5:
        caption: Rename
        description: A request to rename a file on a file system.
      6:
        caption: Set Attributes
        description: A request to set attributes for a file on a file system.
      7:
        caption: Set Security
        description: A request to set security for a file on a file system.
      8:
        caption: Get Attributes
        description: A request to get attributes for a file on a file system.
      9:
        caption: Get Security
        description: A request to get security for a file on a file system.
      10:
        caption: Encrypt
        description: A request to encrypt a file on a file system.
      11:
        caption: Decrypt
        description: A request to decrypt a file on a file system.
      12:
        caption: Mount
        description: A request to mount a file on a file system.
      13:
        caption: Unmount
        description: A request to unmount a file from a file system.
      14:
        caption: Open
        description: A request to create a file handle.
      99:
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  actor:
    caption: Actor
    type: object_t
    object: actor
    requirement: required
    group: primary
    description: The actor that performed the activity on the `file` object
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event.
    enum:
      1:
        caption: System Activity
        description: System Activity events.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event.
    enum:
      1001:
        caption: File System Activity
        description: File System Activity events report when a process performs an action on a file or folder.
  cloud: {caption: Cloud, type: object_t, object: cloud, requirement: required, group: primary, profile: cloud, from: base_event}
  device: {caption: Device, type: object_t, object: device, requirement: required, group: primary, observable: 20, from: system}
  file:
    caption: File
    type: object_t
    object: file
    requirement: required
    group: primary
    observable: 24
    description: The file that is the target of the activity.
  metadata: {caption: Metadata, type: object_t, object: metadata, requirement: required, group: context, from: base_event}
  osint: {caption: OSINT, type: object_t, object: osint, array: true, requirement: required, group: primary, profile: osint, from: base_event}
  severity_id: {caption: Severity ID, type: integer_t, requirement: required, group: classification, sibling: severity, enum: {0: Unknown, 1: Informational, 2: Low, 3: Medium, 4: High, 5: Critical, 6: Fatal, 99: Other}, from: base_event}
  time: {caption: Event Time, type: timestamp_t, requirement: required, group: occurrence, from: base_event}
  type_uid:
    caption: Type ID
    type: long_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event/finding type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
  action_id: {caption: Action ID, type: integer_t, requirement: recommended, group: primary, profile: security_control, sibling: action, enum: {0: Unknown, 1: Allowed, 2: Denied, 3: Observed, 4: Modified, 99: Other}, from: base_event}
  component:
    caption: Component
    type: string_t
    requirement: recommended
    group: primary
    description: |-
      The name or relative pathname of a sub-component of the data object, if applicable.

      For example: `attachment.doc`, `attachment.zip/bad.doc`, or `part.mime/part.cab/part.uue/part.doc`.
  confidence_id: {caption: Confidence ID, type: integer_t, requirement: recommended, group: context, profile: security_control, sibling: confidence, enum: {0: Unknown, 1: Low, 2: Medium, 3: High, 99: Other}, from: base_event}
  create_mask:
    caption: Create Mask
    type: string_t
    requirement: recommended
    group: primary
    description: The original Windows mask that is required to create the object.
  disposition_id:
    caption: Disposition ID
    type: integer_t
    requirement: recommended
    group: primary
    profile: security_control
    sibling: disposition
    enum:
      0: Unknown
      1: Allowed
      2: Blocked
      3: Quarantined
      4: Isolated
      5: Deleted
      6: Dropped
      7: Custom Action
      8: Approved
      9: Restored
      10: Exonerated
      11: Corrected
      12: Partially Corrected
      13: Uncorrected
      14: Delayed
      15: Detected
      16: No Action
      17: Logged
      18: Tagged
      19: Alert
      20: Count
      21: Reset
      22: Captcha
      23: Challenge
      24: Access Revoked
      25: Rejected
      26: Unauthorized
      27: Error
      99: Other
    from: base_event
  file_diff:
    caption: File Diff
    type: string_t
    requirement: recommended
    group: primary
    description: File content differences used for change detection. For example, a common use case is to identify itemized changes within INI or configuration/property setting values.
  file_result:
    caption: File Result
    type: object_t
    object: file
    requirement: recommended
    group: primary
    observable: 24
    description: The resulting file object when the activity was allowed and successful.

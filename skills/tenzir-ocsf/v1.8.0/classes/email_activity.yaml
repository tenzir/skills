# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: email_activity
caption: Email Activity
uid: 4009
category: network
category_uid: 4
extends: base_event
description: Email Activity events report SMTP protocol and email activities including those with embedded URLs and files. See the `Email` object for details.
profiles: [cloud, container, data_classification, datetime, host, osint, security_control]
references:
- description: D3FEND™ Ontology d3f:EmailEvent
  url: https://d3fend.mitre.org/event/d3f:EmailEvent/
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event.
    enum:
      0:
        caption: Unknown
        description: The event activity is unknown.
      1:
        caption: Send
      2:
        caption: Receive
      3:
        caption: Scan
        description: 'Email being scanned (example: security scanning)'
      4:
        caption: Trace
        description: Follow an email message as it travels through an organization. The `message_trace_uid` should be populated when selected.
        references:
        - description: For example Office 365 Email Message Trace
          url: href='https://learn.microsoft.com/en-us/Exchange/monitoring/trace-an-email-message/message-trace-modern-eac
      5:
        caption: MTA Relay
        description: Email processed by an MTA, typically combining send, receive, and scan operations into a single activity.
      99:
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event.
    enum:
      4:
        caption: Network Activity
        description: Network Activity events.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event.
    enum:
      4009:
        caption: Email Activity
        description: Email Activity events report SMTP protocol and email activities including those with embedded URLs and files. See the `Email` object for details.
  cloud: {caption: Cloud, type: object_t, object: cloud, requirement: required, group: primary, profile: cloud, from: base_event}
  direction_id:
    caption: Direction ID
    type: integer_t
    requirement: required
    group: context
    sibling: direction
    description: |-
      The direction of the email relative to the scanning host or organization.

      Email scanned at an internet gateway might be characterized as inbound to the organization from the Internet, outbound from the organization to the Internet, or internal within the organization. Email scanned at a workstation might be characterized as inbound to, or outbound from the workstation.
    enum:
      0:
        caption: Unknown
        description: The email direction is unknown.
      1:
        caption: Inbound
        description: Email Inbound, from the Internet or outside network destined for an entity inside network.
      2:
        caption: Outbound
        description: Email Outbound, from inside the network destined for an entity outside network.
      3:
        caption: Internal
        description: Email Internal, from inside the network destined for an entity inside network.
      4:
        caption: Local
        description: Local network connection (`localhost`). The connection is intra-device, originating from and destined for services running on the same device.
      99:
        caption: Other
        description: The direction is not mapped. See the `direction` attribute, which contains a data source specific value.
  email:
    caption: Email
    type: object_t
    object: email
    requirement: required
    group: primary
    observable: 22
    description: The email object.
  metadata: {caption: Metadata, type: object_t, object: metadata, requirement: required, group: context, from: base_event}
  osint: {caption: OSINT, type: object_t, object: osint, array: true, requirement: required, group: primary, profile: osint, from: base_event}
  severity_id: {caption: Severity ID, type: integer_t, requirement: required, group: classification, sibling: severity, enum: {0: Unknown, 1: Informational, 2: Low, 3: Medium, 4: High, 5: Critical, 6: Fatal, 99: Other}, from: base_event}
  time: {caption: Event Time, type: timestamp_t, requirement: required, group: occurrence, from: base_event}
  type_uid:
    caption: Type ID
    type: long_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event/finding type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
  action_id: {caption: Action ID, type: integer_t, requirement: recommended, group: primary, profile: security_control, sibling: action, enum: {0: Unknown, 1: Allowed, 2: Denied, 3: Observed, 4: Modified, 99: Other}, from: base_event}
  command:
    caption: Command
    type: string_t
    requirement: recommended
    group: primary
    description: The command issued by the initiator (client), such as SMTP HELO or EHLO.
  confidence_id: {caption: Confidence ID, type: integer_t, requirement: recommended, group: context, profile: security_control, sibling: confidence, enum: {0: Unknown, 1: Low, 2: Medium, 3: High, 99: Other}, from: base_event}
  device: {caption: Device, type: object_t, object: device, requirement: recommended, group: primary, profile: host, observable: 20, from: base_event}
  disposition_id:
    caption: Disposition ID
    type: integer_t
    requirement: recommended
    group: primary
    profile: security_control
    sibling: disposition
    enum:
      0: Unknown
      1: Allowed
      2: Blocked
      3: Quarantined
      4: Isolated
      5: Deleted
      6: Dropped
      7: Custom Action
      8: Approved
      9: Restored
      10: Exonerated
      11: Corrected
      12: Partially Corrected
      13: Uncorrected
      14: Delayed
      15: Detected
      16: No Action
      17: Logged
      18: Tagged
      19: Alert
      20: Count
      21: Reset
      22: Captcha
      23: Challenge
      24: Access Revoked
      25: Rejected
      26: Unauthorized
      27: Error
      99: Other
    from: base_event
  dst_endpoint:
    caption: Destination Endpoint
    type: object_t
    object: network_endpoint
    requirement: recommended
    group: primary
    observable: 20
    description: The responder (server) receiving the email.
  email_auth:
    caption: Email Authentication
    type: object_t
    object: email_auth
    requirement: recommended
    group: primary
    description: The SPF, DKIM and DMARC attributes of an email.
  from:
    caption: From
    type: email_t
    requirement: recommended
    group: primary
    observable: 5
    description: The sender address from the transmission envelope. This reflects the actual sending party and may differ from the 'From' header in the message.
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322
  is_alert: {caption: Alert, type: boolean_t, requirement: recommended, group: primary, profile: security_control, from: base_event}
  message: {caption: Message, type: string_t, requirement: recommended, group: primary, from: base_event}
  message_trace_uid:
    caption: Message Trace UID
    type: string_t
    requirement: recommended
    group: primary
    description: The identifier that tracks a message that travels through multiple points of a messaging service.
    references:
    - description: For example Office 365 Message Trace Report.
      url: https://learn.microsoft.com/en-us/previous-versions/office/developer/o365-enterprise-developers/jj984335(v=office.15)
  observables: {caption: Observables, type: object_t, object: observable, array: true, requirement: recommended, group: primary, from: base_event}
  protocol_name:
    caption: Protocol Name
    type: string_t
    requirement: recommended
    group: primary
    description: The Protocol Name specifies the email communication protocol, such as SMTP, IMAP, or POP3.
  smtp_hello:
    caption: SMTP Hello
    type: string_t
    requirement: recommended
    group: primary
    deprecated:
      since: 1.4.0
      message: Use the `command` attribute instead.
    description: The value of the SMTP HELO or EHLO command sent by the initiator (client).
  src_endpoint:
    caption: Source Endpoint
    type: object_t
    object: network_endpoint
    requirement: recommended
    group: primary
    observable: 20
    description: The initiator (client) sending the email.
  status: {caption: Status, type: string_t, requirement: recommended, group: primary, from: base_event}
  status_code: {caption: Status Code, type: string_t, requirement: recommended, group: primary, from: base_event}
  status_detail: {caption: Status Detail, type: string_t, requirement: recommended, group: primary, from: base_event}
  status_id: {caption: Status ID, type: integer_t, requirement: recommended, group: primary, sibling: status, enum: {0: Unknown, 1: Success, 2: Failure, 99: Other}, from: base_event}
  timezone_offset: {caption: Timezone Offset, type: integer_t, requirement: recommended, group: occurrence, from: base_event}
  to:
    caption: To
    type: email_t
    array: true
    requirement: recommended
    group: primary
    observable: 5
    description: The recipient address from the transmission envelope. This may differ from the 'To' header and represents where the message was actually delivered.
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322
  action: {caption: Action, type: string_t, requirement: optional, group: primary, profile: security_control, from: base_event}
  activity_name: {caption: Activity, type: string_t, requirement: optional, group: classification, from: base_event}
  actor: {caption: Actor, type: object_t, object: actor, requirement: optional, group: primary, profile: host, from: base_event}
  api: {caption: API Details, type: object_t, object: api, requirement: optional, group: context, profile: cloud, from: base_event}
  attacks: {caption: MITRE ATT&CK® and ATLAS™ Details, type: object_t, object: attack, array: true, requirement: optional, group: primary, profile: security_control, from: base_event}
  attempt:
    caption: Attempt
    type: integer_t
    requirement: optional
    group: context
    description: The attempt number for attempting to deliver the email.
  authorizations: {caption: Authorization Information, type: object_t, object: authorization, array: true, requirement: optional, group: primary, profile: security_control, from: base_event}
  banner:
    caption: Protocol Banner
    type: string_t
    requirement: optional
    group: context
    description: The initial connection response that a messaging server receives after it connects to an email server.
  category_name:
    caption: Category
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event category name, as defined by category_uid value: `Network Activity`.'
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event class name, as defined by class_uid value: `Email Activity`.'
  confidence: {caption: Confidence, type: string_t, requirement: optional, group: context, profile: security_control, from: base_event}
  confidence_score: {caption: Confidence Score, type: integer_t, requirement: optional, group: context, profile: security_control, from: base_event}
  count: {caption: Count, type: integer_t, requirement: optional, group: occurrence, from: base_event}
  direction:
    caption: Direction
    type: string_t
    requirement: optional
    group: context
    description: The direction of the email, as defined by the `direction_id` value.
  disposition: {caption: Disposition, type: string_t, requirement: optional, group: primary, profile: security_control, from: base_event}

name: web_resources_activity
caption: Web Resources Activity
uid: 6001
category: application
category_uid: 6
extends: application
description: Web Resources Activity events describe actions executed on a set of Web Resources.
profiles: [cloud, container, data_classification, datetime, host, network_proxy, osint, security_control]
attributes:
  action:
    caption: Action
    requirement: optional

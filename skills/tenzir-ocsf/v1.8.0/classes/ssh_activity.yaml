  osint: {caption: OSINT, type: object_t, object: osint, array: true, requirement: required, group: primary, profile: osint, from: base_event}
  severity_id: {caption: Severity ID, type: integer_t, requirement: required, group: classification, sibling: severity, enum: {0: Unknown, 1: Informational, 2: Low, 3: Medium, 4: High, 5: Critical, 6: Fatal, 99: Other}, from: base_event}
  time: {caption: Event Time, type: timestamp_t, requirement: required, group: occurrence, from: base_event}
  type_uid:
    caption: Type ID
    type: long_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event/finding type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
  action_id: {caption: Action ID, type: integer_t, requirement: recommended, group: primary, profile: security_control, sibling: action, enum: {0: Unknown, 1: Allowed, 2: Denied, 3: Observed, 4: Modified, 99: Other}, from: base_event}
  auth_type:
    caption: Authentication Type
    type: string_t
    requirement: recommended
    group: primary
    description: The SSH authentication type, normalized to the caption of 'auth_type_id'. In the case of 'Other', it is defined by the event source.
  auth_type_id:
    caption: Authentication Type ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: auth_type
    description: The normalized identifier of the SSH authentication type.
    enum:
      0:
        caption: Unknown
        description: The authentication type is unknown.
      1:
        caption: Certificate Based
        description: Authentication using digital certificates.
      2:
        caption: GSSAPI
        description: GSSAPI for centralized authentication.
      3:
        caption: Host Based
        description: Authentication based on the client host's identity.
      4:
        caption: Keyboard Interactive
        description: Multi-step, interactive authentication.
      5:
        caption: Password
        description: Password Authentication.
      6:
        caption: Public Key
        description: Paired public key authentication.
      99:
        caption: Other
        description: The authentication type is not mapped. See the `auth_type` attribute, which contains a data source specific value.
  client_hassh:
    caption: Client HASSH
    type: object_t
    object: hassh
    requirement: recommended
    group: primary
    description: The Client HASSH fingerprinting object.
  confidence_id: {caption: Confidence ID, type: integer_t, requirement: recommended, group: context, profile: security_control, sibling: confidence, enum: {0: Unknown, 1: Low, 2: Medium, 3: High, 99: Other}, from: base_event}

# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: rdp_activity
caption: RDP Activity
uid: 4005
category: network
category_uid: 4
extends: network
description: Remote Desktop Protocol (RDP) Activity events report post-authentication remote client connections between clients and servers over the network.
profiles: [cloud, container, data_classification, datetime, host, load_balancer, network_proxy, osint, security_control]
constraints:
  at_least_one: [dst_endpoint, src_endpoint]
references:
- description: D3FEND™ Ontology d3f:RDPEvent
  url: https://d3fend.mitre.org/event/d3f:RDPEvent/
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event.
    enum:
      0:
        caption: Unknown
        description: The event activity is unknown.
      1:
        caption: Initial Request
        description: The initial RDP request.
      2:
        caption: Initial Response
        description: The initial RDP response.
      3:
        caption: Connect Request
        description: An RDP connection request.
      4:
        caption: Connect Response
        description: An RDP connection response.
      5:
        caption: TLS Handshake
        description: The TLS handshake.
      6:
        caption: Traffic
        description: Network traffic report.
      7:
        caption: Disconnect
        description: An RDP connection disconnect.
      8:
        caption: Reconnect
        description: An RDP connection reconnect.
      99:
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
    references:
    - description: 'Suricata Event Type: RDP'
      url: https://docs.suricata.io/en/latest/output/eve/eve-json-format.html#event-type-rdp
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event.
    enum:
      4:
        caption: Network Activity
        description: Network Activity events.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event.
    enum:
      4005:
        caption: RDP Activity
        description: Remote Desktop Protocol (RDP) Activity events report post-authentication remote client connections between clients and servers over the network.

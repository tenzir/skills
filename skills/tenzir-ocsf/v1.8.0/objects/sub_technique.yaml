name: sub_technique
caption: MITRE Sub-technique
extends: _entity
description: The MITRE Sub-technique object describes the ATT&CK® or ATLAS™ Sub-technique ID and/or name associated to an attack.
constraints:
  at_least_one: [name, uid]
references:
- description: ATT&CK® Matrix
  url: https://attack.mitre.org
- description: ATLAS™ Matrix
  url: https://atlas.mitre.org/matrices/ATLAS
referenced_by:
  objects:
    attack: [sub_technique]
attributes:
  name:
    caption: Name
    type: string_t
    requirement: recommended
    description: 'The name of the attack sub-technique. For example: `Scanning IP Blocks` or `User Execution: Unsafe ML Artifacts`.'
  src_url:
    caption: Source URL
    type: url_t
    requirement: optional
    observable: 6
    description: 'The versioned permalink of the attack sub-technique. For example: `https://attack.mitre.org/versions/v14/techniques/T1595/001/`.'
  uid:
    caption: Unique ID
    type: string_t
    requirement: recommended
    description: 'The unique identifier of the attack sub-technique. For example: `T1595.001` or `AML.T0011.000`.'

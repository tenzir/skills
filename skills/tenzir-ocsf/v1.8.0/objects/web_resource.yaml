    requirement: optional
    profile: datetime
    from: _resource
    description: The time when the resource was created.
  data:
    caption: Data
    type: json_t
    requirement: optional
    description: Details of the web resource, e.g, `file` details, `search` results or application-defined resource.
  data_classification:
    caption: Data Classification
    requirement: recommended
    profile: data_classification
    definition: v1.8.0/objects/_resource.yaml
  data_classifications:
    caption: Data Classification
    requirement: recommended
    profile: data_classification
    definition: v1.8.0/objects/_resource.yaml
  desc:
    caption: Description
    type: string_t
    requirement: optional
    description: Description of the web resource.
  labels:
    caption: Labels
    requirement: optional
    definition: v1.8.0/objects/_resource.yaml
  modified_time:
    caption: Modified Time
    requirement: optional
    definition: v1.8.0/objects/_resource.yaml
  modified_time_dt:
    caption: Modified Time
    type: datetime_t
    requirement: optional
    profile: datetime

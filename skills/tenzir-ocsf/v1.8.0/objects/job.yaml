name: job
caption: Job
extends: object
description: The Job object provides information about a scheduled job or task, including its name, command line, and state. It encompasses attributes that describe the properties and status of the scheduled job.
profiles: [data_classification, datetime]
references:
- description: D3FEND™ Ontology d3f:ScheduledJob.
  url: https://d3fend.mitre.org/dao/artifact/d3f:ScheduledJob/
referenced_by:
  classes:
    job_query: [job]
    scheduled_job_activity: [job]
  objects:
    evidences: [job]
    query_evidence: [job]
    startup_item: [job]
attributes:
  name:
    caption: Name
    type: string_t
    requirement: required
    description: The name of the job.
  cmd_line:
    caption: Command Line
    type: string_t
    requirement: recommended
    observable: 13
    description: The job command line.
  created_time:
    caption: Created Time
    type: timestamp_t
    requirement: recommended
    description: The time when the job was created.
  desc:
    caption: Description
    type: string_t
    requirement: recommended
    description: The description of the job.
  last_run_time:
    caption: Last Run
    type: timestamp_t
    requirement: recommended
    description: The time when the job was last run.
  run_state_id:
    caption: Run State ID
    type: integer_t
    requirement: recommended
    sibling: run_state
    description: The run state ID of the job.
    enum:
      0:
        caption: Unknown
        description: The run state is unknown.
      1:
        caption: Ready
      2:
        caption: Queued
      3:
        caption: Running
      4:
        caption: Stopped
      99:
        caption: Other
        description: The run state is not mapped. See the `run_state` attribute, which contains a data source specific value.
  created_time_dt:
    caption: Created Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the job was created.
  file:
    caption: File
    type: object_t
    object: file
    requirement: optional
    observable: 24
    description: The file that pertains to the job.
  last_run_time_dt:
    caption: Last Run
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the job was last run.
  next_run_time:
    caption: Next Run
    type: timestamp_t
    requirement: optional
    description: The time when the job will next be run.
  next_run_time_dt:
    caption: Next Run
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the job will next be run.
  run_state:
    caption: Run State
    type: string_t
    requirement: optional
    description: The run state of the job.
  user:
    caption: User
    type: object_t
    object: user
    requirement: optional
    observable: 21
    description: The user that created the job.

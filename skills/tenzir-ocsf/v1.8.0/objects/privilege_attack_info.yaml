name: privilege_attack_info
caption: Privilege Attack Info
extends: object
description: The Privilege Attack Info object groups privileges by the potential attack they could enable. It maps specific privileges to MITRE ATT&CK techniques, helping identify security risks associated with granted permissions.
referenced_by:
  objects:
    service_privilege_analysis: [privilege_attack_info_list]
attributes:
  attack:
    caption: MITRE ATT&CK® Details
    type: object_t
    object: attack
    requirement: required
    description: The MITRE ATT&CK technique that these privileges could enable.
  privilege_info_list:
    caption: Privilege Info List
    type: object_t
    object: privilege_info
    array: true
    requirement: required
    description: The list of privilege information objects, where each element describes a specific privilege that could enable the associated attack technique.

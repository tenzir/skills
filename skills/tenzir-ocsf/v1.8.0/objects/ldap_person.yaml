name: ldap_person
caption: LDAP Person
extends: object
description: The additional LDAP attributes that describe a person.
profiles: [datetime]
referenced_by:
  objects:
    user: [ldap_person]
attributes:
  cost_center:
    caption: Cost Center
    type: string_t
    requirement: optional
    description: The cost center associated with the user.
  created_time:
    caption: Created Time
    type: timestamp_t
    requirement: optional
    description: The timestamp when the user was created.
  created_time_dt:
    caption: Created Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The timestamp when the user was created.
  deleted_time:
    caption: Deleted Time
    type: timestamp_t
    requirement: optional
    description: The timestamp when the user was deleted. In Active Directory (AD), when a user is deleted they are moved to a temporary container and then removed after 30 days. So, this field can be populated even after a user is deleted for the next 30 days.
  deleted_time_dt:
    caption: Deleted Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The timestamp when the user was deleted. In Active Directory (AD), when a user is deleted they are moved to a temporary container and then removed after 30 days. So, this field can be populated even after a user is deleted for the next 30 days.
  department:
    caption: Department
    type: string_t
    requirement: optional
    description: The name of the department in which the user works.
  display_name:
    caption: Display Name
    type: string_t
    requirement: optional
    description: The display name of the LDAP person. According to RFC 2798, this is the preferred name of a person to be used when displaying entries.
    references:
    - description: RFC 2798
      url: https://www.rfc-editor.org/rfc/rfc2798.html#section-2.3
    - description: Microsoft AD Schema
      url: https://learn.microsoft.com/en-us/windows/win32/adschema/a-displayname
  email_addrs:
    caption: Email Addresses
    type: email_t
    array: true
    requirement: optional
    observable: 5
    description: A list of additional email addresses for the user.
  employee_uid:
    caption: Employee ID
    type: string_t
    requirement: optional
    description: The employee identifier assigned to the user by the organization.
  given_name:
    caption: Given Name
    type: string_t
    requirement: optional
    description: The given or first name of the user.
  hire_time:
    caption: Hire Time
    type: timestamp_t
    requirement: optional
    description: The timestamp when the user was or will be hired by the organization.
  hire_time_dt:
    caption: Hire Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The timestamp when the user was or will be hired by the organization.
  job_title:
    caption: Job Title
    type: string_t
    requirement: optional
    description: The user's job title.
  labels:
    caption: Labels
    type: string_t
    array: true
    requirement: optional
    description: 'The labels associated with the user. For example in AD this could be the `userType`, `employeeType`. For example: `Member, Employee`.'
  last_login_time:
    caption: Last Login
    type: timestamp_t
    requirement: optional
    description: The last time when the user logged in.
  last_login_time_dt:
    caption: Last Login
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The last time when the user logged in.
  ldap_cn:
    caption: LDAP Common Name
    type: string_t
    requirement: optional
    description: The LDAP and X.500 `commonName` attribute, typically the full name of the person. For example, `John Doe`.
  ldap_dn:
    caption: LDAP Distinguished Name
    type: string_t
    requirement: optional
    description: The X.500 Distinguished Name (DN) is a structured string that uniquely identifies an entry, such as a user, in an X.500 directory service For example, `cn=John Doe,ou=People,dc=example,dc=com`.
  leave_time:
    caption: Leave Time
    type: timestamp_t
    requirement: optional
    description: The timestamp when the user left or will be leaving the organization.
  leave_time_dt:
    caption: Leave Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The timestamp when the user left or will be leaving the organization.
  location:
    caption: Geo Location
    type: object_t
    object: location
    requirement: optional
    observable: 26
    description: The geographical location associated with a user. This is typically the user's usual work location.
  manager:
    caption: Manager
    type: object_t
    object: user
    requirement: optional
    observable: 21
    description: The user's manager. This helps in understanding an org hierarchy. This should only ever be populated once in an event. I.e. there should not be a manager's manager in an event.
  modified_time:
    caption: Modified Time
    type: timestamp_t
    requirement: optional
    description: The timestamp when the user entry was last modified.
  modified_time_dt:
    caption: Modified Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The timestamp when the user entry was last modified.
  office_location:
    caption: Office Location
    type: string_t
    requirement: optional
    description: The primary office location associated with the user. This could be any string and isn't a specific address. For example, `South East Virtual`.
  phone_number:
    caption: Telephone Number
    type: string_t
    requirement: optional
    description: The telephone number of the user. Corresponds to the LDAP `Telephone-Number` CN.
  surname:
    caption: Surname
    type: string_t
    requirement: optional
    description: The last or family name for the user.
  tags:
    caption: Tags
    type: object_t
    object: key_value_object
    array: true
    requirement: optional
    description: The list of tags; `{key:value}` pairs associated to the user.

# Attributes with a `definition` path are inherited unchanged. Read that file
# for their type, object, description, enum, and observable.
name: affected_package
caption: Affected Software Package
extends: package
description: The Affected Package object describes details about a software package identified as affected by a vulnerability/vulnerabilities.
profiles: [data_classification]
references:
- description: D3FEND™ Ontology d3f:SoftwarePackage.
  url: https://d3fend.mitre.org/dao/artifact/d3f:SoftwarePackage/
referenced_by:
  objects:
    vulnerability: [affected_packages]
attributes:
  architecture:
    caption: Architecture
    requirement: recommended
    definition: v1.8.0/objects/package.yaml
  cpe_name:
    caption: The product CPE identifier
    requirement: optional
    definition: v1.8.0/objects/package.yaml
  epoch:
    caption: Epoch
    requirement: optional
    definition: v1.8.0/objects/package.yaml
  fixed_in_version:
    caption: Fixed In Version
    type: string_t
    requirement: optional
    description: The software package version in which a reported vulnerability was patched/fixed.
  hash:
    caption: Hash
    requirement: optional
    definition: v1.8.0/objects/package.yaml
  license:
    caption: Software License
    requirement: optional
    definition: v1.8.0/objects/package.yaml
  license_url:
    caption: Software License URL
    requirement: optional
    definition: v1.8.0/objects/package.yaml
  name:
    caption: Name
    requirement: required
    definition: v1.8.0/objects/package.yaml
  package_manager:
    caption: Package Manager
    requirement: optional
    definition: v1.8.0/objects/package.yaml
  package_manager_url:
    caption: Package Manager URL
    requirement: optional
    definition: v1.8.0/objects/package.yaml
  path:
    caption: Path
    type: file_path_t
    requirement: optional
    observable: 45
    description: The installation path of the affected package.
  purl:
    caption: Package URL
    requirement: optional
    definition: v1.8.0/objects/package.yaml
  release:
    caption: Software Release Details
    requirement: optional
    definition: v1.8.0/objects/package.yaml
  remediation:
    caption: Remediation Guidance
    type: object_t
    object: remediation
    requirement: optional
    description: Describes the recommended remediation steps to address identified issue(s).
  src_url:
    caption: Source URL
    requirement: optional
    definition: v1.8.0/objects/package.yaml
  type:
    caption: Type
    requirement: optional
    definition: v1.8.0/objects/package.yaml
  type_id:
    caption: Type ID
    requirement: recommended
    definition: v1.8.0/objects/package.yaml
  uid:
    caption: Package UID
    requirement: optional
    definition: v1.8.0/objects/package.yaml
  vendor_name:
    caption: Vendor Name
    requirement: optional
    definition: v1.8.0/objects/package.yaml
  version:
    caption: Version
    requirement: required
    definition: v1.8.0/objects/package.yaml

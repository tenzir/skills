attributes:
  data:
    caption: Data
    type: json_t
    requirement: optional
    description: Additional data about the policy such as the underlying JSON policy itself or other details.
  desc:
    caption: Description
    type: string_t
    requirement: optional
    description: The description of the policy.
  group:
    caption: Group
    type: object_t
    object: group
    requirement: optional
    description: The policy group.
  is_applied:
    caption: Applied
    type: boolean_t
    requirement: recommended
    description: A determination if the content of a policy was applied to a target or request, or not.
  name:
    caption: Name
    type: string_t
    requirement: recommended
    description: 'The policy name. For example: `AdministratorAccess Policy`.'
  type:
    caption: Type
    type: string_t
    requirement: optional
    description: 'The policy type. For example: `Identity Policy, Resource Policy, Service Control Policy, etc.`.'
  uid:
    caption: Unique ID
    type: string_t
    requirement: recommended
    description: A unique identifier of the policy instance.
  version:
    caption: Version
    type: string_t
    requirement: recommended
    description: The policy version number.

name: related_event
caption: Related Event/Finding
extends: object
description: The Related Event object describes an event or another finding related to a finding. It may or may not be an OCSF event.
profiles: [data_classification, datetime]
referenced_by:
  objects:
    finding: [related_events]
    finding_info: [related_events]
attributes:
  uid:
    caption: Unique ID
    type: string_t
    requirement: required
    description: |-
      The unique identifier of the related event/finding.

      If the related event/finding is in OCSF, then this value must be equal to `metadata.uid` in the corresponding event.
  severity_id:
    caption: Severity ID
    type: integer_t
    requirement: recommended
    sibling: severity
    description: |-
      The normalized identifier of the event/finding severity.

      The normalized severity is a measurement the effort and expense required to manage and resolve an event or incident. Smaller numerical values represent lower impact events, and larger numerical values represent higher impact events.
    enum:
      0:
        caption: Unknown
        description: The event/finding severity is unknown.
      1:
        caption: Informational
        description: Informational message. No action required.
      2:
        caption: Low
        description: The user decides if action is needed.
      3:
        caption: Medium
        description: Action is required but the situation is not serious at this time.
      4:
        caption: High
        description: Action is required immediately.
      5:
        caption: Critical
        description: Action is required immediately and the scope is broad.
      6:
        caption: Fatal
        description: An error occurred but it is too late to take remedial action.
      99:
        caption: Other
        description: The event/finding severity is not mapped. See the `severity` attribute, which contains a data source specific value.
  type_uid:
    caption: Type ID
    type: long_t
    requirement: recommended
    sibling: type_name
    description: |-
      The unique identifier of the related OCSF event type.

      For example: `100701.`

      Populate if the related event/finding is in OCSF.
  attacks:
    caption: MITRE ATT&CK® and ATLAS™ Details
    type: object_t
    object: attack
    array: true
    requirement: optional
    description: An array of MITRE ATT&CK® objects describing identified tactics, techniques & sub-techniques. The objects are compatible with MITRE ATLAS™ tactics, techniques & sub-techniques.
    references:
    - description: MITRE ATT&CK®
      url: https://attack.mitre.org
    - description: MITRE ATLAS
      url: https://atlas.mitre.org/matrices/ATLAS
  count:
    caption: Count
    type: integer_t
    requirement: optional
    description: The number of times that activity in the same logical group occurred, as reported by the related Finding.
  created_time:
    caption: Created Time
    type: timestamp_t
    requirement: optional
    description: |-
      The time when the related event/finding was created.

      If the related event/finding is in OCSF and is a Finding, then this value should be equal to `finding_info.created_time` in the corresponding Finding. If the related event/finding is in OCSF and is not a Finding, then this value should be equal to `time` in the corresponding event.
  created_time_dt:
    caption: Created Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: |-
      The time when the related event/finding was created.

      If the related event/finding is in OCSF and is a Finding, then this value should be equal to `finding_info.created_time` in the corresponding Finding. If the related event/finding is in OCSF and is not a Finding, then this value should be equal to `time` in the corresponding event.
  desc:
    caption: Description
    type: string_t
    requirement: optional
    description: A description of the related event/finding.
  first_seen_time:
    caption: First Seen
    type: timestamp_t
    requirement: optional
    description: |-
      The time when the finding was first observed. e.g. The time when a vulnerability was first observed.
      It can differ from the `created_time` timestamp, which reflects the time this finding was created.
  first_seen_time_dt:
    caption: First Seen
    type: datetime_t
    requirement: optional
    profile: datetime
    description: |-
      The time when the finding was first observed. e.g. The time when a vulnerability was first observed.
      It can differ from the `created_time` timestamp, which reflects the time this finding was created.
  kill_chain:
    caption: Kill Chain
    type: object_t
    object: kill_chain_phase
    array: true
    requirement: optional
    description: The [Cyber Kill Chain®](https://www.lockheedmartin.com/en-us/capabilities/cyber/cyber-kill-chain.html) provides a detailed description of each phase and its associated activities within the broader context of a cyber attack.
  last_seen_time:
    caption: Last Seen
    type: timestamp_t
    requirement: optional
    description: |-
      The time when the finding was most recently observed. e.g. The time when a vulnerability was most recently observed.
      It can differ from the `modified_time` timestamp, which reflects the time this finding was last modified.
  last_seen_time_dt:
    caption: Last Seen
    type: datetime_t
    requirement: optional
    profile: datetime
    description: |-
      The time when the finding was most recently observed. e.g. The time when a vulnerability was most recently observed.
      It can differ from the `modified_time` timestamp, which reflects the time this finding was last modified.
  modified_time:
    caption: Modified Time
    type: timestamp_t
    requirement: optional
    description: The time when the related event/finding was last modified.
  modified_time_dt:
    caption: Modified Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the related event/finding was last modified.
  observables:
    caption: Observables
    type: object_t
    object: observable
    array: true
    requirement: optional
    description: The observables associated with the event or a finding.
    references:
    - description: OCSF Observables FAQ
      url: https://github.com/ocsf/ocsf-docs/blob/main/articles/defining-and-using-observables.md
  product:
    caption: Product
    type: object_t
    object: product
    requirement: optional
    description: Details about the product that reported the related event/finding.
  product_uid:
    caption: Product Identifier
    type: string_t
    requirement: optional
    deprecated:
      since: 1.4.0
      message: Use the `uid` attribute in the `product` object instead. See specific usage.
    description: The unique identifier of the product that reported the related event.
  severity:
    caption: Severity
    type: string_t
    requirement: optional
    description: The event/finding severity, normalized to the caption of the `severity_id` value. In the case of 'Other', it is defined by the source.
  status:
    caption: Status
    type: string_t
    requirement: optional
    description: The related event status. Should correspond to the label of the status_id (or 'Other' status value for status_id = 99) of the related event.
  tags:
    caption: Tags
    type: object_t
    object: key_value_object
    array: true
    requirement: optional
    description: The list of tags; `{key:value}` pairs associated with the related event/finding.
  title:
    caption: Title
    type: string_t
    requirement: optional
    description: A title or a brief phrase summarizing the related event/finding.
  traits:
    caption: Traits
    type: object_t
    object: trait
    array: true
    requirement: optional
    description: The list of key traits or characteristics extracted from the related event/finding that influenced or contributed to the overall finding's outcome.
  type:
    caption: Type
    type: string_t
    requirement: optional
    description: |-
      The type of the related event/finding.

      Populate if the related event/finding is `NOT` in OCSF. If it is in OCSF, then utilize `type_name, type_uid` instead.
  type_name:
    caption: Type Name
    type: string_t
    requirement: optional
    description: |-
      The type of the related OCSF event, as defined by `type_uid`.

      For example: `Process Activity: Launch.`

      Populate if the related event/finding is in OCSF.

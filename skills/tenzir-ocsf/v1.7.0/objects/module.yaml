name: module
caption: Module
extends: object
description: The Module object describes the attributes of a module.
profiles: [data_classification]
constraints:
  at_least_one: [load_type_id, function_name]
referenced_by:
  classes:
    module_activity: [module]
    module_query: [module]
    process_activity: [module]
  objects:
    query_evidence: [module]
attributes:
  base_address:
    caption: Base Address
    type: string_t
    requirement: recommended
    description: The memory address where the module was loaded.
  file:
    caption: File
    type: object_t
    object: file
    requirement: recommended
    observable: 24
    description: The module file object.
  function_name:
    caption: Function Name
    type: string_t
    requirement: recommended
    description: The invoked function in the module. For load and unload events, this is the entry-point function of the module. The system calls the entry-point function whenever a process or thread loads or unloads the module.
  load_type_id:
    caption: Load Type ID
    type: integer_t
    requirement: recommended
    sibling: load_type
    description: The normalized identifier for how the module was loaded in memory.
    enum:
      0:
        caption: Unknown
        description: The load type is unknown.
      1:
        caption: Standard
        description: A normal module loaded by the normal windows loading mechanism i.e. LoadLibrary.
      2:
        caption: Non Standard
        description: A module loaded in a way avoidant of normal windows procedures. i.e. Bootstrapped Loading/Manual Dll Loading.
      3:
        caption: ShellCode
        description: A raw module in process memory that is READWRITE_EXECUTE and had a thread started in its range.
      4:
        caption: Mapped
        description: A memory mapped file, typically created with CreatefileMapping/MapViewOfFile.
      5:
        caption: NonStandard Backed
        description: A module loaded in a non standard way. However, GetModuleFileName succeeds on this allocation.
      99:
        caption: Other
        description: The load type is not mapped. See the `load_type` attribute, which contains a data source specific value.
  start_address:
    caption: Start Address
    type: string_t
    requirement: recommended
    description: The start address of the execution.
  type:
    caption: Type
    type: string_t
    requirement: recommended
    description: The module type.
  function_invocation:
    caption: Function Invocation
    type: object_t
    object: function_invocation
    requirement: optional
    description: Details about the invocation of the function given in `function_name`.
  load_type:
    caption: Load Type
    type: string_t
    requirement: optional
    description: The load type, normalized to the caption of the load_type_id value. In the case of 'Other', it is defined by the event source.

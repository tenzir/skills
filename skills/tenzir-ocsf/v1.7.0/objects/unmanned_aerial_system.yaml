# Attributes with a `definition` path are inherited unchanged. Read that file
# for their type, object, description, enum, and observable.
name: unmanned_aerial_system
caption: Unmanned Aerial System
extends: aircraft
description: 'The Unmanned Aerial System object describes the characteristics, Position Location Information (PLI), and other metadata of Unmanned Aerial Systems (UAS) and other unmanned and drone systems used in Remote ID. Remote ID is defined in the Standard Specification for Remote ID and Tracking (ASTM Designation: F3411-22a) [ASTM F3411-22a](https://cdn.standards.iteh.ai/samples/112830/71297057ac42432880a203654f213709/ASTM-F3411-22a.pdf).'
constraints:
  at_least_one: [name, serial_number, uid, uid_alt]
referenced_by:
  classes:
    airborne_broadcast_activity: [unmanned_aerial_system]
    drone_flights_activity: [unmanned_aerial_system]
attributes:
  hw_info:
    caption: UAS Hardware Information
    type: object_t
    object: device_hw_info
    requirement: optional
    description: The endpoint hardware information.
  location:
    caption: UAS Position Location Information
    type: object_t
    object: location
    requirement: recommended
    observable: 26
    description: The detailed geographical location usually associated with an IP address.
  model:
    caption: Model
    requirement: optional
    definition: v1.7.0/objects/aircraft.yaml
  name:
    caption: Name
    type: string_t
    requirement: optional
    description: The name of the unmanned system as reported by tracking or sensing hardware.
  serial_number:
    caption: Serial Number
    type: string_t
    requirement: recommended
    observable: 37
    description: The serial number of the unmanned system. This is expressed in `CTA-2063-A` format.
  speed:
    caption: Speed
    requirement: optional
    definition: v1.7.0/objects/aircraft.yaml
  speed_accuracy:
    caption: Speed Accuracy
    requirement: optional
    definition: v1.7.0/objects/aircraft.yaml
  track_direction:
    caption: Track Direction
    requirement: optional
    definition: v1.7.0/objects/aircraft.yaml
  type:
    caption: Type
    type: string_t
    requirement: optional
    description: The type of the UAS. For example, Helicopter, Gyroplane, Rocket, etc.
  type_id:
    caption: Type ID
    type: integer_t
    requirement: recommended
    sibling: type
    description: The UAS type identifier.
    enum:
      '0':
        caption: Unknown/Undeclared
        description: The UAS type is empty or not declared.
      '1':
        caption: Airplane
      '2':
        caption: Helicopter
        description: Can also be a Multi-rotor Unmanned Aircraft (e.g., Quad-copter).
      '3':
        caption: Gyroplane
      '4':
        caption: Hybrid Lift
        description: Fixed wing aircraft that can take off vertically.
      '5':
        caption: Ornithopter
      '6':
        caption: Glider
      '7':
        caption: Kite
      '8':
        caption: Free Balloon
      '9':
        caption: Captive Balloon
      '10':
        caption: Airship
        description: E.g., a blimp.
      '11':
        caption: Free Fall/Parachute
        description: Parachutes, or objects without any power or propulsion mechanism.
      '12':
        caption: Rocket
      '13':
        caption: Tethered Powered Aircraft
      '14':
        caption: Ground Obstacle
      '99':
        caption: Other
        description: The type is not mapped. See the `type` attribute, which contains a data source specific value.
  uid:
    caption: UAS ID
    type: string_t
    requirement: recommended
    description: The primary identification identifier for an unmanned system. This can be a Serial Number (in `CTA-2063-A` format, the Registration ID (provided by the `CAA`, a UTM, or a unique Session ID.
  uid_alt:
    caption: UAS Alternate ID
    type: string_t
    requirement: recommended
    description: A secondary identification identifier for an unmanned system. This can be a Serial Number (in `CTA-2063-A` format, the Registration ID (provided by the `CAA`, a UTM, or a unique Session ID.
  uuid:
    caption: UTM UUID
    type: uuid_t
    requirement: recommended
    description: The Unmanned Aircraft System Traffic Management (UTM) provided universal unique ID (UUID) traceable to a non-obfuscated ID where this UTM UUID acts as a 'session id' to protect exposure of operationally sensitive information.
  vertical_speed:
    caption: Vertical Speed
    requirement: optional
    definition: v1.7.0/objects/aircraft.yaml

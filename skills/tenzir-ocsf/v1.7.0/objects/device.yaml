# Attributes with a `definition` path are inherited unchanged. Read that file
# for their type, object, description, enum, and observable.
name: device
caption: Device
extends: endpoint
observable: 20
description: The Device object represents an addressable computer system or host, which is typically connected to a computer network and participates in the transmission or processing of data within the computer network.
profiles: [container, datetime]
constraints:
  at_least_one: [ip, uid, name, hostname, instance_uid, interface_uid, interface_name]
references:
- description: D3FEND™ Ontology d3f:Host.
  url: https://d3fend.mitre.org/dao/artifact/d3f:Host/

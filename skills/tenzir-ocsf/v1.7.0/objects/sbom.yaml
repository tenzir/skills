name: sbom
caption: Software Bill of Materials
extends: object
description: The Software Bill of Materials object describes characteristics of a generated SBOM.
profiles: [data_classification, datetime]
referenced_by:
  classes:
    software_info: [sbom]
  objects:
    application: [sbom]
attributes:
  created_time:
    caption: Created Time
    type: timestamp_t
    requirement: recommended
    description: The time when the SBOM was created.
  created_time_dt:
    caption: Created Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the SBOM was created.
  package:
    caption: Software Package
    type: object_t
    object: package
    requirement: required
    description: The software package or library that is being discovered or inventoried by an SBOM.
    references:
    - description: D3FEND™ Ontology d3f:SoftwarePackage.
      url: https://d3fend.mitre.org/dao/artifact/d3f:SoftwarePackage/
  product:
    caption: Product
    type: object_t
    object: product
    requirement: recommended
    description: Details about the upstream product that generated the SBOM e.g. `cdxgen` or `Syft`.
  software_components:
    caption: Software Components
    type: object_t
    object: software_component
    array: true
    requirement: required
    description: The list of software components used in the software package.
  type:
    caption: Type
    type: string_t
    requirement: optional
    description: The type of SBOM, normalized to the caption of the `type_id` value. In the case of 'Other', it is defined by the source.
  type_id:
    caption: Type ID
    type: integer_t
    requirement: recommended
    sibling: type
    description: The type of SBOM.
    enum:
      '0':
        caption: Unknown
        description: The type is unknown.
      '1':
        caption: SPDX
        description: System Package Data Exchange (SPDX®) is an open standard capable of representing systems with software components in as SBOMs (Software Bill of Materials) and other AI, data and security references supporting a range of risk management use cases. The SPDX specification is a freely available international open standard (ISO/IEC 5692:2021).
      '2':
        caption: CycloneDX
        description: CycloneDX is an International Standard for Bill of Materials (ECMA-424).
      '3':
        caption: SWID
        description: The International Organization for Standardization (ISO) and the International Electrotechnical Commission (IEC) publishes, ISO/IEC 19770-2, a standard for software identification (SWID) tags that defines a structured metadata format for describing a software product. A SWID tag document is composed of a structured set of data elements that identify the software product
      '99':
        caption: Other
        description: The type is not mapped. See the `type` attribute, which contains a data source specific value.
    references:
    - description: SPDX
      url: https://spdx.dev/
    - description: ISO/IEC 5692:2021
      url: https://www.iso.org/standard/81870.html
    - description: CycloneDX
      url: https://cyclonedx.org/
    - description: ECMA-424
      url: https://ecma-international.org/publications-and-standards/standards/ecma-424/
    - description: SWID
      url: https://nvd.nist.gov/products/swid
    - description: ISO/IEC 19770-2:2015
      url: https://www.iso.org/standard/65666.html
  uid:
    caption: SBOM ID
    type: string_t
    requirement: optional
    description: A unique identifier for the SBOM or the SBOM generation by a source tool, such as the SPDX `metadata.component.bom-ref`.
  version:
    caption: Version
    type: string_t
    requirement: optional
    description: The specification (spec) version of the particular SBOM, e.g., `1.6`.

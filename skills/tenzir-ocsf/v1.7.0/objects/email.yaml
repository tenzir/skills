name: email
caption: Email
extends: object
observable: 22
description: The Email object describes the email metadata such as sender, recipients, and direction, and can include embedded URLs and files.
profiles: [data_classification]
constraints:
  at_least_one: [from, to]
references:
- description: D3FEND™ Ontology d3f:Email.
  url: https://d3fend.mitre.org/dao/artifact/d3f:Email/
referenced_by:
  classes:
    email_activity: [email]
  objects:
    evidences: [email]
    managed_entity: [email]
    osint: [email]
attributes:
  data_classification:
    caption: Data Classification
    type: object_t
    object: data_classification
    requirement: recommended
    group: context
    profile: data_classification
    deprecated:
      since: 1.4.0
      message: Use the attribute `data_classifications` instead
    description: The Data Classification object includes information about data classification levels and data category types.
  data_classifications:
    caption: Data Classification
    type: object_t
    object: data_classification
    array: true
    requirement: recommended
    group: context
    profile: data_classification
    description: A list of Data Classification objects, that include information about data classification levels and data category types, identified by a classifier.
  from:
    caption: From
    type: email_t
    requirement: recommended
    observable: 5
    description: The machine-readable email header From value, as defined by RFC 5322. For example `example.user@usersdomain.com`.
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322
  message_uid:
    caption: Message UID
    type: string_t
    requirement: recommended
    observable: 42
    description: The email header Message-ID value, as defined by RFC 5322.
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322
  reply_to:
    caption: Reply To
    type: email_t
    requirement: recommended
    observable: 5
    deprecated:
      since: 1.4.0
      message: Use the  `reply_to_list`  attribute instead.
    description: The machine-readable email header Reply-To value, as defined by RFC 5322. For example `example.user@usersdomain.com`
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322
  size:
    caption: Size
    type: long_t
    requirement: recommended
    description: The size in bytes of the email, including attachments.
  smtp_from:
    caption: SMTP From
    type: email_t
    requirement: recommended
    observable: 5
    deprecated:
      since: 1.4.0
      message: Use the  `from`  attribute instead.
    description: The value of the SMTP MAIL FROM command.
  smtp_to:
    caption: SMTP To
    type: email_t
    array: true
    requirement: recommended
    observable: 5
    deprecated:
      since: 1.4.0
      message: Use the  `to`  attribute instead.
    description: The value of the SMTP envelope RCPT TO command.
  subject:
    caption: Subject
    type: string_t
    requirement: recommended
    observable: 40
    description: The email header Subject value, as defined by RFC 5322.
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322
  to:
    caption: To
    type: email_t
    array: true
    requirement: recommended
    observable: 5
    description: The machine-readable email header To values, as defined by RFC 5322. For example `example.user@usersdomain.com`
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322
  uid:
    caption: Email Thread UID
    type: string_t
    requirement: recommended
    observable: 41
    description: The unique identifier of the email thread.
  cc:
    caption: Cc
    type: email_t
    array: true
    requirement: optional
    observable: 5
    description: The machine-readable email header Cc values, as defined by RFC 5322. For example `example.user@usersdomain.com`.
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322
  cc_mailboxes:
    caption: Cc Mailboxes
    type: string_t
    array: true
    requirement: optional
    description: The human-readable email header Cc Mailbox values. For example `'Example User <example.user@usersdomain.com>'`.
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322#section-3.4
  delivered_to:
    caption: Delivered To
    type: email_t
    requirement: optional
    observable: 5
    deprecated:
      since: 1.4.0
      message: Use the  `delivered_to_list`  attribute instead.
    description: The machine-readable Delivered-To email header field. For example `example.user@usersdomain.com`
  delivered_to_list:
    caption: Delivered To List
    type: email_t
    array: true
    requirement: optional
    observable: 5
    description: The machine-readable Delivered-To email header values. For example `example.user@usersdomain.com`
    references:
    - description: RFC 9228
      url: https://www.rfc-editor.org/rfc/rfc9228
  files:
    caption: Files
    type: object_t
    object: file
    array: true
    requirement: optional
    observable: 24
    description: The files embedded or attached to the email.
  from_list:
    caption: From List
    type: email_t
    array: true
    requirement: optional
    observable: 5
    description: The machine-readable email header From values. This array should contain the value in `from`. For example `example.user@usersdomain.com`.
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322#section-3.4
  from_mailbox:
    caption: From Mailbox
    type: string_t
    requirement: optional
    description: The human-readable email header From Mailbox value. For example `'Example User <example.user@usersdomain.com>'`.
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322#section-3.4
  from_mailboxes:
    caption: From Mailboxes
    type: email_t
    array: true
    requirement: optional
    observable: 5
    description: The human-readable email header From Mailbox values. This array should contain the value in `from_mailbox`. For example `'Example User <example.user@usersdomain.com>'`.
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322#section-3.4
  http_headers:
    caption: HTTP Headers
    type: object_t
    object: http_header
    array: true
    requirement: optional
    description: Additional HTTP headers of an HTTP request or response.
  is_read:
    caption: Read
    type: boolean_t
    requirement: optional
    description: The indication of whether the email has been read.
  raw_header:
    caption: Raw Header
    type: string_t
    requirement: optional
    description: The email authentication header.
  reply_to_list:
    caption: Reply To List
    type: email_t
    array: true
    requirement: optional
    observable: 5
    description: The machine-readable email header Reply-To values, as defined by RFC 5322. For example `example.user@usersdomain.com`
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322
  reply_to_mailboxes:
    caption: Reply To Mailboxes
    type: string_t
    array: true
    requirement: optional
    description: The human-readable email header Reply To Mailbox values. For example `'Example User <example.user@usersdomain.com>'`.
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322#section-3.4
  return_path:
    caption: Return Path
    type: email_t
    requirement: optional
    observable: 5
    description: The address found in the 'Return-Path' header, which indicates where bounce messages (non-delivery reports) should be sent. This address is often set by the sending system and may differ from the 'From' or 'Sender' addresses. For example, `mailer-daemon@senderserver.com`.
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322
    - description: RFC 5321 - Simple Mail Transfer Protocol
      url: https://datatracker.ietf.org/doc/html/rfc5321#section-4.4
  sender:
    caption: Sender
    type: email_t
    requirement: optional
    observable: 5
    description: The machine readable email address of the system or server that actually transmitted the email message, extracted from the email headers per RFC 5322. This differs from the `from` field, which shows the message author. The sender field is most commonly used when multiple addresses appear in the  `from_list`  field, or when the transmitting system is different from the message author (such as when sending on behalf of someone else).
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322
  sender_mailbox:
    caption: Sender Mailbox
    type: string_t
    requirement: optional
    description: The human readable email address of the system or server that actually transmitted the email message, extracted from the email headers per RFC 5322. This differs from the `from_mailbox` field, which shows the message author. The sender mailbox field is most commonly used when multiple addresses appear in the  `from_mailboxes`  field, or when the transmitting system is different from the message author (such as when sending on behalf of someone else).
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322
  to_mailboxes:
    caption: To Mailboxes
    type: string_t
    array: true
    requirement: optional
    description: The human-readable email header To Mailbox values. For example `'Example User <example.user@usersdomain.com>'`.
    references:
    - description: RFC 5322
      url: https://www.rfc-editor.org/rfc/rfc5322#section-3.4
  urls:
    caption: URLs
    type: object_t
    object: url
    array: true
    requirement: optional
    observable: 23
    description: The URLs embedded in the email.
  x_originating_ip:
    caption: X-Originating-IP
    type: ip_t
    array: true
    requirement: optional
    observable: 2
    description: The X-Originating-IP header identifying the emails originating IP address(es).

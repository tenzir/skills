    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event.
    enum:
      0:
        caption: Unknown
        description: The event activity is unknown.
      1:
        caption: Allocate Page
      2:
        caption: Modify Page
      3:
        caption: Delete Page
      4:
        caption: Buffer Overflow
      5:
        caption: Disable DEP
        description: Data Execution Permission
      6:
        caption: Enable DEP
        description: Data Execution Permission
      7:
        caption: Read
        description: 'Read (Example: `ReadProcessMemory`)'
      8:
        caption: Write
        description: 'Write (Example: `WriteProcessMemory`)'
      99:
        caption: Other
        description: The event activity is not mapped.

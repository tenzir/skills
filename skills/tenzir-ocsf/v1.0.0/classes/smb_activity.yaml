name: smb_activity
caption: SMB Activity
uid: 4006
category: network
category_uid: 4
extends: network_activity
description: Server Message Block (SMB) Protocol Activity events report client/server connections sharing resources within the network.
profiles: [cloud, container, datetime, host, security_control]
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event.
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: File Supersede
        description: The event pertains to file superseded activity (overwritten if it exists and created if not).
      '2':
        caption: File Open
        description: The event pertains to file open activity (the file is opened if it exists and fails to open if it doesn't).
      '3':
        caption: File Create
        description: The event pertains to file creation activity (a file is created if it does not exist and fails if it does).
      '4':
        caption: File Open If
        description: The event pertains to file open activity (the file is opened if it exists and is created if it doesn't).
      '5':
        caption: File Overwrite
        description: The event pertains to file overwrite activity (the file is opened in a truncated form if it exists and fails if it doesn't).
      '6':
        caption: File Overwrite If
        description: The event pertains to file overwrite activity (the file is opened in a truncated form if it exists and created otherwise)
      '99':
        caption: Other
        description: The event activity is not mapped.
  activity_name:
    caption: Activity
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event activity name, as defined by the activity_id.
  actor:
    caption: Actor
    type: object_t
    object: actor
    requirement: optional
    group: primary
    profile: host
    from: network_activity
    description: The actor object describes details about the user/role/process that was the source of the activity.
  api:
    caption: API Details
    type: object_t
    object: api
    requirement: optional
    group: context
    profile: cloud
    from: base_event
    description: Describes details about a typical API (Application Programming Interface) call.
  app_name:
    caption: Application Name
    type: string_t
    requirement: optional
    group: context
    from: network_activity
    description: The name of the application that is associated with the event or object.
  attacks:
    caption: Attacks
    type: object_t
    object: attack
    array: true
    requirement: recommended
    group: primary
    profile: security_control
    from: network_activity
    description: An array of attacks associated with an event.
  category_name:
    caption: Category
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event category name, as defined by category_uid value: `Network Activity`.'
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event.
    enum:
      '4':
        caption: Network Activity
        description: Network Activity events.
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event class name, as defined by class_uid value: `SMB Activity`.'
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A Class describes the attributes available in an event.
    enum:
      '4006':
        caption: SMB Activity
        description: Server Message Block (SMB) Protocol Activity events report client/server connections sharing resources within the network.
  client_dialects:
    caption: Client Dialects
    type: string_t
    array: true
    requirement: recommended
    group: context
    description: The list of SMB dialects that the client speaks.
  cloud:
    caption: Cloud
    type: object_t
    object: cloud
    requirement: required
    group: primary
    profile: cloud
    from: base_event
    description: Describes details about the Cloud environment where the event was originally created or logged.
  command:
    caption: Command
    type: string_t
    requirement: recommended
    group: primary
    description: The command name (e.g. SMB2_COMMAND_CREATE, SMB1_COMMAND_WRITE_ANDX).
  connection_info:
    caption: Connection Info
    type: object_t
    object: network_connection_info
    requirement: recommended
    group: primary
    from: network_activity
    description: The network connection information.
  count:
    caption: Count
    type: integer_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The number of times that events in the same logical group occurred during the event Start Time to End Time period.
  dce_rpc:
    caption: Distributed Computing Environment/Remote Procedure Call (DCE/RPC)
    type: object_t
    object: dce_rpc
    requirement: optional
    group: context
    description: The DCE/RPC object describes the remote procedure call system for distributed computing environments.
  device:
    caption: Device
    type: object_t
    object: device
    requirement: recommended
    group: primary
    profile: host
    from: network_activity
    observable: 20
    description: An addressable device, computer system or host.
  dialect:
    caption: Dialect
    type: string_t
    requirement: recommended
    group: context
    description: The negotiated protocol dialect.
  disposition:
    caption: Disposition
    type: string_t
    requirement: optional
    group: primary
    profile: security_control
    from: network_activity
    description: The event disposition name, normalized to the caption of the disposition_id value. In the case of 'Other', it is defined by the event source.
  disposition_id:
    caption: Disposition ID
    type: integer_t
    requirement: required
    group: primary
    profile: security_control
    from: network_activity
    sibling: disposition
    description: When security issues, such as malware or policy violations, are detected and possibly corrected, then `disposition_id` describes the action taken by the security product.
    enum:
      '0':
        caption: Unknown
      '1':
        caption: Allowed
      '2':
        caption: Blocked
      '3':
        caption: Quarantined
      '4':
        caption: Isolated
      '5':
        caption: Deleted
      '6':
        caption: Dropped
      '7':
        caption: Custom Action
        description: Executed custom action such as run a command script.
      '8':
        caption: Approved
      '9':
        caption: Restored
      '10':
        caption: Exonerated
        description: No longer suspicious (re-scored).
      '11':
        caption: Corrected
      '12':
        caption: Partially Corrected
      '13':
        caption: Uncorrected
      '14':
        caption: Delayed
        description: Requires reboot to finish the operation.
      '15':
        caption: Detected
      '16':
        caption: No Action
      '17':
        caption: Logged
      '18':
        caption: Tagged
        description: Marked with extended attributes.
      '99':
        caption: Other
  dst_endpoint:
    caption: Destination Endpoint
    type: object_t
    object: network_endpoint
    requirement: required
    group: primary
    from: network_activity
    observable: 20
    description: The responder (server) in a network connection.
  duration:
    caption: Duration
    type: integer_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The event duration or aggregate time, the amount of time the event covers from `start_time` to `end_time` in milliseconds.
  end_time:
    caption: End Time
    type: timestamp_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The end time of a time period, or the time of the most recent event included in the aggregate event.
  end_time_dt:
    caption: End Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: base_event
    description: The end time of a time period, or the time of the most recent event included in the aggregate event.
  enrichments:
    caption: Enrichments
    type: object_t
    object: enrichment
    array: true
    requirement: optional
    group: context
    from: base_event
    description: 'The additional information from an external data source, which is associated with the event. For example add location information for the IP address in the DNS answers:`[{"name": "answers.ip", "value": "92.24.47.250", "type": "location", "data": {"city": "Socotra", "continent": "Asia", "coordinates": [-25.4153, 17.0743], "country": "YE", "desc": "Yemen"}}]`'
  file:
    caption: File
    type: object_t
    object: file
    requirement: recommended
    group: primary
    observable: 24
    description: The file that is the target of the SMB activity.
  malware:
    caption: Malware
    type: object_t
    object: malware
    array: true
    requirement: optional
    group: primary
    profile: security_control
    from: network_activity
    description: The list of malware identified by a finding.
  message:
    caption: Message
    type: string_t
    requirement: recommended
    group: primary
    from: base_event
    description: The description of the event, as defined by the event source.
  metadata:
    caption: Metadata
    type: object_t
    object: metadata
    requirement: required
    group: context
    from: base_event
    description: The metadata associated with the event.
  observables:
    caption: Observables
    type: object_t
    object: observable
    array: true
    requirement: optional
    group: primary
    from: base_event
    description: The observables associated with the event.
  open_type:
    caption: Open Type
    type: string_t
    requirement: recommended
    group: primary
    description: Indicates how the file was opened (e.g. normal, delete on close).
  proxy:
    caption: Proxy
    type: object_t
    object: network_proxy
    requirement: optional
    group: primary
    from: network_activity
    observable: 20
    description: If a proxy connection is present, the connection from the client to the proxy server.
  raw_data:
    caption: Raw Data
    type: string_t
    requirement: optional
    group: context
    from: base_event
    description: The event data as received from the event source.
  response:
    caption: API Response Details
    type: object_t
    object: response
    requirement: recommended
    group: primary
    description: The server response in an SMB network connection.
  severity:
    caption: Severity
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event severity, normalized to the caption of the severity_id value. In the case of 'Other', it is defined by the event source.
  severity_id:
    caption: Severity ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: severity
    description: |-
      The normalized identifier of the event severity.

      The normalized severity is a measurement the effort and expense required to manage and resolve an event or incident. Smaller numerical values represent lower impact events, and larger numerical values represent higher impact events.
    enum:
      '0':
        caption: Unknown
        description: The event severity is not known.
      '1':
        caption: Informational
        description: Informational message. No action required.
      '2':
        caption: Low
        description: The user decides if action is needed.
      '3':
        caption: Medium
        description: Action is required but the situation is not serious at this time.
      '4':
        caption: High
        description: Action is required immediately.
      '5':
        caption: Critical
        description: Action is required immediately and the scope is broad.
      '6':
        caption: Fatal
        description: An error occurred but it is too late to take remedial action.
      '99':
        caption: Other
        description: The event severity is not mapped. See the `severity` attribute, which contains a data source specific value.
  share:
    caption: Share
    type: string_t
    requirement: optional
    group: primary
    description: The SMB share name.
  share_type:
    caption: Share Type
    type: string_t
    requirement: optional
    group: primary
    description: The SMB share type, normalized to the caption of the share_type_id value. In the case of 'Other', it is defined by the event source.
  share_type_id:
    caption: Share Type Id
    type: integer_t
    requirement: recommended
    group: primary
    sibling: share_type
    description: The normalized identifier of the SMB share type.
    enum:
      '0':
        caption: Unknown
        description: The share type is not known.
      '1':
        caption: File
      '2':
        caption: Pipe
      '3':
        caption: Print
      '99':
        caption: Other
        description: The share type is not mapped.
  src_endpoint:
    caption: Source Endpoint
    type: object_t
    object: network_endpoint
    requirement: required
    group: primary
    from: network_activity
    observable: 20
    description: The initiator (client) of the network connection.
  start_time:
    caption: Start Time
    type: timestamp_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The start time of a time period, or the time of the least recent event included in the aggregate event.
  start_time_dt:
    caption: Start Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: base_event
    description: The start time of a time period, or the time of the least recent event included in the aggregate event.
  status:
    caption: Status
    type: string_t
    requirement: optional
    group: primary
    from: base_event
    description: The event status, normalized to the caption of the status_id value. In the case of 'Other', it is defined by the event source.
  status_code:
    caption: Status Code
    type: string_t
    requirement: optional
    group: primary
    from: base_event
    description: |-
      The event status code, as reported by the event source.

      For example, in a Windows Failed Authentication event, this would be the value of 'Failure Code', e.g. 0x18.
  status_detail:
    caption: Status Details
    type: string_t
    requirement: optional
    group: primary
    from: base_event
    description: The status details contains additional information about the event outcome.
  status_id:
    caption: Status ID
    type: integer_t
    requirement: recommended
    group: primary
    from: base_event
    sibling: status
    description: The normalized identifier of the event status.
    enum:
      '0':
        caption: Unknown
      '1':
        caption: Success
      '2':
        caption: Failure
      '99':
        caption: Other
        description: The event status is not mapped. See the `status` attribute, which contains a data source specific value.
  time:
    caption: Event Time
    type: timestamp_t
    requirement: required
    group: occurrence
    from: base_event
    description: The normalized event occurrence time.
  time_dt:
    caption: Event Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: base_event
    description: The normalized event occurrence time.
  timezone_offset:
    caption: Timezone Offset
    type: integer_t
    requirement: recommended
    group: occurrence
    from: base_event
    description: The number of minutes that the reported event `time` is ahead or behind UTC, in the range -1,080 to +1,080.
  tls:
    caption: TLS
    type: object_t
    object: tls
    requirement: optional
    group: primary
    from: network_activity
    description: The Transport Layer Security (TLS) attributes.
  traffic:
    caption: Traffic
    type: object_t
    object: network_traffic
    requirement: optional
    group: primary
    from: network_activity
    description: The network traffic refers to the amount of data moving across a network at a given point of time. Intended to be used alongside Network Connection.
  tree_uid:
    caption: Tree UID
    type: string_t
    requirement: optional
    group: primary
    description: The tree id is a unique SMB identifier which represents an open connection to a share.
  type_name:
    caption: Type Name
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event type name, as defined by the type_uid.
  type_uid:
    caption: Type ID
    type: integer_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
    enum:
      '400600':
        caption: 'SMB Activity: Unknown'
      '400601':
        caption: 'SMB Activity: File Supersede'
        description: The event pertains to file superseded activity (overwritten if it exists and created if not).
      '400602':
        caption: 'SMB Activity: File Open'
        description: The event pertains to file open activity (the file is opened if it exists and fails to open if it doesn't).
      '400603':
        caption: 'SMB Activity: File Create'
        description: The event pertains to file creation activity (a file is created if it does not exist and fails if it does).
      '400604':
        caption: 'SMB Activity: File Open If'
        description: The event pertains to file open activity (the file is opened if it exists and is created if it doesn't).
      '400605':
        caption: 'SMB Activity: File Overwrite'
        description: The event pertains to file overwrite activity (the file is opened in a truncated form if it exists and fails if it doesn't).
      '400606':
        caption: 'SMB Activity: File Overwrite If'
        description: The event pertains to file overwrite activity (the file is opened in a truncated form if it exists and created otherwise)
      '400699':
        caption: 'SMB Activity: Other'
  unmapped:
    caption: Unmapped Data
    type: object_t
    object: object
    requirement: optional
    group: context
    from: base_event
    description: The attributes that are not mapped to the event schema. The names and values of those attributes are specific to the event source.

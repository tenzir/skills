# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: smb_activity
caption: SMB Activity
uid: 4006
category: network
category_uid: 4
extends: network_activity
description: Server Message Block (SMB) Protocol Activity events report client/server connections sharing resources within the network.
profiles: [cloud, container, datetime, host, security_control]
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event.
    enum:
      0:
        caption: Unknown
        description: The event activity is unknown.
      1:
        caption: File Supersede
        description: The event pertains to file superseded activity (overwritten if it exists and created if not).
      2:
        caption: File Open
        description: The event pertains to file open activity (the file is opened if it exists and fails to open if it doesn't).
      3:
        caption: File Create
        description: The event pertains to file creation activity (a file is created if it does not exist and fails if it does).
      4:
        caption: File Open If
        description: The event pertains to file open activity (the file is opened if it exists and is created if it doesn't).
      5:
        caption: File Overwrite
        description: The event pertains to file overwrite activity (the file is opened in a truncated form if it exists and fails if it doesn't).
      6:
        caption: File Overwrite If
        description: The event pertains to file overwrite activity (the file is opened in a truncated form if it exists and created otherwise)
      99:
        caption: Other
        description: The event activity is not mapped.
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event.
    enum:
      4:
        caption: Network Activity
        description: Network Activity events.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A Class describes the attributes available in an event.
    enum:
      4006:
        caption: SMB Activity
        description: Server Message Block (SMB) Protocol Activity events report client/server connections sharing resources within the network.
  cloud: {caption: Cloud, type: object_t, object: cloud, requirement: required, group: primary, profile: cloud, from: base_event}
  disposition_id:
    caption: Disposition ID
    type: integer_t
    requirement: required
    group: primary
    profile: security_control
    sibling: disposition
    enum:
      0: Unknown
      1: Allowed
      2: Blocked
      3: Quarantined
      4: Isolated
      5: Deleted
      6: Dropped
      7: Custom Action
      8: Approved
      9: Restored
      10: Exonerated
      11: Corrected
      12: Partially Corrected
      13: Uncorrected
      14: Delayed
      15: Detected
      16: No Action
      17: Logged
      18: Tagged
      99: Other
    from: network_activity
  dst_endpoint: {caption: Destination Endpoint, type: object_t, object: network_endpoint, requirement: required, group: primary, observable: 20, from: network_activity}
  metadata: {caption: Metadata, type: object_t, object: metadata, requirement: required, group: context, from: base_event}
  severity_id: {caption: Severity ID, type: integer_t, requirement: required, group: classification, sibling: severity, enum: {0: Unknown, 1: Informational, 2: Low, 3: Medium, 4: High, 5: Critical, 6: Fatal, 99: Other}, from: base_event}
  src_endpoint: {caption: Source Endpoint, type: object_t, object: network_endpoint, requirement: required, group: primary, observable: 20, from: network_activity}
  time: {caption: Event Time, type: timestamp_t, requirement: required, group: occurrence, from: base_event}
  type_uid:
    caption: Type ID
    type: integer_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
  attacks: {caption: Attacks, type: object_t, object: attack, array: true, requirement: recommended, group: primary, profile: security_control, from: network_activity}
  client_dialects:
    caption: Client Dialects
    type: string_t
    array: true
    requirement: recommended
    group: context
    description: The list of SMB dialects that the client speaks.
  command:
    caption: Command
    type: string_t
    requirement: recommended
    group: primary
    description: The command name (e.g. SMB2_COMMAND_CREATE, SMB1_COMMAND_WRITE_ANDX).
  connection_info: {caption: Connection Info, type: object_t, object: network_connection_info, requirement: recommended, group: primary, from: network_activity}
  device: {caption: Device, type: object_t, object: device, requirement: recommended, group: primary, profile: host, observable: 20, from: network_activity}
  dialect:
    caption: Dialect
    type: string_t
    requirement: recommended
    group: context
    description: The negotiated protocol dialect.
  file:
    caption: File
    type: object_t
    object: file
    requirement: recommended
    group: primary
    observable: 24
    description: The file that is the target of the SMB activity.
  message: {caption: Message, type: string_t, requirement: recommended, group: primary, from: base_event}
  open_type:
    caption: Open Type
    type: string_t
    requirement: recommended
    group: primary
    description: Indicates how the file was opened (e.g. normal, delete on close).
  response:
    caption: API Response Details
    type: object_t
    object: response
    requirement: recommended
    group: primary
    description: The server response in an SMB network connection.
  share_type_id:
    caption: Share Type Id
    type: integer_t
    requirement: recommended
    group: primary
    sibling: share_type
    description: The normalized identifier of the SMB share type.
    enum:
      0:
        caption: Unknown
        description: The share type is not known.
      1:
        caption: File
      2:
        caption: Pipe
      3:
        caption: Print
      99:
        caption: Other
        description: The share type is not mapped.
  status_id: {caption: Status ID, type: integer_t, requirement: recommended, group: primary, sibling: status, enum: {0: Unknown, 1: Success, 2: Failure, 99: Other}, from: base_event}
  timezone_offset: {caption: Timezone Offset, type: integer_t, requirement: recommended, group: occurrence, from: base_event}
  activity_name: {caption: Activity, type: string_t, requirement: optional, group: classification, from: base_event}
  actor: {caption: Actor, type: object_t, object: actor, requirement: optional, group: primary, profile: host, from: network_activity}
  api: {caption: API Details, type: object_t, object: api, requirement: optional, group: context, profile: cloud, from: base_event}
  app_name: {caption: Application Name, type: string_t, requirement: optional, group: context, from: network_activity}
  category_name:
    caption: Category
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event category name, as defined by category_uid value: `Network Activity`.'
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event class name, as defined by class_uid value: `SMB Activity`.'
  count: {caption: Count, type: integer_t, requirement: optional, group: occurrence, from: base_event}
  dce_rpc:
    caption: Distributed Computing Environment/Remote Procedure Call (DCE/RPC)
    type: object_t
    object: dce_rpc
    requirement: optional
    group: context
    description: The DCE/RPC object describes the remote procedure call system for distributed computing environments.
  disposition: {caption: Disposition, type: string_t, requirement: optional, group: primary, profile: security_control, from: network_activity}
  duration: {caption: Duration, type: integer_t, requirement: optional, group: occurrence, from: base_event}
  end_time: {caption: End Time, type: timestamp_t, requirement: optional, group: occurrence, from: base_event}
  end_time_dt: {caption: End Time, type: datetime_t, requirement: optional, group: occurrence, profile: datetime, from: base_event}
  enrichments: {caption: Enrichments, type: object_t, object: enrichment, array: true, requirement: optional, group: context, from: base_event}
  malware: {caption: Malware, type: object_t, object: malware, array: true, requirement: optional, group: primary, profile: security_control, from: network_activity}
  observables: {caption: Observables, type: object_t, object: observable, array: true, requirement: optional, group: primary, from: base_event}
  proxy: {caption: Proxy, type: object_t, object: network_proxy, requirement: optional, group: primary, observable: 20, from: network_activity}
  raw_data: {caption: Raw Data, type: string_t, requirement: optional, group: context, from: base_event}
  severity: {caption: Severity, type: string_t, requirement: optional, group: classification, from: base_event}
  share:
    caption: Share
    type: string_t
    requirement: optional
    group: primary
    description: The SMB share name.
  share_type:
    caption: Share Type
    type: string_t
    requirement: optional
    group: primary
    description: The SMB share type, normalized to the caption of the share_type_id value. In the case of 'Other', it is defined by the event source.
  start_time: {caption: Start Time, type: timestamp_t, requirement: optional, group: occurrence, from: base_event}
  start_time_dt: {caption: Start Time, type: datetime_t, requirement: optional, group: occurrence, profile: datetime, from: base_event}
  status: {caption: Status, type: string_t, requirement: optional, group: primary, from: base_event}
  status_code: {caption: Status Code, type: string_t, requirement: optional, group: primary, from: base_event}
  status_detail: {caption: Status Details, type: string_t, requirement: optional, group: primary, from: base_event}
  time_dt: {caption: Event Time, type: datetime_t, requirement: optional, group: occurrence, profile: datetime, from: base_event}
  tls: {caption: TLS, type: object_t, object: tls, requirement: optional, group: primary, from: network_activity}
  traffic: {caption: Traffic, type: object_t, object: network_traffic, requirement: optional, group: primary, from: network_activity}
  tree_uid:
    caption: Tree UID
    type: string_t
    requirement: optional
    group: primary
    description: The tree id is a unique SMB identifier which represents an open connection to a share.
  type_name: {caption: Type Name, type: string_t, requirement: optional, group: classification, from: base_event}
  unmapped: {caption: Unmapped Data, type: object_t, object: object, requirement: optional, group: context, from: base_event}

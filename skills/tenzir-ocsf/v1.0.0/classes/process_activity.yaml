name: process_activity
caption: Process Activity
uid: 1007
category: system
category_uid: 1
extends: system
description: Process Activity events report when a process launches, injects, opens or terminates another process, successful or otherwise.
profiles: [cloud, container, datetime, host, security_control]
associations:
  device: [actor.user]
  actor.user: [device]
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event.
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Launch
      '2':
        caption: Terminate
      '3':
        caption: Open
      '4':
        caption: Inject
      '5':
        caption: Set User ID
      '99':
        caption: Other
        description: The event activity is not mapped.
  activity_name:
    caption: Activity
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event activity name, as defined by the activity_id.
  actor:
    caption: Actor
    type: object_t
    object: actor
    requirement: required
    group: primary
    description: The actor that performed the activity on the target `process`. For example, the process that started a new process or injected code into another process.
  actual_permissions:
    caption: Actual Permissions
    type: integer_t
    requirement: optional
    group: primary
    description: The permissions that were granted to the in a platform-native format.
  api:
    caption: API Details
    type: object_t
    object: api
    requirement: optional
    group: context
    profile: cloud
    from: base_event
    description: Describes details about a typical API (Application Programming Interface) call.
  attacks:
    caption: Attacks
    type: object_t
    object: attack
    array: true
    requirement: recommended
    group: primary
    profile: security_control
    from: system
    description: An array of attacks associated with an event.
  category_name:
    caption: Category
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event category name, as defined by category_uid value: `System Activity`.'
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event.
    enum:
      '1':
        caption: System Activity
        description: System Activity events.
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event class name, as defined by class_uid value: `Process Activity`.'
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A Class describes the attributes available in an event.
    enum:
      '1007':
        caption: Process Activity
        description: Process Activity events report when a process launches, injects, opens or terminates another process, successful or otherwise.
  cloud:
    caption: Cloud
    type: object_t
    object: cloud
    requirement: required
    group: primary
    profile: cloud
    from: base_event
    description: Describes details about the Cloud environment where the event was originally created or logged.
  count:
    caption: Count
    type: integer_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The number of times that events in the same logical group occurred during the event Start Time to End Time period.
  device:
    caption: Device
    type: object_t
    object: device
    requirement: required
    group: primary
    from: system
    observable: 20
    description: An addressable device, computer system or host.
  disposition:
    caption: Disposition
    type: string_t
    requirement: optional
    group: primary
    profile: security_control
    from: system
    description: The event disposition name, normalized to the caption of the disposition_id value. In the case of 'Other', it is defined by the event source.
  disposition_id:
    caption: Disposition ID
    type: integer_t
    requirement: required
    group: primary
    profile: security_control
    from: system
    sibling: disposition
    description: When security issues, such as malware or policy violations, are detected and possibly corrected, then `disposition_id` describes the action taken by the security product.
    enum:
      '0':
        caption: Unknown
      '1':
        caption: Allowed
      '2':
        caption: Blocked
      '3':
        caption: Quarantined
      '4':
        caption: Isolated
      '5':
        caption: Deleted
      '6':
        caption: Dropped
      '7':
        caption: Custom Action
        description: Executed custom action such as run a command script.
      '8':
        caption: Approved
      '9':
        caption: Restored
      '10':
        caption: Exonerated
        description: No longer suspicious (re-scored).
      '11':
        caption: Corrected
      '12':
        caption: Partially Corrected
      '13':
        caption: Uncorrected
      '14':
        caption: Delayed
        description: Requires reboot to finish the operation.
      '15':
        caption: Detected
      '16':
        caption: No Action
      '17':
        caption: Logged
      '18':
        caption: Tagged
        description: Marked with extended attributes.
      '99':
        caption: Other
  duration:
    caption: Duration
    type: integer_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The event duration or aggregate time, the amount of time the event covers from `start_time` to `end_time` in milliseconds.
  end_time:
    caption: End Time
    type: timestamp_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The end time of a time period, or the time of the most recent event included in the aggregate event.
  end_time_dt:
    caption: End Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: base_event
    description: The end time of a time period, or the time of the most recent event included in the aggregate event.
  enrichments:
    caption: Enrichments
    type: object_t
    object: enrichment
    array: true
    requirement: optional
    group: context
    from: base_event
    description: 'The additional information from an external data source, which is associated with the event. For example add location information for the IP address in the DNS answers:`[{"name": "answers.ip", "value": "92.24.47.250", "type": "location", "data": {"city": "Socotra", "continent": "Asia", "coordinates": [-25.4153, 17.0743], "country": "YE", "desc": "Yemen"}}]`'
  exit_code:
    caption: Exit Code
    type: integer_t
    requirement: optional
    group: primary
    description: The exit code reported by a process when it terminates. The convention is that zero indicates success and any non-zero exit code indicates that some error occurred.
  injection_type:
    caption: Injection Type
    type: string_t
    requirement: optional
    group: primary
    description: The process injection method, normalized to the caption of the injection_type_id value. In the case of 'Other', it is defined by the event source.
  injection_type_id:
    caption: Injection Type ID
    type: integer_t
    requirement: optional
    group: primary
    sibling: injection_type
    description: The normalized identifier of the process injection method.
    enum:
      '0':
        caption: Unknown
      '1':
        caption: Remote Thread
      '2':
        caption: Load Library
      '99':
        caption: Other
  malware:
    caption: Malware
    type: object_t
    object: malware
    array: true
    requirement: optional
    group: primary
    profile: security_control
    from: system
    description: The list of malware identified by a finding.
  message:
    caption: Message
    type: string_t
    requirement: recommended
    group: primary
    from: base_event
    description: The description of the event, as defined by the event source.
  metadata:
    caption: Metadata
    type: object_t
    object: metadata
    requirement: required
    group: context
    from: base_event
    description: The metadata associated with the event.
  module:
    caption: Module
    type: object_t
    object: module
    requirement: optional
    group: primary
    description: The module that was injected by the actor process.
  observables:
    caption: Observables
    type: object_t
    object: observable
    array: true
    requirement: optional
    group: primary
    from: base_event
    description: The observables associated with the event.
  process:
    caption: Process
    type: object_t
    object: process
    requirement: required
    group: primary
    observable: 25
    description: The process that was launched, injected into, opened, or terminated.
  raw_data:
    caption: Raw Data
    type: string_t
    requirement: optional
    group: context
    from: base_event
    description: The event data as received from the event source.
  requested_permissions:
    caption: Requested Permissions
    type: integer_t
    requirement: optional
    group: primary
    description: The permissions mask that were requested by the process.
  severity:
    caption: Severity
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event severity, normalized to the caption of the severity_id value. In the case of 'Other', it is defined by the event source.
  severity_id:
    caption: Severity ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: severity
    description: |-
      The normalized identifier of the event severity.

      The normalized severity is a measurement the effort and expense required to manage and resolve an event or incident. Smaller numerical values represent lower impact events, and larger numerical values represent higher impact events.
    enum:
      '0':
        caption: Unknown
        description: The event severity is not known.
      '1':
        caption: Informational
        description: Informational message. No action required.
      '2':
        caption: Low
        description: The user decides if action is needed.
      '3':
        caption: Medium
        description: Action is required but the situation is not serious at this time.
      '4':
        caption: High
        description: Action is required immediately.
      '5':
        caption: Critical
        description: Action is required immediately and the scope is broad.
      '6':
        caption: Fatal
        description: An error occurred but it is too late to take remedial action.
      '99':
        caption: Other
        description: The event severity is not mapped. See the `severity` attribute, which contains a data source specific value.
  start_time:
    caption: Start Time
    type: timestamp_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The start time of a time period, or the time of the least recent event included in the aggregate event.
  start_time_dt:
    caption: Start Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: base_event
    description: The start time of a time period, or the time of the least recent event included in the aggregate event.
  status:
    caption: Status
    type: string_t
    requirement: optional
    group: primary
    from: base_event
    description: The event status, normalized to the caption of the status_id value. In the case of 'Other', it is defined by the event source.
  status_code:
    caption: Status Code
    type: string_t
    requirement: optional
    group: primary
    from: base_event
    description: |-
      The event status code, as reported by the event source.

      For example, in a Windows Failed Authentication event, this would be the value of 'Failure Code', e.g. 0x18.
  status_detail:
    caption: Status Details
    type: string_t
    requirement: optional
    group: primary
    from: base_event
    description: The status details contains additional information about the event outcome.
  status_id:
    caption: Status ID
    type: integer_t
    requirement: recommended
    group: primary
    from: base_event
    sibling: status
    description: The normalized identifier of the event status.
    enum:
      '0':
        caption: Unknown
      '1':
        caption: Success
      '2':
        caption: Failure
      '99':
        caption: Other
        description: The event status is not mapped. See the `status` attribute, which contains a data source specific value.
  time:
    caption: Event Time
    type: timestamp_t
    requirement: required
    group: occurrence
    from: base_event
    description: The normalized event occurrence time.
  time_dt:
    caption: Event Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: base_event
    description: The normalized event occurrence time.
  timezone_offset:
    caption: Timezone Offset
    type: integer_t
    requirement: recommended
    group: occurrence
    from: base_event
    description: The number of minutes that the reported event `time` is ahead or behind UTC, in the range -1,080 to +1,080.
  type_name:
    caption: Type Name
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event type name, as defined by the type_uid.
  type_uid:
    caption: Type ID
    type: integer_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
    enum:
      '100700':
        caption: 'Process Activity: Unknown'
      '100701':
        caption: 'Process Activity: Launch'
      '100702':
        caption: 'Process Activity: Terminate'
      '100703':
        caption: 'Process Activity: Open'
      '100704':
        caption: 'Process Activity: Inject'
      '100705':
        caption: 'Process Activity: Set User ID'
      '100799':
        caption: 'Process Activity: Other'
  unmapped:
    caption: Unmapped Data
    type: object_t
    object: object
    requirement: optional
    group: context
    from: base_event
    description: The attributes that are not mapped to the event schema. The names and values of those attributes are specific to the event source.

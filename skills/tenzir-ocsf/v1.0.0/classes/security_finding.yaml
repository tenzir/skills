name: security_finding
caption: Security Finding
uid: 2001
category: findings
category_uid: 2
extends: findings
description: Security Finding events describe findings, detections, anomalies, alerts and/or actions performed by security products
profiles: [cloud, container, datetime]
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    from: findings
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event.
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Create
        description: A security finding is created.
      '2':
        caption: Update
        description: A security finding is updated.
      '99':
        caption: Other
        description: The event activity is not mapped.
  activity_name:
    caption: Activity
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event activity name, as defined by the activity_id.
  analytic:
    caption: Analytic
    type: object_t
    object: analytic
    requirement: recommended
    group: primary
    description: The analytic technique used to create the finding or detection
  api:
    caption: API Details
    type: object_t
    object: api
    requirement: optional
    group: context
    profile: cloud
    from: base_event
    description: Describes details about a typical API (Application Programming Interface) call.
  attacks:
    caption: Attacks
    type: object_t
    object: attack
    array: true
    requirement: optional
    group: context
    description: The attack object describes the technique and associated tactics as defined by [ATT&CK MatrixTM](https://attack.mitre.org/wiki/ATT&CK_Matrix).
  category_name:
    caption: Category
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event category name, as defined by category_uid value: `Findings`.'
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event.
    enum:
      '2':
        caption: Findings
        description: Findings events report findings, detections, and possible resolutions of malware, anomalies, or other actions performed by security products.
  cis_csc:
    caption: CIS CSC
    type: object_t
    object: cis_control
    array: true
    requirement: optional
    group: context
    description: The CIS Critical Security Controls is a list of top 20 actions and practices an organization’s security team can take on such that cyber attacks or malware, are minimized and prevented.
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event class name, as defined by class_uid value: `Security Finding`.'
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A Class describes the attributes available in an event.
    enum:
      '2001':
        caption: Security Finding
        description: Security Finding events describe findings, detections, anomalies, alerts and/or actions performed by security products
  cloud:
    caption: Cloud
    type: object_t
    object: cloud
    requirement: required
    group: primary
    profile: cloud
    from: base_event
    description: Describes details about the Cloud environment where the event was originally created or logged.
  compliance:
    caption: Compliance
    type: object_t
    object: compliance
    requirement: optional
    group: context
    description: The compliance object provides context to compliance findings (e.g., a check against a specific regulatory or best practice framework such as CIS or NIST) and contains compliance related details.
  confidence:
    caption: Confidence
    type: string_t
    requirement: optional
    group: primary
    description: The confidence, normalized to the caption of the confidence_id value. In the case of 'Other', it is defined by the event source.
  confidence_id:
    caption: Confidence Id
    type: integer_t
    requirement: recommended
    group: primary
    sibling: confidence
    description: The normalized confidence refers to the accuracy of the rule that created the finding. A rule with a low confidence means that the finding scope is wide and may create finding reports that may not be malicious in nature.
    enum:
      '0':
        caption: Unknown
        description: No confidence is assigned.
      '1':
        caption: Low
      '2':
        caption: Medium
      '3':
        caption: High
      '99':
        caption: Other
        description: The confidence is not mapped to the defined enum values. See the `confidence` attribute, which contains a data source specific value.
  confidence_score:
    caption: Confidence Score
    type: integer_t
    requirement: optional
    group: primary
    description: The confidence score as reported by the event source.
  count:
    caption: Count
    type: integer_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The number of times that events in the same logical group occurred during the event Start Time to End Time period.
  data_sources:
    caption: Data Sources
    type: string_t
    array: true
    requirement: optional
    group: context
    description: The data sources for the finding.
  duration:
    caption: Duration
    type: integer_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The event duration or aggregate time, the amount of time the event covers from `start_time` to `end_time` in milliseconds.
  end_time:
    caption: End Time
    type: timestamp_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The end time of a time period, or the time of the most recent event included in the aggregate event.
  end_time_dt:
    caption: End Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: base_event
    description: The end time of a time period, or the time of the most recent event included in the aggregate event.
  enrichments:
    caption: Enrichments
    type: object_t
    object: enrichment
    array: true
    requirement: optional
    group: context
    from: base_event
    description: 'The additional information from an external data source, which is associated with the event. For example add location information for the IP address in the DNS answers:`[{"name": "answers.ip", "value": "92.24.47.250", "type": "location", "data": {"city": "Socotra", "continent": "Asia", "coordinates": [-25.4153, 17.0743], "country": "YE", "desc": "Yemen"}}]`'
  evidence:
    caption: Evidence
    type: json_t
    requirement: optional
    group: context
    description: The data the finding exposes to the analyst.
  finding:
    caption: Finding
    type: object_t
    object: finding
    requirement: required
    group: primary
    description: Finding object provides details related to a finding generated by security tool
  impact:
    caption: Impact
    type: string_t
    requirement: optional
    group: primary
    description: The impact , normalized to the caption of the impact_id value. In the case of 'Other', it is defined by the event source.
  impact_id:
    caption: Impact ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: impact
    description: The normalized impact of the finding.
    enum:
      '0':
        caption: Unknown
      '1':
        caption: Low
      '2':
        caption: Medium
      '3':
        caption: High
      '4':
        caption: Critical
      '99':
        caption: Other
        description: The detection impact is not mapped. See the `impact` attribute, which contains a data source specific value.
  impact_score:
    caption: Impact
    type: integer_t
    requirement: optional
    group: primary
    description: The impact of the finding, valid range 0-100.
  kill_chain:
    caption: Kill Chain
    type: object_t
    object: kill_chain
    array: true
    requirement: optional
    group: context
    description: The [Cyber Kill Chain®](https://www.lockheedmartin.com/en-us/capabilities/cyber/cyber-kill-chain.html).
  malware:
    caption: Malware
    type: object_t
    object: malware
    array: true
    requirement: optional
    group: context
    description: The list of malware identified by a finding.
  message:
    caption: Message
    type: string_t
    requirement: recommended
    group: primary
    from: base_event
    description: The description of the event, as defined by the event source.
  metadata:
    caption: Metadata
    type: object_t
    object: metadata
    requirement: required
    group: context
    from: base_event
    description: The metadata associated with the event.
  nist:
    caption: NIST List
    type: string_t
    array: true
    requirement: optional
    group: context
    description: The NIST Cybersecurity Framework recommendations for managing the cybersecurity risk.
  observables:
    caption: Observables
    type: object_t
    object: observable
    array: true
    requirement: optional
    group: primary
    from: base_event
    description: The observables associated with the event.
  process:
    caption: Process
    type: object_t
    object: process
    requirement: optional
    group: context
    observable: 25
    description: The process object.
  raw_data:
    caption: Raw Data
    type: string_t
    requirement: optional
    group: context
    from: base_event
    description: The event data as received from the event source.
  resources:
    caption: Resources Array
    type: object_t
    object: resource_details
    array: true
    requirement: recommended
    group: primary
    description: Describes details about resources that were affected by the activity/event.
  risk_level:
    caption: Risk Level
    type: string_t
    requirement: optional
    group: primary
    description: The risk level, normalized to the caption of the risk_level_id value. In the case of 'Other', it is defined by the event source.
  risk_level_id:
    caption: Risk Level ID
    type: integer_t
    requirement: optional
    group: primary
    sibling: risk_level
    description: The normalized risk level id.
    enum:
      '0':
        caption: Info
      '1':
        caption: Low
      '2':
        caption: Medium
      '3':
        caption: High
      '4':
        caption: Critical
  risk_score:
    caption: Risk Score
    type: integer_t
    requirement: optional
    group: primary
    description: The risk score as reported by the event source.
  severity:
    caption: Severity
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event severity, normalized to the caption of the severity_id value. In the case of 'Other', it is defined by the event source.
  severity_id:
    caption: Severity ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: severity
    description: |-
      The normalized identifier of the event severity.

      The normalized severity is a measurement the effort and expense required to manage and resolve an event or incident. Smaller numerical values represent lower impact events, and larger numerical values represent higher impact events.
    enum:
      '0':
        caption: Unknown
        description: The event severity is not known.
      '1':
        caption: Informational
        description: Informational message. No action required.
      '2':
        caption: Low
        description: The user decides if action is needed.
      '3':
        caption: Medium
        description: Action is required but the situation is not serious at this time.
      '4':
        caption: High
        description: Action is required immediately.
      '5':
        caption: Critical
        description: Action is required immediately and the scope is broad.
      '6':
        caption: Fatal
        description: An error occurred but it is too late to take remedial action.
      '99':
        caption: Other
        description: The event severity is not mapped. See the `severity` attribute, which contains a data source specific value.
  start_time:
    caption: Start Time
    type: timestamp_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The start time of a time period, or the time of the least recent event included in the aggregate event.
  start_time_dt:
    caption: Start Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: base_event
    description: The start time of a time period, or the time of the least recent event included in the aggregate event.
  state:
    caption: State
    type: string_t
    requirement: optional
    group: context
    description: The normalized state of a security finding.
  state_id:
    caption: State ID
    type: integer_t
    requirement: required
    group: context
    sibling: state
    description: The normalized state identifier of a security finding.
    enum:
      '0':
        caption: Unknown
      '1':
        caption: New
        description: The finding is new and yet to be reviewed.
      '2':
        caption: In Progress
        description: The finding is under review.
      '3':
        caption: Suppressed
        description: The finding was reviewed, considered as a false positive and is now suppressed.
      '4':
        caption: Resolved
        description: The finding was reviewed and remediated and is now considered resolved.
      '99':
        caption: Other
        description: The state is not mapped. See the `state` attribute, which contains a data source specific value.
  status:
    caption: Status
    type: string_t
    requirement: optional
    group: primary
    from: base_event
    description: The event status, normalized to the caption of the status_id value. In the case of 'Other', it is defined by the event source.
  status_code:
    caption: Status Code
    type: string_t
    requirement: optional
    group: primary
    from: base_event
    description: |-
      The event status code, as reported by the event source.

      For example, in a Windows Failed Authentication event, this would be the value of 'Failure Code', e.g. 0x18.
  status_detail:
    caption: Status Details
    type: string_t
    requirement: optional
    group: primary
    from: base_event
    description: The status details contains additional information about the event outcome.
  status_id:
    caption: Status ID
    type: integer_t
    requirement: recommended
    group: primary
    from: base_event
    sibling: status
    description: The normalized identifier of the event status.
    enum:
      '0':
        caption: Unknown
      '1':
        caption: Success
      '2':
        caption: Failure
      '99':
        caption: Other
        description: The event status is not mapped. See the `status` attribute, which contains a data source specific value.
  time:
    caption: Event Time
    type: timestamp_t
    requirement: required
    group: occurrence
    from: base_event
    description: The normalized event occurrence time.
  time_dt:
    caption: Event Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: base_event
    description: The normalized event occurrence time.
  timezone_offset:
    caption: Timezone Offset
    type: integer_t
    requirement: recommended
    group: occurrence
    from: base_event
    description: The number of minutes that the reported event `time` is ahead or behind UTC, in the range -1,080 to +1,080.
  type_name:
    caption: Type Name
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event type name, as defined by the type_uid.
  type_uid:
    caption: Type ID
    type: integer_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
    enum:
      '200100':
        caption: 'Security Finding: Unknown'
      '200101':
        caption: 'Security Finding: Create'
        description: A security finding is created.
      '200102':
        caption: 'Security Finding: Update'
        description: A security finding is updated.
      '200199':
        caption: 'Security Finding: Other'
  unmapped:
    caption: Unmapped Data
    type: object_t
    object: object
    requirement: optional
    group: context
    from: base_event
    description: The attributes that are not mapped to the event schema. The names and values of those attributes are specific to the event source.
  vulnerabilities:
    caption: Vulnerabilities
    type: object_t
    object: vulnerability
    array: true
    requirement: optional
    group: context
    description: This object describes vulnerabilities reported in a security finding.

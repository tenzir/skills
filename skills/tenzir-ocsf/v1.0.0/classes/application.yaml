# Attributes with a `definition` path are inherited unchanged. Read that file
# for their type, object, description, enum, and observable.
name: application
caption: Application Activity
category: application
abstract: true
extends: base_event
description: The base event is a generic and concrete event. It also defines a set of attributes available in most event classes. As a generic event that does not belong to any event category, it could be used to log events that are not otherwise defined by the schema.
profiles: [cloud, datetime]
attributes:
  activity_id:
    caption: Activity ID
    requirement: required
    definition: v1.0.0/classes/base_event.yaml
  activity_name:
    caption: Activity
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  api:
    caption: API Details
    requirement: optional
    profile: cloud
    definition: v1.0.0/classes/base_event.yaml
  category_name:
    caption: Category
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  category_uid:
    caption: Category ID
    requirement: required
    definition: v1.0.0/classes/base_event.yaml
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event class name, as defined by class_uid value.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: class_name
    description: The unique identifier of a class. A Class describes the attributes available in an event.
    enum:
      '0':
        caption: Base Event
  cloud:
    caption: Cloud
    requirement: required
    profile: cloud
    definition: v1.0.0/classes/base_event.yaml
  count:
    caption: Count
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  duration:
    caption: Duration
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  end_time:
    caption: End Time
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  enrichments:
    caption: Enrichments
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  message:
    caption: Message
    requirement: recommended
    definition: v1.0.0/classes/base_event.yaml
  metadata:
    caption: Metadata
    requirement: required
    definition: v1.0.0/classes/base_event.yaml
  observables:
    caption: Observables
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  raw_data:
    caption: Raw Data
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  severity:
    caption: Severity
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  severity_id:
    caption: Severity ID
    requirement: required
    definition: v1.0.0/classes/base_event.yaml
  start_time:
    caption: Start Time
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  status:
    caption: Status
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  status_code:
    caption: Status Code
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  status_detail:
    caption: Status Details
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  status_id:
    caption: Status ID
    requirement: recommended
    definition: v1.0.0/classes/base_event.yaml
  time:
    caption: Event Time
    requirement: required
    definition: v1.0.0/classes/base_event.yaml
  timezone_offset:
    caption: Timezone Offset
    requirement: recommended
    definition: v1.0.0/classes/base_event.yaml
  type_name:
    caption: Type Name
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  type_uid:
    caption: Type ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: type_name
    description: 'The event type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
  unmapped:
    caption: Unmapped Data
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml

# Attributes with a `definition` path are inherited unchanged. Read that file
# for their type, object, description, enum, and observable.
name: system
caption: System Activity
category: system
abstract: true
extends: base_event
description: The System Activity event is a generic event that defines a set of attributes available in the system activity events. As a generic event, it could be used to log events that are not otherwise defined by the System Activity category.
profiles: [cloud, datetime, host, security_control]
associations:
  device: [actor.user]
  actor.user: [device]
attributes:
  activity_id:
    caption: Activity ID
    requirement: required
    definition: v1.0.0/classes/base_event.yaml
  activity_name:
    caption: Activity
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  actor:
    caption: Actor
    type: object_t
    object: actor
    requirement: required
    group: primary
    description: The actor object describes details about the user/role/process that was the source of the activity.
  api:
    caption: API Details
    requirement: optional
    profile: cloud
    definition: v1.0.0/classes/base_event.yaml
  attacks:
    caption: Attacks
    type: object_t
    object: attack
    array: true
    requirement: recommended
    group: primary
    profile: security_control
    description: An array of attacks associated with an event.
  category_name:
    caption: Category
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  category_uid:
    caption: Category ID
    requirement: required
    definition: v1.0.0/classes/base_event.yaml
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event class name, as defined by class_uid value.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: class_name
    description: The unique identifier of a class. A Class describes the attributes available in an event.
    enum:
      '0':
        caption: Base Event
  cloud:
    caption: Cloud
    requirement: required
    profile: cloud
    definition: v1.0.0/classes/base_event.yaml
  count:
    caption: Count
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  device:
    caption: Device
    type: object_t
    object: device
    requirement: required
    group: primary
    observable: 20
    description: An addressable device, computer system or host.
  disposition:
    caption: Disposition
    type: string_t
    requirement: optional
    group: primary
    profile: security_control
    description: The event disposition name, normalized to the caption of the disposition_id value. In the case of 'Other', it is defined by the event source.
  disposition_id:
    caption: Disposition ID
    type: integer_t
    requirement: required
    group: primary
    profile: security_control
    sibling: disposition
    description: When security issues, such as malware or policy violations, are detected and possibly corrected, then `disposition_id` describes the action taken by the security product.
    enum:
      '0':
        caption: Unknown
      '1':
        caption: Allowed
      '2':
        caption: Blocked
      '3':
        caption: Quarantined
      '4':
        caption: Isolated
      '5':
        caption: Deleted
      '6':
        caption: Dropped
      '7':
        caption: Custom Action
        description: Executed custom action such as run a command script.
      '8':
        caption: Approved
      '9':
        caption: Restored
      '10':
        caption: Exonerated
        description: No longer suspicious (re-scored).
      '11':
        caption: Corrected
      '12':
        caption: Partially Corrected
      '13':
        caption: Uncorrected
      '14':
        caption: Delayed
        description: Requires reboot to finish the operation.
      '15':
        caption: Detected
      '16':
        caption: No Action
      '17':
        caption: Logged
      '18':
        caption: Tagged
        description: Marked with extended attributes.
      '99':
        caption: Other
  duration:
    caption: Duration
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  end_time:
    caption: End Time
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  enrichments:
    caption: Enrichments
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  malware:
    caption: Malware
    type: object_t
    object: malware
    array: true
    requirement: optional
    group: primary
    profile: security_control
    description: The list of malware identified by a finding.
  message:
    caption: Message
    requirement: recommended
    definition: v1.0.0/classes/base_event.yaml
  metadata:
    caption: Metadata
    requirement: required
    definition: v1.0.0/classes/base_event.yaml
  observables:
    caption: Observables
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  raw_data:
    caption: Raw Data
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  severity:
    caption: Severity
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  severity_id:
    caption: Severity ID
    requirement: required
    definition: v1.0.0/classes/base_event.yaml
  start_time:
    caption: Start Time
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  status:
    caption: Status
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  status_code:
    caption: Status Code
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  status_detail:
    caption: Status Details
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  status_id:
    caption: Status ID
    requirement: recommended
    definition: v1.0.0/classes/base_event.yaml
  time:
    caption: Event Time
    requirement: required
    definition: v1.0.0/classes/base_event.yaml
  timezone_offset:
    caption: Timezone Offset
    requirement: recommended
    definition: v1.0.0/classes/base_event.yaml
  type_name:
    caption: Type Name
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  type_uid:
    caption: Type ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: type_name
    description: 'The event type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
  unmapped:
    caption: Unmapped Data
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml

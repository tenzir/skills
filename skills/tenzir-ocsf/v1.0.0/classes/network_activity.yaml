    description: The list of malware identified by a finding.
  message:
    caption: Message
    requirement: recommended
    definition: v1.0.0/classes/base_event.yaml
  metadata:
    caption: Metadata
    requirement: required
    definition: v1.0.0/classes/base_event.yaml
  observables:
    caption: Observables
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  proxy:

  raw_data:
    caption: Raw Data
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  severity:
    caption: Severity
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  severity_id:
    caption: Severity ID
    requirement: required
    definition: v1.0.0/classes/base_event.yaml
  src_endpoint:
    caption: Source Endpoint
    type: object_t
    object: network_endpoint
    requirement: required
    group: primary
    observable: 20
    description: The initiator (client) of the network connection.
  start_time:
    caption: Start Time
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  start_time_dt:
    caption: Start Time
    requirement: optional
    profile: datetime
    definition: v1.0.0/classes/base_event.yaml
  status:
    caption: Status
    requirement: optional

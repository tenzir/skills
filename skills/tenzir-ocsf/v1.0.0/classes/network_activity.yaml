# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: network_activity
caption: Network Activity
uid: 4001
category: network
category_uid: 4
extends: base_event
description: Network Activity events report network connection and traffic activity.
profiles: [cloud, container, datetime, host, security_control]
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event.
    enum:
      0:
        caption: Unknown
        description: The event activity is unknown.
      1:
        caption: Open
        description: A new network connection was opened.
      2:
        caption: Close
        description: The network connection was closed.
      3:
        caption: Reset
        description: The network connection was abnormally terminated or closed by a middle device like firewalls.
      4:
        caption: Fail
        description: The network connection failed. For example a connection timeout or no route to host.
      5:
        caption: Refuse
        description: The network connection was refused. For example an attempt to connect to a server port which is not open.
      6:
        caption: Traffic
        description: Network traffic report.
      99:
        caption: Other
        description: The event activity is not mapped.
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event.
    enum:
      4:
        caption: Network Activity
        description: Network Activity events.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A Class describes the attributes available in an event.
    enum:
      4001:
        caption: Network Activity
        description: Network Activity events report network connection and traffic activity.
  cloud: {caption: Cloud, type: object_t, object: cloud, requirement: required, group: primary, profile: cloud, from: base_event}
  disposition_id:
    caption: Disposition ID
    type: integer_t
    requirement: required
    group: primary
    profile: security_control
    sibling: disposition
    description: When security issues, such as malware or policy violations, are detected and possibly corrected, then `disposition_id` describes the action taken by the security product.
    enum:
      0:
        caption: Unknown
      1:
        caption: Allowed
      2:
        caption: Blocked
      3:
        caption: Quarantined
      4:
        caption: Isolated
      5:
        caption: Deleted
      6:
        caption: Dropped
      7:
        caption: Custom Action
        description: Executed custom action such as run a command script.
      8:
        caption: Approved
      9:
        caption: Restored
      10:
        caption: Exonerated
        description: No longer suspicious (re-scored).
      11:
        caption: Corrected
      12:
        caption: Partially Corrected
      13:
        caption: Uncorrected
      14:
        caption: Delayed
        description: Requires reboot to finish the operation.
      15:
        caption: Detected
      16:
        caption: No Action
      17:
        caption: Logged
      18:
        caption: Tagged
        description: Marked with extended attributes.
      99:
        caption: Other
  dst_endpoint:
    caption: Destination Endpoint
    type: object_t
    object: network_endpoint
    requirement: required
    group: primary
    observable: 20
    description: The responder (server) in a network connection.
  metadata: {caption: Metadata, type: object_t, object: metadata, requirement: required, group: context, from: base_event}
  severity_id: {caption: Severity ID, type: integer_t, requirement: required, group: classification, sibling: severity, enum: {0: Unknown, 1: Informational, 2: Low, 3: Medium, 4: High, 5: Critical, 6: Fatal, 99: Other}, from: base_event}
  src_endpoint:
    caption: Source Endpoint
    type: object_t
    object: network_endpoint
    requirement: required
    group: primary
    observable: 20
    description: The initiator (client) of the network connection.
  time: {caption: Event Time, type: timestamp_t, requirement: required, group: occurrence, from: base_event}
  type_uid:
    caption: Type ID
    type: integer_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
  attacks:
    caption: Attacks
    type: object_t
    object: attack
    array: true
    requirement: recommended
    group: primary
    profile: security_control
    description: An array of attacks associated with an event.
  connection_info:
    caption: Connection Info
    type: object_t
    object: network_connection_info
    requirement: recommended
    group: primary
    description: The network connection information.
  device:
    caption: Device
    type: object_t
    object: device
    requirement: recommended
    group: primary
    profile: host
    observable: 20
    description: An addressable device, computer system or host.
  message: {caption: Message, type: string_t, requirement: recommended, group: primary, from: base_event}
  status_id: {caption: Status ID, type: integer_t, requirement: recommended, group: primary, sibling: status, enum: {0: Unknown, 1: Success, 2: Failure, 99: Other}, from: base_event}
  timezone_offset: {caption: Timezone Offset, type: integer_t, requirement: recommended, group: occurrence, from: base_event}
  activity_name: {caption: Activity, type: string_t, requirement: optional, group: classification, from: base_event}
  actor:
    caption: Actor
    type: object_t
    object: actor
    requirement: optional
    group: primary
    profile: host
    description: The actor object describes details about the user/role/process that was the source of the activity.
  api: {caption: API Details, type: object_t, object: api, requirement: optional, group: context, profile: cloud, from: base_event}
  app_name:
    caption: Application Name
    type: string_t
    requirement: optional
    group: context
    description: The name of the application that is associated with the event or object.
  category_name:
    caption: Category
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event category name, as defined by category_uid value: `Network Activity`.'
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event class name, as defined by class_uid value: `Network Activity`.'
  count: {caption: Count, type: integer_t, requirement: optional, group: occurrence, from: base_event}
  disposition:
    caption: Disposition
    type: string_t
    requirement: optional
    group: primary
    profile: security_control
    description: The event disposition name, normalized to the caption of the disposition_id value. In the case of 'Other', it is defined by the event source.
  duration: {caption: Duration, type: integer_t, requirement: optional, group: occurrence, from: base_event}
  end_time: {caption: End Time, type: timestamp_t, requirement: optional, group: occurrence, from: base_event}
  end_time_dt: {caption: End Time, type: datetime_t, requirement: optional, group: occurrence, profile: datetime, from: base_event}
  enrichments: {caption: Enrichments, type: object_t, object: enrichment, array: true, requirement: optional, group: context, from: base_event}
  malware:
    caption: Malware
    type: object_t
    object: malware
    array: true
    requirement: optional
    group: primary
    profile: security_control
    description: The list of malware identified by a finding.
  observables: {caption: Observables, type: object_t, object: observable, array: true, requirement: optional, group: primary, from: base_event}
  proxy:
    caption: Proxy
    type: object_t
    object: network_proxy
    requirement: optional
    group: primary
    observable: 20
    description: If a proxy connection is present, the connection from the client to the proxy server.
  raw_data: {caption: Raw Data, type: string_t, requirement: optional, group: context, from: base_event}
  severity: {caption: Severity, type: string_t, requirement: optional, group: classification, from: base_event}
  start_time: {caption: Start Time, type: timestamp_t, requirement: optional, group: occurrence, from: base_event}
  start_time_dt: {caption: Start Time, type: datetime_t, requirement: optional, group: occurrence, profile: datetime, from: base_event}
  status: {caption: Status, type: string_t, requirement: optional, group: primary, from: base_event}
  status_code: {caption: Status Code, type: string_t, requirement: optional, group: primary, from: base_event}
  status_detail: {caption: Status Details, type: string_t, requirement: optional, group: primary, from: base_event}
  time_dt: {caption: Event Time, type: datetime_t, requirement: optional, group: occurrence, profile: datetime, from: base_event}
  tls:
    caption: TLS
    type: object_t
    object: tls
    requirement: optional
    group: primary
    description: The Transport Layer Security (TLS) attributes.
  traffic:
    caption: Traffic
    type: object_t
    object: network_traffic
    requirement: optional
    group: primary
    description: The network traffic refers to the amount of data moving across a network at a given point of time. Intended to be used alongside Network Connection.
  type_name: {caption: Type Name, type: string_t, requirement: optional, group: classification, from: base_event}
  unmapped: {caption: Unmapped Data, type: object_t, object: object, requirement: optional, group: context, from: base_event}

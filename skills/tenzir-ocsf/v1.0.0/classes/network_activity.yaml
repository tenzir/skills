  status_id:
    caption: Status ID
    requirement: recommended
    definition: v1.0.0/classes/base_event.yaml
  time:
    caption: Event Time
    requirement: required
    definition: v1.0.0/classes/base_event.yaml
  time_dt:
    caption: Event Time
    requirement: optional

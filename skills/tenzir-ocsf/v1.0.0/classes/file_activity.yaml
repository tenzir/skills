name: file_activity
caption: File System Activity
uid: 1001
category: system
category_uid: 1
extends: system
description: File System Activity events report when a process performs an action on a file or folder.
profiles: [cloud, container, datetime, host, security_control]
associations:
  device: [actor.user]
  actor.user: [device]
attributes:
  access_mask:
    caption: Access Mask
    type: integer_t
    requirement: optional
    group: context
    description: The access mask in a platform-native format.
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The activity ID of the event.
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Create
        description: A request to create a new file on a file system.
      '2':
        caption: Read
        description: A request to read data from a file on a file system.
      '3':
        caption: Update
        description: A request to write data to a file on a file system.
      '4':
        caption: Delete
        description: A request to delete a file on a file system.
      '5':
        caption: Rename
        description: A request to rename a file on a file system.
      '6':
        caption: Set Attributes
        description: A request to set attributes for a file on a file system.
      '7':
        caption: Set Security
        description: A request to set security for a file on a file system.
      '8':
        caption: Get Attributes
        description: A request to get attributes for a file on a file system.
      '9':
        caption: Get Security
        description: A request to get security for a file on a file system.
      '10':
        caption: Encrypt
        description: A request to encrypt a file on a file system.
      '11':
        caption: Decrypt
        description: A request to decrypt a file on a file system.
      '12':
        caption: Mount
        description: A request to mount a file on a file system.
      '13':
        caption: Unmount
        description: A request to unmount a file from a file system.
      '14':
        caption: Open
        description: A request to create a file handle.
      '99':
        caption: Other
        description: The event activity is not mapped.
  activity_name:
    caption: Activity
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event activity name, as defined by the activity_id.
  actor:
    caption: Actor
    type: object_t
    object: actor
    requirement: required
    group: primary
    description: The actor that performed the activity on the `file` object
  api:
    caption: API Details
    type: object_t
    object: api
    requirement: optional
    group: context
    profile: cloud
    from: base_event
    description: Describes details about a typical API (Application Programming Interface) call.
  attacks:
    caption: Attacks
    type: object_t
    object: attack
    array: true
    requirement: recommended
    group: primary
    profile: security_control
    from: system
    description: An array of attacks associated with an event.
  category_name:
    caption: Category
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event category name, as defined by category_uid value: `System Activity`.'
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event.
    enum:
      '1':
        caption: System Activity
        description: System Activity events.
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event class name, as defined by class_uid value: `File System Activity`.'
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A Class describes the attributes available in an event.
    enum:
      '1001':
        caption: File System Activity
        description: File System Activity events report when a process performs an action on a file or folder.
  cloud:
    caption: Cloud
    type: object_t
    object: cloud
    requirement: required
    group: primary
    profile: cloud
    from: base_event
    description: Describes details about the Cloud environment where the event was originally created or logged.
  component:
    caption: Component
    type: string_t
    requirement: optional
    group: primary
    description: |-
      The name or relative pathname of a sub-component of the data object, if applicable.

      For example: `attachment.doc`, `attachment.zip/bad.doc`, or `part.mime/part.cab/part.uue/part.doc`.
  connection_uid:
    caption: Connection Identifier
    type: string_t
    requirement: optional
    group: context
    description: The network connection identifier.
  count:
    caption: Count
    type: integer_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The number of times that events in the same logical group occurred during the event Start Time to End Time period.
  create_mask:
    caption: Create Mask
    type: string_t
    requirement: optional
    group: primary
    description: The original Windows mask that is required to create the object.
  device:
    caption: Device
    type: object_t
    object: device
    requirement: required
    group: primary
    from: system
    observable: 20
    description: An addressable device, computer system or host.
  disposition:
    caption: Disposition
    type: string_t
    requirement: optional
    group: primary
    profile: security_control
    from: system
    description: The event disposition name, normalized to the caption of the disposition_id value. In the case of 'Other', it is defined by the event source.
  disposition_id:
    caption: Disposition ID
    type: integer_t
    requirement: required
    group: primary
    profile: security_control
    from: system
    sibling: disposition
    description: When security issues, such as malware or policy violations, are detected and possibly corrected, then `disposition_id` describes the action taken by the security product.
    enum:
      '0':
        caption: Unknown
      '1':
        caption: Allowed
      '2':
        caption: Blocked
      '3':
        caption: Quarantined
      '4':
        caption: Isolated
      '5':
        caption: Deleted
      '6':
        caption: Dropped
      '7':
        caption: Custom Action
        description: Executed custom action such as run a command script.
      '8':
        caption: Approved
      '9':
        caption: Restored
      '10':
        caption: Exonerated
        description: No longer suspicious (re-scored).
      '11':
        caption: Corrected
      '12':
        caption: Partially Corrected
      '13':
        caption: Uncorrected
      '14':
        caption: Delayed
        description: Requires reboot to finish the operation.
      '15':
        caption: Detected
      '16':
        caption: No Action
      '17':
        caption: Logged
      '18':
        caption: Tagged
        description: Marked with extended attributes.
      '99':
        caption: Other
  duration:
    caption: Duration
    type: integer_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The event duration or aggregate time, the amount of time the event covers from `start_time` to `end_time` in milliseconds.
  end_time:
    caption: End Time
    type: timestamp_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The end time of a time period, or the time of the most recent event included in the aggregate event.
  end_time_dt:
    caption: End Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: base_event
    description: The end time of a time period, or the time of the most recent event included in the aggregate event.
  enrichments:
    caption: Enrichments
    type: object_t
    object: enrichment
    array: true
    requirement: optional
    group: context
    from: base_event
    description: 'The additional information from an external data source, which is associated with the event. For example add location information for the IP address in the DNS answers:`[{"name": "answers.ip", "value": "92.24.47.250", "type": "location", "data": {"city": "Socotra", "continent": "Asia", "coordinates": [-25.4153, 17.0743], "country": "YE", "desc": "Yemen"}}]`'
  file:
    caption: File
    type: object_t
    object: file
    requirement: required
    group: primary
    observable: 24
    description: The file that is the target of the activity.
  file_diff:
    caption: File Diff
    type: string_t
    requirement: optional
    group: primary
    description: File content differences used for change detection. For example, a common use case is to identify itemized changes within INI or configuration/property setting values.
  file_result:
    caption: File Result
    type: object_t
    object: file
    requirement: optional
    group: primary
    observable: 24
    description: The resulting file object when the activity was allowed and successful.
  malware:
    caption: Malware
    type: object_t
    object: malware
    array: true
    requirement: optional
    group: primary
    profile: security_control
    from: system
    description: The list of malware identified by a finding.
  message:
    caption: Message
    type: string_t
    requirement: recommended
    group: primary
    from: base_event
    description: The description of the event, as defined by the event source.
  metadata:
    caption: Metadata
    type: object_t
    object: metadata
    requirement: required
    group: context
    from: base_event
    description: The metadata associated with the event.
  observables:
    caption: Observables
    type: object_t
    object: observable
    array: true
    requirement: optional
    group: primary
    from: base_event
    description: The observables associated with the event.
  raw_data:
    caption: Raw Data
    type: string_t
    requirement: optional
    group: context
    from: base_event
    description: The event data as received from the event source.
  severity:
    caption: Severity
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event severity, normalized to the caption of the severity_id value. In the case of 'Other', it is defined by the event source.
  severity_id:
    caption: Severity ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: severity
    description: |-
      The normalized identifier of the event severity.

      The normalized severity is a measurement the effort and expense required to manage and resolve an event or incident. Smaller numerical values represent lower impact events, and larger numerical values represent higher impact events.
    enum:
      '0':
        caption: Unknown
        description: The event severity is not known.
      '1':
        caption: Informational
        description: Informational message. No action required.
      '2':
        caption: Low
        description: The user decides if action is needed.
      '3':
        caption: Medium
        description: Action is required but the situation is not serious at this time.
      '4':
        caption: High
        description: Action is required immediately.
      '5':
        caption: Critical
        description: Action is required immediately and the scope is broad.
      '6':
        caption: Fatal
        description: An error occurred but it is too late to take remedial action.
      '99':
        caption: Other
        description: The event severity is not mapped. See the `severity` attribute, which contains a data source specific value.
  start_time:
    caption: Start Time
    type: timestamp_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The start time of a time period, or the time of the least recent event included in the aggregate event.
  start_time_dt:
    caption: Start Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: base_event
    description: The start time of a time period, or the time of the least recent event included in the aggregate event.
  status:
    caption: Status
    type: string_t
    requirement: optional
    group: primary
    from: base_event
    description: The event status, normalized to the caption of the status_id value. In the case of 'Other', it is defined by the event source.
  status_code:
    caption: Status Code
    type: string_t
    requirement: optional
    group: primary
    from: base_event
    description: |-
      The event status code, as reported by the event source.

      For example, in a Windows Failed Authentication event, this would be the value of 'Failure Code', e.g. 0x18.
  status_detail:
    caption: Status Details
    type: string_t
    requirement: optional
    group: primary
    from: base_event
    description: The status details contains additional information about the event outcome.
  status_id:
    caption: Status ID
    type: integer_t
    requirement: recommended
    group: primary
    from: base_event
    sibling: status
    description: The normalized identifier of the event status.
    enum:
      '0':
        caption: Unknown
      '1':
        caption: Success
      '2':
        caption: Failure
      '99':
        caption: Other
        description: The event status is not mapped. See the `status` attribute, which contains a data source specific value.
  time:
    caption: Event Time
    type: timestamp_t
    requirement: required
    group: occurrence
    from: base_event
    description: The normalized event occurrence time.
  time_dt:
    caption: Event Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: base_event
    description: The normalized event occurrence time.
  timezone_offset:
    caption: Timezone Offset
    type: integer_t
    requirement: recommended
    group: occurrence
    from: base_event
    description: The number of minutes that the reported event `time` is ahead or behind UTC, in the range -1,080 to +1,080.
  type_name:
    caption: Type Name
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event type name, as defined by the type_uid.
  type_uid:
    caption: Type ID
    type: integer_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
    enum:
      '100100':
        caption: 'File System Activity: Unknown'
      '100101':
        caption: 'File System Activity: Create'
        description: A request to create a new file on a file system.
      '100102':
        caption: 'File System Activity: Read'
        description: A request to read data from a file on a file system.
      '100103':
        caption: 'File System Activity: Update'
        description: A request to write data to a file on a file system.
      '100104':
        caption: 'File System Activity: Delete'
        description: A request to delete a file on a file system.
      '100105':
        caption: 'File System Activity: Rename'
        description: A request to rename a file on a file system.
      '100106':
        caption: 'File System Activity: Set Attributes'
        description: A request to set attributes for a file on a file system.
      '100107':
        caption: 'File System Activity: Set Security'
        description: A request to set security for a file on a file system.
      '100108':
        caption: 'File System Activity: Get Attributes'
        description: A request to get attributes for a file on a file system.
      '100109':
        caption: 'File System Activity: Get Security'
        description: A request to get security for a file on a file system.
      '100110':
        caption: 'File System Activity: Encrypt'
        description: A request to encrypt a file on a file system.
      '100111':
        caption: 'File System Activity: Decrypt'
        description: A request to decrypt a file on a file system.
      '100112':
        caption: 'File System Activity: Mount'
        description: A request to mount a file on a file system.
      '100113':
        caption: 'File System Activity: Unmount'
        description: A request to unmount a file from a file system.
      '100114':
        caption: 'File System Activity: Open'
        description: A request to create a file handle.
      '100199':
        caption: 'File System Activity: Other'
  unmapped:
    caption: Unmapped Data
    type: object_t
    object: object
    requirement: optional
    group: context
    from: base_event
    description: The attributes that are not mapped to the event schema. The names and values of those attributes are specific to the event source.

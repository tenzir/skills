# Attributes with a `definition` path are inherited unchanged. Read that file
# for their type, object, description, enum, and observable.
name: email_activity
caption: Email Activity
uid: 4009
category: network
category_uid: 4
extends: base_event
description: Email events report activities of emails.
profiles: [cloud, container, datetime, host, security_control]
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: optional
    group: context
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event.
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Send
      '2':
        caption: Receive
      '3':
        caption: Scan
        description: 'Email being scanned (example: security scanning)'
      '99':
        caption: Other
        description: The event activity is not mapped.
  activity_name:
    caption: Activity
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  actor:
    caption: Actor
    type: object_t
    object: actor
    requirement: optional
    group: primary
    profile: host
    description: The actor object describes details about the user/role/process that was the source of the activity.
  api:
    caption: API Details
    requirement: optional
    profile: cloud
    definition: v1.0.0/classes/base_event.yaml
  attacks:
    caption: Attacks
    type: object_t
    object: attack
    array: true
    requirement: recommended
    group: primary
    profile: security_control
    description: An array of attacks associated with an event.
  attempt:
    caption: Attempt
    type: integer_t
    requirement: optional
    group: context
    description: The attempt number for attempting to deliver the email.
  banner:
    caption: SMTP Banner
    type: string_t
    requirement: optional
    group: context
    description: The initial SMTP connection response that a messaging server receives after it connects to a email server.
  category_name:
    caption: Category
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event category name, as defined by category_uid value: `Network Activity`.'
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event.
    enum:
      '4':
        caption: Network Activity
        description: Network Activity events.
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event class name, as defined by class_uid value: `Email Activity`.'
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A Class describes the attributes available in an event.
    enum:
      '4009':
        caption: Email Activity
        description: Email events report activities of emails.
  cloud:
    caption: Cloud
    requirement: required
    profile: cloud
    definition: v1.0.0/classes/base_event.yaml
  count:
    caption: Count
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  device:
    caption: Device
    type: object_t
    object: device
    requirement: recommended
    group: primary
    profile: host
    observable: 20
    description: An addressable device, computer system or host.
  direction:
    caption: Direction
    type: string_t
    requirement: optional
    group: context
    description: The direction of the email, as defined by the `direction_id` value.
  direction_id:
    caption: Direction ID
    type: integer_t
    requirement: required
    group: context
    sibling: direction
    description: |-
      The direction of the email relative to the scanning host or organization.

      Email scanned at an internet gateway might be characterized as inbound to the organization from the Internet, outbound from the organization to the Internet, or internal within the organization. Email scanned at a workstation might be characterized as inbound to, or outbound from the workstation.
    enum:
      '0':
        caption: Unknown
        description: The email direction is unknown.
      '1':
        caption: Inbound
        description: Email Inbound, from the Internet or outside network destined for an entity inside network.
      '2':
        caption: Outbound
        description: Email Outbound, from inside the network destined for an entity outside network.
      '3':
        caption: Internal
        description: Email Internal, from inside the network destined for an entity inside network.
      '99':
        caption: Other
  disposition:
    caption: Disposition
    type: string_t
    requirement: optional
    group: primary
    profile: security_control
    description: The event disposition name, normalized to the caption of the disposition_id value. In the case of 'Other', it is defined by the event source.
  disposition_id:
    caption: Disposition ID
    type: integer_t
    requirement: required
    group: primary
    profile: security_control
    sibling: disposition
    description: When security issues, such as malware or policy violations, are detected and possibly corrected, then `disposition_id` describes the action taken by the security product.
    enum:
      '0':
        caption: Unknown
      '1':
        caption: Allowed
      '2':
        caption: Blocked
      '3':
        caption: Quarantined
      '4':
        caption: Isolated
      '5':
        caption: Deleted
      '6':
        caption: Dropped
      '7':
        caption: Custom Action
        description: Executed custom action such as run a command script.
      '8':
        caption: Approved
      '9':
        caption: Restored
      '10':
        caption: Exonerated
        description: No longer suspicious (re-scored).
      '11':
        caption: Corrected
      '12':
        caption: Partially Corrected
      '13':
        caption: Uncorrected
      '14':
        caption: Delayed
        description: Requires reboot to finish the operation.
      '15':
        caption: Detected
      '16':
        caption: No Action
      '17':
        caption: Logged
      '18':
        caption: Tagged
        description: Marked with extended attributes.
      '99':
        caption: Other
  dst_endpoint:
    caption: Destination Endpoint
    type: object_t
    object: network_endpoint
    requirement: optional
    group: primary
    observable: 20
    description: The responder (server) receiving the email.
  duration:
    caption: Duration
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  email:
    caption: Email
    type: object_t
    object: email
    requirement: required
    group: primary
    observable: 22
    description: The email object.
  email_auth:
    caption: Email Authentication
    type: object_t
    object: email_auth
    requirement: recommended
    group: primary
    description: The SPF, DKIM and DMARC attributes of an email.
  end_time:
    caption: End Time
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  end_time_dt:
    caption: End Time
    requirement: optional
    profile: datetime
    definition: v1.0.0/classes/base_event.yaml
  enrichments:
    caption: Enrichments
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  malware:
    caption: Malware
    type: object_t
    object: malware
    array: true
    requirement: optional
    group: primary
    profile: security_control
    description: The list of malware identified by a finding.
  message:
    caption: Message
    requirement: recommended
    definition: v1.0.0/classes/base_event.yaml
  metadata:
    caption: Metadata
    requirement: required
    definition: v1.0.0/classes/base_event.yaml
  observables:
    caption: Observables
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  raw_data:
    caption: Raw Data
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  severity:
    caption: Severity
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  severity_id:
    caption: Severity ID
    requirement: required
    definition: v1.0.0/classes/base_event.yaml
  smtp_hello:
    caption: SMTP Hello
    type: string_t
    requirement: recommended
    group: primary
    description: The value of the SMTP HELO or EHLO command sent by the initiator (client).
  src_endpoint:
    caption: Source Endpoint
    type: object_t
    object: network_endpoint
    requirement: optional
    group: primary
    observable: 20
    description: The initiator (client) sending the email.
  start_time:
    caption: Start Time
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  start_time_dt:
    caption: Start Time
    requirement: optional
    profile: datetime
    definition: v1.0.0/classes/base_event.yaml
  status:
    caption: Status
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  status_code:
    caption: Status Code
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  status_detail:
    caption: Status Details
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  status_id:
    caption: Status ID
    requirement: recommended
    definition: v1.0.0/classes/base_event.yaml
  time:
    caption: Event Time
    requirement: required
    definition: v1.0.0/classes/base_event.yaml
  time_dt:
    caption: Event Time
    requirement: optional
    profile: datetime
    definition: v1.0.0/classes/base_event.yaml
  timezone_offset:
    caption: Timezone Offset
    requirement: recommended
    definition: v1.0.0/classes/base_event.yaml
  type_name:
    caption: Type Name
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml
  type_uid:
    caption: Type ID
    type: integer_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
    enum:
      '400900':
        caption: 'Email Activity: Unknown'
      '400901':
        caption: 'Email Activity: Send'
      '400902':
        caption: 'Email Activity: Receive'
      '400903':
        caption: 'Email Activity: Scan'
        description: 'Email being scanned (example: security scanning)'
      '400999':
        caption: 'Email Activity: Other'
  unmapped:
    caption: Unmapped Data
    requirement: optional
    definition: v1.0.0/classes/base_event.yaml

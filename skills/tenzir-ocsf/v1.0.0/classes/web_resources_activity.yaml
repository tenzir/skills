name: web_resources_activity
caption: Web Resources Activity
uid: 6001
category: application
category_uid: 6
extends: base_event
description: Web Resources Activity events describe actions executed on a set of Web Resources.
profiles: [cloud, container, datetime, host]
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event.
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Create
        description: One or more web resources were created.
      '2':
        caption: Read
        description: One or more web resources were read / viewed.
      '3':
        caption: Update
        description: One or more web resources were updated.
      '4':
        caption: Delete
        description: One or more web resources were deleted.
      '5':
        caption: Search
        description: A search was performed on one or more web resources.
      '6':
        caption: Import
        description: One or more web resources were imported into an Application.
      '7':
        caption: Export
        description: One or more web resources were exported from an Application.
      '8':
        caption: Share
        description: One or more web resources were shared.
      '99':
        caption: Other
        description: The event activity is not mapped.
  activity_name:
    caption: Activity
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event activity name, as defined by the activity_id.
  actor:
    caption: Actor
    type: object_t
    object: actor
    requirement: optional
    group: primary
    profile: host
    description: The actor object describes details about the user/role/process that was the source of the activity.
  api:
    caption: API Details
    type: object_t
    object: api
    requirement: optional
    group: context
    profile: cloud
    from: base_event
    description: Describes details about a typical API (Application Programming Interface) call.
  category_name:
    caption: Category
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event category name, as defined by category_uid value: `Application Activity`.'
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event.
    enum:
      '6':
        caption: Application Activity
        description: Application Activity events report detailed information about the behavior of applications and services.
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event class name, as defined by class_uid value: `Web Resources Activity`.'
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A Class describes the attributes available in an event.
    enum:
      '6001':
        caption: Web Resources Activity
        description: Web Resources Activity events describe actions executed on a set of Web Resources.
  cloud:
    caption: Cloud
    type: object_t
    object: cloud
    requirement: required
    group: primary
    profile: cloud
    from: base_event
    description: Describes details about the Cloud environment where the event was originally created or logged.
  count:
    caption: Count
    type: integer_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The number of times that events in the same logical group occurred during the event Start Time to End Time period.
  device:
    caption: Device
    type: object_t
    object: device
    requirement: recommended
    group: primary
    profile: host
    observable: 20
    description: An addressable device, computer system or host.
  dst_endpoint:
    caption: Destination Endpoint
    type: object_t
    object: network_endpoint
    requirement: recommended
    group: primary
    observable: 20
    description: Details about server providing the web resources.
  duration:
    caption: Duration
    type: integer_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The event duration or aggregate time, the amount of time the event covers from `start_time` to `end_time` in milliseconds.
  end_time:
    caption: End Time
    type: timestamp_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The end time of a time period, or the time of the most recent event included in the aggregate event.
  end_time_dt:
    caption: End Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: base_event
    description: The end time of a time period, or the time of the most recent event included in the aggregate event.
  enrichments:
    caption: Enrichments
    type: object_t
    object: enrichment
    array: true
    requirement: optional
    group: context
    from: base_event
    description: 'The additional information from an external data source, which is associated with the event. For example add location information for the IP address in the DNS answers:`[{"name": "answers.ip", "value": "92.24.47.250", "type": "location", "data": {"city": "Socotra", "continent": "Asia", "coordinates": [-25.4153, 17.0743], "country": "YE", "desc": "Yemen"}}]`'
  message:
    caption: Message
    type: string_t
    requirement: recommended
    group: primary
    from: base_event
    description: The description of the event, as defined by the event source.
  metadata:
    caption: Metadata
    type: object_t
    object: metadata
    requirement: required
    group: context
    from: base_event
    description: The metadata associated with the event.
  observables:
    caption: Observables
    type: object_t
    object: observable
    array: true
    requirement: optional
    group: primary
    from: base_event
    description: The observables associated with the event.
  raw_data:
    caption: Raw Data
    type: string_t
    requirement: optional
    group: context
    from: base_event
    description: The event data as received from the event source.
  severity:
    caption: Severity
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event severity, normalized to the caption of the severity_id value. In the case of 'Other', it is defined by the event source.
  severity_id:
    caption: Severity ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: severity
    description: |-
      The normalized identifier of the event severity.

      The normalized severity is a measurement the effort and expense required to manage and resolve an event or incident. Smaller numerical values represent lower impact events, and larger numerical values represent higher impact events.
    enum:
      '0':
        caption: Unknown
        description: The event severity is not known.
      '1':
        caption: Informational
        description: Informational message. No action required.
      '2':
        caption: Low
        description: The user decides if action is needed.
      '3':
        caption: Medium
        description: Action is required but the situation is not serious at this time.
      '4':
        caption: High
        description: Action is required immediately.
      '5':
        caption: Critical
        description: Action is required immediately and the scope is broad.
      '6':
        caption: Fatal
        description: An error occurred but it is too late to take remedial action.
      '99':
        caption: Other
        description: The event severity is not mapped. See the `severity` attribute, which contains a data source specific value.
  src_endpoint:
    caption: Source Endpoint
    type: object_t
    object: network_endpoint
    requirement: recommended
    group: primary
    observable: 20
    description: Details about the endpoint from which the request originated.
  start_time:
    caption: Start Time
    type: timestamp_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The start time of a time period, or the time of the least recent event included in the aggregate event.
  start_time_dt:
    caption: Start Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: base_event
    description: The start time of a time period, or the time of the least recent event included in the aggregate event.
  status:
    caption: Status
    type: string_t
    requirement: optional
    group: primary
    from: base_event
    description: The event status, normalized to the caption of the status_id value. In the case of 'Other', it is defined by the event source.
  status_code:
    caption: Status Code
    type: string_t
    requirement: optional
    group: primary
    from: base_event
    description: |-
      The event status code, as reported by the event source.

      For example, in a Windows Failed Authentication event, this would be the value of 'Failure Code', e.g. 0x18.
  status_detail:
    caption: Status Details
    type: string_t
    requirement: optional
    group: primary
    from: base_event
    description: The status details contains additional information about the event outcome.
  status_id:
    caption: Status ID
    type: integer_t
    requirement: recommended
    group: primary
    from: base_event
    sibling: status
    description: The normalized identifier of the event status.
    enum:
      '0':
        caption: Unknown
      '1':
        caption: Success
      '2':
        caption: Failure
      '99':
        caption: Other
        description: The event status is not mapped. See the `status` attribute, which contains a data source specific value.
  time:
    caption: Event Time
    type: timestamp_t
    requirement: required
    group: occurrence
    from: base_event
    description: The normalized event occurrence time.
  time_dt:
    caption: Event Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: base_event
    description: The normalized event occurrence time.
  timezone_offset:
    caption: Timezone Offset
    type: integer_t
    requirement: recommended
    group: occurrence
    from: base_event
    description: The number of minutes that the reported event `time` is ahead or behind UTC, in the range -1,080 to +1,080.
  type_name:
    caption: Type Name
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event type name, as defined by the type_uid.
  type_uid:
    caption: Type ID
    type: integer_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
    enum:
      '600100':
        caption: 'Web Resources Activity: Unknown'
      '600101':
        caption: 'Web Resources Activity: Create'
        description: One or more web resources were created.
      '600102':
        caption: 'Web Resources Activity: Read'
        description: One or more web resources were read / viewed.
      '600103':
        caption: 'Web Resources Activity: Update'
        description: One or more web resources were updated.
      '600104':
        caption: 'Web Resources Activity: Delete'
        description: One or more web resources were deleted.
      '600105':
        caption: 'Web Resources Activity: Search'
        description: A search was performed on one or more web resources.
      '600106':
        caption: 'Web Resources Activity: Import'
        description: One or more web resources were imported into an Application.
      '600107':
        caption: 'Web Resources Activity: Export'
        description: One or more web resources were exported from an Application.
      '600108':
        caption: 'Web Resources Activity: Share'
        description: One or more web resources were shared.
      '600199':
        caption: 'Web Resources Activity: Other'
  unmapped:
    caption: Unmapped Data
    type: object_t
    object: object
    requirement: optional
    group: context
    from: base_event
    description: The attributes that are not mapped to the event schema. The names and values of those attributes are specific to the event source.
  web_resources:
    caption: Web Resources
    type: object_t
    object: web_resource
    array: true
    requirement: required
    group: primary
    description: Describes details about web resources that were affected by an activity/event.
  web_resources_result:
    caption: Web Resources Result
    type: object_t
    object: web_resource
    array: true
    requirement: optional
    group: primary
    description: The results of the activity on web resources. It should contain the new values of the changed attributes of the web resources.

objects:
- name: _dns
  caption: DNS
  abstract: true
  extends: object
  group: Network
  summary: The Domain Name System (DNS) object represents the shared information associated with the DNS query and answer objects.
  path: v1.0.0/objects/_dns.yaml
- name: _entity
  caption: Entity
  abstract: true
  extends: object
  group: Base
  summary: The Entity object is an unordered collection of attributes, with a name and unique identifier.
  path: v1.0.0/objects/_entity.yaml
- name: _resource
  caption: Resource
  abstract: true
  extends: _entity
  group: Base
  summary: The Resource object contains attributes that provide information about a particular resource.
  path: v1.0.0/objects/_resource.yaml
- name: account
  caption: Account
  extends: _entity
  group: Identity & Access
  summary: The Account object contains details about the account that initiated or performed a specific activity within a system or application.
  path: v1.0.0/objects/account.yaml
- name: actor
  caption: Actor
  extends: object
  group: Identity & Access
  summary: The Actor object contains details about the user, role, or process that initiated or performed a specific activity.
  path: v1.0.0/objects/actor.yaml
- name: analytic
  caption: Analytic
  extends: _entity
  group: Findings & Compliance
  summary: The Analytic object contains details about the analytic technique used to analyze and derive insights from the data or information that led to the finding or conclusion.
  path: v1.0.0/objects/analytic.yaml
- name: api
  caption: API
  extends: object
  group: Metadata & Context
  summary: The API, or Application Programming Interface, object represents information pertaining to an API request and response.
  path: v1.0.0/objects/api.yaml
- name: attack
  caption: Attack
  extends: object
  group: Threat Intelligence
  summary: The Attack object describes the technique and associated tactics related to an attack.
  path: v1.0.0/objects/attack.yaml
- name: authorization
  caption: Authorization Result
  extends: object
  group: Identity & Access
  summary: The Authorization Result object provides details about the authorization outcome and associated policies related to activity.
  path: v1.0.0/objects/authorization.yaml
- name: certificate
  caption: Digital Certificate
  extends: object
  group: Location & Geography
  summary: The Digital Certificate, also known as a Public Key Certificate, object contains information about the ownership and usage of a public key.
  path: v1.0.0/objects/certificate.yaml
- name: cis_benchmark_result
  caption: CIS Benchmark Result
  extends: object
  group: Findings & Compliance
  summary: The CIS Benchmark Result object contains information as defined by the Center for Internet Security ([CIS](https://www.cisecurity.org/cis-benchmarks/)) benchmark result.
  path: v1.0.0/objects/cis_benchmark_result.yaml
- name: cis_control
  caption: CIS Control
  extends: object
  group: Findings & Compliance
  summary: The CIS Control contains information as defined by the Center for Internet Security Critical Security Control [(CIS CSC)](https://www.cisecurity.org/controls).
  path: v1.0.0/objects/cis_control.yaml
- name: cloud
  caption: Cloud
  extends: object
  group: Cloud & Resources
  summary: The Cloud object contains information about a cloud account such as AWS Account ID, regions, etc.
  path: v1.0.0/objects/cloud.yaml
- name: compliance
  caption: Compliance
  extends: object
  group: Findings & Compliance
  summary: The Compliance object contains information about compliance requirements related of a finding generated by security tool.
  path: v1.0.0/objects/compliance.yaml
- name: container
  caption: Container
  extends: object
  observable: 27
  group: Device & Host
  summary: The Container object describes an instance of a specific container.
  path: v1.0.0/objects/container.yaml
- name: cve
  caption: CVE
  extends: object
  group: Threat Intelligence
  summary: The Common Vulnerabilities and Exposures (CVE) object represents publicly disclosed cybersecurity vulnerabilities defined in CVE Program catalog ([CVE](https://cve.mitre.org/)).
  path: v1.0.0/objects/cve.yaml
- name: cvss
  caption: CVSS Score
  extends: object
  group: Threat Intelligence
  summary: The Common Vulnerability Scoring System ([CVSS](https://www.first.org/cvss/)) object provides a way to capture the principal characteristics of a vulnerability and produce a numerical score reflecting its severity.
  path: v1.0.0/objects/cvss.yaml
- name: dce_rpc
  caption: DCE/RPC
  extends: object
  group: Network
  summary: The DCE/RPC, or Distributed Computing Environment/Remote Procedure Call, object describes the remote procedure call system for distributed computing environments.
  path: v1.0.0/objects/dce_rpc.yaml
- name: device
  caption: Device
  extends: endpoint
  observable: 20
  group: Device & Host
  summary: The Device object represents an addressable computer system or host, which is typically connected to a computer network and participates in the transmission or processing of data within the computer network.
  path: v1.0.0/objects/device.yaml
- name: device_hw_info
  caption: Device Hardware Info
  extends: object
  group: Device & Host
  summary: The Device Hardware Information object contains details and specifications of the physical components that make up a device.
  path: v1.0.0/objects/device_hw_info.yaml
- name: digital_signature
  caption: Digital Signature
  extends: object
  group: File & Data
  summary: The Digital Signature object contains information about the cryptographic mechanism used to verify the authenticity, integrity, and origin of the file or application.
  path: v1.0.0/objects/digital_signature.yaml
- name: display
  caption: Display
  extends: object
  group: Device & Host
  summary: The Display object contains information about the physical or virtual display connected to a computer system.
  path: v1.0.0/objects/display.yaml
- name: dns_answer
  caption: DNS Answer
  extends: _dns
  group: Network
  summary: The DNS Answer object represents a specific response provided by the Domain Name System (DNS) when querying for information about a domain or performing a DNS operation.
  path: v1.0.0/objects/dns_answer.yaml
- name: dns_query
  caption: DNS Query
  extends: _dns
  group: Network
  summary: The DNS query object represents a specific request made to the Domain Name System (DNS) to retrieve information about a domain or perform a DNS operation.
  path: v1.0.0/objects/dns_query.yaml
- name: email
  caption: Email
  extends: object
  observable: 22
  group: Email
  summary: The Email object describes the email metadata such as sender, recipients, and direction.
  path: v1.0.0/objects/email.yaml
- name: email_auth
  caption: Email Authentication
  extends: object
  group: Email
  summary: The Email Authentication object describes the Sender Policy Framework (SPF), DomainKeys Identified Mail (DKIM) and Domain-based Message Authentication, Reporting and Conformance (DMARC) attributes of an email.
  path: v1.0.0/objects/email_auth.yaml
- name: endpoint
  caption: Endpoint
  extends: _entity
  observable: 20
  group: Network
  summary: The Endpoint object describes a physical or virtual device that connects to and exchanges information with a computer network.
  path: v1.0.0/objects/endpoint.yaml
- name: enrichment
  caption: Enrichment
  extends: object
  group: Metadata & Context
  summary: The Enrichment object provides inline enrichment data for specific attributes of interest within an event.
  path: v1.0.0/objects/enrichment.yaml
- name: extension
  caption: Schema Extension
  extends: _entity
  group: Metadata & Context
  summary: The OCSF Schema Extension object provides detailed information about the schema extension used to construct the event.
  path: v1.0.0/objects/extension.yaml
- name: feature
  caption: Feature
  extends: _entity
  group: Metadata & Context
  summary: The Feature object provides information about the software product feature that generated a specific event.
  path: v1.0.0/objects/feature.yaml
- name: file
  caption: File
  extends: _entity
  observable: 24
  group: File & Data
  summary: The File object represents the metadata associated with a file stored in a computer system.

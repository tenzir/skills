- name: finding
  caption: Finding
  extends: object
  group: Findings & Compliance
  summary: The Finding object contains details related to a security finding generated by a security tool or system.
  path: v1.0.0/objects/finding.yaml
- name: fingerprint
  caption: Fingerprint
  extends: object
  observable: 30
  group: File & Data

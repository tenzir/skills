  path: v1.0.0/objects/san.yaml
- name: service
  caption: Service
  extends: _entity
  group: Process & Module
  summary: The Service object describes characteristics of a service, `e.g.
  path: v1.0.0/objects/service.yaml
- name: session
  caption: Session
  extends: object
  group: Identity & Access
  summary: The Session object describes details about an authenticated session. e.g.
  path: v1.0.0/objects/session.yaml

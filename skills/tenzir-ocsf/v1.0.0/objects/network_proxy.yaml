name: network_proxy
caption: Network Proxy Endpoint
extends: network_endpoint
observable: 20
description: The Network Proxy Endpoint describes characteristics of a network proxy. Defined by D3FEND [d3f:ProxyServer](https://d3fend.mitre.org/dao/artifact/d3f:ProxyServer/).
constraints:
  at_least_one: [ip, uid, name, hostname, svc_name, instance_uid, interface_uid, interface_name]
referenced_by:
  classes:
    dns_activity: [proxy]
    ftp_activity: [proxy]
    http_activity: [proxy]
    network_activity: [proxy]
    rdp_activity: [proxy]
    smb_activity: [proxy]
    ssh_activity: [proxy]
    web_resource_access_activity: [proxy]
attributes:
  domain:
    caption: Domain
    type: string_t
    requirement: optional
    from: endpoint
    description: The name of the domain.
  hostname:
    caption: Hostname
    type: hostname_t
    requirement: recommended
    from: endpoint
    observable: 1
    description: The fully qualified name of the endpoint.
  instance_uid:
    caption: Instance ID
    type: string_t
    requirement: recommended
    from: endpoint
    description: The unique identifier of a VM instance.
  interface_name:
    caption: Network Interface Name
    type: string_t
    requirement: recommended
    from: endpoint
    description: The name of the network interface (e.g. eth2).
  interface_uid:
    caption: Network Interface ID
    type: string_t
    requirement: recommended
    from: endpoint
    description: The unique identifier of the network interface.
  intermediate_ips:
    caption: Intermediate IP Addresses
    type: ip_t
    array: true
    requirement: optional
    from: network_endpoint
    observable: 2
    description: The intermediate IP Addresses. For example, the IP addresses in the HTTP X-Forwarded-For header.
  ip:
    caption: IP Address
    type: ip_t
    requirement: recommended
    from: endpoint
    observable: 2
    description: The IP address of the endpoint, in either IPv4 or IPv6 format.
  location:
    caption: Geo Location
    type: object_t
    object: location
    requirement: optional
    from: endpoint
    observable: 26
    description: The geographical location of the endpoint.
  mac:
    caption: MAC Address
    type: mac_t
    requirement: optional
    from: endpoint
    observable: 3
    description: The Media Access Control (MAC) address of the endpoint.
  name:
    caption: Name
    type: string_t
    requirement: recommended
    from: endpoint
    description: The short name of the endpoint.
  port:
    caption: Port
    type: port_t
    requirement: recommended
    from: network_endpoint
    description: The port used for communication within the network connection.
  subnet_uid:
    caption: Subnet UID
    type: string_t
    requirement: optional
    from: endpoint
    description: The unique identifier of a virtual subnet.
  svc_name:
    caption: Service Name
    type: string_t
    requirement: recommended
    from: network_endpoint
    description: The service name in service-to-service connections. For example, AWS VPC logs the pkt-src-aws-service and pkt-dst-aws-service fields identify the connection is coming from or going to an AWS service.
  uid:
    caption: Unique ID
    type: string_t
    requirement: recommended
    from: endpoint
    description: The unique identifier of the endpoint.
  vlan_uid:
    caption: VLAN
    type: string_t
    requirement: optional
    from: endpoint
    description: The Virtual LAN identifier.
  vpc_uid:
    caption: VPC UID
    type: string_t
    requirement: optional
    from: endpoint
    description: The unique identifier of the Virtual Private Cloud (VPC).

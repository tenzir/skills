# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: network_endpoint
caption: Network Endpoint
extends: endpoint
observable: 20
description: The Network Endpoint object describes characteristics of a network endpoint. These can be a source or destination of a network connection.
constraints:
  at_least_one: [ip, uid, name, hostname, svc_name, instance_uid, interface_uid, interface_name]
referenced_by:
  classes:
    account_change: [src_endpoint]
    api_activity: [dst_endpoint, src_endpoint]
    authentication: [dst_endpoint, src_endpoint]
    authorize_session: [dst_endpoint]
    dhcp_activity: [dst_endpoint, src_endpoint]
    dns_activity: [dst_endpoint, src_endpoint]
    email_activity: [dst_endpoint, src_endpoint]
    ftp_activity: [dst_endpoint, src_endpoint]
    http_activity: [dst_endpoint, src_endpoint]
    network_activity: [dst_endpoint, src_endpoint]
    network_file_activity: [src_endpoint]
    rdp_activity: [dst_endpoint, src_endpoint]
    smb_activity: [dst_endpoint, src_endpoint]
    ssh_activity: [dst_endpoint, src_endpoint]
    web_resource_access_activity: [src_endpoint]
    web_resources_activity: [dst_endpoint, src_endpoint]
attributes:
  hostname: {caption: Hostname, type: hostname_t, requirement: recommended, observable: 1, from: endpoint}
  instance_uid: {caption: Instance ID, type: string_t, requirement: recommended, from: endpoint}
  interface_name: {caption: Network Interface Name, type: string_t, requirement: recommended, from: endpoint}
  interface_uid: {caption: Network Interface ID, type: string_t, requirement: recommended, from: endpoint}
  ip: {caption: IP Address, type: ip_t, requirement: recommended, observable: 2, from: endpoint}
  name: {caption: Name, type: string_t, requirement: recommended, from: endpoint}
  port:
    caption: Port
    type: port_t
    requirement: recommended
    description: The port used for communication within the network connection.
  svc_name:
    caption: Service Name
    type: string_t
    requirement: recommended
    description: The service name in service-to-service connections. For example, AWS VPC logs the pkt-src-aws-service and pkt-dst-aws-service fields identify the connection is coming from or going to an AWS service.
  uid: {caption: Unique ID, type: string_t, requirement: recommended, from: endpoint}
  domain: {caption: Domain, type: string_t, requirement: optional, from: endpoint}
  intermediate_ips:
    caption: Intermediate IP Addresses
    type: ip_t
    array: true
    requirement: optional
    observable: 2
    description: The intermediate IP Addresses. For example, the IP addresses in the HTTP X-Forwarded-For header.
  location: {caption: Geo Location, type: object_t, object: location, requirement: optional, observable: 26, from: endpoint}
  mac: {caption: MAC Address, type: mac_t, requirement: optional, observable: 3, from: endpoint}
  subnet_uid: {caption: Subnet UID, type: string_t, requirement: optional, from: endpoint}
  vlan_uid: {caption: VLAN, type: string_t, requirement: optional, from: endpoint}
  vpc_uid: {caption: VPC UID, type: string_t, requirement: optional, from: endpoint}

name: http_response
caption: HTTP Response
extends: object
description: The HTTP Response object contains detailed information about the response sent from a web server to the requester. It encompasses attributes and metadata that describe the response status, headers, body content, and other relevant information.
referenced_by:
  classes:
    http_activity: [http_response]
    web_resource_access_activity: [http_response]
attributes:
  code:
    caption: Response Code
    type: integer_t
    requirement: required
    description: The numeric code sent from the web server to the requester.
  content_type:
    caption: HTTP Content Type
    type: string_t
    requirement: optional
    description: The request header that identifies the original [media type](https://www.iana.org/assignments/media-types/media-types.xhtml)  of the resource (prior to any content encoding applied for sending).
  latency:
    caption: Latency
    type: integer_t
    requirement: optional
    description: 'TODO: The HTTP response latency. In seconds, milliseconds, etc.?'
  length:
    caption: Response Length
    type: integer_t
    requirement: optional
    description: The HTTP response length, in number of bytes.
  message:
    caption: Message
    type: string_t
    requirement: optional
    description: The description of the event, as defined by the event source.
  status:
    caption: Status
    type: string_t
    requirement: optional
    description: 'The response status. For example: Kubernetes responseStatus.status.'

name: kernel
caption: Kernel Resource
extends: object
description: The Kernel Resource object provides information about a specific kernel resource, including its name and type. It describes essential attributes associated with a resource managed by the kernel of an operating system. Defined by D3FEND [d3f:Kernel](https://d3fend.mitre.org/dao/artifact/d3f:Kernel/).
referenced_by:
  classes:
    kernel_activity: [kernel]
attributes:
  name:
    caption: Name
    type: string_t
    requirement: required
    description: The name of the kernel resource.
  type_id:
    caption: Type ID
    type: integer_t
    requirement: required
    sibling: type
    description: The type of the kernel resource.
    enum:
      0:
        caption: Unknown
        description: The type is unknown.
      1:
        caption: Shared Mutex
      2:
        caption: System Call
      99:
        caption: Other
        description: The type is not mapped. See the `type` attribute, which may contain a data source specific value.
  is_system:
    caption: System
    type: boolean_t
    requirement: optional
    description: The indication of whether the object is part of the operating system.
  path:
    caption: Path
    type: string_t
    requirement: optional
    description: The full path of the kernel resource.
  system_call:
    caption: System Call
    type: string_t
    requirement: optional
    description: The system call that was invoked.
  type:
    caption: Type
    type: string_t
    requirement: optional
    description: The type of the kernel resource.

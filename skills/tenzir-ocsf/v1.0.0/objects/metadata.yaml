name: metadata
caption: Metadata
extends: object
description: The Metadata object describes the metadata associated with the event. Defined by D3FEND [d3f:Metadata](https://d3fend.mitre.org/dao/artifact/d3f:Metadata/).
profiles: [datetime]
referenced_by:
  classes:
    account_change: [metadata]
    api_activity: [metadata]
    application_lifecycle: [metadata]
    authentication: [metadata]
    authorize_session: [metadata]
    base_event: [metadata]
    config_state: [metadata]
    dhcp_activity: [metadata]
    dns_activity: [metadata]
    email_activity: [metadata]
    email_file_activity: [metadata]
    email_url_activity: [metadata]
    entity_management: [metadata]
    file_activity: [metadata]
    ftp_activity: [metadata]
    group_management: [metadata]
    http_activity: [metadata]
    inventory_info: [metadata]
    kernel_activity: [metadata]
    kernel_extension: [metadata]
    memory_activity: [metadata]
    module_activity: [metadata]
    network_activity: [metadata]
    network_file_activity: [metadata]
    process_activity: [metadata]
    rdp_activity: [metadata]
    scheduled_job_activity: [metadata]
    security_finding: [metadata]
    smb_activity: [metadata]
    ssh_activity: [metadata]
    user_access: [metadata]
    web_resource_access_activity: [metadata]
    web_resources_activity: [metadata]
attributes:
  correlation_uid:
    caption: Correlation UID
    type: string_t
    requirement: optional
    description: The unique identifier used to correlate events.
  event_code:
    caption: Event Code
    type: string_t
    requirement: optional
    description: The Event ID or Code that the product uses to describe the event.
  extension:
    caption: Schema Extension
    type: object_t
    object: extension
    requirement: optional
    description: The schema extension used to create the event.
  labels:
    caption: Labels
    type: string_t
    array: true
    requirement: optional
    description: |-
      The list of category labels attached to the event or specific attributes. Labels are user defined tags or aliases added at normalization time.

      For example: `["network", "connection.ip:destination", "device.ip:source"]`
  log_name:
    caption: Log Name
    type: string_t
    requirement: recommended
    description: 'The event log name. For example, syslog file name or Windows logging subsystem: Security.'
  log_provider:
    caption: Log Provider
    type: string_t
    requirement: recommended
    description: The logging provider or logging service that logged the event. For example, Microsoft-Windows-Security-Auditing.
  log_version:
    caption: Log Version
    type: string_t
    requirement: optional
    description: The event log schema version that specifies the format of the original event. For example syslog version or Cisco Log Schema Version.
  logged_time:
    caption: Logged Time
    type: timestamp_t
    requirement: optional
    description: |-
      The time when the logging system collected and logged the event.

      This attribute is distinct from the event time in that event time typically contain the time extracted from the original event. Most of the time, these two times will be different.
  logged_time_dt:
    caption: Logged Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: |-
      The time when the logging system collected and logged the event.

      This attribute is distinct from the event time in that event time typically contain the time extracted from the original event. Most of the time, these two times will be different.
  modified_time:
    caption: Modified Time
    type: timestamp_t
    requirement: optional
    description: The time when the event was last modified or enriched.
  modified_time_dt:
    caption: Modified Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the event was last modified or enriched.
  original_time:
    caption: Original Time
    type: string_t
    requirement: recommended
    description: The original event time as reported by the event source. For example, the time in the original format from system event log such as Syslog on Unix/Linux and the System event file on Windows. Omit if event is generated instead of collected via logs.
  processed_time:
    caption: Processed Time
    type: timestamp_t
    requirement: optional
    description: The event processed time, such as an ETL operation.
  processed_time_dt:
    caption: Processed Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The event processed time, such as an ETL operation.
  product:
    caption: Product
    type: object_t
    object: product
    requirement: required
    description: The product that reported the event.
  profiles:
    caption: Profiles
    type: string_t
    array: true
    requirement: optional
    description: The list of profiles used to create the event.
  sequence:
    caption: Sequence Number
    type: integer_t
    requirement: optional
    description: Sequence number of the event. The sequence number is a value available in some events, to make the exact ordering of events unambiguous, regardless of the event time precision.
  uid:
    caption: Event UID
    type: string_t
    requirement: optional
    description: The logging system-assigned unique identifier of an event instance.
  version:
    caption: Version
    type: string_t
    requirement: required
    description: 'The version of the OCSF schema, using Semantic Versioning Specification ([SemVer](https://semver.org)). For example: 1.0.0. Event consumers use the version to determine the available event attributes.'

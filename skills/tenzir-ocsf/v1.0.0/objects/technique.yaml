name: technique
caption: Technique
extends: _entity
description: The Technique object describes the technique related to an attack, as defined by [ATT&CK MatrixTM](https://attack.mitre.org/wiki/ATT&CK_Matrix).
constraints:
  at_least_one: [name, uid]
referenced_by:
  objects:
    attack: [technique]
attributes:
  name:
    caption: Name
    type: string_t
    requirement: recommended
    description: 'The name of the attack technique, as defined by [ATT&CK MatrixTM](https://attack.mitre.org/wiki/ATT&CK_Matrix). For example: `Drive-by Compromise`.'
  uid:
    caption: Unique ID
    type: string_t
    requirement: recommended
    description: 'The unique identifier of the attack technique, as defined by [ATT&CK MatrixTM](https://attack.mitre.org/wiki/ATT&CK_Matrix). For example: `T1189`.'

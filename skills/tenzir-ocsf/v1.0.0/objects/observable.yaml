name: observable
caption: Observable
extends: object
description: The observable object is a pivot element that contains related information found in many places in the event.
referenced_by:
  classes:
    account_change: [observables]
    api_activity: [observables]
    application_lifecycle: [observables]
    authentication: [observables]
    authorize_session: [observables]
    base_event: [observables]
    config_state: [observables]
    dhcp_activity: [observables]
    dns_activity: [observables]
    email_activity: [observables]
    email_file_activity: [observables]
    email_url_activity: [observables]
    entity_management: [observables]
    file_activity: [observables]
    ftp_activity: [observables]
    group_management: [observables]
    http_activity: [observables]
    inventory_info: [observables]
    kernel_activity: [observables]
    kernel_extension: [observables]
    memory_activity: [observables]
    module_activity: [observables]
    network_activity: [observables]
    network_file_activity: [observables]
    process_activity: [observables]
    rdp_activity: [observables]
    scheduled_job_activity: [observables]
    security_finding: [observables]
    smb_activity: [observables]
    ssh_activity: [observables]
    user_access: [observables]
    web_resource_access_activity: [observables]
    web_resources_activity: [observables]
attributes:
  name:
    caption: Name
    type: string_t
    requirement: required
    description: 'The full name of the observable attribute. The `name` is a pointer/reference to an attribute within the event data. For example: `file.name`.'
  type_id:
    caption: Type ID
    type: integer_t
    requirement: required
    sibling: type
    description: The observable value type identifier.
    enum:
      0:
        caption: Unknown
        description: Unknown observable data type.
      1:
        caption: Hostname
        description: |-
          Observable by Dictionary Type.
          Unique name assigned to a device connected to a computer network. A domain name in general is an Internet address that can be resolved through the Domain Name System (DNS). For example: `r2-d2.example.com`.
      2:
        caption: IP Address
        description: |-
          Observable by Dictionary Type.
          Internet Protocol address (IP address), in either IPv4 or IPv6 format.
      3:
        caption: MAC Address
        description: |-
          Observable by Dictionary Type.
          Media Access Control (MAC) address. For example: `18:36:F3:98:4F:9A`.
      4:
        caption: User Name
        description: |-
          Observable by Dictionary Type.
          User name. For example: `john_doe`.
      5:
        caption: Email Address
        description: |-
          Observable by Dictionary Type.
          Email address. For example: `john_doe@example.com`.
      6:
        caption: URL String
        description: |-
          Observable by Dictionary Type.
          Uniform Resource Locator (URL) string. For example: `http://www.example.com/download/trouble.exe`.
      7:
        caption: File Name
        description: |-
          Observable by Dictionary Type.
          File name. For example: `text-file.txt`.
      8:
        caption: File Hash
        description: |-
          Observable by Dictionary Type.
          File hash. A unique value that corresponds to the content of the file.
      9:
        caption: Process Name
        description: |-
          Observable by Dictionary Type.
          Process name. For example: `Notepad`.
      10:
        caption: Resource UID
        description: |-
          Observable by Dictionary Type.
          Resource unique identifier. For example, S3 Bucket name or EC2 Instance ID.
      20:
        caption: Endpoint
        description: |-
          Observable by Object.
          The Endpoint object describes a physical or virtual device that connects to and exchanges information with a computer network. Some examples of endpoints are mobile devices, desktop computers, virtual machines, embedded devices, and servers. Internet-of-Things devices—like cameras, lighting, refrigerators, security systems, smart speakers, and thermostats—are also endpoints.
      21:
        caption: User
        description: |-
          Observable by Object.
          The User object describes the characteristics of a user/person or a security principal. Defined by D3FEND [d3f:UserAccount](https://d3fend.mitre.org/dao/artifact/d3f:UserAccount/).
      22:
        caption: Email
        description: |-
          Observable by Object.
          The Email object describes the email metadata such as sender, recipients, and direction. Defined by D3FEND [d3f:Email](https://d3fend.mitre.org/dao/artifact/d3f:Email/).
      23:
        caption: Uniform Resource Locator
        description: |-
          Observable by Object.
          The Uniform Resource Locator(URL) object describes the characteristics of a URL. Defined in [RFC 1738](https://datatracker.ietf.org/doc/html/rfc1738) and by D3FEND [d3f:URL](https://d3fend.mitre.org/dao/artifact/d3f:URL/).
      24:
        caption: File
        description: |-
          Observable by Object.
          The File object represents the metadata associated with a file stored in a computer system. It encompasses information about the file itself, including its attributes, properties, and organizational details. Defined by D3FEND [d3f:File](https://next.d3fend.mitre.org/dao/artifact/d3f:File/).
      25:
        caption: Process
        description: |-
          Observable by Object.
          The Process object describes a running instance of a launched program. Defined by D3FEND [d3f:Process](https://d3fend.mitre.org/dao/artifact/d3f:Process/).
      26:
        caption: Geo Location
        description: |-
          Observable by Object.
          The Geo Location object describes a geographical location, usually associated with an IP address. Defined by D3FEND [d3f:PhysicalLocation](https://d3fend.mitre.org/dao/artifact/d3f:PhysicalLocation/).
      27:
        caption: Container
        description: |-
          Observable by Object.
          The Container object describes an instance of a specific container. A container is a prepackaged, portable system image that runs isolated on an existing system using a container runtime like containerd.
      30:
        caption: Fingerprint
        description: |-
          Observable by Object.
          The Fingerprint object provides detailed information about a digital fingerprint, which is a compact representation of data used to identify a longer piece of information, such as a public key or file content. It contains the algorithm and value of the fingerprint, enabling efficient and reliable identification of the associated data.
      99:
        caption: Other
        description: The observable data type is not mapped. See the `type` attribute, which may contain data source specific value.
  reputation:
    caption: Reputation Scores
    type: object_t
    object: reputation
    requirement: optional
    description: Contains the original and normalized reputation scores.
  type:
    caption: Type
    type: string_t
    requirement: optional
    description: The observable value type name.
  value:
    caption: Value
    type: string_t
    requirement: optional
    description: |-
      The value associated with the observable attribute. The meaning of the value depends on the observable type.
      If the `name` refers to a scalar attribute, then the `value` is the value of the attribute.
      If the `name` refers to an object attribute, then the `value` is not populated.

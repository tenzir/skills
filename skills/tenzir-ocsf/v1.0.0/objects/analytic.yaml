name: analytic
caption: Analytic
extends: _entity
description: The Analytic object contains details about the analytic technique used to analyze and derive insights from the data or information that led to the finding or conclusion.
referenced_by:
  classes:
    security_finding: [analytic]
  objects:
    analytic: [related_analytics]
attributes:
  name:
    caption: Name
    type: string_t
    requirement: required
    description: The name of the analytic that generated the finding.
  type_id:
    caption: Type ID
    type: integer_t
    requirement: required
    sibling: type
    description: The analytic type ID.
    enum:
      0:
        caption: Unknown
        description: The type is unknown.
      1:
        caption: Rule
      2:
        caption: Behavioral
      3:
        caption: Statistical
      4:
        caption: Learning (ML/DL)
      99:
        caption: Other
        description: The type is not mapped. See the `type` attribute, which may contain a data source specific value.
  uid:
    caption: Unique ID
    type: string_t
    requirement: recommended
    description: The unique identifier of the analytic that generated the finding.
  category:
    caption: Category
    type: string_t
    requirement: optional
    description: The analytic category.
  desc:
    caption: Description
    type: string_t
    requirement: optional
    description: The description of the analytic that generated the finding.
  related_analytics:
    caption: Related Analytics
    type: object_t
    object: analytic
    array: true
    requirement: optional
    description: Describes analytics related to the analytic of a finding or detection as identified by the security product.
  type:
    caption: Type
    type: string_t
    requirement: optional
    description: The analytic type.
  version:
    caption: Version
    type: string_t
    requirement: optional
    description: 'The analytic version. For example: `1.1`.'

name: compliance
caption: Compliance
extends: object
description: The Compliance object contains information about compliance requirements related of a finding generated by security tool.
referenced_by:
  classes:
    security_finding: [compliance]
attributes:
  requirements:
    caption: Requirements
    type: string_t
    array: true
    requirement: optional
    description: A list of applicable compliance requirements for which this finding is related to.
  status:
    caption: Status
    type: string_t
    requirement: optional
    description: The event status, normalized to the caption of the status_id value. In the case of 'Other', it is defined by the event source.
  status_detail:
    caption: Status Details
    type: string_t
    requirement: optional
    description: The status details contains additional information about the event outcome.

name: tactic
caption: Tactic
extends: _entity
description: The Tactic object describes the tactic IDs and/or name that are associated with the attack technique, as defined by [ATT&CK MatrixTM](https://attack.mitre.org/wiki/ATT&CK_Matrix).
constraints:
  at_least_one: [name, uid]
referenced_by:
  objects:
    attack: [tactics]
attributes:
  name:
    caption: Name
    type: string_t
    requirement: recommended
    description: The tactic name that is associated with the attack technique, as defined by [ATT&CK MatrixTM](https://attack.mitre.org/wiki/ATT&CK_Matrix).
  uid:
    caption: Unique ID
    type: string_t
    requirement: recommended
    description: The tactic ID that is associated with the attack technique, as defined by [ATT&CK MatrixTM](https://attack.mitre.org/wiki/ATT&CK_Matrix).

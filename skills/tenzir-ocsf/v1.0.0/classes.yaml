classes:
- name: base_event
  caption: Base Event
  uid: 0
  summary: The base event is a generic and concrete event.
  path: v1.0.0/classes/base_event.yaml
- name: system
  caption: System Activity
  category: system
  abstract: true
  extends: base_event
  summary: The System Activity event is a generic event that defines a set of attributes available in the system activity events.
  path: v1.0.0/classes/system.yaml
- name: file_activity
  caption: File System Activity
  uid: 1001
  category: system
  extends: system
  summary: File System Activity events report when a process performs an action on a file or folder.
  path: v1.0.0/classes/file_activity.yaml
- name: kernel_activity
  caption: Kernel Activity
  uid: 1003
  category: system
  extends: system
  summary: Kernel Activity events report when an process creates, reads, or deletes a kernel resource.
  path: v1.0.0/classes/kernel_activity.yaml
- name: kernel_extension
  caption: Kernel Extension Activity
  uid: 1002
  category: system
  extends: system
  summary: Kernel Extension events report when a driver/extension is loaded or unloaded into the kernel
  path: v1.0.0/classes/kernel_extension.yaml
- name: memory_activity
  caption: Memory Activity
  uid: 1004
  category: system
  extends: system
  summary: Memory Activity events report when a process has memory allocated, read/modified, or other manipulation activities - such as a buffer overflow or turning off data execution protection (DEP).
  path: v1.0.0/classes/memory_activity.yaml
- name: module_activity
  caption: Module Activity
  uid: 1005
  category: system
  extends: system
  summary: Module Activity events report when a process loads or unloads the `module`.
  path: v1.0.0/classes/module_activity.yaml
- name: process_activity
  caption: Process Activity
  uid: 1007
  category: system
  extends: system
  summary: Process Activity events report when a process launches, injects, opens or terminates another process, successful or otherwise.
  path: v1.0.0/classes/process_activity.yaml
- name: scheduled_job_activity
  caption: Scheduled Job Activity
  uid: 1006
  category: system
  extends: system
  summary: Scheduled Job Activity events report activities related to scheduled jobs or tasks.
  path: v1.0.0/classes/scheduled_job_activity.yaml
- name: win/registry_key_activity
  caption: Registry Key Activity
  uid: 201001
  category: system
  extension: win
  extends: system
  summary: Registry Key Activity events report when a process performs an action on a Windows registry key.
  path: v1.0.0/extensions/win/classes/registry_key_activity.yaml
- name: win/registry_value_activity
  caption: Registry Value Activity
  uid: 201002
  category: system
  extension: win
  extends: system
  summary: Registry Value Activity events reports when a process performs an action on a Windows registry value.
  path: v1.0.0/extensions/win/classes/registry_value_activity.yaml
- name: win/resource_activity
  caption: Windows Resource Activity
  uid: 201003
  category: system
  extension: win
  extends: system
  summary: Windows Resource Activity events report when a process accesses a Windows managed resource object, successful or otherwise.
  path: v1.0.0/extensions/win/classes/resource_activity.yaml
- name: findings
  caption: Findings
  category: findings
  abstract: true
  extends: base_event
  summary: Findings events report findings, detections, and possible resolutions of malware, anomalies, or actions performed by security products.
  path: v1.0.0/classes/findings.yaml
- name: security_finding
  caption: Security Finding
  uid: 2001
  category: findings
  extends: findings
  summary: Security Finding events describe findings, detections, anomalies, alerts and/or actions performed by security products
  path: v1.0.0/classes/security_finding.yaml
- name: iam
  caption: Identity & Access Management
  category: iam
  abstract: true
  extends: base_event
  summary: The Identity & Access Management event is a generic event that defines a set of attributes available in the access control events.
  path: v1.0.0/classes/iam.yaml
- name: account_change
  caption: Account Change
  uid: 3001
  category: iam
  extends: iam
  summary: Account Change events report when specific user account management tasks are performed, such as a user/role being created, changed, deleted, renamed, disabled, enabled, locked out or unlocked.
  path: v1.0.0/classes/account_change.yaml
- name: authentication
  caption: Authentication
  uid: 3002
  category: iam
  extends: iam
  summary: Authentication events report authentication session activities such as user attempts a logon or logoff, successfully or otherwise.
  path: v1.0.0/classes/authentication.yaml
- name: authorize_session
  caption: Authorize Session
  uid: 3003
  category: iam
  extends: iam
  summary: Authorize Session events report privileges or groups assigned to a new user session, usually at login time.
  path: v1.0.0/classes/authorize_session.yaml
- name: entity_management
  caption: Entity Management
  uid: 3004
  category: iam
  extends: iam
  summary: Entity Management events report activity by a managed client, a micro service, or a user at a management console.
  path: v1.0.0/classes/entity_management.yaml
- name: group_management
  caption: Group Management
  uid: 3006
  category: iam
  extends: iam
  summary: Group Management events report management updates to a group, including updates to membership and permissions.
  path: v1.0.0/classes/group_management.yaml
- name: user_access
  caption: User Access Management
  uid: 3005
  category: iam
  extends: iam
  summary: User Access Management events report management updates to a user's privileges.
  path: v1.0.0/classes/user_access.yaml
- name: dhcp_activity
  caption: DHCP Activity
  uid: 4004
  category: network
  extends: base_event
  summary: DHCP Activity events report MAC to IP assignment via DHCP from a client or server.
  path: v1.0.0/classes/dhcp_activity.yaml
- name: dns_activity
  caption: DNS Activity
  uid: 4003
  category: network
  extends: network_activity
  summary: DNS Activity events report DNS queries and answers as seen on the network.
  path: v1.0.0/classes/dns_activity.yaml
- name: email_activity
  caption: Email Activity
  uid: 4009
  category: network
  extends: base_event
  summary: Email events report activities of emails.
  path: v1.0.0/classes/email_activity.yaml
- name: email_file_activity
  caption: Email File Activity
  uid: 4011
  category: network
  extends: base_event
  summary: Email File Activity events report files within emails.
  path: v1.0.0/classes/email_file_activity.yaml
- name: email_url_activity
  caption: Email URL Activity
  uid: 4012
  category: network
  extends: base_event
  summary: Email URL Activity events report URLs within an email.
  path: v1.0.0/classes/email_url_activity.yaml
- name: ftp_activity
  caption: FTP Activity
  uid: 4008
  category: network
  extends: network_activity
  summary: File Transfer Protocol (FTP) Activity events report file transfers between a server and a client as seen on the network.
  path: v1.0.0/classes/ftp_activity.yaml
- name: http_activity
  caption: HTTP Activity
  uid: 4002
  category: network
  extends: network_activity
  summary: HTTP Activity events report HTTP connection and traffic information.
  path: v1.0.0/classes/http_activity.yaml
- name: network_activity
  caption: Network Activity
  uid: 4001
  category: network
  extends: base_event
  summary: Network Activity events report network connection and traffic activity.
  path: v1.0.0/classes/network_activity.yaml
- name: network_file_activity
  caption: Network File Activity
  uid: 4010
  category: network
  extends: base_event
  summary: Network File Activity events report activities on a cloud file storage service such as Box, MS OneDrive, or Google Drive.
  path: v1.0.0/classes/network_file_activity.yaml
- name: rdp_activity
  caption: RDP Activity
  uid: 4005
  category: network
  extends: network_activity
  summary: Remote Desktop Protocol (RDP) Activity events report remote client connections to a server as seen on the network.
  path: v1.0.0/classes/rdp_activity.yaml
- name: smb_activity
  caption: SMB Activity
  uid: 4006
  category: network
  extends: network_activity
  summary: Server Message Block (SMB) Protocol Activity events report client/server connections sharing resources within the network.
  path: v1.0.0/classes/smb_activity.yaml
- name: ssh_activity
  caption: SSH Activity
  uid: 4007
  category: network
  extends: network_activity
  summary: SSH Activity events report remote client connections to a server using the Secure Shell (SSH) Protocol.
  path: v1.0.0/classes/ssh_activity.yaml
- name: discovery
  caption: Discovery
  category: discovery
  abstract: true
  extends: base_event
  summary: The Discovery event is a generic event that defines a set of attributes available in Discovery category events.
  path: v1.0.0/classes/discovery.yaml
- name: config_state
  caption: Device Config State
  uid: 5002
  category: discovery
  extends: discovery
  summary: Device Config State events report device configuration data.
  path: v1.0.0/classes/config_state.yaml
- name: inventory_info
  caption: Device Inventory Info
  uid: 5001
  category: discovery
  extends: discovery
  summary: Device Inventory Info events report device inventory data.
  path: v1.0.0/classes/inventory_info.yaml
- name: application
  caption: Application Activity
  category: application
  abstract: true
  extends: base_event
  summary: The base event is a generic and concrete event.
  path: v1.0.0/classes/application.yaml
- name: api_activity
  caption: API Activity
  uid: 6003
  category: application
  extends: application
  summary: API events describe general CRUD (Create, Read, Update, Delete) API activities, e.g.
  path: v1.0.0/classes/api_activity.yaml
- name: application_lifecycle
  caption: Application Lifecycle
  uid: 6002
  category: application
  extends: application
  summary: Application Lifecycle events report installation, removal, start, stop of an application or service.
  path: v1.0.0/classes/application_lifecycle.yaml
- name: web_resource_access_activity
  caption: Web Resource Access Activity
  uid: 6004
  category: application
  extends: application
  summary: Web Resource Access Activity events describe successful/failed attempts to access a web resource over HTTP.
  path: v1.0.0/classes/web_resource_access_activity.yaml
- name: web_resources_activity
  caption: Web Resources Activity
  uid: 6001
  category: application
  extends: base_event
  summary: Web Resources Activity events describe actions executed on a set of Web Resources.
  path: v1.0.0/classes/web_resources_activity.yaml

objects:
- name: _dns
  caption: DNS
  abstract: true
  extends: object
  group: Network
  summary: The Domain Name System (DNS) object represents the shared information associated with the DNS query and answer objects.
  path: v1.2.0/objects/_dns.yaml
- name: _entity
  caption: Entity
  abstract: true
  extends: object
  group: Base
  summary: The Entity object is an unordered collection of attributes, with a name and unique identifier.
  path: v1.2.0/objects/_entity.yaml
- name: _resource
  caption: Resource
  abstract: true
  extends: _entity
  group: Base
  summary: The Resource object contains attributes that provide information about a particular resource.
  path: v1.2.0/objects/_resource.yaml
- name: account
  caption: Account
  extends: _entity
  group: Identity & Access
  summary: The Account object contains details about the account that initiated or performed a specific activity within a system or application.
  path: v1.2.0/objects/account.yaml
- name: actor
  caption: Actor
  extends: object
  group: Identity & Access
  summary: The Actor object contains details about the user, role, application, service, or process that initiated or performed a specific activity.
  path: v1.2.0/objects/actor.yaml
- name: affected_code
  caption: Affected Code
  extends: object
  group: File & Data
  summary: The Affected Code object describes details about a code block identified as vulnerable.

  path: v1.2.0/objects/agent.yaml
- name: analytic
  caption: Analytic
  extends: _entity
  group: Findings & Compliance
  summary: The Analytic object contains details about the analytic technique used to analyze and derive insights from the data or information that led to the creation of a finding or conclusion.
  path: v1.2.0/objects/analytic.yaml
- name: api
  caption: API
  extends: object
  group: Metadata & Context
  summary: The API, or Application Programming Interface, object represents information pertaining to an API request and response.
  path: v1.2.0/objects/api.yaml
- name: attack

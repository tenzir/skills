# Attributes with a `definition` path are inherited unchanged. Read that file
# for their type, object, description, enum, and observable.
name: iam
caption: Identity & Access Management
category: iam
abstract: true
extends: base_event
description: The Identity & Access Management event is a generic event that defines a set of attributes available in the access control events. As a generic event, it could be used to log events that are not otherwise defined by the IAM category.
profiles: [cloud, datetime, host]
attributes:
  activity_id:
    caption: Activity ID
    requirement: required
    definition: v1.2.0/classes/base_event.yaml
  activity_name:
    caption: Activity
    requirement: optional
    definition: v1.2.0/classes/base_event.yaml
  actor:
    caption: Actor
    type: object_t
    object: actor
    requirement: optional
    group: primary
    profile: host
    description: The actor object describes details about the user/role/process that was the source of the activity.
  api:
    caption: API Details
    requirement: optional
    profile: cloud
    definition: v1.2.0/classes/base_event.yaml
  category_name:
    caption: Category
    requirement: optional
    definition: v1.2.0/classes/base_event.yaml
  category_uid:
    caption: Category ID
    requirement: required
    definition: v1.2.0/classes/base_event.yaml
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event class name, as defined by class_uid value.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event.
    enum:
      '0':
        caption: Base Event
  cloud:
    caption: Cloud
    requirement: required
    profile: cloud
    definition: v1.2.0/classes/base_event.yaml
  count:
    caption: Count
    requirement: optional
    definition: v1.2.0/classes/base_event.yaml
  device:
    caption: Device
    type: object_t
    object: device
    requirement: recommended
    group: primary
    profile: host
    observable: 20
    description: An addressable device, computer system or host.
  duration:
    caption: Duration
    requirement: optional
    definition: v1.2.0/classes/base_event.yaml
  end_time:
    caption: End Time
    requirement: optional
    definition: v1.2.0/classes/base_event.yaml
  enrichments:
    caption: Enrichments
    requirement: optional
    definition: v1.2.0/classes/base_event.yaml
  http_request:
    caption: HTTP Request
    type: object_t
    object: http_request
    requirement: optional
    group: context
    description: Details about the underlying HTTP request.
  message:
    caption: Message
    requirement: recommended
    definition: v1.2.0/classes/base_event.yaml
  metadata:
    caption: Metadata
    requirement: required
    definition: v1.2.0/classes/base_event.yaml
  observables:
    caption: Observables
    requirement: recommended
    definition: v1.2.0/classes/base_event.yaml
  raw_data:
    caption: Raw Data
    requirement: optional
    definition: v1.2.0/classes/base_event.yaml
  severity:
    caption: Severity
    requirement: optional
    definition: v1.2.0/classes/base_event.yaml
  severity_id:
    caption: Severity ID
    requirement: required
    definition: v1.2.0/classes/base_event.yaml
  src_endpoint:
    caption: Source Endpoint
    type: object_t
    object: network_endpoint
    requirement: recommended
    group: primary
    observable: 20
    description: Details about the source of the IAM activity.
  start_time:
    caption: Start Time
    requirement: optional
    definition: v1.2.0/classes/base_event.yaml
  status:
    caption: Status
    requirement: recommended
    definition: v1.2.0/classes/base_event.yaml
  status_code:
    caption: Status Code
    requirement: recommended
    definition: v1.2.0/classes/base_event.yaml
  status_detail:
    caption: Status Details
    requirement: recommended
    definition: v1.2.0/classes/base_event.yaml
  status_id:
    caption: Status ID
    requirement: recommended
    definition: v1.2.0/classes/base_event.yaml
  time:
    caption: Event Time
    requirement: required
    definition: v1.2.0/classes/base_event.yaml
  timezone_offset:
    caption: Timezone Offset
    requirement: recommended
    definition: v1.2.0/classes/base_event.yaml
  type_name:
    caption: Type Name
    requirement: optional
    definition: v1.2.0/classes/base_event.yaml
  type_uid:
    caption: Type ID
    type: long_t
    requirement: required
    group: classification
    from: base_event
    sibling: type_name
    description: 'The event/finding type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
  unmapped:
    caption: Unmapped Data
    requirement: optional
    definition: v1.2.0/classes/base_event.yaml

# Attributes with a `definition` path are inherited unchanged. Read that file
# for their type, object, description, enum, and observable.
name: finding
caption: Finding
category: findings
abstract: true
extends: base_event
description: The Finding event is a generic event that defines a set of attributes available in the Findings category.
profiles: [cloud, datetime, host]
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the finding activity.
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Create
        description: A finding was created.
      '2':
        caption: Update
        description: A finding was updated.
      '3':
        caption: Close
        description: A finding was closed.
      '99':
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  activity_name:
    caption: Activity
    type: string_t
    requirement: optional
    group: classification
    description: The finding activity name, as defined by the `activity_id`.
  actor:
    caption: Actor
    type: object_t
    object: actor
    requirement: optional
    group: primary
    profile: host
    description: The actor object describes details about the user/role/process that was the source of the activity.
  api:
    caption: API Details
    requirement: optional
    profile: cloud
    definition: v1.2.0/classes/base_event.yaml
  category_name:
    caption: Category
    requirement: optional
    definition: v1.2.0/classes/base_event.yaml
  category_uid:
    caption: Category ID
    requirement: required
    definition: v1.2.0/classes/base_event.yaml
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event class name, as defined by class_uid value.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event.
    enum:
      '0':
        caption: Base Event
  cloud:
    caption: Cloud
    requirement: required
    profile: cloud
    definition: v1.2.0/classes/base_event.yaml
  comment:
    caption: Comment
    type: string_t
    requirement: optional
    group: context
    description: A user provided comment about the finding.
  confidence:
    caption: Confidence
    type: string_t
    requirement: optional
    group: context
    description: The confidence, normalized to the caption of the confidence_id value. In the case of 'Other', it is defined by the event source.
  confidence_id:
    caption: Confidence Id
    type: integer_t
    requirement: recommended
    group: context
    description: The normalized confidence refers to the accuracy of the rule that created the finding. A rule with a low confidence means that the finding scope is wide and may create finding reports that may not be malicious in nature.
    enum:
      '0':
        caption: Unknown
        description: The normalized confidence is unknown.
      '1':
        caption: Low
      '2':
        caption: Medium
      '3':
        caption: High
      '99':
        caption: Other
        description: The confidence is not mapped to the defined enum values. See the `confidence` attribute, which contains a data source specific value.
  confidence_score:
    caption: Confidence Score
    type: integer_t
    requirement: optional
    group: context
    description: The confidence score as reported by the event source.
  count:
    caption: Count
    requirement: optional
    definition: v1.2.0/classes/base_event.yaml
  device:
    caption: Device
    type: object_t
    object: device
    requirement: recommended
    group: primary
    profile: host
    observable: 20
    description: |-
      Describes the affected device/host. It can be used in conjunction with `Affected Resource(s)`.

      e.g. Specific details about an AWS EC2 instance, that is affected by the Finding.
  duration:
    caption: Duration
    requirement: optional
    definition: v1.2.0/classes/base_event.yaml
  end_time:
    caption: End Time
    type: timestamp_t
    requirement: optional
    group: occurrence
    description: The time of the most recent event included in the finding.
  enrichments:
    caption: Enrichments
    requirement: optional
    definition: v1.2.0/classes/base_event.yaml
  finding_info:
    caption: Finding Information
    type: object_t
    object: finding_info
    requirement: required
    group: primary
    description: Describes the supporting information about a generated finding.
  message:
    caption: Message
    requirement: recommended
    definition: v1.2.0/classes/base_event.yaml
  metadata:
    caption: Metadata
    requirement: required
    definition: v1.2.0/classes/base_event.yaml
  observables:
    caption: Observables
    requirement: recommended
    definition: v1.2.0/classes/base_event.yaml
  raw_data:
    caption: Raw Data
    requirement: optional
    definition: v1.2.0/classes/base_event.yaml
  severity:
    caption: Severity
    requirement: optional
    definition: v1.2.0/classes/base_event.yaml
  severity_id:
    caption: Severity ID
    requirement: required
    definition: v1.2.0/classes/base_event.yaml
  start_time:
    caption: Start Time
    type: timestamp_t
    requirement: optional
    group: occurrence
    description: The time of the least recent event included in the finding.
  status:
    caption: Status
    type: string_t
    requirement: optional
    group: context
    description: The normalized status of the Finding set by the consumer normalized to the caption of the status_id value. In the case of 'Other', it is defined by the source.
  status_code:
    caption: Status Code
    requirement: recommended
    definition: v1.2.0/classes/base_event.yaml
  status_detail:
    caption: Status Details
    requirement: recommended
    definition: v1.2.0/classes/base_event.yaml
  status_id:
    caption: Status ID
    type: integer_t
    requirement: recommended
    group: context
    sibling: status
    description: The normalized status identifier of the Finding, set by the consumer.
    enum:
      '0':
        caption: Unknown
        description: The status is unknown.
      '1':
        caption: New
        description: The Finding is new and yet to be reviewed.
      '2':
        caption: In Progress
        description: The Finding is under review.
      '3':
        caption: Suppressed
        description: The Finding was reviewed, determined to be benign or a false positive and is now suppressed.
      '4':
        caption: Resolved
        description: The Finding was reviewed, remediated and is now considered resolved.
      '99':
        caption: Other
        description: The event status is not mapped. See the `status` attribute, which contains a data source specific value.
  time:
    caption: Event Time
    requirement: required
    definition: v1.2.0/classes/base_event.yaml
  timezone_offset:
    caption: Timezone Offset
    requirement: recommended
    definition: v1.2.0/classes/base_event.yaml
  type_name:
    caption: Type Name
    requirement: optional
    definition: v1.2.0/classes/base_event.yaml
  type_uid:
    caption: Type ID
    type: long_t
    requirement: required
    group: classification
    from: base_event
    sibling: type_name
    description: 'The event/finding type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
  unmapped:
    caption: Unmapped Data
    requirement: optional
    definition: v1.2.0/classes/base_event.yaml

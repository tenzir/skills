name: incident_finding
caption: Incident Finding
uid: 2005
category: findings
category_uid: 2
extends: base_event
description: An Incident Finding reports the creation, update, or closure of security incidents as a result of detections and/or analytics.
profiles: [cloud, container, data_classification, datetime]
constraints:
  at_least_one: [assignee, assignee_group]
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the Incident activity.
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Create
        description: Reports the creation of an Incident.
      '2':
        caption: Update
        description: Reports updates to an Incident.
      '3':
        caption: Close
        description: Reports closure of an Incident .
      '99':
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  activity_name:
    caption: Activity
    type: string_t
    requirement: optional
    group: classification
    description: The Incident activity name, as defined by the `activity_id`.
  api:
    caption: API Details
    type: object_t
    object: api
    requirement: optional
    group: context
    profile: cloud
    from: base_event
    description: Describes details about a typical API (Application Programming Interface) call.
  assignee:
    caption: Assignee
    type: object_t
    object: user
    requirement: optional
    group: context
    observable: 21
    description: The details of the user assigned to an Incident.
  assignee_group:
    caption: Assignee Group
    type: object_t
    object: group
    requirement: optional
    group: context
    description: The details of the group assigned to an Incident.
  attacks:
    caption: MITRE ATT&CK® Details
    type: object_t
    object: attack
    array: true
    requirement: optional
    group: context
    description: An array of [MITRE ATT&CK®](https://attack.mitre.org) objects describing the tactics, techniques & sub-techniques associated to the Incident.
  category_name:
    caption: Category
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event category name, as defined by category_uid value: `Findings`.'
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event.
    enum:
      '2':
        caption: Findings
        description: Findings events report findings, detections, and possible resolutions of malware, anomalies, or other actions performed by security products.
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event class name, as defined by class_uid value: `Incident Finding`.'
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event.
    enum:
      '2005':
        caption: Incident Finding
        description: An Incident Finding reports the creation, update, or closure of security incidents as a result of detections and/or analytics.
  cloud:
    caption: Cloud
    type: object_t
    object: cloud
    requirement: required
    group: primary
    profile: cloud
    from: base_event
    description: Describes details about the Cloud environment where the event was originally created or logged.
  comment:
    caption: Comment
    type: string_t
    requirement: optional
    group: context
    description: Additional user supplied details for updating or closing the incident.
  confidence:
    caption: Confidence
    type: string_t
    requirement: optional
    group: context
    description: The confidence, normalized to the caption of the confidence_id value. In the case of 'Other', it is defined by the event source.
  confidence_id:
    caption: Confidence Id
    type: integer_t
    requirement: recommended
    group: context
    description: The normalized confidence refers to the accuracy of the rule that created the finding. A rule with a low confidence means that the finding scope is wide and may create finding reports that may not be malicious in nature.
    enum:
      '0':
        caption: Unknown
        description: The normalized confidence is unknown.
      '1':
        caption: Low
      '2':
        caption: Medium
      '3':
        caption: High
      '99':
        caption: Other
        description: The confidence is not mapped to the defined enum values. See the `confidence` attribute, which contains a data source specific value.
  confidence_score:
    caption: Confidence Score
    type: integer_t
    requirement: optional
    group: context
    description: The confidence score as reported by the event source.
  count:
    caption: Count
    type: integer_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The number of times that events in the same logical group occurred during the event Start Time to End Time period.
  desc:
    caption: Description
    type: string_t
    requirement: recommended
    group: primary
    description: The short description of the Incident.
  duration:
    caption: Duration
    type: integer_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The event duration or aggregate time, the amount of time the event covers from `start_time` to `end_time` in milliseconds.
  end_time:
    caption: End Time
    type: timestamp_t
    requirement: optional
    group: occurrence
    description: The time of the most recent event included in the incident.
  end_time_dt:
    caption: End Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    description: The time of the most recent event included in the incident.
  enrichments:
    caption: Enrichments
    type: object_t
    object: enrichment
    array: true
    requirement: optional
    group: context
    from: base_event
    description: 'The additional information from an external data source, which is associated with the event or a finding. For example add location information for the IP address in the DNS answers:`[{"name": "answers.ip", "value": "92.24.47.250", "type": "location", "data": {"city": "Socotra", "continent": "Asia", "coordinates": [-25.4153, 17.0743], "country": "YE", "desc": "Yemen"}}]`'
  finding_info_list:
    caption: Finding Information List
    type: object_t
    object: finding_info
    array: true
    requirement: required
    group: primary
    description: A list of `finding_info` objects associated to an incident.
  impact:
    caption: Impact
    type: string_t
    requirement: recommended
    group: primary
    description: The impact , normalized to the caption of the impact_id value. In the case of 'Other', it is defined by the event source.
  impact_id:
    caption: Impact ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: impact
    description: The normalized impact of the finding.
    enum:
      '0':
        caption: Unknown
        description: The normalized impact is unknown.
      '1':
        caption: Low
      '2':
        caption: Medium
      '3':
        caption: High
      '4':
        caption: Critical
      '99':
        caption: Other
        description: The impact is not mapped. See the `impact` attribute, which contains a data source specific value.
  impact_score:
    caption: Impact
    type: integer_t
    requirement: recommended
    group: primary
    description: The impact of the finding, valid range 0-100.
  is_suspected_breach:
    caption: Suspected Breach
    type: boolean_t
    requirement: optional
    group: context
    description: A determination based on analytics as to whether a potential breach was found.
  message:
    caption: Message
    type: string_t
    requirement: recommended
    group: primary
    from: base_event
    description: The description of the event/finding, as defined by the source.
  metadata:
    caption: Metadata
    type: object_t
    object: metadata
    requirement: required
    group: context
    from: base_event
    description: The metadata associated with the event or a finding.
  observables:
    caption: Observables
    type: object_t
    object: observable
    array: true
    requirement: recommended
    group: primary
    from: base_event
    description: The observables associated with the event or a finding.
  priority:
    caption: Priority
    type: string_t
    requirement: optional
    group: context
    description: The priority, normalized to the caption of the priority_id value. In the case of 'Other', it is defined by the event source.
  priority_id:
    caption: Priority ID
    type: integer_t
    requirement: recommended
    group: context
    sibling: priority
    description: The normalized priority. Priority identifies the relative importance of the finding. It is a measurement of urgency.
    enum:
      '0':
        caption: Unknown
        description: No priority is assigned.
      '1':
        caption: Low
        description: Application or personal procedure is unusable, where a workaround is available or a repair is possible.
      '2':
        caption: Medium
        description: Non-critical function or procedure is unusable or hard to use causing operational disruptions with no direct impact on a service's availability. A workaround is available.
      '3':
        caption: High
        description: Critical functionality or network access is interrupted, degraded or unusable, having a severe impact on services availability. No acceptable alternative is possible.
      '4':
        caption: Critical
        description: Interruption making a critical functionality inaccessible or a complete network interruption causing a severe impact on services availability. There is no possible alternative.
      '99':
        caption: Other
        description: The priority is not normalized.
  raw_data:
    caption: Raw Data
    type: string_t
    requirement: optional
    group: context
    from: base_event
    description: The raw event/finding data as received from the source.
  severity:
    caption: Severity
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event/finding severity, normalized to the caption of the severity_id value. In the case of 'Other', it is defined by the source.
  severity_id:
    caption: Severity ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: severity
    description: |-
      The normalized identifier of the event/finding severity.

      The normalized severity is a measurement the effort and expense required to manage and resolve an event or incident. Smaller numerical values represent lower impact events, and larger numerical values represent higher impact events.
    enum:
      '0':
        caption: Unknown
        description: The event/finding severity is unknown.
      '1':
        caption: Informational
        description: Informational message. No action required.
      '2':
        caption: Low
        description: The user decides if action is needed.
      '3':
        caption: Medium
        description: Action is required but the situation is not serious at this time.
      '4':
        caption: High
        description: Action is required immediately.
      '5':
        caption: Critical
        description: Action is required immediately and the scope is broad.
      '6':
        caption: Fatal
        description: An error occurred but it is too late to take remedial action.
      '99':
        caption: Other
        description: The event/finding severity is not mapped. See the `severity` attribute, which contains a data source specific value.
  src_url:
    caption: Source URL
    type: url_t
    requirement: recommended
    group: primary
    observable: 6
    description: A Url link used to access the original incident.
  start_time:
    caption: Start Time
    type: timestamp_t
    requirement: optional
    group: occurrence
    description: The time of the least recent event included in the incident.
  start_time_dt:
    caption: Start Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    description: The time of the least recent event included in the incident.
  status:
    caption: Status
    type: string_t
    requirement: recommended
    group: primary
    description: The normalized status of the Incident normalized to the caption of the status_id value. In the case of 'Other', it is defined by the source.
  status_code:
    caption: Status Code
    type: string_t
    requirement: recommended
    group: primary
    from: base_event
    description: |-
      The event status code, as reported by the event source.

      For example, in a Windows Failed Authentication event, this would be the value of 'Failure Code', e.g. 0x18.
  status_detail:
    caption: Status Details
    type: string_t
    requirement: recommended
    group: primary
    from: base_event
    description: The status details contains additional information about the event/finding outcome.
  status_id:
    caption: Status ID
    type: integer_t
    requirement: required
    group: primary
    sibling: status
    description: The normalized status identifier of the Incident.
    enum:
      '0':
        caption: Unknown
        description: The status is unknown.
      '1':
        caption: New
        description: The service desk has received the incident but has not assigned it to an agent.
      '2':
        caption: In Progress
        description: The incident has been assigned to an agent but has not been resolved. The agent is actively working with the user to diagnose and resolve the incident.
      '3':
        caption: On Hold
        description: The incident requires some information or response from the user or from a third party.
      '4':
        caption: Resolved
        description: The service desk has confirmed that the incident is resolved.
      '5':
        caption: Closed
        description: The incident is resolved and no further action is necessary.
      '99':
        caption: Other
        description: The event status is not mapped. See the `status` attribute, which contains a data source specific value.
  time:
    caption: Event Time
    type: timestamp_t
    requirement: required
    group: occurrence
    from: base_event
    description: The normalized event occurrence time or the finding creation time.
  time_dt:
    caption: Event Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: base_event
    description: The normalized event occurrence time or the finding creation time.
  timezone_offset:
    caption: Timezone Offset
    type: integer_t
    requirement: recommended
    group: occurrence
    from: base_event
    description: The number of minutes that the reported event `time` is ahead or behind UTC, in the range -1,080 to +1,080.
  type_name:
    caption: Type Name
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event/finding type name, as defined by the type_uid.
  type_uid:
    caption: Type ID
    type: long_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event/finding type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
    enum:
      '200500':
        caption: 'Incident Finding: Unknown'
      '200501':
        caption: 'Incident Finding: Create'
        description: Reports the creation of an Incident.
      '200502':
        caption: 'Incident Finding: Update'
        description: Reports updates to an Incident.
      '200503':
        caption: 'Incident Finding: Close'
        description: Reports closure of an Incident .
      '200599':
        caption: 'Incident Finding: Other'
  unmapped:
    caption: Unmapped Data
    type: object_t
    object: object
    requirement: optional
    group: context
    from: base_event
    description: The attributes that are not mapped to the event schema. The names and values of those attributes are specific to the event source.
  verdict:
    caption: Verdict
    type: string_t
    requirement: recommended
    group: primary
    description: The verdict assigned to an Incident finding.
  verdict_id:
    caption: Verdict ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: verdict
    description: The normalized verdict of an Incident.
    enum:
      '0':
        caption: Unknown
        description: The type is unknown.
      '1':
        caption: False Positive
        description: The incident is a false positive.
      '2':
        caption: True Positive
        description: The incident is a true positive.
      '3':
        caption: Disregard
        description: The incident can be disregarded as it is unimportant, an error or accident.
      '4':
        caption: Suspicious
        description: The incident is suspicious.
      '5':
        caption: Benign
        description: The incident is benign.
      '6':
        caption: Test
        description: The incident is a test.
      '7':
        caption: Insufficient Data
        description: The incident has insufficient data to make a verdict.
      '8':
        caption: Security Risk
        description: The incident is a security risk.
      '9':
        caption: Managed Externally
        description: The incident remediation or required actions are managed externally.
      '10':
        caption: Duplicate
        description: The incident is a duplicate.
      '99':
        caption: Other
        description: The type is not mapped. See the `type` attribute, which contains a data source specific value.

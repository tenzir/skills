# Attributes with a `definition` path are inherited unchanged. Read that file
# for their type, object, description, enum, and observable.
name: resource_details
caption: Resource Details
extends: _resource
description: The Resource Details object describes details about resources that were affected by the activity/event.
profiles: [cloud, data_classification]
constraints:
  at_least_one: [name, uid]
referenced_by:
  classes:
    api_activity: [resources]
    compliance_finding: [resource]
    data_security_finding: [resources]
    detection_finding: [resources]
    group_management: [resource]
    security_finding: [resources]
    user_access: [resource]
    vulnerability_finding: [resource]
attributes:
  agent_list:
    caption: Agent List
    type: object_t
    object: agent
    array: true
    requirement: optional
    description: A list of `agent` objects associated with a device, endpoint, or resource.
  cloud_partition:
    caption: Cloud Partition
    type: string_t
    requirement: optional
    profile: cloud
    description: 'The canonical cloud partition name to which the region is assigned (e.g. AWS Partitions: aws, aws-cn, aws-us-gov).'
  criticality:
    caption: Criticality
    type: string_t
    requirement: optional
    description: The criticality of the resource as defined by the event source.
  data:
    caption: Data
    requirement: optional
    definition: v1.2.0/objects/_resource.yaml
  data_classification:
    caption: Data Classification
    requirement: recommended
    profile: data_classification
    definition: v1.2.0/objects/_resource.yaml
  group:
    caption: Group
    type: object_t
    object: group
    requirement: optional
    description: The name of the related resource group.
  labels:
    caption: Labels
    requirement: optional
    definition: v1.2.0/objects/_resource.yaml
  name:
    caption: Name
    requirement: optional
    definition: v1.2.0/objects/_resource.yaml
  namespace:
    caption: Namespace
    type: string_t
    requirement: optional
    description: The namespace is useful when similar entities exist that you need to keep separate.
  owner:
    caption: Owner
    type: object_t
    object: user
    requirement: recommended
    observable: 21
    description: The identity of the service or user account that owns the resource.
  region:
    caption: Region
    type: string_t
    requirement: optional
    profile: cloud
    description: The cloud region of the resource.
  type:
    caption: Type
    requirement: optional
    definition: v1.2.0/objects/_resource.yaml
  uid:
    caption: Unique ID
    requirement: optional
    definition: v1.2.0/objects/_resource.yaml
  version:
    caption: Version
    type: string_t
    requirement: optional
    description: The version of the resource. For example `1.2.3`.

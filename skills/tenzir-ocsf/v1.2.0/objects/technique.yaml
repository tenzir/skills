name: technique
caption: Technique
extends: _entity
description: The Technique object describes the technique ID and/or name associated to an attack, as defined by [ATT&CK MatrixTM](https://attack.mitre.org/wiki/ATT&CK_Matrix).
constraints:
  at_least_one: [name, uid]
referenced_by:
  objects:
    attack: [technique]
attributes:
  name:
    caption: Name
    type: string_t
    requirement: recommended
    description: 'The name of the attack technique, as defined by [ATT&CK MatrixTM](https://attack.mitre.org/wiki/ATT&CK_Matrix). For example: `Active Scanning`.'
  src_url:
    caption: Source URL
    type: url_t
    requirement: optional
    observable: 6
    description: 'The versioned permalink of the attack technique, as defined by [ATT&CK MatrixTM](https://attack.mitre.org/wiki/ATT&CK_Matrix). For example: `https://attack.mitre.org/versions/v14/techniques/T1595/`.'
  uid:
    caption: Unique ID
    type: string_t
    requirement: recommended
    description: 'The unique identifier of the attack technique, as defined by [ATT&CK MatrixTM](https://attack.mitre.org/wiki/ATT&CK_Matrix). For example: `T1595`.'

name: finding_info
caption: Finding Information
extends: object
description: The Finding Information object describes metadata related to a security finding generated by a security tool or system.
profiles: [datetime]
referenced_by:
  classes:
    compliance_finding: [finding_info]
    data_security_finding: [finding_info]
    detection_finding: [finding_info]
    incident_finding: [finding_info_list]
    vulnerability_finding: [finding_info]
attributes:
  title:
    caption: Title
    type: string_t
    requirement: required
    description: A title or a brief phrase summarizing the reported finding.
  uid:
    caption: Unique ID
    type: string_t
    requirement: required
    description: The unique identifier of the reported finding.
  analytic:
    caption: Analytic
    type: object_t
    object: analytic
    requirement: recommended
    description: The analytic technique used to analyze and derive insights from the data or information that led to the finding or conclusion.
  attacks:
    caption: MITRE ATT&CK® Details
    type: object_t
    object: attack
    array: true
    requirement: optional
    description: The [MITRE ATT&CK®](https://attack.mitre.org) technique and associated tactics related to the finding.
  created_time:
    caption: Created Time
    type: timestamp_t
    requirement: optional
    description: The time when the finding was created.
  created_time_dt:
    caption: Created Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the finding was created.
  data_sources:
    caption: Data Sources
    type: string_t
    array: true
    requirement: optional
    description: A list of data sources utilized in generation of the finding.
  desc:
    caption: Description
    type: string_t
    requirement: optional
    description: The description of the reported finding.
  first_seen_time:
    caption: First Seen
    type: timestamp_t
    requirement: optional
    description: |-
      The time when the finding was first observed. e.g. The time when a vulnerability was first observed.

      It can differ from the `created_time` timestamp, which reflects the time this finding was created.
  first_seen_time_dt:
    caption: First Seen
    type: datetime_t
    requirement: optional
    profile: datetime
    description: |-
      The time when the finding was first observed. e.g. The time when a vulnerability was first observed.

      It can differ from the `created_time` timestamp, which reflects the time this finding was created.
  kill_chain:
    caption: Kill Chain
    type: object_t
    object: kill_chain_phase
    array: true
    requirement: optional
    description: The [Cyber Kill Chain®](https://www.lockheedmartin.com/en-us/capabilities/cyber/cyber-kill-chain.html) provides a detailed description of each phase and its associated activities within the broader context of a cyber attack.
  last_seen_time:
    caption: Last Seen
    type: timestamp_t
    requirement: optional
    description: |-
      The time when the finding was most recently observed. e.g. The time when a vulnerability was most recently observed.

      It can differ from the `modified_time` timestamp, which reflects the time this finding was last modified.
  last_seen_time_dt:
    caption: Last Seen
    type: datetime_t
    requirement: optional
    profile: datetime
    description: |-
      The time when the finding was most recently observed. e.g. The time when a vulnerability was most recently observed.

      It can differ from the `modified_time` timestamp, which reflects the time this finding was last modified.
  modified_time:
    caption: Modified Time
    type: timestamp_t
    requirement: optional
    description: The time when the finding was last modified.
  modified_time_dt:
    caption: Modified Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the finding was last modified.
  product_uid:
    caption: Product Identifier
    type: string_t
    requirement: optional
    description: The unique identifier of the product that reported the finding.
  related_analytics:
    caption: Related Analytics
    type: object_t
    object: analytic
    array: true
    requirement: optional
    description: Other analytics related to this finding.
  related_events:
    caption: Related Events
    type: object_t
    object: related_event
    array: true
    requirement: optional
    description: Describes events and/or other findings related to the finding as identified by the security product.
  src_url:
    caption: Source URL
    type: url_t
    requirement: optional
    observable: 6
    description: The URL pointing to the source of the finding.
  types:
    caption: Types
    type: string_t
    array: true
    requirement: optional
    description: One or more types of the reported finding.

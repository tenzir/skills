# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: device
caption: Device
extends: endpoint
observable: 20
description: The Device object represents an addressable computer system or host, which is typically connected to a computer network and participates in the transmission or processing of data within the computer network. Defined by D3FEND [d3f:Host](https://d3fend.mitre.org/dao/artifact/d3f:Host/).
profiles: [container, datetime]
constraints:
  at_least_one: [ip, uid, name, hostname, instance_uid, interface_uid, interface_name]
referenced_by:
  classes:
    account_change: [device]
    admin_group_query: [device]
    application_lifecycle: [device]
    authentication: [device]
    authorize_session: [device]
    compliance_finding: [device]
    config_state: [device]
    data_security_finding: [device]
    detection_finding: [device]
    device_config_state_change: [device]
    dhcp_activity: [device]
    dns_activity: [device]
    email_activity: [device]
    email_file_activity: [device]
    email_url_activity: [device]
    entity_management: [device]
    file_activity: [device]
    file_query: [device]
    folder_query: [device]
    ftp_activity: [device]
    group_management: [device]
    http_activity: [device]
    inventory_info: [device]
    job_query: [device]
    kernel_activity: [device]
    kernel_extension: [device]
    kernel_object_query: [device]
    memory_activity: [device]
    module_activity: [device]
    module_query: [device]
    network_activity: [device]
    network_connection_query: [device]
    network_file_activity: [device]
    networks_query: [device]
    ntp_activity: [device]
    patch_state: [device]
    peripheral_device_query: [device]
    process_activity: [device]
    process_query: [device]
    rdp_activity: [device]
    scan_activity: [device]
    scheduled_job_activity: [device]
    service_query: [device]
    session_query: [device]
    smb_activity: [device]
    ssh_activity: [device]
    tunnel_activity: [device]
    user_access: [device]
    user_query: [device]
    vulnerability_finding: [device]
    web_resource_access_activity: [device]
    web_resources_activity: [device]
  objects:
    auth_factor: [device]
    logger: [device]
attributes:
  type_id:
    caption: Type ID
    type: integer_t
    requirement: required
    sibling: type
    description: The device type ID.
    enum:
      0:
        caption: Unknown
        description: The type is unknown.
      1:
        caption: Server
        description: A [server](https://d3fend.mitre.org/dao/artifact/d3f:Server/).
      2:
        caption: Desktop
        description: A [desktop computer](https://d3fend.mitre.org/dao/artifact/d3f:DesktopComputer/).
      3:
        caption: Laptop
        description: A [laptop computer](https://d3fend.mitre.org/dao/artifact/d3f:LaptopComputer/).
      4:
        caption: Tablet
        description: A [tablet computer](https://d3fend.mitre.org/dao/artifact/d3f:TabletComputer/).
      5:
        caption: Mobile
        description: A [mobile phone](https://d3fend.mitre.org/dao/artifact/d3f:MobilePhone/).
      6:
        caption: Virtual
        description: A [virtual machine](https://d3fend.mitre.org/dao/artifact/d3f:VirtualizationSoftware/).
      7:
        caption: IOT
        description: A [IOT (Internet of Things) device](https://www.techtarget.com/iotagenda/definition/IoT-device).
      8:
        caption: Browser
        description: A [web browser](https://d3fend.mitre.org/dao/artifact/d3f:Browser/).
      9:
        caption: Firewall
        description: A [networking firewall](https://d3fend.mitre.org/dao/artifact/d3f:Firewall/).
      10:
        caption: Switch
        description: A [networking switch](https://d3fend.mitre.org/dao/artifact/d3f:Switch/).
      11:
        caption: Hub
        description: A [networking hub](https://en.wikipedia.org/wiki/Ethernet_hub).
      99:
        caption: Other
        description: The type is not mapped. See the `type` attribute, which contains a data source specific value.
  container: {caption: Container, type: object_t, object: container, requirement: recommended, group: context, profile: container, observable: 27, from: endpoint}
  hostname:
    caption: Hostname
    type: hostname_t
    requirement: recommended
    observable: 1
    description: The device hostname.
  instance_uid: {caption: Instance ID, type: string_t, requirement: recommended, from: endpoint}
  interface_name: {caption: Network Interface Name, type: string_t, requirement: recommended, from: endpoint}
  interface_uid: {caption: Network Interface ID, type: string_t, requirement: recommended, from: endpoint}
  ip:
    caption: IP Address
    type: ip_t
    requirement: recommended
    observable: 2
    description: The device IP address, in either IPv4 or IPv6 format.
  name:
    caption: Name
    type: string_t
    requirement: recommended
    description: |-
      The alternate device name, ordinarily as assigned by an administrator.

      Note: The Name could be any other string that helps to identify the device, such as a phone number; for example `310-555-1234`.
  namespace_pid: {caption: Namespace PID, type: integer_t, requirement: recommended, group: context, profile: container, from: endpoint}
  owner: {caption: Owner, type: object_t, object: user, requirement: recommended, observable: 21, from: endpoint}
  region:
    caption: Region
    type: string_t
    requirement: recommended
    description: The region where the virtual machine is located. For example, an AWS Region.
  uid:
    caption: Unique ID
    type: string_t
    requirement: recommended
    description: The unique identifier of the device. For example the Windows TargetSID or AWS EC2 ARN.
  agent_list: {caption: Agent List, type: object_t, object: agent, array: true, requirement: optional, from: endpoint}
  autoscale_uid:
    caption: Autoscale UID
    type: string_t
    requirement: optional
    description: The unique identifier of the cloud autoscale configuration.
  created_time:
    caption: Created Time
    type: timestamp_t
    requirement: optional
    description: The time when the device was known to have been created.
  created_time_dt:
    caption: Created Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the device was known to have been created.
  desc:
    caption: Description
    type: string_t
    requirement: optional
    description: The description of the device, ordinarily as reported by the operating system.
  domain:
    caption: Domain
    type: string_t
    requirement: optional
    description: 'The network domain where the device resides. For example: `work.example.com`.'
  first_seen_time:
    caption: First Seen
    type: timestamp_t
    requirement: optional
    description: The initial discovery time of the device.
  first_seen_time_dt:
    caption: First Seen
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The initial discovery time of the device.
  groups:
    caption: Groups
    type: object_t
    object: group
    array: true
    requirement: optional
    description: 'The group names to which the device belongs. For example: `["Windows Laptops", "Engineering"].`'
  hw_info: {caption: Hardware Info, type: object_t, object: device_hw_info, requirement: optional, from: endpoint}
  hypervisor:
    caption: Hypervisor
    type: string_t
    requirement: optional
    description: The name of the hypervisor running on the device. For example, `Xen`, `VMware`, `Hyper-V`, `VirtualBox`, etc.
  image:
    caption: Image
    type: object_t
    object: image
    requirement: optional
    description: The image used as a template to run the virtual machine.
  imei:
    caption: IMEI
    type: string_t
    requirement: optional
    description: The International Mobile Station Equipment Identifier that is associated with the device.
  is_compliant:
    caption: Compliant Device
    type: boolean_t
    requirement: optional
    description: The event occurred on a compliant device.
  is_managed:
    caption: Managed Device
    type: boolean_t
    requirement: optional
    description: The event occurred on a managed device.
  is_personal:
    caption: Personal Device
    type: boolean_t
    requirement: optional
    description: The event occurred on a personal device.
  is_trusted:
    caption: Trusted Device
    type: boolean_t
    requirement: optional
    description: The event occurred on a trusted device.
  last_seen_time:
    caption: Last Seen
    type: timestamp_t
    requirement: optional
    description: The most recent discovery time of the device.
  last_seen_time_dt:
    caption: Last Seen
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The most recent discovery time of the device.
  location:
    caption: Geo Location
    type: object_t
    object: location
    requirement: optional
    observable: 26
    description: The geographical location of the device.
  mac: {caption: MAC Address, type: mac_t, requirement: optional, observable: 3, from: endpoint}
  modified_time:
    caption: Modified Time
    type: timestamp_t
    requirement: optional
    description: The time when the device was last known to have been modified.
  modified_time_dt:
    caption: Modified Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the device was last known to have been modified.
  network_interfaces:
    caption: Network Interfaces
    type: object_t
    object: network_interface
    array: true
    requirement: optional
    description: |-
      The network interfaces that are associated with the device, one for each unique MAC address/IP address/hostname/name combination.

      Note: The first element of the array is the network information that pertains to the event.
  org:
    caption: Organization
    type: object_t
    object: organization
    requirement: optional
    description: Organization and org unit related to the device.
  os: {caption: OS, type: object_t, object: os, requirement: optional, from: endpoint}
  risk_level:
    caption: Risk Level
    type: string_t
    requirement: optional
    description: The risk level, normalized to the caption of the risk_level_id value. In the case of 'Other', it is defined by the event source.
  risk_level_id:
    caption: Risk Level ID
    type: integer_t
    requirement: optional
    sibling: risk_level
    description: The normalized risk level id.
    enum:
      0:
        caption: Info
      1:
        caption: Low
      2:
        caption: Medium
      3:
        caption: High
      4:
        caption: Critical
  risk_score:
    caption: Risk Score
    type: integer_t
    requirement: optional
    description: The risk score as reported by the event source.
  subnet:
    caption: Subnet
    type: subnet_t
    requirement: optional
    observable: 12
    description: The subnet mask.
  subnet_uid: {caption: Subnet UID, type: string_t, requirement: optional, from: endpoint}
  type:
    caption: Type
    type: string_t
    requirement: optional
    description: 'The device type. For example: `unknown`, `server`, `desktop`, `laptop`, `tablet`, `mobile`, `virtual`, `browser`, or `other`.'
  uid_alt:
    caption: Alternate ID
    type: string_t
    requirement: optional
    description: An alternate unique identifier of the device if any. For example the ActiveDirectory DN.
  vlan_uid: {caption: VLAN, type: string_t, requirement: optional, from: endpoint}
  vpc_uid: {caption: VPC UID, type: string_t, requirement: optional, from: endpoint}
  zone: {caption: Network Zone, type: string_t, requirement: optional, from: endpoint}

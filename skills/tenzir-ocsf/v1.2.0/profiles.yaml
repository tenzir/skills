cloud:
  caption: Cloud
  description: The attributes that describe information specific to Cloud services/applications.
  applies_to:
    classes: [account_change, admin_group_query, api_activity, application_lifecycle, authentication, authorize_session, base_event, compliance_finding, config_state, data_security_finding, datastore_activity, detection_finding, device_config_state_change, dhcp_activity, dns_activity, email_activity, email_file_activity, email_url_activity, entity_management, file_activity, file_hosting, file_query, folder_query, ftp_activity, group_management, http_activity, incident_finding, inventory_info, job_query, kernel_activity, kernel_extension, kernel_object_query, memory_activity, module_activity, module_query, network_activity, network_connection_query, network_file_activity, networks_query, ntp_activity, patch_state, peripheral_device_query, process_activity, process_query, rdp_activity, scan_activity, scheduled_job_activity, security_finding, service_query, session_query, smb_activity, ssh_activity, tunnel_activity, user_access, user_inventory, user_query, vulnerability_finding, web_resource_access_activity, web_resources_activity]
    objects: [resource_details]
  attributes:
    api:
      caption: API Details
      type: object_t
      object: api
      requirement: optional
      group: context
      description: Describes details about a typical API (Application Programming Interface) call.
    cloud:
      caption: Cloud
      type: object_t
      object: cloud
      requirement: required
      group: primary
      description: Describes details about the Cloud environment where the event was originally created or logged.
container:
  caption: Container
  description: The container context for a process.
  applies_to:
    objects: [device, endpoint, network_endpoint, network_proxy, process]
  attributes:
    container:
      caption: Container
      type: object_t
      object: container
      requirement: recommended
      group: context
      observable: 27
      description: The information describing an instance of a container. A container is a prepackaged, portable system image that runs isolated on an existing system using a container runtime like containerd.
    namespace_pid:
      caption: Namespace PID
      type: integer_t
      requirement: recommended
      group: context
      description: If running under a process namespace (such as in a container), the process identifier within that process namespace.
data_classification:
  caption: Data Classification
  description: The attributes that describe information specific to data classification.
  applies_to:
    objects: [database, databucket, email, file, metadata, product, resource_details, web_resource]
  attributes:
    data_classification:
      caption: Data Classification
      type: object_t
      object: data_classification
      requirement: recommended
      group: context
      description: The Data Classification object includes information about data classification levels and data category types.
datetime:
  caption: Date/Time
  description: This profile defines date/time attributes as defined in RFC-3339. For example 1985-04-12T23:20:50.52Z.
  applies_to:
    classes: [account_change, admin_group_query, api_activity, application_lifecycle, authentication, authorize_session, base_event, compliance_finding, config_state, data_security_finding, datastore_activity, detection_finding, device_config_state_change, dhcp_activity, dns_activity, email_activity, email_file_activity, email_url_activity, entity_management, file_activity, file_hosting, file_query, folder_query, ftp_activity, group_management, http_activity, incident_finding, inventory_info, job_query, kernel_activity, kernel_extension, kernel_object_query, memory_activity, module_activity, module_query, network_activity, network_connection_query, network_file_activity, networks_query, ntp_activity, patch_state, peripheral_device_query, process_activity, process_query, rdp_activity, scan_activity, scheduled_job_activity, security_finding, service_query, session_query, smb_activity, ssh_activity, tunnel_activity, user_access, user_inventory, user_query, vulnerability_finding, web_resource_access_activity, web_resources_activity]
  attributes: {}
host:

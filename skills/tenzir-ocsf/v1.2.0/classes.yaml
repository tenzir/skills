  extends: discovery_result
  summary: Registry Key Query events report information about discovered Windows registry keys.
  path: v1.2.0/extensions/win/classes/registry_key_query.yaml
- name: win/registry_value_query
  caption: Registry Value Query
  uid: 205005
  category: discovery
  extension: win
  extends: discovery_result
  summary: Registry Value Query events report information about discovered Windows registry values.
  path: v1.2.0/extensions/win/classes/registry_value_query.yaml
- name: application
  caption: Application Activity
  category: application
  abstract: true
  extends: base_event
  summary: The base event is a generic and concrete event.
  path: v1.2.0/classes/application.yaml
- name: api_activity
  caption: API Activity
  uid: 6003
  category: application
  extends: application
  summary: API events describe general CRUD (Create, Read, Update, Delete) API activities, e.g.
  path: v1.2.0/classes/api_activity.yaml
- name: application_lifecycle
  caption: Application Lifecycle
  uid: 6002
  category: application
  extends: application
  summary: Application Lifecycle events report installation, removal, start, stop of an application or service.
  path: v1.2.0/classes/application_lifecycle.yaml
- name: datastore_activity
  caption: Datastore Activity
  uid: 6005
  category: application
  extends: application
  summary: Datastore events describe general activities (Read, Update, Query, Delete, etc.) which affect datastores or data within those datastores, e.g.
  path: v1.2.0/classes/datastore_activity.yaml

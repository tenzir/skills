  uid: 5004
  category: discovery
  extends: discovery
  summary: Operating System Patch State reports the installation of an OS patch to a device and any associated knowledgebase articles.
  path: v1.2.0/classes/patch_state.yaml
- name: peripheral_device_query
  caption: Peripheral Device Query
  uid: 5014
  category: discovery
  extends: discovery_result
  summary: Peripheral Device Query events report information about peripheral devices.
  path: v1.2.0/classes/peripheral_device_query.yaml
- name: process_query
  caption: Process Query
  uid: 5015
  category: discovery
  extends: discovery_result
  summary: Process Query events report information about running processes.
  path: v1.2.0/classes/process_query.yaml
- name: service_query
  caption: Service Query
  uid: 5016
  category: discovery
  extends: discovery_result
  summary: Service Query events report information about running services.
  path: v1.2.0/classes/service_query.yaml
- name: session_query
  caption: User Session Query
  uid: 5017
  category: discovery
  extends: discovery_result
  summary: User Session Query events report information about existing user sessions.
  path: v1.2.0/classes/session_query.yaml
- name: user_inventory
  caption: User Inventory Info
  uid: 5003
  category: discovery
  extends: discovery
  summary: User Inventory Info events report user inventory data that is either logged or proactively collected.
  path: v1.2.0/classes/user_inventory.yaml
- name: user_query
  caption: User Query
  uid: 5018
  category: discovery
  extends: discovery_result
  summary: User Query events report user data that have been discovered, queried, polled or searched.
  path: v1.2.0/classes/user_query.yaml
- name: win/prefetch_query
  caption: Prefetch Query
  uid: 205019
  category: discovery

  extends: discovery
  summary: Device Config State Change events report state changes that impact the security of the device.
  path: v1.2.0/classes/device_config_state_change.yaml
- name: file_query
  caption: File Query
  uid: 5007
  category: discovery
  extends: discovery_result
  summary: File Query events report information about files that are present on the system.
  path: v1.2.0/classes/file_query.yaml
- name: folder_query
  caption: Folder Query
  uid: 5008
  category: discovery
  extends: discovery_result
  summary: Folder Query events report information about folders that are present on the system.
  path: v1.2.0/classes/folder_query.yaml
- name: inventory_info
  caption: Device Inventory Info
  uid: 5001
  category: discovery
  extends: discovery
  summary: Device Inventory Info events report device inventory data that is either logged or proactively collected.
  path: v1.2.0/classes/inventory_info.yaml
- name: job_query
  caption: Job Query
  uid: 5010
  category: discovery
  extends: discovery_result
  summary: Job Query events report information about scheduled jobs.
  path: v1.2.0/classes/job_query.yaml
- name: kernel_object_query
  caption: Kernel Object Query
  uid: 5006
  category: discovery
  extends: discovery_result
  summary: Kernel Object Query events report information about discovered kernel resources.
  path: v1.2.0/classes/kernel_object_query.yaml
- name: module_query
  caption: Module Query
  uid: 5011
  category: discovery
  extends: discovery_result
  summary: Module Query events report information about loaded modules.
  path: v1.2.0/classes/module_query.yaml
- name: network_connection_query
  caption: Network Connection Query
  uid: 5012
  category: discovery
  extends: discovery_result
  summary: Network Connection Query events report information about active network connections.
  path: v1.2.0/classes/network_connection_query.yaml
- name: networks_query
  caption: Networks Query
  uid: 5013
  category: discovery
  extends: discovery_result
  summary: Networks Query events report information about network adapters.
  path: v1.2.0/classes/networks_query.yaml
- name: patch_state

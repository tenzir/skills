name: win/reg_key
caption: Registry Key
extension: win
extends: object
observable: 28
description: The registry key object describes a Windows registry key. Defined by D3FEND [d3f:WindowsRegistryKey](https://d3fend.mitre.org/dao/artifact/d3f:WindowsRegistryKey/).
profiles: [datetime]
referenced_by:
  classes:
    win/registry_key_activity: [prev_reg_key, reg_key]
    win/registry_key_query: [reg_key]
attributes:
  is_system:
    caption: System
    type: boolean_t
    requirement: optional
    description: The indication of whether the object is part of the operating system.
  modified_time:
    caption: Modified Time
    type: timestamp_t
    requirement: optional
    description: The time when the registry key was last modified.
  modified_time_dt:
    caption: Modified Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the registry key was last modified.
  path:
    caption: Path
    type: string_t
    requirement: required
    description: The full path to the registry key.
  security_descriptor:
    caption: Security Descriptor
    type: string_t
    requirement: optional
    description: The security descriptor of the registry key.

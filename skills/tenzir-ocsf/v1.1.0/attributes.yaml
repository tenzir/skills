  description: The time when the object was created. See specific usage.
  used_by:
    objects: [certificate, cve, database, databucket, device, digital_signature, epss, file, finding, finding_info, job, kb_article, ldap_person, process, session, table]
creator:
  caption: Creator
  type: object_t
  object: user
  observable: 21
  description: The user that created the object associated with event. See specific usage.
  used_by:
    objects: [file]
credential_uid:
  caption: User Credential ID
  type: string_t
  description: The unique identifier of the user's credential. For example, AWS Access Key ID.
  used_by:
    objects: [session, user]
criticality:
  caption: Criticality
  type: string_t
  description: Criticality of a resource/object in question
  used_by:
    objects: [resource_details]
customer_uid:
  caption: Customer UID
  type: string_t
  deprecated:
    since: 1.1.0
    message: Use the  `tenant_uid`  attribute instead.
  description: The unique customer identifier.
cve:
  caption: CVE
  type: object_t
  object: cve
  description: The Common Vulnerabilities and Exposures ([CVE](https://cve.mitre.org/)).
  used_by:
    objects: [vulnerability]
cves:
  caption: CVE List
  type: object_t
  object: cve
  array: true
  description: List of Common Vulnerabilities and Exposures ([CVE](https://cve.mitre.org/)).
  used_by:
    objects: [malware]
cvss:
  caption: CVSS Score
  type: object_t
  object: cvss
  array: true
  description: The CVSS object details Common Vulnerability Scoring System ([CVSS](https://www.first.org/cvss/)) scores from the advisory that are related to the vulnerability.
  used_by:
    objects: [cve]
cwe:
  caption: CWE
  type: object_t
  object: cwe
  description: The CWE object represents a weakness in a software system that can be exploited by a threat actor to perform an attack. The CWE object is based on the [Common Weakness Enumeration (CWE)](https://cwe.mitre.org/) catalog.
  used_by:
    objects: [cve, vulnerability]
cwe_uid:
  caption: CWE UID
  type: string_t
  deprecated:
    since: 1.1.0
    message: Use the  `cwe`  object attributes instead.
  description: 'The [Common Weakness Enumeration (CWE)](https://cwe.mitre.org/) unique identifier. For example: `CWE-787`.'
  used_by:
    objects: [cve]
cwe_url:
  caption: CWE URL
  type: url_t
  observable: 6
  deprecated:
    since: 1.1.0
    message: Use the  `cwe`  object attributes instead.
  description: 'Common Weakness Enumeration (CWE) definition URL. For example: `https://cwe.mitre.org/data/definitions/787.html`.'
  used_by:
    objects: [cve]

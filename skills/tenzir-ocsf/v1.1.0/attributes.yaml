  type: string_t
  description: The unique command identifier.
  used_by:
    classes: [scan_activity]
comment:
  caption: Comment
  type: string_t
  description: The user-provided comment.
  used_by:
    classes: [compliance_finding, detection_finding, entity_management, incident_finding, vulnerability_finding]
company_name:
  caption: Company Name
  type: string_t
  description: 'The name of the company that published the file. For example: `Microsoft Corporation`.'
  used_by:
    objects: [file]
compliance:
  caption: Compliance
  type: object_t
  object: compliance
  description: The compliance object provides context to compliance findings (e.g., a check against a specific regulatory or best practice framework such as CIS, NIST etc.) and contains compliance related details.
  used_by:
    classes: [compliance_finding, security_finding]
component:
  caption: Component
  type: string_t
  description: |-
    The name or relative pathname of a sub-component of the data object, if applicable.

    For example: `attachment.doc`, `attachment.zip/bad.doc`, or `part.mime/part.cab/part.uue/part.doc`.
  used_by:
    classes: [file_activity]
condition:
  caption: Condition
  type: string_t
  description: 'The rule trigger condition for the rule. For example: SQL_INJECTION.'
  used_by:
    objects: [firewall_rule]
confidence:
  caption: Confidence
  type: string_t
  description: The confidence, normalized to the caption of the confidence_id value. In the case of 'Other', it is defined by the event source.
  used_by:
    classes: [compliance_finding, detection_finding, incident_finding, security_finding, vulnerability_finding]
confidence_id:
  caption: Confidence Id
  type: integer_t
  description: The normalized confidence refers to the accuracy of the rule that created the finding. A rule with a low confidence means that the finding scope is wide and may create finding reports that may not be malicious in nature.
  used_by:
    classes: [compliance_finding, detection_finding, incident_finding, security_finding, vulnerability_finding]
confidence_score:
  caption: Confidence Score
  type: integer_t
  description: The confidence score as reported by the event source.
  used_by:
    classes: [compliance_finding, detection_finding, incident_finding, security_finding, vulnerability_finding]
confidentiality:
  caption: Confidentiality
  type: string_t
  description: The file content confidentiality, normalized to the confidentiality_id value. In the case of 'Other', it is defined by the event source.
  used_by:
    objects: [file]
confidentiality_id:
  caption: Confidentiality ID
  type: integer_t
  sibling: confidentiality
  description: The normalized identifier of the file content confidentiality indicator.
  used_by:
    objects: [file]
connection_info:
  caption: Connection Info
  type: object_t
  object: network_connection_info
  description: The network connection information.
  used_by:
    classes: [dhcp_activity, dns_activity, file_hosting, ftp_activity, http_activity, network_activity, network_file_activity, ntp_activity, rdp_activity, smb_activity, ssh_activity]
    objects: [evidences]
connection_uid:
  caption: Connection Identifier
  type: string_t
  description: The network connection identifier.
  used_by:
    classes: [file_activity]
container:
  caption: Container
  type: object_t
  object: container
  observable: 27
  description: The information describing an instance of a container. A container is a prepackaged, portable system image that runs isolated on an existing system using a container runtime like containerd.
  used_by:
    objects: [device, endpoint, network_endpoint, network_proxy, process]
containers:
  caption: Containers
  type: object_t
  object: container
  array: true
  observable: 27
  description: When working with containerized applications, the set of containers which write to the standard the output of a particular logging driver. For example, this may be the set of containers involved in handling api requests and responses for a containerized application.
  used_by:
    objects: [request, response]
content_type:
  caption: HTTP Content Type
  type: string_t
  description: The request header that identifies the original [media type](https://www.iana.org/assignments/media-types/media-types.xhtml)  of the resource (prior to any content encoding applied for sending).
  used_by:
    objects: [http_response]
continent:
  caption: Continent
  type: string_t
  description: The name of the continent.
  used_by:
    objects: [location]
control:
  caption: Security Control
  type: string_t
  description: A Control is prescriptive, prioritized, and simplified set of best practices that one can use to strengthen their cybersecurity posture. e.g. AWS SecurityHub Controls, CIS Controls.
  used_by:
    objects: [cis_csc, compliance]
coordinates:
  caption: Coordinates
  type: float_t
  array: true
  description: 'A two-element array, containing a longitude/latitude pair. The format conforms with [GeoJSON](https://geojson.org). For example: `[-73.983, 40.719]`.'
  used_by:
    objects: [location]
correlation_uid:
  caption: Correlation UID
  type: string_t
  description: The unique identifier used to correlate events.
  used_by:
    objects: [metadata]
cost_center:
  caption: Cost Center
  type: string_t
  description: The cost center associated with the user.
  used_by:
    objects: [ldap_person]
count:
  caption: Count
  type: integer_t
  description: The number of times that events in the same logical group occurred during the event Start Time to End Time period.
  used_by:
    classes: [account_change, api_activity, application_lifecycle, authentication, authorize_session, base_event, compliance_finding, config_state, datastore_activity, detection_finding, device_config_state_change, dhcp_activity, dns_activity, email_activity, email_file_activity, email_url_activity, entity_management, file_activity, file_hosting, ftp_activity, group_management, http_activity, incident_finding, inventory_info, kernel_activity, kernel_extension, memory_activity, module_activity, network_activity, network_file_activity, ntp_activity, patch_state, process_activity, rdp_activity, scan_activity, scheduled_job_activity, security_finding, smb_activity, ssh_activity, user_access, user_inventory, vulnerability_finding, web_resource_access_activity, web_resources_activity]
    objects: [session]
country:
  caption: Country
  type: string_t
  description: |-
    The ISO 3166-1 Alpha-2 country code. For the complete list of country codes see [ISO 3166-1 alpha-2 codes](https://www.iso.org/obp/ui/#iso:pub:PUB500001:en).

    Note: The two letter country code should be capitalized. For example: `US` or `CA`.
  used_by:
    objects: [location, os]
cpe_name:
  caption: The product CPE identifier
  type: string_t
  description: 'The Common Platform Enumeration (CPE) name as described by ([NIST](https://nvd.nist.gov/products/cpe)) For example: `cpe:/a:apple:safari:16.2`.'
  used_by:
    objects: [os, product]
cpu_bits:
  caption: CPU Bits
  type: integer_t
  description: 'The cpu architecture, the number of bits used for addressing in memory. For example: `32` or `64`.'
  used_by:
    objects: [device_hw_info, os]
cpu_cores:
  caption: CPU Cores
  type: integer_t
  description: 'The number of processor cores in all installed processors. For Example: `42`.'
  used_by:
    objects: [device_hw_info]
cpu_count:
  caption: CPU Count
  type: integer_t
  description: 'The number of physical processors on a system. For example: `1`.'
  used_by:
    objects: [device_hw_info]
cpu_speed:
  caption: Processor Speed
  type: integer_t
  description: 'The speed of the processor in Mhz. For Example: `4200`.'
  used_by:
    objects: [device_hw_info]
cpu_type:
  caption: Processor Type
  type: string_t
  description: 'The processor type. For example: `x86 Family 6 Model 37 Stepping 5`.'
  used_by:
    objects: [device_hw_info]
create_mask:
  caption: Create Mask
  type: string_t
  description: The original Windows mask that is required to create the object.
  used_by:
    classes: [file_activity]
created_time:
  caption: Created Time
  type: timestamp_t
  description: The time when the object was created. See specific usage.
  used_by:
    objects: [certificate, cve, database, databucket, device, digital_signature, epss, file, finding, finding_info, job, kb_article, ldap_person, process, session, table]
created_time_dt:
  caption: Created Time

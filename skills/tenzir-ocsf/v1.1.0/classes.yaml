classes:
- name: base_event
  caption: Base Event
  uid: 0
  summary: The base event is a generic and concrete event.
  path: v1.1.0/classes/base_event.yaml
- name: system
  caption: System Activity
  category: system
  abstract: true
  extends: base_event
  summary: The System Activity event is a generic event that defines a set of attributes available in the system activity events.
  path: v1.1.0/classes/system.yaml
- name: file_activity
  caption: File System Activity
  uid: 1001
  category: system
  extends: system
  summary: File System Activity events report when a process performs an action on a file or folder.
  activities: {1: Create, 2: Read, 3: Update, 4: Delete, 5: Rename, 6: Set Attributes, 7: Set Security, 8: Get Attributes, 9: Get Security, 10: Encrypt, 11: Decrypt, 12: Mount, 13: Unmount, 14: Open}
  path: v1.1.0/classes/file_activity.yaml
- name: kernel_activity
  caption: Kernel Activity
  uid: 1003
  category: system
  extends: system
  summary: Kernel Activity events report when an process creates, reads, or deletes a kernel resource.
  activities: {1: Create, 2: Read, 3: Delete, 4: Invoke}
  path: v1.1.0/classes/kernel_activity.yaml
- name: kernel_extension
  caption: Kernel Extension Activity
  uid: 1002
  category: system
  extends: system
  summary: Kernel Extension events report when a driver/extension is loaded or unloaded into the kernel
  activities: {1: Load, 2: Unload}
  path: v1.1.0/classes/kernel_extension.yaml
- name: memory_activity
  caption: Memory Activity
  uid: 1004
  category: system
  extends: system
  summary: Memory Activity events report when a process has memory allocated, read/modified, or other manipulation activities - such as a buffer overflow or turning off data execution protection (DEP).
  activities: {1: Allocate Page, 2: Modify Page, 3: Delete Page, 4: Buffer Overflow, 5: Disable DEP, 6: Enable DEP, 7: Read, 8: Write}
  path: v1.1.0/classes/memory_activity.yaml
- name: module_activity
  caption: Module Activity
  uid: 1005
  category: system
  extends: system
  summary: Module Activity events report when a process loads or unloads the `module`.
  activities: {1: Load, 2: Unload}
  path: v1.1.0/classes/module_activity.yaml
- name: process_activity
  caption: Process Activity
  uid: 1007
  category: system
  extends: system
  summary: Process Activity events report when a process launches, injects, opens or terminates another process, successful or otherwise.
  activities: {1: Launch, 2: Terminate, 3: Open, 4: Inject, 5: Set User ID}
  path: v1.1.0/classes/process_activity.yaml
- name: scheduled_job_activity
  caption: Scheduled Job Activity
  uid: 1006
  category: system
  extends: system
  summary: Scheduled Job Activity events report activities related to scheduled jobs or tasks.
  activities: {1: Create, 2: Update, 3: Delete, 4: Enable, 5: Disable, 6: Start}
  path: v1.1.0/classes/scheduled_job_activity.yaml
- name: win/registry_key_activity
  caption: Registry Key Activity
  uid: 201001
  category: system
  extension: win
  extends: system
  summary: Registry Key Activity events report when a process performs an action on a Windows registry key.
  activities: {1: Create, 2: Read, 3: Modify, 4: Delete, 5: Rename, 6: Set Security, 7: Restore, 8: Import, 9: Export}
  path: v1.1.0/extensions/win/classes/registry_key_activity.yaml
- name: win/registry_value_activity
  caption: Registry Value Activity
  uid: 201002
  category: system
  extension: win
  extends: system
  summary: Registry Value Activity events reports when a process performs an action on a Windows registry value.
  activities: {1: Get, 2: Set, 3: Modify, 4: Delete}
  path: v1.1.0/extensions/win/classes/registry_value_activity.yaml
- name: win/resource_activity
  caption: Windows Resource Activity
  uid: 201003
  category: system
  extension: win
  extends: system
  summary: Windows Resource Activity events report when a process accesses a Windows managed resource object, successful or otherwise.
  activities: {1: Access}
  path: v1.1.0/extensions/win/classes/resource_activity.yaml
- name: finding
  caption: Finding
  category: findings
  abstract: true
  extends: base_event
  summary: The Finding event is a generic event that defines a set of attributes available in the Findings category.
  path: v1.1.0/classes/finding.yaml
- name: compliance_finding
  caption: Compliance Finding
  uid: 2003
  category: findings
  extends: finding
  summary: Compliance Finding events describe results of evaluations performed against resources, to check compliance with various Industry Frameworks or Security Standards such as `NIST SP 800-53, CIS AWS Foundations Benchmark v1.4.0, ISO/IEC 27001` etc.
  activities: {1: Create, 2: Update, 3: Close}
  path: v1.1.0/classes/compliance_finding.yaml
- name: detection_finding
  caption: Detection Finding
  uid: 2004
  category: findings
  extends: finding
  summary: A Detection Finding describes detections or alerts generated by security products using correlation engines, detection engines or other methodologies.
  activities: {1: Create, 2: Update, 3: Close}
  path: v1.1.0/classes/detection_finding.yaml
- name: incident_finding
  caption: Incident Finding
  uid: 2005
  category: findings
  extends: base_event
  summary: An Incident Finding reports the creation, update, or closure of security incidents as a result of detections and/or analytics.
  activities: {1: Create, 2: Update, 3: Close}
  path: v1.1.0/classes/incident_finding.yaml
- name: security_finding
  caption: Security Finding
  uid: 2001
  category: findings
  extends: base_event
  deprecated: true
  summary: Security Finding events describe findings, detections, anomalies, alerts and/or actions performed by security products
  activities: {1: Create, 2: Update, 3: Close}
  path: v1.1.0/classes/security_finding.yaml
- name: vulnerability_finding
  caption: Vulnerability Finding
  uid: 2002
  category: findings
  extends: finding
  summary: The Vulnerability Finding event is a notification about weakness in an information system, system security procedures, internal controls, or implementation that could be exploited or triggered by a threat source.
  activities: {1: Create, 2: Update, 3: Close}
  path: v1.1.0/classes/vulnerability_finding.yaml
- name: iam
  caption: Identity & Access Management
  category: iam
  abstract: true
  extends: base_event
  summary: The Identity & Access Management event is a generic event that defines a set of attributes available in the access control events.
  path: v1.1.0/classes/iam.yaml
- name: account_change
  caption: Account Change
  uid: 3001
  category: iam
  extends: iam
  summary: Account Change events report when specific user account management tasks are performed, such as a user/role being created, changed, deleted, renamed, disabled, enabled, locked out or unlocked.
  activities: {1: Create, 2: Enable, 3: Password Change, 4: Password Reset, 5: Disable, 6: Delete, 7: Attach Policy, 8: Detach Policy, 9: Lock, 10: MFA Factor Enable, 11: MFA Factor Disable}
  path: v1.1.0/classes/account_change.yaml
- name: authentication
  caption: Authentication
  uid: 3002
  category: iam
  extends: iam
  summary: Authentication events report authentication session activities such as user attempts a logon or logoff, successfully or otherwise.
  activities: {1: Logon, 2: Logoff, 3: Authentication Ticket, 4: Service Ticket Request, 5: Service Ticket Renew}
  path: v1.1.0/classes/authentication.yaml
- name: authorize_session
  caption: Authorize Session
  uid: 3003
  category: iam
  extends: iam
  summary: Authorize Session events report privileges or groups assigned to a new user session, usually at login time.
  activities: {1: Assign Privileges, 2: Assign Groups}
  path: v1.1.0/classes/authorize_session.yaml
- name: entity_management
  caption: Entity Management
  uid: 3004
  category: iam
  extends: iam
  summary: Entity Management events report activity by a managed client, a micro service, or a user at a management console.
  activities: {1: Create, 2: Read, 3: Update, 4: Delete}
  path: v1.1.0/classes/entity_management.yaml
- name: group_management
  caption: Group Management
  uid: 3006
  category: iam
  extends: iam
  summary: Group Management events report management updates to a group, including updates to membership and permissions.
  activities: {1: Assign Privileges, 2: Revoke Privileges, 3: Add User, 4: Remove User, 5: Delete, 6: Create}
  path: v1.1.0/classes/group_management.yaml
- name: user_access
  caption: User Access Management
  uid: 3005
  category: iam
  extends: iam
  summary: User Access Management events report management updates to a user's privileges.
  activities: {1: Assign Privileges, 2: Revoke Privileges}
  path: v1.1.0/classes/user_access.yaml
- name: network
  caption: Network
  category: network
  abstract: true
  extends: base_event
  summary: Network event is a generic event that defines a set of attributes available in the Network category.
  path: v1.1.0/classes/network.yaml
- name: dhcp_activity
  caption: DHCP Activity
  uid: 4004
  category: network
  extends: network
  summary: DHCP Activity events report MAC to IP assignment via DHCP from a client or server.
  activities: {1: Discover, 2: Offer, 3: Request, 4: Decline, 5: Ack, 6: Nak, 7: Release, 8: Inform, 9: Expire}
  path: v1.1.0/classes/dhcp_activity.yaml
- name: dns_activity
  caption: DNS Activity
  uid: 4003
  category: network
  extends: network
  summary: DNS Activity events report DNS queries and answers as seen on the network.
  activities: {1: Query, 2: Response, 6: Traffic}
  path: v1.1.0/classes/dns_activity.yaml
- name: email_activity
  caption: Email Activity
  uid: 4009
  category: network
  extends: base_event
  summary: Email events report activities of emails.
  activities: {1: Send, 2: Receive, 3: Scan}
  path: v1.1.0/classes/email_activity.yaml
- name: email_file_activity
  caption: Email File Activity
  uid: 4011
  category: network
  extends: base_event
  summary: Email File Activity events report files within emails.
  activities: {1: Send, 2: Receive, 3: Scan}
  path: v1.1.0/classes/email_file_activity.yaml
- name: email_url_activity
  caption: Email URL Activity
  uid: 4012
  category: network
  extends: base_event
  summary: Email URL Activity events report URLs within an email.
  activities: {1: Send, 2: Receive, 3: Scan}
  path: v1.1.0/classes/email_url_activity.yaml
- name: ftp_activity
  caption: FTP Activity
  uid: 4008
  category: network
  extends: network
  summary: File Transfer Protocol (FTP) Activity events report file transfers between a server and a client as seen on the network.
  activities: {1: Put, 2: Get, 3: Poll, 4: Delete, 5: Rename, 6: List}
  path: v1.1.0/classes/ftp_activity.yaml
- name: http_activity
  caption: HTTP Activity
  uid: 4002
  category: network
  extends: network
  summary: HTTP Activity events report HTTP connection and traffic information.
  activities: {1: Connect, 2: Delete, 3: Get, 4: Head, 5: Options, 6: Post, 7: Put, 8: Trace}
  path: v1.1.0/classes/http_activity.yaml
- name: network_activity
  caption: Network Activity
  uid: 4001
  category: network
  extends: network
  summary: Network Activity events report network connection and traffic activity.
  activities: {1: Open, 2: Close, 3: Reset, 4: Fail, 5: Refuse, 6: Traffic}
  path: v1.1.0/classes/network_activity.yaml
- name: network_file_activity
  caption: Network File Activity
  uid: 4010
  category: network
  extends: network
  deprecated: true
  summary: Network File Activity events report file activities traversing the network, including file storage services such as Box, MS OneDrive, or Google Drive.
  activities: {1: Upload, 2: Download, 3: Update, 4: Delete, 5: Rename, 6: Copy, 7: Move, 8: Restore, 9: Preview, 10: Lock, 11: Unlock, 12: Share, 13: Unshare, 14: Open, 15: Sync, 16: Unsync}
  path: v1.1.0/classes/network_file_activity.yaml
- name: ntp_activity
  caption: NTP Activity
  uid: 4013
  category: network
  extends: network
  summary: The Network Time Protocol (NTP) Activity events report instances of remote clients synchronizing their clocks with an NTP server, as observed on the network.
  activities: {1: Symmetric Active Exchange, 2: Symmetric Passive Response, 3: Client Synchronization, 4: Server Response, 5: Broadcast, 6: Control, 7: Private Use Case}
  path: v1.1.0/classes/ntp_activity.yaml
- name: rdp_activity
  caption: RDP Activity
  uid: 4005
  category: network
  extends: network
  summary: Remote Desktop Protocol (RDP) Activity events report remote client connections to a server as seen on the network.
  activities: {1: Initial Request, 2: Initial Response, 3: Connect Request, 4: Connect Response, 5: TLS Handshake, 6: Traffic}
  path: v1.1.0/classes/rdp_activity.yaml
- name: smb_activity
  caption: SMB Activity
  uid: 4006
  category: network
  extends: network
  summary: Server Message Block (SMB) Protocol Activity events report client/server connections sharing resources within the network.
  activities: {1: File Supersede, 2: File Open, 3: File Create, 4: File Open If, 5: File Overwrite, 6: File Overwrite If}
  path: v1.1.0/classes/smb_activity.yaml
- name: ssh_activity
  caption: SSH Activity
  uid: 4007
  category: network
  extends: network
  summary: SSH Activity events report remote client connections to a server using the Secure Shell (SSH) Protocol.
  activities: {1: Open, 2: Close, 3: Reset, 4: Fail, 5: Refuse, 6: Traffic}
  path: v1.1.0/classes/ssh_activity.yaml
- name: discovery
  caption: Discovery
  category: discovery
  abstract: true
  extends: base_event
  summary: The Discovery event is a generic event that defines a set of attributes available in Discovery category events.
  path: v1.1.0/classes/discovery.yaml
- name: discovery_result
  caption: Discovery Result
  category: discovery
  abstract: true
  extends: base_event
  summary: Discovery Result events report the results of a discovery request.
  path: v1.1.0/classes/discovery_result.yaml
- name: config_state
  caption: Device Config State
  uid: 5002
  category: discovery
  extends: discovery
  summary: Device Config State events report device configuration data and CIS Benchmark results.
  activities: {1: Log, 2: Collect}
  path: v1.1.0/classes/config_state.yaml
- name: device_config_state_change
  caption: Device Config State Change
  uid: 5019
  category: discovery
  extends: discovery
  summary: Device Config State Change events report state changes that impact the security of the device.
  activities: {1: Log, 2: Collect}
  path: v1.1.0/classes/device_config_state_change.yaml
- name: inventory_info
  caption: Device Inventory Info
  uid: 5001
  category: discovery
  extends: discovery
  summary: Device Inventory Info events report device inventory data that is either logged or proactively collected.
  activities: {1: Log, 2: Collect}
  path: v1.1.0/classes/inventory_info.yaml
- name: patch_state
  caption: Operating System Patch State
  uid: 5004
  category: discovery
  extends: discovery
  summary: Operating System Patch State reports the installation of an OS patch to a device and any associated knowledgebase articles.
  activities: {1: Log, 2: Collect}
  path: v1.1.0/classes/patch_state.yaml
- name: user_inventory
  caption: User Inventory Info
  uid: 5003
  category: discovery
  extends: discovery
  summary: User Inventory Info events report user inventory data that is either logged or proactively collected.
  activities: {1: Log, 2: Collect}
  path: v1.1.0/classes/user_inventory.yaml
- name: win/prefetch_info
  caption: Prefetch Info
  uid: 205019
  category: discovery
  extension: win
  extends: discovery_result
  summary: Prefetch Info events report information about Windows prefetch files.
  activities: {1: Exists, 2: Partial, 3: Does not exist, 4: Error, 5: Unsupported}
  path: v1.1.0/extensions/win/classes/prefetch_info.yaml
- name: win/registry_key_info
  caption: Registry Key Info
  uid: 205004
  category: discovery
  extension: win
  extends: discovery_result
  summary: Registry Key Info events report information about discovered Windows registry keys.
  activities: {1: Exists, 2: Partial, 3: Does not exist, 4: Error, 5: Unsupported}
  path: v1.1.0/extensions/win/classes/registry_key_info.yaml
- name: win/registry_value_info
  caption: Registry Value Info
  uid: 205005
  category: discovery
  extension: win
  extends: discovery_result
  summary: Registry Value Info events report information about discovered Windows registry values.
  activities: {1: Exists, 2: Partial, 3: Does not exist, 4: Error, 5: Unsupported}
  path: v1.1.0/extensions/win/classes/registry_value_info.yaml
- name: application
  caption: Application Activity
  category: application
  abstract: true
  extends: base_event
  summary: The base event is a generic and concrete event.
  path: v1.1.0/classes/application.yaml
- name: api_activity
  caption: API Activity
  uid: 6003
  category: application
  extends: application
  summary: API events describe general CRUD (Create, Read, Update, Delete) API activities, e.g.
  activities: {1: Create, 2: Read, 3: Update, 4: Delete}
  path: v1.1.0/classes/api_activity.yaml
- name: application_lifecycle
  caption: Application Lifecycle
  uid: 6002
  category: application
  extends: application
  summary: Application Lifecycle events report installation, removal, start, stop of an application or service.
  activities: {1: Install, 2: Remove, 3: Start, 4: Stop}
  path: v1.1.0/classes/application_lifecycle.yaml
- name: datastore_activity
  caption: Datastore Activity
  uid: 6005
  category: application
  extends: application
  summary: Datastore events describe general activities (Read, Update, Query, Delete, etc.) which affect datastores or data within those datastores, e.g.
  activities: {1: Read, 2: Update, 3: Connect, 4: Query, 5: Write, 6: Create, 7: Delete}
  path: v1.1.0/classes/datastore_activity.yaml
- name: file_hosting
  caption: File Hosting Activity
  uid: 6006
  category: application
  extends: application
  summary: File Hosting Activity events report the actions taken by file management applications, including file sharing servers like Sharepoint and services such as Box, MS OneDrive, or Google Drive.
  activities: {1: Upload, 2: Download, 3: Update, 4: Delete, 5: Rename, 6: Copy, 7: Move, 8: Restore, 9: Preview, 10: Lock, 11: Unlock, 12: Share, 13: Unshare, 14: Open, 15: Sync, 16: Unsync}
  path: v1.1.0/classes/file_hosting.yaml
- name: scan_activity
  caption: Scan Activity
  uid: 6007
  category: application
  extends: base_event
  summary: Scan events report the start, completion, and results of a scan job.
  activities: {1: Started, 2: Completed, 3: Cancelled, 4: Duration Violation, 5: Pause Violation, 6: Error, 7: Paused, 8: Resumed, 9: Restarted, 10: Delayed}
  path: v1.1.0/classes/scan_activity.yaml
- name: web_resource_access_activity
  caption: Web Resource Access Activity
  uid: 6004
  category: application
  extends: application
  deprecated: true
  summary: Web Resource Access Activity events describe successful/failed attempts to access a web resource over HTTP.
  activities: {1: Access Grant, 2: Access Deny, 3: Access Revoke, 4: Access Error}
  path: v1.1.0/classes/web_resource_access_activity.yaml
- name: web_resources_activity
  caption: Web Resources Activity
  uid: 6001
  category: application
  extends: base_event
  summary: Web Resources Activity events describe actions executed on a set of Web Resources.
  activities: {1: Create, 2: Read, 3: Update, 4: Delete, 5: Search, 6: Import, 7: Export, 8: Share}
  path: v1.1.0/classes/web_resources_activity.yaml

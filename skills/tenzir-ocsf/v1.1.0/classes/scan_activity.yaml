name: scan_activity
caption: Scan Activity
uid: 6007
category: application
category_uid: 6
extends: base_event
description: Scan events report the start, completion, and results of a scan job. The scan event includes the number of items that were scanned and the number of detections that were resolved.
profiles: [cloud, container, datetime, host]
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event.
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Started
        description: The scan was started.
      '2':
        caption: Completed
        description: The scan was completed.
      '3':
        caption: Cancelled
        description: The scan was cancelled.
      '4':
        caption: Duration Violation
        description: The allocated scan time was insufficient to complete the requested scan.
      '5':
        caption: Pause Violation
        description: The scan was paused, either by the user or by program constraints (e.g. scans that are suspended during certain time intervals), and not resumed within the allotted time.
      '6':
        caption: Error
        description: The scan could not be completed due to an internal error.
      '7':
        caption: Paused
        description: The scan was paused.
      '8':
        caption: Resumed
        description: The scan was resumed from the pause point.
      '9':
        caption: Restarted
        description: The scan restarted from the beginning of the file enumeration.
      '10':
        caption: Delayed
        description: The user delayed the scan.
      '99':
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  activity_name:
    caption: Activity
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event activity name, as defined by the activity_id.
  actor:
    caption: Actor
    type: object_t
    object: actor
    requirement: optional
    group: primary
    profile: host
    description: The actor object describes details about the user/role/process that was the source of the activity.
  api:
    caption: API Details
    type: object_t
    object: api
    requirement: optional
    group: context
    profile: cloud
    from: base_event
    description: Describes details about a typical API (Application Programming Interface) call.
  category_name:
    caption: Category
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event category name, as defined by category_uid value: `Application Activity`.'
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event.
    enum:
      '6':
        caption: Application Activity
        description: Application Activity events report detailed information about the behavior of applications and services.
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event class name, as defined by class_uid value: `Scan Activity`.'
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A Class describes the attributes available in an event.
    enum:
      '6007':
        caption: Scan Activity
        description: Scan events report the start, completion, and results of a scan job. The scan event includes the number of items that were scanned and the number of detections that were resolved.
  cloud:
    caption: Cloud
    type: object_t
    object: cloud
    requirement: required
    group: primary
    profile: cloud
    from: base_event
    description: Describes details about the Cloud environment where the event was originally created or logged.
  command_uid:
    caption: Command UID
    type: string_t
    requirement: recommended
    group: primary
    description: The command identifier that is associated with this scan event.  This ID uniquely identifies the proactive scan command, e.g., if remotely initiated.
  count:
    caption: Count
    type: integer_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The number of times that events in the same logical group occurred during the event Start Time to End Time period.
  device:
    caption: Device
    type: object_t
    object: device
    requirement: recommended
    group: primary
    profile: host
    observable: 20
    description: An addressable device, computer system or host.
  duration:
    caption: Duration
    type: integer_t
    requirement: recommended
    group: occurrence
    description: The duration of the scan
  end_time:
    caption: End Time
    type: timestamp_t
    requirement: recommended
    group: occurrence
    description: The end time of the scan job.
  end_time_dt:
    caption: End Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    description: The end time of the scan job.
  enrichments:
    caption: Enrichments
    type: object_t
    object: enrichment
    array: true
    requirement: optional
    group: context
    from: base_event
    description: 'The additional information from an external data source, which is associated with the event or a finding. For example add location information for the IP address in the DNS answers:`[{"name": "answers.ip", "value": "92.24.47.250", "type": "location", "data": {"city": "Socotra", "continent": "Asia", "coordinates": [-25.4153, 17.0743], "country": "YE", "desc": "Yemen"}}]`'
  message:
    caption: Message
    type: string_t
    requirement: recommended
    group: primary
    from: base_event
    description: The description of the event/finding, as defined by the source.
  metadata:
    caption: Metadata
    type: object_t
    object: metadata
    requirement: required
    group: context
    from: base_event
    description: The metadata associated with the event or a finding.
  num_detections:
    caption: Detections
    type: integer_t
    requirement: recommended
    group: primary
    description: The number of detections.
  num_files:
    caption: Scanned Files
    type: integer_t
    requirement: recommended
    group: primary
    description: The number of files scanned.
  num_folders:
    caption: Scanned Folders
    type: integer_t
    requirement: recommended
    group: primary
    description: The number of folders scanned.
  num_network_items:
    caption: Scanned Network Items
    type: integer_t
    requirement: recommended
    group: primary
    description: The number of network items scanned.
  num_processes:
    caption: Scanned Processes
    type: integer_t
    requirement: recommended
    group: primary
    description: The number of processes scanned.
  num_registry_items:
    caption: Scanned Registry Items
    type: integer_t
    requirement: recommended
    group: primary
    description: The number of registry items scanned.
  num_resolutions:
    caption: Resolutions
    type: integer_t
    requirement: recommended
    group: primary
    description: The number of items that were resolved.
  num_skipped_items:
    caption: Skipped
    type: integer_t
    requirement: recommended
    group: primary
    description: The number of skipped items.
  num_trusted_items:
    caption: Trusted
    type: integer_t
    requirement: recommended
    group: primary
    description: The number of trusted items.
  observables:
    caption: Observables
    type: object_t
    object: observable
    array: true
    requirement: optional
    group: primary
    from: base_event
    description: The observables associated with the event or a finding.
  policy:
    caption: Policy
    type: object_t
    object: policy
    requirement: recommended
    group: primary
    description: The policy associated with this Scan event; required if the scan was initiated by a policy.
  raw_data:
    caption: Raw Data
    type: string_t
    requirement: optional
    group: context
    from: base_event
    description: The raw event/finding data as received from the source.
  scan:
    caption: Scan
    type: object_t
    object: scan
    requirement: required
    group: primary
    description: The Scan object describes characteristics of the scan job.
  schedule_uid:
    caption: Schedule UID
    type: string_t
    requirement: recommended
    group: primary
    description: The unique identifier of the schedule associated with a scan job.
  severity:
    caption: Severity
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event/finding severity, normalized to the caption of the severity_id value. In the case of 'Other', it is defined by the source.
  severity_id:
    caption: Severity ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: severity
    description: |-
      The normalized identifier of the event/finding severity.

      The normalized severity is a measurement the effort and expense required to manage and resolve an event or incident. Smaller numerical values represent lower impact events, and larger numerical values represent higher impact events.
    enum:
      '0':
        caption: Unknown
        description: The event/finding severity is unknown.
      '1':
        caption: Informational
        description: Informational message. No action required.
      '2':
        caption: Low
        description: The user decides if action is needed.
      '3':
        caption: Medium
        description: Action is required but the situation is not serious at this time.
      '4':
        caption: High
        description: Action is required immediately.
      '5':
        caption: Critical
        description: Action is required immediately and the scope is broad.
      '6':
        caption: Fatal
        description: An error occurred but it is too late to take remedial action.
      '99':
        caption: Other
        description: The event/finding severity is not mapped. See the `severity` attribute, which contains a data source specific value.
  start_time:
    caption: Start Time
    type: timestamp_t
    requirement: recommended
    group: occurrence
    description: The start time of the scan job.
  start_time_dt:
    caption: Start Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    description: The start time of the scan job.
  status:
    caption: Status
    type: string_t
    requirement: optional
    group: primary
    from: base_event
    description: The event status, normalized to the caption of the status_id value. In the case of 'Other', it is defined by the event source.
  status_code:
    caption: Status Code
    type: string_t
    requirement: optional
    group: primary
    from: base_event
    description: |-
      The event status code, as reported by the event source.

      For example, in a Windows Failed Authentication event, this would be the value of 'Failure Code', e.g. 0x18.
  status_detail:
    caption: Status Details
    type: string_t
    requirement: optional
    group: primary
    from: base_event
    description: The status details contains additional information about the event/finding outcome.
  status_id:
    caption: Status ID
    type: integer_t
    requirement: recommended
    group: primary
    from: base_event
    sibling: status
    description: The normalized identifier of the event status.
    enum:
      '0':
        caption: Unknown
        description: The status is unknown.
      '1':
        caption: Success
      '2':
        caption: Failure
      '99':
        caption: Other
        description: The event status is not mapped. See the `status` attribute, which contains a data source specific value.
  time:
    caption: Event Time
    type: timestamp_t
    requirement: required
    group: occurrence
    from: base_event
    description: The normalized event occurrence time or the finding creation time.
  time_dt:
    caption: Event Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: base_event
    description: The normalized event occurrence time or the finding creation time.
  timezone_offset:
    caption: Timezone Offset
    type: integer_t
    requirement: recommended
    group: occurrence
    from: base_event
    description: The number of minutes that the reported event `time` is ahead or behind UTC, in the range -1,080 to +1,080.
  total:
    caption: Total
    type: integer_t
    requirement: recommended
    group: primary
    description: The total number of items that were scanned; zero if no items were scanned.
  type_name:
    caption: Type Name
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event/finding type name, as defined by the type_uid.
  type_uid:
    caption: Type ID
    type: long_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event/finding type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
    enum:
      '600700':
        caption: 'Scan Activity: Unknown'
      '600701':
        caption: 'Scan Activity: Started'
        description: The scan was started.
      '600702':
        caption: 'Scan Activity: Completed'
        description: The scan was completed.
      '600703':
        caption: 'Scan Activity: Cancelled'
        description: The scan was cancelled.
      '600704':
        caption: 'Scan Activity: Duration Violation'
        description: The allocated scan time was insufficient to complete the requested scan.
      '600705':
        caption: 'Scan Activity: Pause Violation'
        description: The scan was paused, either by the user or by program constraints (e.g. scans that are suspended during certain time intervals), and not resumed within the allotted time.
      '600706':
        caption: 'Scan Activity: Error'
        description: The scan could not be completed due to an internal error.
      '600707':
        caption: 'Scan Activity: Paused'
        description: The scan was paused.
      '600708':
        caption: 'Scan Activity: Resumed'
        description: The scan was resumed from the pause point.
      '600709':
        caption: 'Scan Activity: Restarted'
        description: The scan restarted from the beginning of the file enumeration.
      '600710':
        caption: 'Scan Activity: Delayed'
        description: The user delayed the scan.
      '600799':
        caption: 'Scan Activity: Other'
  unmapped:
    caption: Unmapped Data
    type: object_t
    object: object
    requirement: optional
    group: context
    from: base_event
    description: The attributes that are not mapped to the event schema. The names and values of those attributes are specific to the event source.

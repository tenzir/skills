  activity_name: {caption: Activity, type: string_t, requirement: optional, group: classification, from: finding}
  actor: {caption: Actor, type: object_t, object: actor, requirement: optional, group: primary, profile: host, from: finding}
  api: {caption: API Details, type: object_t, object: api, requirement: optional, group: context, profile: cloud, from: base_event}
  attacks:

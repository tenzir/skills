    description: Provides details about an authorization, such as authorization outcome, and any associated policies related to the activity/event.
  category_name:
    caption: Category
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event category name, as defined by category_uid value: `Findings`.'
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event class name, as defined by class_uid value: `Detection Finding`.'
  comment: {caption: Comment, type: string_t, requirement: optional, group: context, from: finding}
  confidence: {caption: Confidence, type: string_t, requirement: optional, group: context, from: finding}
  confidence_score: {caption: Confidence Score, type: integer_t, requirement: optional, group: context, from: finding}
  count: {caption: Count, type: integer_t, requirement: optional, group: occurrence, from: base_event}
  device: {caption: Device, type: object_t, object: device, requirement: optional, group: primary, profile: host, observable: 20, from: finding}
  disposition:

  enrichments:
    caption: Enrichments
    requirement: optional
    definition: v1.1.0/classes/base_event.yaml
  evidences:
    caption: Evidence Artifacts
    type: object_t
    object: evidences
    array: true
    requirement: recommended
    group: primary
    description: Describes various evidence artifacts associated to the activity/activities that triggered a security detection.
  finding_info:
    caption: Finding Information
    requirement: required
    definition: v1.1.0/classes/finding.yaml
  firewall_rule:
    caption: Firewall Rule
    type: object_t
    object: firewall_rule
    requirement: optional
    group: primary
    profile: security_control
    description: The firewall rule that triggered the event.
  impact:
    caption: Impact
    type: string_t
    requirement: optional
    group: context
    description: The impact , normalized to the caption of the impact_id value. In the case of 'Other', it is defined by the event source.
  impact_id:
    caption: Impact ID
    type: integer_t
    requirement: optional
    group: context
    sibling: impact
    description: The normalized impact of the finding.
    enum:
      '0':
        caption: Unknown
        description: The normalized impact is unknown.
      '1':
        caption: Low
      '2':
        caption: Medium
      '3':
        caption: High
      '4':
        caption: Critical
      '99':
        caption: Other
        description: The impact is not mapped. See the `impact` attribute, which contains a data source specific value.
  impact_score:
    caption: Impact
    type: integer_t
    requirement: optional
    group: context
    description: The impact of the finding, valid range 0-100.
  malware:

name: rdp_activity
caption: RDP Activity
uid: 4005
category: network
category_uid: 4
extends: network
description: Remote Desktop Protocol (RDP) Activity events report remote client connections to a server as seen on the network.
profiles: [cloud, container, datetime, host, load_balancer, network_proxy, security_control]
attributes:

  classes:
    dhcp_activity: [proxy_traffic, traffic]
    dns_activity: [proxy_traffic, traffic]
    ftp_activity: [proxy_traffic, traffic]
    http_activity: [proxy_traffic, traffic]
    network_activity: [proxy_traffic, traffic]
    network_file_activity: [proxy_traffic, traffic]
    ntp_activity: [proxy_traffic, traffic]
    rdp_activity: [proxy_traffic, traffic]
    smb_activity: [proxy_traffic, traffic]

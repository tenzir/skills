attributes:
  bytes:
    caption: Total Bytes
    type: long_t
    requirement: recommended
    description: The total number of bytes (in and out).
  packets:
    caption: Total Packets
    type: long_t
    requirement: recommended
    description: The total number of packets (in and out).
  bytes_in:

name: image
caption: Image
extends: _entity
description: The Image object provides a description of a specific Virtual Machine (VM) or Container image. Defined by D3FEND [d3f:ContainerImage](https://d3fend.mitre.org/dao/artifact/d3f:ContainerImage/).
referenced_by:
  objects:
    container: [image]
    device: [image]
attributes:
  uid:
    caption: Unique ID
    type: string_t
    requirement: required
    description: 'The unique image ID. For example: `77af4d6b9913`.'
  name:
    caption: Name
    type: string_t
    requirement: recommended
    description: 'The image name. For example: `elixir`.'
  labels:
    caption: Labels
    type: string_t
    array: true
    requirement: optional
    description: The image labels.
  path:
    caption: Path
    type: string_t
    requirement: optional
    description: The full path to the image file.
  tag:
    caption: Image Tag
    type: string_t
    requirement: optional
    description: 'The image tag. For example: `1.11-alpine`.'

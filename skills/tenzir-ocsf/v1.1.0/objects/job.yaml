name: job
caption: Job
extends: object
description: The Job object provides information about a scheduled job or task, including its name, command line, and state. It encompasses attributes that describe the properties and status of the scheduled job.
profiles: [datetime]
referenced_by:
  classes:
    scheduled_job_activity: [job]
attributes:
  cmd_line:
    caption: Command Line
    type: string_t
    requirement: recommended
    description: The job command line.
  created_time:
    caption: Created Time
    type: timestamp_t
    requirement: recommended
    description: The time when the job was created.
  created_time_dt:
    caption: Created Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the job was created.
  desc:
    caption: Description
    type: string_t
    requirement: recommended
    description: The description of the job.
  file:
    caption: File
    type: object_t
    object: file
    requirement: required
    observable: 24
    description: The file that pertains to the job.
  last_run_time:
    caption: Last Run
    type: timestamp_t
    requirement: recommended
    description: The time when the job was last run.
  last_run_time_dt:
    caption: Last Run
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the job was last run.
  name:
    caption: Name
    type: string_t
    requirement: required
    description: The name of the job.
  next_run_time:
    caption: Next Run
    type: timestamp_t
    requirement: optional
    description: The time when the job will next be run.
  next_run_time_dt:
    caption: Next Run
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the job will next be run.
  run_state:
    caption: Run State
    type: string_t
    requirement: optional
    description: The run state of the job.
  run_state_id:
    caption: Run State ID
    type: integer_t
    requirement: recommended
    sibling: run_state
    description: The run state ID of the job.
    enum:
      '0':
        caption: Unknown
      '1':
        caption: Ready
      '2':
        caption: Queued
      '3':
        caption: Running
      '4':
        caption: Stopped
      '99':
        caption: Other
  user:
    caption: User
    type: object_t
    object: user
    requirement: optional
    observable: 21
    description: The user that created the job.

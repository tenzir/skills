name: tactic
caption: MITRE ATT&CK® Tactic
extends: _entity
description: The MITRE ATT&CK® Tactic object describes the tactic ID and/or name that is associated to an attack, as defined by [ATT&CK® Matrix](https://attack.mitre.org/wiki/ATT&CK_Matrix).
constraints:
  at_least_one: [name, uid]
referenced_by:
  objects:
    attack: [tactic, tactics]
attributes:
  uid:
    caption: Unique ID
    type: string_t
    requirement: recommended
    description: 'The tactic ID that is associated with the attack technique, as defined by [ATT&CK® Matrix](https://attack.mitre.org/wiki/ATT&CK_Matrix). For example: `TA0043`.'
  name:
    caption: Name
    type: string_t
    requirement: optional
    description: 'The tactic name that is associated with the attack technique, as defined by [ATT&CK® Matrix](https://attack.mitre.org/wiki/ATT&CK_Matrix). For example: `Reconnaissance`.'
  src_url:
    caption: Source URL
    type: url_t
    requirement: optional
    observable: 6
    description: 'The versioned permalink of the attack tactic, as defined by [ATT&CK® Matrix](https://attack.mitre.org/wiki/ATT&CK_Matrix). For example: `https://attack.mitre.org/versions/v14/tactics/TA0043/`.'

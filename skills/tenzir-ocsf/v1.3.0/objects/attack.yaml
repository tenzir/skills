name: attack
caption: MITRE ATT&CK®
extends: object
description: The [MITRE ATT&CK®](https://attack.mitre.org) object describes the tactic, technique & sub-technique associated to an attack as defined in [ATT&CK® Matrix](https://attack.mitre.org/wiki/ATT&CK_Matrix).
constraints:
  at_least_one: [tactic, technique, sub_technique]
referenced_by:
  classes:
    data_security_finding: [attacks]
    datastore_activity: [attacks]
    detection_finding: [attacks]
    dhcp_activity: [attacks]
    dns_activity: [attacks]
    email_activity: [attacks]
    email_file_activity: [attacks]
    email_url_activity: [attacks]
    event_log: [attacks]
    file_activity: [attacks]
    ftp_activity: [attacks]
    http_activity: [attacks]
    incident_finding: [attacks]
    kernel_activity: [attacks]
    kernel_extension: [attacks]
    memory_activity: [attacks]
    module_activity: [attacks]
    network_activity: [attacks]
    network_file_activity: [attacks]
    ntp_activity: [attacks]
    process_activity: [attacks]
    rdp_activity: [attacks]
    scheduled_job_activity: [attacks]
    security_finding: [attacks]
    smb_activity: [attacks]
    ssh_activity: [attacks]
    tunnel_activity: [attacks]
    web_resources_activity: [attacks]
  objects:
    finding_info: [attacks]

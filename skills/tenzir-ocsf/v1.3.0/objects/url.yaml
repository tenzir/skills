name: url
caption: Uniform Resource Locator
extends: object
observable: 23
description: The Uniform Resource Locator(URL) object describes the characteristics of a URL. Defined in [RFC 1738](https://datatracker.ietf.org/doc/html/rfc1738) and by D3FEND [d3f:URL](https://d3fend.mitre.org/dao/artifact/d3f:URL/).
constraints:
  at_least_one: [url_string, path]
referenced_by:
  classes:
    email_url_activity: [url]
    network_activity: [url]
  objects:
    evidences: [url]
    http_request: [url]

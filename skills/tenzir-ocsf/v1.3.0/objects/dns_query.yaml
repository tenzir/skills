name: dns_query
caption: DNS Query
extends: _dns
description: The DNS query object represents a specific request made to the Domain Name System (DNS) to retrieve information about a domain or perform a DNS operation. This object encapsulates the necessary attributes and methods to construct and send DNS queries, specify the query type (e.g., A, AAAA, MX). Defined by D3FEND [d3f:DNSLookup](https://d3fend.mitre.org/dao/artifact/d3f:DNSLookup/).
referenced_by:
  classes:
    dns_activity: [query]
  objects:
    evidences: [query]
attributes:
  class:
    caption: Resource Record Class
    type: string_t
    requirement: recommended
    from: _dns
    description: 'The class of resource records being queried. See [RFC1035](https://www.rfc-editor.org/rfc/rfc1035.txt). For example: `IN`.'
  hostname:
    caption: Hostname
    type: hostname_t
    requirement: required
    observable: 1
    description: 'The hostname or domain being queried. For example: `www.example.com`'
  opcode:
    caption: DNS Opcode
    type: string_t
    requirement: optional
    description: The DNS opcode specifies the type of the query message.
  opcode_id:
    caption: DNS Opcode ID
    type: integer_t
    requirement: recommended
    description: The DNS opcode ID specifies the normalized query message type as defined in [RFC-5395](https://www.rfc-editor.org/rfc/rfc5395.html).
    enum:
      '0':
        caption: Query
        description: Standard query
      '1':
        caption: Inverse Query
        description: Inverse query, obsolete
      '2':
        caption: Status
        description: Server status request
      '3':
        caption: Reserved
        description: Reserved, not used
      '4':
        caption: Notify
        description: Zone change notification
      '5':
        caption: Update
        description: Dynamic DNS update
      '6':
        caption: DSO Message
        description: DNS Stateful Operations (DSO)
      '99':
        caption: Other
        description: The DNS Opcode is not defined by the RFC. See the `opcode` attribute, which contains a data source specific value.
  packet_uid:
    caption: Packet UID
    type: integer_t
    requirement: recommended
    from: _dns
    description: The DNS packet identifier assigned by the program that generated the query. The identifier is copied to the response.
  type:
    caption: Resource Record Type
    type: string_t
    requirement: recommended
    from: _dns
    description: 'The type of resource records being queried. See [RFC1035](https://www.rfc-editor.org/rfc/rfc1035.txt). For example: A, AAAA, CNAME, MX, and NS.'

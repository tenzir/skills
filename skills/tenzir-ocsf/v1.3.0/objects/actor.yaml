name: actor
caption: Actor
extends: object
description: The Actor object contains details about the user, role, application, service, or process that initiated or performed a specific activity.
profiles: [container, data_classification]
constraints:
  at_least_one: [process, user, invoked_by, session, app_name, app_uid]
referenced_by:
  classes:
    account_change: [actor]
    admin_group_query: [actor]
    api_activity: [actor]
    application_lifecycle: [actor]
    authentication: [actor]
    authorize_session: [actor]
    compliance_finding: [actor]
    config_state: [actor]
    data_security_finding: [actor]
    datastore_activity: [actor]
    detection_finding: [actor]
    device_config_state_change: [actor]
    dhcp_activity: [actor]
    dns_activity: [actor]
    email_activity: [actor]
    email_file_activity: [actor]
    email_url_activity: [actor]
    entity_management: [actor]
    event_log: [actor]
    file_activity: [actor]
    file_hosting: [actor]
    file_query: [actor]
    file_remediation_activity: [actor]
    folder_query: [actor]
    ftp_activity: [actor]
    group_management: [actor]
    http_activity: [actor]
    inventory_info: [actor]
    job_query: [actor]
    kernel_activity: [actor]
    kernel_extension: [actor]
    kernel_object_query: [actor]
    memory_activity: [actor]
    module_activity: [actor]
    module_query: [actor]
    network_activity: [actor]
    network_connection_query: [actor]
    network_file_activity: [actor]
    network_remediation_activity: [actor]
    networks_query: [actor]
    ntp_activity: [actor]
    patch_state: [actor]
    peripheral_device_query: [actor]
    process_activity: [actor]
    process_query: [actor]
    process_remediation_activity: [actor]
    rdp_activity: [actor]
    remediation_activity: [actor]
    scan_activity: [actor]
    scheduled_job_activity: [actor]
    service_query: [actor]
    session_query: [actor]
    smb_activity: [actor]
    software_info: [actor]
    ssh_activity: [actor]
    tunnel_activity: [actor]
    user_access: [actor]
    user_inventory: [actor]
    user_query: [actor]
    vulnerability_finding: [actor]
    web_resource_access_activity: [actor]
    web_resources_activity: [actor]
  objects:
    evidences: [actor]
attributes:
  process:
    caption: Process
    type: object_t
    object: process
    requirement: recommended
    observable: 25
    description: The process that initiated the activity.
  user:
    caption: User
    type: object_t
    object: user
    requirement: recommended
    observable: 21
    description: The user that initiated the activity or the user context from which the activity was initiated.
  app_name:
    caption: Application Name
    type: string_t
    requirement: optional
    description: The client application or service that initiated the activity. This can be in conjunction with the `user` if present. Note that `app_name` is distinct from the `process` if present.
  app_uid:
    caption: Application ID
    type: string_t
    requirement: optional
    description: The unique identifier of the client application or service that initiated the activity. This can be in conjunction with the `user` if present. Note that `app_name` is distinct from the `process.pid` or `process.uid` if present.
  authorizations:
    caption: Authorization Information
    type: object_t
    object: authorization
    array: true
    requirement: optional
    description: Provides details about an authorization, such as authorization outcome, and any associated policies related to the activity/event.
  idp:
    caption: Identity Provider
    type: object_t
    object: idp
    requirement: optional
    description: This object describes details about the Identity Provider used.
  invoked_by:
    caption: Invoked by
    type: string_t
    requirement: optional
    deprecated:
      since: 1.2.0
      message: Use  `app_name, app_uid`  attributes instead.
    description: The name of the service that invoked the activity as described in the event.
  session:
    caption: Session
    type: object_t
    object: session
    requirement: optional
    description: The user session from which the activity was initiated.

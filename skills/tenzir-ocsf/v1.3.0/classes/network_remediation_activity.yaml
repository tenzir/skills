name: network_remediation_activity
caption: Network Remediation Activity
uid: 7004
category: remediation
category_uid: 7
extends: remediation_activity
description: Network Remediation Activity events report on attempts at remediating computer networks. It follows the MITRE countermeasures defined by the D3FEND™ [Matrix](https://d3fend.mitre.org/). Techniques and Sub-techniques will include Network, such as Network Isolation or Network Traffic Filtering.
profiles: [cloud, container, data_classification, datetime, host, osint]
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    from: remediation_activity
    sibling: activity_name
    description: 'Matches the MITRE D3FEND™ Tactic. Note: the Model and Detect Tactics are not supported as remediations by the OCSF Remediation event class.'
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Isolate
        description: Creates logical or physical barriers in a system which reduces opportunities for adversaries to create further accesses. Defined by D3FEND™ [d3f:Isolate](https://d3fend.mitre.org/d3f:Isolate/).
      '2':
        caption: Evict
        description: Removes an adversary or malicious resource from a device or computer network. Defined by D3FEND™ [d3f:Evict](https://d3fend.mitre.org/d3f:Evict/).
      '3':
        caption: Restore
        description: Returns the system to a better state. Defined by D3FEND™ [d3f:Restore](https://d3fend.mitre.org/d3f:Restore/).
      '4':
        caption: Harden
        description: Increases the opportunity cost of computer network exploitation. Defined by D3FEND™ [d3f:Harden](https://d3fend.mitre.org/d3f:Harden/).
      '99':
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  activity_name:
    caption: Activity
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event activity name, as defined by the activity_id.
  actor:
    caption: Actor
    type: object_t
    object: actor
    requirement: optional
    group: primary
    profile: host
    from: remediation_activity
    description: The actor object describes details about the user/role/process that was the source of the activity.
  api:
    caption: API Details
    type: object_t
    object: api
    requirement: optional
    group: context
    profile: cloud
    from: base_event
    description: Describes details about a typical API (Application Programming Interface) call.
  category_name:
    caption: Category
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event category name, as defined by category_uid value: `Remediation`.'
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event.
    enum:
      '7':
        caption: Remediation
        description: Remediation events report the results of remediation commands targeting files, processes, and other objects.
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event class name, as defined by class_uid value: `Network Remediation Activity`.'
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event.
    enum:
      '7004':
        caption: Network Remediation Activity
        description: Network Remediation Activity events report on attempts at remediating computer networks. It follows the MITRE countermeasures defined by the D3FEND™ [Matrix](https://d3fend.mitre.org/). Techniques and Sub-techniques will include Network, such as Network Isolation or Network Traffic Filtering.
  cloud:
    caption: Cloud

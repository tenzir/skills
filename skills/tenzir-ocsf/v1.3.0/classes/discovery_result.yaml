# Attributes with a `definition` path are inherited unchanged. Read that file
# for their type, object, description, enum, and observable.
name: discovery_result
caption: Discovery Result
category: discovery
abstract: true
extends: base_event
description: Discovery Result events report the results of a discovery request.
profiles: [cloud, datetime, host, osint]
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event.
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Query
        description: The discovered results are via a query request.
      '99':
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  activity_name:
    caption: Activity
    requirement: optional
    definition: v1.3.0/classes/base_event.yaml
  actor:
    caption: Actor
    type: object_t
    object: actor
    requirement: optional
    group: primary
    profile: host
    description: The actor object describes details about the user/role/process that was the source of the activity.
  api:
    caption: API Details
    requirement: optional
    profile: cloud
    definition: v1.3.0/classes/base_event.yaml
  category_name:
    caption: Category
    requirement: optional
    definition: v1.3.0/classes/base_event.yaml
  category_uid:
    caption: Category ID
    requirement: required
    definition: v1.3.0/classes/base_event.yaml
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event class name, as defined by class_uid value.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event.
    enum:
      '0':
        caption: Base Event
  cloud:
    caption: Cloud
    requirement: required
    profile: cloud
    definition: v1.3.0/classes/base_event.yaml
  count:
    caption: Count
    requirement: optional
    definition: v1.3.0/classes/base_event.yaml
  device:
    caption: Device
    type: object_t
    object: device
    requirement: recommended
    group: primary
    profile: host
    observable: 20
    description: An addressable device, computer system or host.
  duration:
    caption: Duration Milliseconds
    requirement: optional
    definition: v1.3.0/classes/base_event.yaml
  end_time:
    caption: End Time
    requirement: optional
    definition: v1.3.0/classes/base_event.yaml
  enrichments:
    caption: Enrichments
    requirement: optional
    definition: v1.3.0/classes/base_event.yaml
  message:
    caption: Message
    requirement: recommended
    definition: v1.3.0/classes/base_event.yaml
  metadata:
    caption: Metadata
    requirement: required
    definition: v1.3.0/classes/base_event.yaml
  observables:
    caption: Observables
    requirement: recommended
    definition: v1.3.0/classes/base_event.yaml
  osint:
    caption: OSINT
    requirement: required
    profile: osint
    definition: v1.3.0/classes/base_event.yaml
  query_info:
    caption: Query Info
    type: object_t
    object: query_info
    requirement: recommended
    group: primary
    description: The search details associated with the query request.
  query_result:
    caption: Query Result
    type: string_t
    requirement: recommended
    group: primary
    description: The result of the query.
  query_result_id:
    caption: Query Result ID
    type: integer_t
    requirement: required
    group: primary
    sibling: query_result
    description: The normalized identifier of the query result.
    enum:
      '0':
        caption: Unknown
        description: The query result is unknown.
      '1':
        caption: Exists
        description: The target was found.
      '2':
        caption: Partial
        description: The target was partially found.
      '3':
        caption: Does not exist
        description: The target was not found.
      '4':
        caption: Error
        description: The discovery attempt failed.
      '5':
        caption: Unsupported
        description: Discovery of the target was not supported.
      '99':
        caption: Other
        description: The query result is not mapped. See the `query_result` attribute, which contains a data source specific value.
  raw_data:
    caption: Raw Data
    requirement: optional
    definition: v1.3.0/classes/base_event.yaml
  severity:
    caption: Severity
    requirement: optional
    definition: v1.3.0/classes/base_event.yaml
  severity_id:
    caption: Severity ID
    requirement: required
    definition: v1.3.0/classes/base_event.yaml
  start_time:
    caption: Start Time
    requirement: optional
    definition: v1.3.0/classes/base_event.yaml
  status:
    caption: Status
    requirement: recommended
    definition: v1.3.0/classes/base_event.yaml
  status_code:
    caption: Status Code
    requirement: recommended
    definition: v1.3.0/classes/base_event.yaml
  status_detail:
    caption: Status Detail
    requirement: recommended
    definition: v1.3.0/classes/base_event.yaml
  status_id:
    caption: Status ID
    requirement: recommended
    definition: v1.3.0/classes/base_event.yaml
  time:
    caption: Event Time
    requirement: required
    definition: v1.3.0/classes/base_event.yaml
  timezone_offset:
    caption: Timezone Offset
    requirement: recommended
    definition: v1.3.0/classes/base_event.yaml
  type_name:
    caption: Type Name
    requirement: optional
    definition: v1.3.0/classes/base_event.yaml
  type_uid:
    caption: Type ID
    type: long_t
    requirement: required
    group: classification
    from: base_event
    sibling: type_name
    description: 'The event/finding type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
  unmapped:
    caption: Unmapped Data
    requirement: optional
    definition: v1.3.0/classes/base_event.yaml

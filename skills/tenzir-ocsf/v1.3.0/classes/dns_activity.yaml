# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: dns_activity
caption: DNS Activity
uid: 4003
category: network
category_uid: 4
extends: network
description: DNS Activity events report DNS queries and answers as seen on the network.
profiles: [cloud, container, data_classification, datetime, host, load_balancer, network_proxy, osint, security_control]
attributes:
  action_id: {caption: Action ID, type: integer_t, requirement: required, group: primary, profile: security_control, sibling: action, enum: {0: Unknown, 1: Allowed, 2: Denied, 99: Other}, from: network}
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event.
    enum:
      0:
        caption: Unknown
        description: The event activity is unknown.
      1:
        caption: Query
        description: The DNS query request.
      2:
        caption: Response
        description: The DNS query response.
      6:
        caption: Traffic
        description: Bidirectional DNS request and response traffic.
      99:
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event.
    enum:
      4:
        caption: Network Activity
        description: Network Activity events.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event.
    enum:
      4003:
        caption: DNS Activity
        description: DNS Activity events report DNS queries and answers as seen on the network.

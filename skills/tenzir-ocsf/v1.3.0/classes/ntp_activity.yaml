    caption: Stratum ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: stratum
    description: The normalized identifier of the stratum level, as defined in [RFC-5905](https://www.rfc-editor.org/rfc/rfc5905.html).
    enum:
      0:
        caption: Unknown
        description: Unspecified or invalid.
      1:
        caption: Primary Server
        description: The highest precision primary server (e.g atomic clock or GPS).
      2:

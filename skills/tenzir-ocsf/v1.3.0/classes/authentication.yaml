name: authentication
caption: Authentication
uid: 3002
category: iam
category_uid: 3
extends: iam
description: Authentication events report authentication session activities such as user attempts a logon or logoff, successfully or otherwise.
profiles: [cloud, container, data_classification, datetime, host, osint]
constraints:
  at_least_one: [service, dst_endpoint]
associations:
  actor.user: [src_endpoint]
  dst_endpoint: [user]
  src_endpoint: [actor.user]
  user: [dst_endpoint]
attributes:
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event.
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Logon
        description: A new logon session was requested.
      '2':
        caption: Logoff
        description: A logon session was terminated and no longer exists.
      '3':
        caption: Authentication Ticket
        description: A Kerberos authentication ticket (TGT) was requested.
      '4':
        caption: Service Ticket Request
        description: A Kerberos service ticket was requested.
      '5':
        caption: Service Ticket Renew
        description: A Kerberos service ticket was renewed.
      '6':
        caption: Preauth
        description: A preauthentication stage was engaged.
      '99':
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  activity_name:
    caption: Activity
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event activity name, as defined by the activity_id.
  actor:
    caption: Actor
    type: object_t
    object: actor
    requirement: optional
    group: context
    description: The actor that requested the authentication.
  api:
    caption: API Details
    type: object_t
    object: api
    requirement: optional
    group: context
    profile: cloud
    from: base_event
    description: Describes details about a typical API (Application Programming Interface) call.
  auth_factors:
    caption: Authentication Factors
    type: object_t
    object: auth_factor
    array: true
    requirement: optional
    group: context
    description: Describes a category of methods used for identity verification in an authentication attempt.
  auth_protocol:
    caption: Auth Protocol
    type: string_t
    requirement: recommended
    group: primary
    description: The authentication protocol as defined by the caption of 'auth_protocol_id'. In the case of 'Other', it is defined by the event source.
  auth_protocol_id:
    caption: Auth Protocol ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: auth_protocol
    description: The normalized identifier of the authentication protocol used to create the user session.
    enum:
      '0':
        caption: Unknown
        description: The authentication protocol is unknown.
      '1':
        caption: NTLM
      '2':
        caption: Kerberos
      '3':
        caption: Digest
      '4':
        caption: OpenID
      '5':
        caption: SAML
      '6':
        caption: OAUTH 2.0
      '7':
        caption: PAP
      '8':
        caption: CHAP
      '9':
        caption: EAP
      '10':
        caption: RADIUS
      '99':
        caption: Other
        description: The authentication protocol is not mapped. See the `auth_protocol` attribute, which contains a data source specific value.
  category_name:
    caption: Category
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event category name, as defined by category_uid value: `Identity & Access Management`.'
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event.
    enum:
      '3':
        caption: Identity & Access Management
        description: Identity & Access Management (IAM) events relate to the supervision of the system's authentication and access control model. Examples of such events are the success or failure of authentication, granting of authority, password change, entity change, privileged use etc.
  certificate:
    caption: Certificate
    type: object_t
    object: certificate
    requirement: recommended
    group: primary
    description: The certificate associated with the authentication or pre-authentication (Kerberos).
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event class name, as defined by class_uid value: `Authentication`.'
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event.
    enum:
      '3002':
        caption: Authentication
        description: Authentication events report authentication session activities such as user attempts a logon or logoff, successfully or otherwise.
  cloud:
    caption: Cloud
    type: object_t
    object: cloud
    requirement: required
    group: primary
    profile: cloud
    from: base_event
    description: Describes details about the Cloud environment where the event was originally created or logged.
  count:
    caption: Count
    type: integer_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The number of times that events in the same logical group occurred during the event Start Time to End Time period.
  device:
    caption: Device
    type: object_t
    object: device
    requirement: recommended
    group: primary
    profile: host
    from: iam
    observable: 20
    description: An addressable device, computer system or host.
  dst_endpoint:
    caption: Destination Endpoint
    type: object_t
    object: network_endpoint
    requirement: recommended
    group: primary
    observable: 20
    description: The endpoint to which the authentication was targeted.
  duration:
    caption: Duration Milliseconds
    type: long_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The event duration or aggregate time, the amount of time the event covers from `start_time` to `end_time` in milliseconds.
  end_time:
    caption: End Time
    type: timestamp_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The end time of a time period, or the time of the most recent event included in the aggregate event.
  end_time_dt:
    caption: End Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: base_event
    description: The end time of a time period, or the time of the most recent event included in the aggregate event.
  enrichments:
    caption: Enrichments
    type: object_t
    object: enrichment
    array: true
    requirement: optional
    group: context
    from: base_event
    description: 'The additional information from an external data source, which is associated with the event or a finding. For example add location information for the IP address in the DNS answers:`[{"name": "answers.ip", "value": "92.24.47.250", "type": "location", "data": {"city": "Socotra", "continent": "Asia", "coordinates": [-25.4153, 17.0743], "country": "YE", "desc": "Yemen"}}]`'
  http_request:
    caption: HTTP Request
    type: object_t
    object: http_request
    requirement: optional
    group: context
    from: iam
    description: Details about the underlying HTTP request.
  is_cleartext:
    caption: Cleartext Credentials
    type: boolean_t
    requirement: optional
    group: context
    description: |-
      Indicates whether the credentials were passed in clear text.

      Note: True if the credentials were passed in a clear text protocol such as FTP or TELNET, or if Windows detected that a user's logon password was passed to the authentication package in clear text.
  is_mfa:
    caption: Multi Factor Authentication
    type: boolean_t
    requirement: recommended
    group: primary
    description: Indicates whether Multi Factor Authentication was used during authentication.
  is_new_logon:
    caption: New Logon
    type: boolean_t
    requirement: optional
    group: context
    description: Indicates logon is from a device not seen before or a first time account logon.
  is_remote:
    caption: Remote
    type: boolean_t
    requirement: recommended
    group: primary
    description: The attempted authentication is over a remote connection.
  logon_process:
    caption: Logon Process
    type: object_t
    object: process
    requirement: optional
    group: context
    observable: 25
    description: The trusted process that validated the authentication credentials.
  logon_type:
    caption: Logon Type
    type: string_t
    requirement: recommended
    group: primary
    description: The logon type, normalized to the caption of the logon_type_id value. In the case of 'Other', it is defined by the event source.
  logon_type_id:
    caption: Logon Type ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: logon_type
    description: The normalized logon type identifier.
    enum:
      '0':
        caption: Unknown
        description: The logon type is unknown.
      '1':
        caption: System
        description: Used only by the System account, for example at system startup.
      '2':
        caption: Interactive
        description: A local logon to device console.
      '3':
        caption: Network
        description: A user or device logged onto this device from the network.
      '4':
        caption: Batch
        description: A batch server logon, where processes may be executing on behalf of a user without their direct intervention.
      '5':
        caption: OS Service
        description: A logon by a service or daemon that was started by the OS.
      '7':
        caption: Unlock
        description: A user unlocked the device.
      '8':
        caption: Network Cleartext
        description: A user logged on to this device from the network. The user's password in the authentication package was not hashed.
      '9':
        caption: New Credentials
        description: A caller cloned its current token and specified new credentials for outbound connections. The new logon session has the same local identity, but uses different credentials for other network connections.
      '10':
        caption: Remote Interactive
        description: A remote logon using Terminal Services or remote desktop application.
      '11':
        caption: Cached Interactive
        description: A user logged on to this device with network credentials that were stored locally on the device and the domain controller was not contacted to verify the credentials.
      '12':
        caption: Cached Remote Interactive
        description: Same as Remote Interactive. This is used for internal auditing.
      '13':
        caption: Cached Unlock
        description: Workstation logon.
      '99':
        caption: Other
        description: The logon type is not mapped. See the `logon_type` attribute, which contains a data source specific value.
  message:
    caption: Message
    type: string_t
    requirement: recommended
    group: primary
    from: base_event
    description: The description of the event/finding, as defined by the source.
  metadata:
    caption: Metadata
    type: object_t
    object: metadata
    requirement: required
    group: context
    from: base_event
    description: The metadata associated with the event or a finding.
  observables:
    caption: Observables
    type: object_t
    object: observable
    array: true
    requirement: recommended
    group: primary
    from: base_event
    description: The observables associated with the event or a finding.
  osint:
    caption: OSINT
    type: object_t
    object: osint
    array: true
    requirement: required
    group: primary
    profile: osint
    from: base_event
    description: The OSINT (Open Source Intelligence) object contains details related to an indicator such as the indicator itself, related indicators, geolocation, registrar information, subdomains, analyst commentary, and other contextual information. This information can be used to further enrich a detection or finding by providing decisioning support to other analysts and engineers.
  raw_data:
    caption: Raw Data
    type: string_t
    requirement: optional
    group: context
    from: base_event
    description: The raw event/finding data as received from the source.
  service:
    caption: Service
    type: object_t
    object: service
    requirement: recommended
    group: primary
    description: The service or gateway to which the user or process is being authenticated
  session:
    caption: Session
    type: object_t
    object: session
    requirement: recommended
    group: primary
    description: The authenticated user or service session.
  severity:
    caption: Severity
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event/finding severity, normalized to the caption of the severity_id value. In the case of 'Other', it is defined by the source.
  severity_id:
    caption: Severity ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: severity
    description: |-
      The normalized identifier of the event/finding severity.

      The normalized severity is a measurement the effort and expense required to manage and resolve an event or incident. Smaller numerical values represent lower impact events, and larger numerical values represent higher impact events.
    enum:
      '0':
        caption: Unknown
        description: The event/finding severity is unknown.
      '1':
        caption: Informational
        description: Informational message. No action required.
      '2':
        caption: Low
        description: The user decides if action is needed.
      '3':
        caption: Medium
        description: Action is required but the situation is not serious at this time.
      '4':
        caption: High
        description: Action is required immediately.
      '5':
        caption: Critical
        description: Action is required immediately and the scope is broad.
      '6':
        caption: Fatal
        description: An error occurred but it is too late to take remedial action.
      '99':
        caption: Other
        description: The event/finding severity is not mapped. See the `severity` attribute, which contains a data source specific value.
  src_endpoint:
    caption: Source Endpoint
    type: object_t
    object: network_endpoint
    requirement: recommended
    group: primary
    from: iam
    observable: 20
    description: Details about the source of the IAM activity.
  start_time:
    caption: Start Time
    type: timestamp_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The start time of a time period, or the time of the least recent event included in the aggregate event.
  start_time_dt:
    caption: Start Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: base_event
    description: The start time of a time period, or the time of the least recent event included in the aggregate event.
  status:
    caption: Status
    type: string_t
    requirement: recommended
    group: primary
    from: base_event
    description: The event status, normalized to the caption of the status_id value. In the case of 'Other', it is defined by the event source.
  status_code:
    caption: Status Code
    type: string_t
    requirement: recommended
    group: primary
    from: base_event
    description: |-
      The event status code, as reported by the event source.

      For example, in a Windows Failed Authentication event, this would be the value of 'Failure Code', e.g. 0x18.
  status_detail:
    caption: Status Detail
    type: string_t
    requirement: recommended
    group: primary
    description: |-
      The details about the authentication request. For example, possible details for Windows logon or logoff events are:

      - Success

      - LOGOFF_USER_INITIATED
      - LOGOFF_OTHER

      - Failure

      - USER_DOES_NOT_EXIST
      - INVALID_CREDENTIALS
      - ACCOUNT_DISABLED
      - ACCOUNT_LOCKED_OUT
      - PASSWORD_EXPIRED
  status_id:
    caption: Status ID
    type: integer_t
    requirement: recommended
    group: primary
    from: base_event
    sibling: status
    description: The normalized identifier of the event status.
    enum:
      '0':
        caption: Unknown
        description: The status is unknown.
      '1':
        caption: Success
      '2':
        caption: Failure
      '99':
        caption: Other
        description: The event status is not mapped. See the `status` attribute, which contains a data source specific value.
  time:
    caption: Event Time
    type: timestamp_t
    requirement: required
    group: occurrence
    from: base_event
    description: The normalized event occurrence time or the finding creation time.
  time_dt:
    caption: Event Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    from: base_event
    description: The normalized event occurrence time or the finding creation time.
  timezone_offset:
    caption: Timezone Offset
    type: integer_t
    requirement: recommended
    group: occurrence
    from: base_event
    description: The number of minutes that the reported event `time` is ahead or behind UTC, in the range -1,080 to +1,080.
  type_name:
    caption: Type Name
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event/finding type name, as defined by the type_uid.
  type_uid:
    caption: Type ID
    type: long_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event/finding type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
    enum:
      '300200':
        caption: 'Authentication: Unknown'
      '300201':
        caption: 'Authentication: Logon'
        description: A new logon session was requested.
      '300202':
        caption: 'Authentication: Logoff'
        description: A logon session was terminated and no longer exists.
      '300203':
        caption: 'Authentication: Authentication Ticket'
        description: A Kerberos authentication ticket (TGT) was requested.
      '300204':
        caption: 'Authentication: Service Ticket Request'
        description: A Kerberos service ticket was requested.
      '300205':
        caption: 'Authentication: Service Ticket Renew'
        description: A Kerberos service ticket was renewed.
      '300206':
        caption: 'Authentication: Preauth'
        description: A preauthentication stage was engaged.
      '300299':
        caption: 'Authentication: Other'
  unmapped:
    caption: Unmapped Data
    type: object_t
    object: object
    requirement: optional
    group: context
    from: base_event
    description: The attributes that are not mapped to the event schema. The names and values of those attributes are specific to the event source.
  user:
    caption: User
    type: object_t
    object: user
    requirement: required
    group: primary
    observable: 21
    description: The subject (user/role or account) to authenticate.

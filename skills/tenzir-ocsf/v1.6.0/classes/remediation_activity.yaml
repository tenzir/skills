name: remediation_activity
caption: Remediation Activity
uid: 7001
category: remediation
category_uid: 7
extends: base_event
description: Remediation Activity events report on attempts at remediating a compromised device or computer network. It follows the MITRE countermeasures defined by the D3FEND™ [Matrix](https://d3fend.mitre.org/).
profiles: [cloud, container, data_classification, datetime, host, osint, security_control]
attributes:
  action:
    caption: Action
    requirement: optional
    profile: security_control
    definition: v1.6.0/classes/base_event.yaml
  action_id:
    caption: Action ID
    requirement: recommended
    profile: security_control
    definition: v1.6.0/classes/base_event.yaml
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: 'Matches the MITRE D3FEND™ Tactic. Note: the Model and Detect Tactics are not supported as remediations by the OCSF Remediation event class.'
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Isolate
        description: Creates logical or physical barriers in a system which reduces opportunities for adversaries to create further accesses. Defined by D3FEND™ [d3f:Isolate](https://d3fend.mitre.org/tactic/d3f:Isolate/).
      '2':
        caption: Evict
        description: Removes an adversary or malicious resource from a device or computer network. Defined by D3FEND™ [d3f:Evict](https://d3fend.mitre.org/tactic/d3f:Evict/).
      '3':
        caption: Restore
        description: Returns the system to a better state. Defined by D3FEND™ [d3f:Restore](https://d3fend.mitre.org/tactic/d3f:Restore/).
      '4':
        caption: Harden
        description: Increases the opportunity cost of computer network exploitation. Defined by D3FEND™ [d3f:Harden](https://d3fend.mitre.org/tactic/d3f:Harden/).
      '5':
        caption: Detect
        description: Further identify adversary access to or unauthorized activity on computer networks. Defined by D3FEND™ [d3f:Detect](https://d3fend.mitre.org/tactic/d3f:Detect/).
      '99':
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.

# Attributes with a `definition` path are inherited unchanged. Read that file
# for their type, object, description, enum, and observable.
name: iam_analysis_finding
caption: IAM Analysis Finding
uid: 2008
category: findings
category_uid: 2
extends: finding
description: |-
  This finding represents an IAM analysis result, which evaluates IAM policies, access patterns, and IAM configurations for potential security risks. The analysis can focus on either an identity (user, role, service account) or a resource to assess permissions, access patterns, and security posture within the IAM domain.
  Note: Use `permission_analysis_results` for identity-centric analysis (evaluating what an identity can do) and `access_analysis_result` for resource-centric analysis (evaluating who can access a resource). These complement each other for comprehensive IAM security assessment.
  Note: If the Finding is an incident, i.e. requires incident workflow, also apply the `incident` profile or aggregate this finding into an `Incident Finding`.
profiles: [cloud, container, data_classification, datetime, host, incident, osint, security_control]
constraints:
  at_least_one: [access_analysis_result, applications, identity_activity_metrics, permission_analysis_results]
attributes:
  access_analysis_result:
    caption: Access Analysis Result
    type: object_t
    object: access_analysis_result
    requirement: optional
    group: context
    description: Describes access relationships and pathways between identities, resources, focusing on who can access what and through which mechanisms. This evaluates access levels (read/write/admin), access types (direct, cross-account, public, federated), and the conditions under which access is granted. Use this for resource-centric security assessments such as external access discovery, public exposure analysis, etc.

# Attributes with a `definition` path are inherited unchanged. Read that file
# for their type, object, description, enum, and observable.
name: network
caption: Network
category: network
abstract: true
extends: base_event
description: Network event is a generic event that defines a set of attributes available in the Network category.
profiles: [cloud, datetime, host, load_balancer, network_proxy, osint, security_control]
constraints:
  at_least_one: [dst_endpoint, src_endpoint]
attributes:
  action:
    caption: Action
    requirement: optional
    profile: security_control
    definition: v1.6.0/classes/base_event.yaml
  action_id:
    caption: Action ID
    requirement: recommended
    profile: security_control
    definition: v1.6.0/classes/base_event.yaml
  activity_id:
    caption: Activity ID
    requirement: required
    definition: v1.6.0/classes/base_event.yaml
  activity_name:
    caption: Activity
    requirement: optional
    definition: v1.6.0/classes/base_event.yaml
  actor:
    caption: Actor
    requirement: optional
    profile: host
    definition: v1.6.0/classes/base_event.yaml
  api:
    caption: API Details
    requirement: optional
    profile: cloud
    definition: v1.6.0/classes/base_event.yaml
  app_name:
    caption: Application Name
    type: string_t
    requirement: optional
    group: context
    description: The name of the application associated with the event or object.
  attacks:
    caption: MITRE ATT&CK® and ATLAS™ Details
    requirement: optional
    profile: security_control
    definition: v1.6.0/classes/base_event.yaml
  authorizations:
    caption: Authorization Information
    requirement: optional
    profile: security_control
    definition: v1.6.0/classes/base_event.yaml
  category_name:
    caption: Category
    requirement: optional
    definition: v1.6.0/classes/base_event.yaml
  category_uid:
    caption: Category ID
    requirement: required
    definition: v1.6.0/classes/base_event.yaml
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: The event class name, as defined by class_uid value.
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event.
    enum:
      '0':
        caption: Base Event
  cloud:
    caption: Cloud
    requirement: required
    profile: cloud
    definition: v1.6.0/classes/base_event.yaml
  confidence:
    caption: Confidence
    requirement: optional
    profile: security_control
    definition: v1.6.0/classes/base_event.yaml
  confidence_id:
    caption: Confidence ID
    requirement: recommended
    profile: security_control
    definition: v1.6.0/classes/base_event.yaml
  confidence_score:
    caption: Confidence Score
    requirement: optional
    profile: security_control
    definition: v1.6.0/classes/base_event.yaml
  connection_info:
    caption: Connection Info
    type: object_t
    object: network_connection_info
    requirement: recommended
    group: primary
    description: The network connection information.
  count:
    caption: Count
    requirement: optional
    definition: v1.6.0/classes/base_event.yaml
  device:
    caption: Device
    requirement: recommended
    profile: host
    definition: v1.6.0/classes/base_event.yaml
  disposition:
    caption: Disposition
    requirement: optional
    profile: security_control
    definition: v1.6.0/classes/base_event.yaml
  disposition_id:
    caption: Disposition ID
    requirement: recommended
    profile: security_control
    definition: v1.6.0/classes/base_event.yaml
  dst_endpoint:
    caption: Destination Endpoint
    type: object_t
    object: network_endpoint
    requirement: recommended
    group: primary
    observable: 20
    description: The responder (server) in a network connection.
  duration:
    caption: Duration Milliseconds
    requirement: optional
    definition: v1.6.0/classes/base_event.yaml
  end_time:
    caption: End Time
    requirement: optional
    definition: v1.6.0/classes/base_event.yaml
  enrichments:
    caption: Enrichments
    requirement: optional
    definition: v1.6.0/classes/base_event.yaml
  firewall_rule:
    caption: Firewall Rule
    requirement: optional
    profile: security_control
    definition: v1.6.0/classes/base_event.yaml
  is_alert:
    caption: Alert
    requirement: recommended
    profile: security_control
    definition: v1.6.0/classes/base_event.yaml
  ja4_fingerprint_list:
    caption: JA4+ Fingerprints
    type: object_t
    object: ja4_fingerprint
    array: true
    requirement: optional
    group: context
    description: A list of the JA4+ network fingerprints.
  load_balancer:
    caption: Load Balancer
    type: object_t
    object: load_balancer
    requirement: recommended
    group: primary
    profile: load_balancer
    description: The Load Balancer object contains information related to the device that is distributing incoming traffic to specified destinations.
  malware:
    caption: Malware
    requirement: optional
    profile: security_control
    definition: v1.6.0/classes/base_event.yaml
  malware_scan_info:
    caption: Malware Scan Info
    requirement: optional
    profile: security_control
    definition: v1.6.0/classes/base_event.yaml
  message:
    caption: Message
    requirement: recommended
    definition: v1.6.0/classes/base_event.yaml
  metadata:
    caption: Metadata
    requirement: required
    definition: v1.6.0/classes/base_event.yaml
  observables:
    caption: Observables
    requirement: recommended
    definition: v1.6.0/classes/base_event.yaml
  osint:
    caption: OSINT
    requirement: required
    profile: osint
    definition: v1.6.0/classes/base_event.yaml
  policy:
    caption: Policy
    requirement: optional
    profile: security_control
    definition: v1.6.0/classes/base_event.yaml
  proxy:
    caption: Proxy
    type: object_t
    object: network_proxy
    requirement: recommended
    group: primary
    observable: 20
    deprecated:
      since: 1.1.0
      message: Use the `proxy_endpoint` attribute instead.
    description: The proxy (server) in a network connection.
  proxy_connection_info:
    caption: Proxy Connection Info
    type: object_t
    object: network_connection_info
    requirement: recommended
    group: context
    profile: network_proxy
    description: The connection information from the proxy server to the remote server.
  proxy_endpoint:
    caption: Proxy Endpoint
    type: object_t
    object: network_proxy
    requirement: optional
    group: context
    profile: network_proxy
    observable: 20
    description: The proxy (server) in a network connection.
  proxy_http_request:
    caption: Proxy HTTP Request
    type: object_t
    object: http_request
    requirement: optional
    group: context
    profile: network_proxy
    description: The HTTP Request from the proxy server to the remote server.
  proxy_http_response:
    caption: Proxy HTTP Response
    type: object_t
    object: http_response
    requirement: optional
    group: context
    profile: network_proxy
    description: The HTTP Response from the remote server to the proxy server.
  proxy_tls:
    caption: Proxy TLS
    type: object_t
    object: tls
    requirement: recommended
    group: context
    profile: network_proxy
    description: The TLS protocol negotiated between the proxy server and the remote server.
  proxy_traffic:
    caption: Proxy Traffic
    type: object_t
    object: network_traffic
    requirement: recommended
    group: context
    profile: network_proxy
    description: The network traffic refers to the amount of data moving across a network, from proxy to remote server at a given point of time.
  raw_data:
    caption: Raw Data
    requirement: optional
    definition: v1.6.0/classes/base_event.yaml
  raw_data_hash:
    caption: Raw Data Hash
    requirement: optional
    definition: v1.6.0/classes/base_event.yaml
  raw_data_size:
    caption: Raw Data Size
    requirement: optional
    definition: v1.6.0/classes/base_event.yaml
  risk_details:
    caption: Risk Details
    requirement: optional
    profile: security_control
    definition: v1.6.0/classes/base_event.yaml
  risk_level:
    caption: Risk Level
    requirement: optional
    profile: security_control
    definition: v1.6.0/classes/base_event.yaml
  risk_level_id:
    caption: Risk Level ID
    requirement: optional
    profile: security_control
    definition: v1.6.0/classes/base_event.yaml
  risk_score:
    caption: Risk Score
    requirement: optional
    profile: security_control
    definition: v1.6.0/classes/base_event.yaml
  severity:
    caption: Severity
    requirement: optional
    definition: v1.6.0/classes/base_event.yaml
  severity_id:
    caption: Severity ID
    requirement: required
    definition: v1.6.0/classes/base_event.yaml
  src_endpoint:
    caption: Source Endpoint
    type: object_t
    object: network_endpoint
    requirement: recommended
    group: primary
    observable: 20
    description: The initiator (client) of the network connection.
  start_time:
    caption: Start Time
    requirement: optional
    definition: v1.6.0/classes/base_event.yaml
  status:
    caption: Status
    requirement: recommended
    definition: v1.6.0/classes/base_event.yaml
  status_code:
    caption: Status Code
    requirement: recommended
    definition: v1.6.0/classes/base_event.yaml
  status_detail:
    caption: Status Detail
    requirement: recommended
    definition: v1.6.0/classes/base_event.yaml
  status_id:
    caption: Status ID
    requirement: recommended
    definition: v1.6.0/classes/base_event.yaml
  time:
    caption: Event Time
    requirement: required
    definition: v1.6.0/classes/base_event.yaml
  timezone_offset:
    caption: Timezone Offset
    requirement: recommended
    definition: v1.6.0/classes/base_event.yaml
  tls:
    caption: TLS
    type: object_t
    object: tls
    requirement: optional
    group: context
    description: The Transport Layer Security (TLS) attributes.
  traffic:
    caption: Traffic
    type: object_t
    object: network_traffic
    requirement: recommended
    group: primary
    description: The network traffic refers to the amount of data moving across a network at a given point of time. Intended to be used alongside Network Connection.
  type_name:
    caption: Type Name
    requirement: optional
    definition: v1.6.0/classes/base_event.yaml
  type_uid:
    caption: Type ID
    type: long_t
    requirement: required
    group: classification
    from: base_event
    sibling: type_name
    description: 'The event/finding type ID. It identifies the event''s semantics and structure. The value is calculated by the logging system as: `class_uid * 100 + activity_id`.'
  unmapped:
    caption: Unmapped Data
    requirement: optional
    definition: v1.6.0/classes/base_event.yaml

advisory:
  caption: Security Advisory
  type: object_t
  object: advisory
  description: Detail about the security advisory, that is used to publicly disclose cybersecurity vulnerabilities by a vendor.
  used_by:
    objects: [vulnerability]
aerial_height:
  caption: Aerial Height
  type: string_t
  description: 'Expressed as either height above takeoff location or height above ground level (AGL) for a UAS current location. This value is provided in meters and must have a minimum resolution of 1 m. Special Values: `Invalid`, `No Value`, or `Unknown: -1000 m`.'
  used_by:
    objects: [location, unmanned_system_operating_area]
affected_code:
  caption: Affected Code
  type: object_t
  object: affected_code
  array: true
  description: List of Affected Code objects that describe details about code blocks identified as vulnerable.
  used_by:
    objects: [vulnerability]
affected_packages:
  caption: Affected Software Packages
  type: object_t
  object: affected_package
  array: true
  description: List of software packages identified as affected by a vulnerability/vulnerabilities.
  used_by:
    objects: [vulnerability]
agent:
  caption: Agent
  type: object_t
  object: agent
  description: An Agent (also known as a Sensor) is typically installed on an Operating System (OS) and serves as a specialized software component that can be designed to monitor, detect, collect, archive, or take action. These activities and possible actions are defined by the upstream system controlling the Agent and its intended purpose. For instance, an Agent can include Endpoint Detection & Response (EDR) agents, backup/disaster recovery sensors, Application Performance Monitoring or profiling sensors, and similar software.
agent_list:
  caption: Agent List
  type: object_t
  object: agent
  array: true
  description: A list of `agent` objects associated with a device, endpoint, or resource.
  used_by:
    objects: [databucket, device, endpoint, network_endpoint, network_proxy, resource_details]
aircraft:
  caption: Aircraft
  type: object_t
  object: aircraft
  description: The Aircraft object represents any aircraft or otherwise airborne asset such as an unmanned system, airplane, balloon, spacecraft, or otherwise. The Aircraft object is intended to normalized data captured or otherwise logged from active radar, passive radar, multi-spectral systems, or the Automatic Dependant Broadcast - Surveillance (ADS-B), and/or Mode S systems.
  used_by:
    classes: [airborne_broadcast_activity]
alert:
  caption: Client TLS Alert
  type: integer_t
  description: The integer value of TLS alert if present. The alerts are defined in the TLS specification in [RFC-2246](https://datatracker.ietf.org/doc/html/rfc2246).
  used_by:
    objects: [tls]
algorithm:
  caption: Algorithm
  type: string_t
  description: The applicable algorithm, normalized to the caption of 'algorithm_id'. See specific usage.
  used_by:
    objects: [analytic, digital_signature, encryption_details, fingerprint, hassh]
algorithm_id:
  caption: Algorithm ID
  type: integer_t
  sibling: algorithm
  description: The normalized identifier of the algorithm. See specific usage.
  used_by:
    objects: [digital_signature, encryption_details, fingerprint]
altitude_ceiling:
  caption: Altitude Ceiling
  type: string_t
  description: 'Maximum altitude (WGS-84 HAE) for a group or an Intent-Based Network Participant. Measured in meters. Special Values: `Invalid`, `No Value`, or `Unknown: -1000 m`.'
  used_by:
    objects: [unmanned_system_operating_area]
altitude_floor:
  caption: Altitude Floor
  type: string_t
  description: 'Minimum altitude (WGS-84 HAE) for a group or an Intent-Based Network Participant. Measured in meters. Special Values: `Invalid`, `No Value`, or `Unknown: -1000 m`.'
  used_by:
    objects: [unmanned_system_operating_area]

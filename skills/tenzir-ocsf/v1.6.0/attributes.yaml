  type: json_t
  description: The list of access check results.
  used_by:
    classes: [file_hosting]
access_type:
  caption: Access Type
  type: string_t
  description: The type or category of access being granted to the identity. See specific usage.
  used_by:
    objects: [access_analysis_result]
accessed_time:
  caption: Accessed Time
  type: timestamp_t
  description: The time when the file was last accessed.
  used_by:
    objects: [file]
accessed_time_dt:

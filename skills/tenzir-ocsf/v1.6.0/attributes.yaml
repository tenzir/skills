  used_by:
    objects: [http_request]
x_originating_ip:
  caption: X-Originating-IP
  type: ip_t
  array: true
  observable: 2
  description: The X-Originating-IP header identifying the emails originating IP address(es).
  used_by:
    objects: [email]
xattributes:
  caption: Extended Attributes
  type: object_t
  object: object
  description: |-
    An unordered collection of zero or more name/value pairs where each pair represents a file or folder extended attribute.For example: Windows alternate data stream attributes (ADS stream name, ADS size, etc.), user-defined or application-defined attributes, ACL, owner, primary group, etc. Examples from DCS:

    - ads_name
    - ads_size
    - dacl
    - owner
    - primary_group
    - link_name - name of the link associated to the file.
    - hard_link_count - the number of links that are associated to the file.
  used_by:
    objects: [file, process]
zone:
  caption: Network Zone
  type: string_t
  description: The network zone or LAN segment.
  used_by:
    objects: [cloud, databucket, device, endpoint, network_endpoint, network_proxy, resource_details]

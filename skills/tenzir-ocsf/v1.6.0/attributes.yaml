scim:
  caption: SCIM
  type: object_t
  object: scim
  description: The System for Cross-domain Identity Management (SCIM) resource object provides a structured set of attributes related to SCIM protocols used for identity provisioning and management across cloud-based platforms. It standardizes user and group provisioning details, enabling identity synchronization and lifecycle management with compatible Identity Providers (IdPs) and applications. SCIM is defined in [RFC-7634](https://datatracker.ietf.org/doc/html/rfc7643)
  used_by:
    objects: [idp]
scim_group_schema:
  caption: SCIM Group Schema
  type: json_t
  description: 'SCIM provides a schema for representing groups, identified using the following schema URI: `urn:ietf:params:scim:schemas:core:2.0:Group` as defined in [RFC-7634](https://datatracker.ietf.org/doc/html/rfc7643). This attribute will capture key-value pairs for the scheme implemented in a SCIM resource.'
  used_by:
    objects: [scim]
scim_user_schema:
  caption: SCIM User Schema
  type: json_t
  description: 'SCIM provides a resource type for user resources. The core schema for user is identified using the following schema URI: `urn:ietf:params:scim:schemas:core:2.0:User` as defined in [RFC-7634](https://datatracker.ietf.org/doc/html/rfc7643). his attribute will capture key-value pairs for the scheme implemented in a SCIM resource. This object is inclusive of both the basic and Enterprise User Schema Extension.'
  used_by:
    objects: [scim]

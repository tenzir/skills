name: network_proxy
caption: Network Proxy Endpoint
extends: network_endpoint
observable: 20
description: The network proxy endpoint object describes a proxy server, which acts as an intermediary between a client requesting a resource and the server providing that resource.
profiles: [container]
constraints:
  at_least_one: [ip, uid, name, hostname, svc_name, instance_uid, interface_uid, interface_name, domain]
references:
- description: D3FEND™ Ontology d3f:ProxyServer
  url: https://d3fend.mitre.org/dao/artifact/d3f:ProxyServer/
referenced_by:
  classes:
    airborne_broadcast_activity: [proxy_endpoint]
    dhcp_activity: [proxy, proxy_endpoint]
    dns_activity: [proxy, proxy_endpoint]
    drone_flights_activity: [proxy_endpoint]
    ftp_activity: [proxy, proxy_endpoint]
    http_activity: [proxy, proxy_endpoint]
    network_activity: [proxy, proxy_endpoint]
    network_file_activity: [proxy, proxy_endpoint]
    ntp_activity: [proxy, proxy_endpoint]
    rdp_activity: [proxy, proxy_endpoint]
    smb_activity: [proxy, proxy_endpoint]
    ssh_activity: [proxy, proxy_endpoint]
    tunnel_activity: [proxy, proxy_endpoint]
    web_resource_access_activity: [proxy, proxy_endpoint]
    web_resources_activity: [proxy_endpoint]
  objects:
    network_endpoint: [proxy_endpoint]
    network_proxy: [proxy_endpoint]
attributes:
  agent_list:
    caption: Agent List
    type: object_t
    object: agent
    array: true
    requirement: optional
    from: endpoint
    description: A list of `agent` objects associated with a device, endpoint, or resource.
  autonomous_system:
    caption: Autonomous System
    type: object_t
    object: autonomous_system
    requirement: optional
    from: network_endpoint
    description: The Autonomous System details associated with an IP address.
  container:
    caption: Container
    type: object_t
    object: container
    requirement: recommended
    group: context
    profile: container
    from: endpoint
    observable: 27
    description: The information describing an instance of a container. A container is a prepackaged, portable system image that runs isolated on an existing system using a container runtime like containerd.
  domain:
    caption: Domain
    type: string_t
    requirement: optional
    from: endpoint
    description: The name of the domain that the endpoint belongs to or that corresponds to the endpoint.
  hostname:
    caption: Hostname
    type: hostname_t
    requirement: recommended
    from: endpoint
    observable: 1
    description: The fully qualified name of the endpoint.
  hw_info:
    caption: Hardware Info
    type: object_t
    object: device_hw_info
    requirement: optional
    from: endpoint
    description: The endpoint hardware information.
  instance_uid:
    caption: Instance ID
    type: string_t
    requirement: recommended
    from: endpoint
    description: The unique identifier of a VM instance.
  interface_name:
    caption: Network Interface Name
    type: string_t
    requirement: recommended
    from: endpoint
    description: The name of the network interface (e.g. eth2).
  interface_uid:
    caption: Network Interface ID
    type: string_t
    requirement: recommended
    from: endpoint
    description: The unique identifier of the network interface.
  intermediate_ips:
    caption: Intermediate IP Addresses
    type: ip_t
    array: true
    requirement: optional
    from: network_endpoint
    observable: 2
    description: The intermediate IP Addresses. For example, the IP addresses in the HTTP X-Forwarded-For header.
  ip:
    caption: IP Address
    type: ip_t
    requirement: recommended
    from: endpoint
    observable: 2
    description: The IP address of the endpoint, in either IPv4 or IPv6 format.
  isp:
    caption: ISP Name
    type: string_t
    requirement: optional
    from: network_endpoint
    description: The name of the Internet Service Provider (ISP).
  isp_org:
    caption: ISP Org
    type: string_t
    requirement: optional
    from: network_endpoint
    description: The organization name of the Internet Service Provider (ISP). This represents the parent organization or company that owns/operates the ISP. For example, Comcast Corporation would be the ISP org for Xfinity internet service. This attribute helps identify the ultimate provider when ISPs operate under different brand names.
  location:
    caption: Geo Location
    type: object_t
    object: location
    requirement: optional
    from: endpoint
    observable: 26
    description: The geographical location of the endpoint.
  mac:
    caption: MAC Address
    type: mac_t
    requirement: optional
    from: endpoint
    observable: 3
    description: The Media Access Control (MAC) address of the endpoint.
  name:
    caption: Name
    type: string_t
    requirement: recommended
    from: endpoint
    description: The short name of the endpoint.
  namespace_pid:
    caption: Namespace PID
    type: integer_t
    requirement: recommended
    group: context
    profile: container
    from: endpoint
    description: If running under a process namespace (such as in a container), the process identifier within that process namespace.
  os:
    caption: OS
    type: object_t
    object: os
    requirement: optional
    from: endpoint
    description: The endpoint operating system.
  owner:
    caption: Owner
    type: object_t
    object: user
    requirement: recommended
    from: endpoint
    observable: 21
    description: The identity of the service or user account that owns the endpoint or was last logged into it.
  port:
    caption: Port
    type: port_t
    requirement: recommended
    from: network_endpoint
    observable: 11
    description: The port used for communication within the network connection.
  proxy_endpoint:
    caption: Proxy Endpoint
    type: object_t
    object: network_proxy
    requirement: optional
    from: network_endpoint
    observable: 20
    description: The network proxy information pertaining to a specific endpoint. This can be used to describe information pertaining to network address translation (NAT).
  subnet_uid:
    caption: Subnet UID
    type: string_t
    requirement: optional
    from: endpoint
    description: The unique identifier of a virtual subnet.
  svc_name:
    caption: Service Name
    type: string_t
    requirement: recommended
    from: network_endpoint
    description: The service name in service-to-service connections. For example, AWS VPC logs the pkt-src-aws-service and pkt-dst-aws-service fields identify the connection is coming from or going to an AWS service.
  type:
    caption: Type
    type: string_t
    requirement: optional
    from: network_endpoint
    description: 'The network endpoint type. For example: `unknown`, `server`, `desktop`, `laptop`, `tablet`, `mobile`, `virtual`, `browser`, or `other`.'
  type_id:
    caption: Type ID
    type: integer_t
    requirement: recommended
    from: network_endpoint
    sibling: type
    description: The network endpoint type ID.
    enum:
      '0':
        caption: Unknown
        description: The type is unknown.
      '1':
        caption: Server
        description: A [server](https://d3fend.mitre.org/dao/artifact/d3f:Server/).
      '2':
        caption: Desktop
        description: A [desktop computer](https://d3fend.mitre.org/dao/artifact/d3f:DesktopComputer/).
      '3':
        caption: Laptop
        description: A [laptop computer](https://d3fend.mitre.org/dao/artifact/d3f:LaptopComputer/).
      '4':
        caption: Tablet
        description: A [tablet computer](https://d3fend.mitre.org/dao/artifact/d3f:TabletComputer/).
      '5':
        caption: Mobile
        description: A [mobile phone](https://d3fend.mitre.org/dao/artifact/d3f:MobilePhone/).
      '6':
        caption: Virtual
        description: A [virtual machine](https://d3fend.mitre.org/dao/artifact/d3f:VirtualizationSoftware/).
      '7':
        caption: IOT
        description: An [IOT (Internet of Things) device](https://www.techtarget.com/iotagenda/definition/IoT-device).
      '8':
        caption: Browser
        description: A [web browser](https://d3fend.mitre.org/dao/artifact/d3f:Browser/).
      '9':
        caption: Firewall
        description: A [networking firewall](https://d3fend.mitre.org/dao/artifact/d3f:Firewall/).
      '10':
        caption: Switch
        description: A [networking switch](https://d3fend.mitre.org/dao/artifact/d3f:Switch/).
      '11':
        caption: Hub
        description: A [networking hub](https://en.wikipedia.org/wiki/Ethernet_hub).
      '12':
        caption: Router
        description: A [networking router](https://d3fend.mitre.org/dao/artifact/d3f:Router/).
      '13':
        caption: IDS
        description: An [intrusion detection system](https://d3fend.mitre.org/dao/artifact/d3f:IntrusionDetectionSystem/).
      '14':
        caption: IPS
        description: An [intrusion prevention system](https://d3fend.mitre.org/dao/artifact/d3f:IntrusionPreventionSystem/).
      '15':
        caption: Load Balancer
        description: A [Load Balancer device.](https://en.wikipedia.org/wiki/Load_balancing_(computing))
      '99':
        caption: Other
        description: The type is not mapped. See the `type` attribute, which contains a data source specific value.
  uid:
    caption: Unique ID
    type: string_t
    requirement: recommended
    from: endpoint
    description: The unique identifier of the endpoint.
  vlan_uid:
    caption: VLAN
    type: string_t
    requirement: optional
    from: endpoint
    description: The Virtual LAN identifier.
  vpc_uid:
    caption: VPC UID
    type: string_t
    requirement: optional
    from: endpoint
    description: The unique identifier of the Virtual Private Cloud (VPC).
  zone:
    caption: Network Zone
    type: string_t
    requirement: optional
    from: endpoint
    description: The network zone or LAN segment.

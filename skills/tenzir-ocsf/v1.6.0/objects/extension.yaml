name: extension
caption: Schema Extension
extends: _entity
description: The OCSF Schema Extension object provides detailed information about the schema extension used to construct the event. The schema extensions are registered in the [extensions.md](https://github.com/ocsf/ocsf-schema/blob/main/extensions.md) file.
referenced_by:
  objects:
    metadata: [extension, extensions]
attributes:
  name:
    caption: Name
    type: string_t
    requirement: required
    description: 'The schema extension name. For example: `dev`.'
  uid:
    caption: Unique ID
    type: string_t
    requirement: required
    description: 'The schema extension unique identifier. For example: `999`.'
  version:
    caption: Version
    type: string_t
    requirement: required
    description: 'The schema extension version. For example: `1.0.0-alpha.2`.'

boolean_t:
  caption: Boolean
  values: [false, true]
  description: Boolean value. One of `true` or `false`.
bytestring_t:
  caption: Byte String
  base: string_t
  regex: ^(?:(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)|(?:[A-Za-z0-9_-]{4})*(?:[A-Za-z0-9_-]{2}==|[A-Za-z0-9_-]{3}=))?$
  description: Base 64 encoded immutable byte sequence. Traditional Base 64 is preferred but publishers may use URL-safe Base 64 when known to be acceptable to consumers. These encodings are described in RFC 4648.
  references:
  - description: RFC 4648
    url: https://www.rfc-editor.org/rfc/rfc4648.html
datetime_t:
  caption: Datetime
  base: string_t
  regex: ^\d{4}-\d{2}-\d{2}[Tt]\d{2}:\d{2}:\d{2}(?:\.\d+)?([Zz]|[\+-]\d{2}:\d{2})?$
  description: |-
    The Internet Date/Time format as defined in [RFC-3339](https://www.rfc-editor.org/rfc/rfc3339.html). For example:
    `2024-09-10T23:20:50.520Z`,
    `2024-09-10 23:20:50.520789Z`.
email_t:
  caption: Email Address
  base: string_t
  regex: ^[a-zA-Z0-9!#$%&'*+-/=?^_`{|}~.]+@[a-zA-Z0-9-]+\.[a-zA-Z0-9-.]+$
  observable: 5
  description: |-
    Email address. For example:
    `john_doe@example.com`.
file_hash_t:
  caption: Hash
  base: string_t
  regex: ^[a-fA-F0-9]+$
  observable: 8
  description: |-
    Hash. A unique value that corresponds to the content of the file, image, ja3_hash or hassh found in the schema. For example:
     MD5: `3172ac7e2b55cbb81f04a6e65855a628`.
file_name_t:
  caption: File Name
  base: string_t
  observable: 7
  description: |-
    File name. For example:
    `text-file.txt`.
file_path_t:
  caption: File Path
  base: string_t
  observable: 45
  description: |-
    The full path to the file. For example: For example:
    `c:\windows\system32\svchost.exe`.
float_t:
  caption: Float
  description: |-
    Real floating-point value. For example:
    `3.14`.
hostname_t:
  caption: Hostname
  base: string_t
  observable: 1
  description: |-
    Unique name assigned to a device connected to a computer network. It may be a fully qualified domain name (FQDN). For example:
    `r2-d2.example.com.`,
    `mx.example.com`
integer_t:
  caption: Integer
  description: Signed integer value.
ip_t:
  caption: IP Address
  base: string_t
  max_len: 40
  regex: ((^\s*((([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5]).){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5]))\s*$)|(^\s*((([0-9A-Fa-f]{1,4}:){7}([0-9A-Fa-f]{1,4}|:))|(([0-9A-Fa-f]{1,4}:){6}(:[0-9A-Fa-f]{1,4}|((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3})|:))|(([0-9A-Fa-f]{1,4}:){5}(((:[0-9A-Fa-f]{1,4}){1,2})|:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3})|:))|(([0-9A-Fa-f]{1,4}:){4}(((:[0-9A-Fa-f]{1,4}){1,3})|((:[0-9A-Fa-f]{1,4})?:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9A-Fa-f]{1,4}:){3}(((:[0-9A-Fa-f]{1,4}){1,4})|((:[0-9A-Fa-f]{1,4}){0,2}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9A-Fa-f]{1,4}:){2}(((:[0-9A-Fa-f]{1,4}){1,5})|((:[0-9A-Fa-f]{1,4}){0,3}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9A-Fa-f]{1,4}:){1}(((:[0-9A-Fa-f]{1,4}){1,6})|((:[0-9A-Fa-f]{1,4}){0,4}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(:(((:[0-9A-Fa-f]{1,4}){1,7})|((:[0-9A-Fa-f]{1,4}){0,5}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:)))(%.+)?\s*$))
  observable: 2
  description: |-
    Internet Protocol address (IP address), in either IPv4 or IPv6 format. For example:
    `192.168.200.24`,
     `2001:0db8:85a3:0000:0000:8a2e:0370:7334`.
json_t:
  caption: JSON
  description: Embedded JSON value. A value can be a string, or a number, or true or false or null, or an object or an array. These structures can be nested. See [www.json.org](https://www.json.org).
long_t:
  caption: Long
  description: 8-byte long, signed integer value.
mac_t:
  caption: MAC Address
  base: string_t
  max_len: 32
  regex: ^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$
  observable: 3
  description: |-
    Media Access Control (MAC) address. For example:
    `18:36:F3:98:4F:9A`.
port_t:
  caption: Port
  base: integer_t
  range: [0, 65535]
  observable: 11
  description: |-
    The TCP/UDP port number. For example:
    `80`,
    `22`.
process_name_t:
  caption: Process Name
  base: string_t
  observable: 9
  description: |-
    Process name. For example:
    `Notepad`.
reg_key_path_t:
  caption: Registry Key Path
  base: string_t
  extension: win
  observable: 46
  description: Full path of registry key.
resource_uid_t:
  caption: Resource UID
  base: string_t
  observable: 10
  description: Resource unique identifier. For example, S3 Bucket name or EC2 Instance ID.
string_t:
  caption: String
  description: UTF-8 encoded byte sequence.
subnet_t:
  caption: Subnet
  base: string_t
  max_len: 42
  observable: 12
  description: |-
    The subnet represented in a CIDR notation, using the format network_address/prefix_length. The network_address can be in either IPv4 or IPv6 format. The prefix length indicates the number of bits used for the network portion, and the remaining bits are available for host addresses within that subnet. For example:
    `192.168.1.0/24`,
    `2001:0db8:85a3:0000::/64`
timestamp_t:
  caption: Timestamp
  base: long_t
  description: |-
    The timestamp format is the number of milliseconds since the Epoch 01/01/1970 00:00:00 UTC. For example:
    `1618524549901`.
url_t:
  caption: URL String
  base: string_t
  observable: 6
  description: |-
    Uniform Resource Locator (URL) string. For example:
    `http://www.example.com/download/trouble.exe`.
username_t:
  caption: User Name
  base: string_t
  observable: 4
  description: |-
    User name. For example:
    `john_doe`.
uuid_t:
  caption: UUID
  base: string_t
  regex: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
  description: |-
    128-bit universal unique identifier. For example:
    `123e4567-e89b-12d3-a456-42661417400`.

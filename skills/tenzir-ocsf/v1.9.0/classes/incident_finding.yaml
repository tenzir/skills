name: incident_finding
caption: Incident Finding
uid: 2005
category: findings
category_uid: 2
extends: base_event
supersedes:
- name: security_finding
  since: 1.1.0
description: |-
  An Incident Finding reports the creation, update, or closure of security incidents as a result of detections and/or analytics.
  Note: `Incident Finding` implicitly includes the `incident` profile and it should be added to the `metadata.profiles[]` array.
profiles: [cloud, container, data_classification, datetime, host, incident, osint, record_integrity, security_control]
constraints:
  at_least_one: [assignee, assignee_group]
attributes:
  action:
    caption: Action
    type: string_t
    requirement: optional
    group: primary
    profile: security_control
    from: base_event
    description: The normalized caption of `action_id`.
  action_id:
    caption: Action ID
    type: integer_t
    requirement: recommended
    group: primary
    profile: security_control
    from: base_event
    sibling: action
    description: The action taken by a control or other policy-based system leading to an outcome or disposition. An unknown action may still correspond to a known disposition. Refer to `disposition_id` for the outcome of the action.
    enum:
      '0':
        caption: Unknown
        description: The action was unknown. The `disposition_id` attribute may still be set to a non-unknown value, for example 'Custom Action', 'Challenge'.
      '1':
        caption: Allowed
        description: The activity was allowed. The `disposition_id` attribute should be set to a value that conforms to this action, for example 'Allowed', 'Approved', 'Delayed', 'No Action', 'Count' etc.
      '2':
        caption: Denied
        description: The attempted activity was denied. The `disposition_id` attribute should be set to a value that conforms to this action, for example 'Blocked', 'Rejected', 'Quarantined', 'Isolated', 'Dropped', 'Access Revoked, etc.
      '3':
        caption: Observed
        description: The activity was observed, but neither explicitly allowed nor denied. This is common with IDS and EDR controls that report additional information on observed behavior such as TTPs. The `disposition_id` attribute should be set to a value that conforms to this action, for example 'Logged', 'Alert', 'Detected', 'Count', etc.
      '4':
        caption: Modified
        description: The activity was modified, adjusted, or corrected. The `disposition_id` attribute should be set appropriately, for example 'Restored', 'Corrected', 'Delayed', 'Captcha', 'Tagged'.
      '99':
        caption: Other
        description: The action is not mapped. See the `action` attribute which contains a data source specific value.
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the incident activity. Use `1` (Create) when an incident is first opened, `2` (Update) when an existing incident is modified (e.g., new findings added, priority changed, assignee updated), and `3` (Close) when the incident is resolved.
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Create
        description: Reports the creation of an Incident.
      '2':
        caption: Update
        description: Reports updates to an Incident.
      '3':
        caption: Close
        description: Reports closure of an Incident .
      '99':
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  activity_name:
    caption: Activity
    type: string_t
    requirement: optional
    group: classification
    description: The incident activity name, as defined by the `activity_id`. When `activity_id` is `99` (Other), this must contain the source-specific activity label.
  actor:
    caption: Actor
    type: object_t
    object: actor
    requirement: optional
    group: primary
    profile: host
    from: base_event
    description: The user, process, or service that initiated the activity on the host. For system-level events this is typically a process; for IAM events it is typically a user or role.
  api:
    caption: API Details
    type: object_t
    object: api
    requirement: optional
    group: context
    profile: cloud
    from: base_event
    description: Describes details about a typical API (Application Programming Interface) call.
  assignee:
    caption: Assignee
    type: object_t
    object: user
    requirement: optional
    group: context
    observable: 21
    description: The details of the user assigned to an Incident.
  assignee_group:
    caption: Assignee Group
    type: object_t
    object: group
    requirement: optional
    group: context
    description: The details of the group assigned to an Incident.
  attacks:
    caption: MITRE ATT&CK® and ATLAS™ Details
    type: object_t
    object: attack
    array: true
    requirement: optional
    group: context
    description: An array of attack objects, each describing a tactic, technique, and/or sub-technique associated with the Incident.
    references:
    - description: MITRE ATT&CK®
      url: https://attack.mitre.org
  attestation_list:
    caption: Attestation List
    type: object_t
    object: attestation
    array: true
    requirement: optional
    group: context
    profile: record_integrity
    from: base_event
    description: One or more cryptographic `attestation` objects over an event, each providing integrity, authenticity, and non-repudiation. Independent attesters over the same event — for example a producer at write time and a downstream processor at ingest — each contribute a separate attestation, distinct from co-signers on a single attestation, which share its `signatures` array. Carried on the `record_integrity` profile; the object itself is domain-agnostic.
  authorizations:
    caption: Authorization Information
    type: object_t
    object: authorization
    array: true
    requirement: optional
    group: primary
    profile: security_control
    from: base_event
    description: Provides details about an authorization, such as authorization outcome, and any associated policies related to the activity/event.
  category_name:
    caption: Category
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event category name, as defined by category_uid value: `Findings`.'
  category_uid:
    caption: Category ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: category_name
    description: The category unique identifier of the event. Each event class belongs to exactly one category. Producers and mappers must set this to the category defined by the event class being used.
    enum:
      '2':
        caption: Findings
        description: Findings events report findings, detections, and possible resolutions of malware, anomalies, or other actions performed by security products.
  class_name:
    caption: Class
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event class name, as defined by class_uid value: `Incident Finding`.'
  class_uid:
    caption: Class ID
    type: integer_t
    requirement: required
    group: classification
    sibling: class_name
    description: The unique identifier of a class. A class describes the attributes available in an event. Producers and mappers must set this to the `uid` defined in the event class definition. For example, `Detection Finding` is `2004`.
    enum:
      '2005':
        caption: Incident Finding
        description: |-
          An Incident Finding reports the creation, update, or closure of security incidents as a result of detections and/or analytics.
          Note: `Incident Finding` implicitly includes the `incident` profile and it should be added to the `metadata.profiles[]` array.
  cloud:
    caption: Cloud
    type: object_t
    object: cloud
    requirement: required
    group: primary
    profile: cloud
    from: base_event
    description: Describes details about the Cloud environment where the event or finding was created.
  comment:
    caption: Comment
    type: string_t
    requirement: optional
    group: context
    deprecated:
      since: 1.9.0
      message: Use the `notes` attribute instead.
      superseded_by: [notes]
    description: Additional user supplied details for updating or closing the incident.
  confidence:
    caption: Confidence
    type: string_t
    requirement: optional
    group: context
    description: The confidence, normalized to the caption of the confidence_id value. In the case of 'Other', it is defined by the event source.
  confidence_id:
    caption: Confidence ID
    type: integer_t
    requirement: recommended
    group: context
    sibling: confidence
    description: The normalized identifier of the confidence level for this incident, representing a summary across all aggregated findings. It reflects the accuracy of the analytics that produced those findings. A lower confidence value indicates a wider finding scope that may produce noisy or potentially non-malicious reports. When the value is `99` (Other), the `confidence` attribute must contain the incident-specific label.
    enum:
      '0':
        caption: Unknown
        description: The normalized confidence is unknown.
      '1':
        caption: Low
      '2':
        caption: Medium
      '3':
        caption: High
      '99':
        caption: Other
        description: The confidence is not mapped to the defined enum values. See the `confidence` attribute, which contains a data source specific value.
  confidence_score:
    caption: Confidence Score
    type: integer_t
    requirement: optional
    group: context
    description: The confidence score assigned to the incident by the system or analyst, expressed on a source-specific numeric scale. This score provides finer-grained confidence information than the categorical `confidence_id` value. When `confidence_id` is `99` (Other), the `confidence` attribute should reflect the same assessment if both are populated.
  count:
    caption: Count
    type: integer_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The number of events aggregated into this single record. Only populate for aggregate events. When set, `start_time` and `end_time` should also be provided to define the aggregation window.
  desc:
    caption: Description
    type: string_t
    requirement: recommended
    group: primary
    description: The short description of the Incident.
  device:
    caption: Device
    type: object_t
    object: device
    requirement: recommended
    group: primary
    profile: host
    from: base_event
    observable: 20
    description: The host or device where the activity was observed. Populate with details such as hostname, IP address, OS, and hardware identifiers when available from the source.
  disposition:
    caption: Disposition
    type: string_t
    requirement: optional
    group: primary
    profile: security_control
    from: base_event
    description: The disposition name, normalized to the caption of the disposition_id value. In the case of 'Other', it is defined by the event source.
  disposition_id:
    caption: Disposition ID
    type: integer_t
    requirement: recommended
    group: primary
    profile: security_control
    from: base_event
    sibling: disposition
    description: Describes the outcome or action taken by a security control, such as access control checks, malware detections or various types of policy violations.
    enum:
      '0':
        caption: Unknown
        description: The disposition is unknown.
      '1':
        caption: Allowed
        description: Granted access or allowed the action to the protected resource.
      '2':
        caption: Blocked
        description: Denied access or blocked the action to the protected resource.
      '3':
        caption: Quarantined
        description: A suspicious file or other content was moved to a benign location.
      '4':
        caption: Isolated
        description: A session was isolated on the network or within a browser.
      '5':
        caption: Deleted
        description: A file or other content was deleted.
      '6':
        caption: Dropped
        description: The request was detected as a threat and resulted in the connection being dropped.
      '7':
        caption: Custom Action
        description: A custom action was executed such as running of a command script. Use the `message` attribute of the base class for details.
      '8':
        caption: Approved
        description: A request or submission was approved. For example, when a form was properly filled out and submitted. This is distinct from `1` 'Allowed'.
      '9':
        caption: Restored
        description: A quarantined file or other content was restored to its original location.
      '10':
        caption: Exonerated
        description: A suspicious or risky entity was deemed to no longer be suspicious (re-scored).
      '11':
        caption: Corrected
        description: A corrupt file or configuration was corrected.
      '12':
        caption: Partially Corrected
        description: A corrupt file or configuration was partially corrected.
      '13':
        caption: Uncorrected
        description: A corrupt file or configuration was not corrected.
      '14':
        caption: Delayed
        description: An operation was delayed, for example if a restart was required to finish the operation.
      '15':
        caption: Detected
        description: Suspicious activity or a policy violation was detected without further action.
      '16':
        caption: No Action
        description: The outcome of an operation had no action taken.
      '17':
        caption: Logged
        description: The operation or action was logged without further action.
      '18':
        caption: Tagged
        description: A file or other entity was marked with extended attributes.
      '19':
        caption: Alert
        description: The request or activity was detected as a threat and resulted in a notification but request was not blocked.
      '20':
        caption: Count
        description: Counted the request or activity but did not determine whether to allow it or block it.
      '21':
        caption: Reset
        description: The request was detected as a threat and resulted in the connection being reset.
      '22':
        caption: Captcha
        description: Required the end user to solve a CAPTCHA puzzle to prove that a human being is sending the request.
      '23':
        caption: Challenge
        description: Ran a silent challenge that required the client session to verify that it's a browser, and not a bot.
      '24':
        caption: Access Revoked
        description: 'The requestor''s access has been revoked due to security policy enforcements. Note: use the `Host` profile if the `User` or `Actor` requestor is not present in the event class.'
      '25':
        caption: Rejected
        description: A request or submission was rejected. For example, when a form was improperly filled out and submitted. This is distinct from `2` 'Blocked'.
      '26':
        caption: Unauthorized
        description: An attempt to access a resource was denied due to an authorization check that failed. This is a more specific disposition than `2` 'Blocked' and can be complemented with the `authorizations` attribute for more detail.
      '27':
        caption: Error
        description: An error occurred during the processing of the activity or request. Use the `message` attribute of the base class for details.
      '99':
        caption: Other
        description: The disposition is not mapped. See the `disposition` attribute, which contains a data source specific value.
  duration:
    caption: Duration Milliseconds
    type: long_t
    requirement: optional
    group: occurrence
    from: base_event
    description: The elapsed time of the aggregation window in milliseconds, from `start_time` to `end_time`. Only populate for aggregate events (`count` > 1). The value should equal `end_time - start_time`.
  end_time:
    caption: End Time
    type: timestamp_t
    requirement: optional
    group: occurrence
    description: The time of the most recent event or finding that contributed to this incident.
  end_time_dt:
    caption: End Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    description: The time of the most recent event or finding that contributed to this incident.
  enrichments:
    caption: Enrichments
    type: object_t
    object: enrichment
    array: true
    requirement: optional
    group: context
    from: base_event
    description: 'The additional information from an external data source, which is associated with the event or a finding. For example add location information for the IP address in the DNS answers:`[{"name": "answers.ip", "value": "92.24.47.250", "type": "location", "data": {"city": "Socotra", "continent": "Asia", "coordinates": [-25.4153, 17.0743], "country": "YE", "desc": "Yemen"}}]`'
  finding_info_list:
    caption: Finding Information List
    type: object_t
    object: finding_info
    array: true
    requirement: required
    group: primary
    description: A list of `finding_info` objects.
  firewall_rule:
    caption: Firewall Rule
    type: object_t
    object: firewall_rule
    requirement: optional
    group: primary
    profile: security_control
    from: base_event
    description: The firewall rule that pertains to the control that triggered the event, if applicable.
  impact:
    caption: Impact
    type: string_t
    requirement: recommended
    group: primary
    description: The impact , normalized to the caption of the impact_id value. In the case of 'Other', it is defined by the event source.
  impact_id:
    caption: Impact ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: impact
    description: The normalized impact of the incident or finding. Per NIST, this is the magnitude of harm that can be expected to result from the consequences of unauthorized disclosure, modification, destruction, or loss of information or information system availability.
    enum:
      '0':
        caption: Unknown
        description: The normalized impact is unknown.
      '1':
        caption: Low
        description: The magnitude of harm is low.
      '2':
        caption: Medium
        description: The magnitude of harm is moderate.
      '3':
        caption: High
        description: The magnitude of harm is high.
      '4':
        caption: Critical
        description: The magnitude of harm is high and the scope is widespread.
      '99':
        caption: Other
        description: The impact is not mapped. See the `impact` attribute, which contains a data source specific value.
    references:
    - description: NIST SP 800-172 from FIPS 199
      url: https://doi.org/10.6028/NIST.FIPS.199
    - description: NIST Computer Security Resource Center
      url: https://doi.org/10.6028/NIST.FIPS.199
  impact_score:
    caption: Impact Score
    type: integer_t
    requirement: recommended
    group: primary
    description: The impact as an integer value of the finding, valid range 0-100.
  is_alert:
    caption: Alert
    type: boolean_t
    requirement: recommended
    group: primary
    profile: security_control
    from: base_event
    description: Indicates that the event is considered to be an alertable signal. Should be set to `true` if `disposition_id = Alert` among other dispositions, and/or `risk_level_id` or `severity_id` of the event is elevated. Not all control events will be alertable, for example if `disposition_id = Exonerated` or `disposition_id = Allowed`.
  is_suspected_breach:
    caption: Suspected Breach
    type: boolean_t
    requirement: optional
    group: context
    description: A determination based on analytics as to whether a potential breach was found.
  malware:
    caption: Malware
    type: object_t
    object: malware
    array: true
    requirement: optional
    group: primary
    profile: security_control
    from: base_event
    description: A list of Malware objects, describing details about the identified malware.
  malware_scan_info:
    caption: Malware Scan Info
    type: object_t
    object: malware_scan_info
    requirement: optional
    group: primary
    profile: security_control
    from: base_event
    description: Describes details about the scan job that identified malware on the target system.
  message:
    caption: Message
    type: string_t
    requirement: recommended
    group: primary
    from: base_event
    description: 'A human-readable description of the event, as defined by the source. This should be a concise, meaningful summary suitable for display in a UI or alert notification - not a raw log line. For example: `"User john_doe logged in from 10.0.0.1."` rather than a raw syslog string.'
  metadata:
    caption: Metadata
    type: object_t
    object: metadata
    requirement: required
    group: context
    from: base_event
    description: The metadata object describes the event producer, schema version, and processing information. Producers and mappers must populate `metadata.product` to identify the data source, and `metadata.version` to indicate the OCSF schema version used. Consumers rely on this to interpret the event correctly.
  notes:
    caption: Notes
    type: object_t
    object: note
    array: true
    requirement: optional
    group: context
    description: Additional notes related to the finding. Each note in the array can include a comment, the user who made the comment, the time when the note was created, and the time when the note was last modified (typically by the same user). Notes can be used to provide additional context, explanations, or observations by analysts related to the incident over time.
  observables:
    caption: Observables
    type: object_t
    object: observable
    array: true
    requirement: recommended
    group: primary
    from: base_event
    description: The observables array surfaces key indicators and entities from the event or finding in a single, consistent location for downstream correlation and detection. Each entry references an attribute path within the event (e.g., `src_endpoint.ip`) along with its type and value, enabling consumers to extract IOCs without parsing the full event structure.
    references:
    - description: OCSF Observables FAQ
      url: https://github.com/ocsf/ocsf-docs/blob/main/articles/defining-and-using-observables.md
  osint:
    caption: OSINT
    type: object_t
    object: osint
    array: true
    requirement: required
    group: primary
    profile: osint
    from: base_event
    description: The OSINT (Open Source Intelligence) object contains details related to an indicator such as the indicator itself, related indicators, geolocation, registrar information, subdomains, analyst commentary, and other contextual information. This information can be used to further enrich a detection or finding by providing decisioning support to other analysts and engineers.
  policy:
    caption: Policy
    type: object_t
    object: policy
    requirement: optional
    group: primary
    profile: security_control
    from: base_event
    description: The policy that pertains to the control that triggered the event, if applicable. For example the name of an anti-malware policy or an access control policy.
  priority:
    caption: Priority
    type: string_t
    requirement: optional
    group: context
    description: The priority, normalized to the caption of the priority_id value. In the case of 'Other', it is defined by the event source.
  priority_id:
    caption: Priority ID
    type: integer_t
    requirement: recommended
    group: context
    sibling: priority
    description: The normalized priority. Priority identifies the relative importance of the incident or finding. It is a measurement of urgency.
    enum:
      '0':
        caption: Unknown
        description: No priority is assigned.
      '1':
        caption: Low
        description: Application or personal procedure is unusable, where a workaround is available or a repair is possible.
      '2':
        caption: Medium
        description: Non-critical function or procedure is unusable or hard to use causing operational disruptions with no direct impact on a service's availability. A workaround is available.
      '3':
        caption: High
        description: Critical functionality or network access is interrupted, degraded or unusable, having a severe impact on services availability. No acceptable alternative is possible.
      '4':
        caption: Critical
        description: Interruption making a critical functionality inaccessible or a complete network interruption causing a severe impact on services availability. There is no possible alternative.
      '99':
        caption: Other
        description: The priority is not normalized.
  raw_data:
    caption: Raw Data
    type: string_t
    requirement: optional
    group: context
    from: base_event
    description: The original event/finding data as received from the source, before normalization into OCSF. Populate this with the verbatim log line, JSON payload, or other native format for forensic and debugging purposes. This field is not intended for structured querying - use the normalized OCSF attributes instead.
  raw_data_hash:
    caption: Raw Data Hash
    type: object_t
    object: fingerprint
    requirement: optional
    group: context
    from: base_event
    observable: 30
    description: A fingerprint (hash) of the `raw_data` content. Use this to verify the integrity of the original event data or to deduplicate events.
  raw_data_size:
    caption: Raw Data Size
    type: long_t
    requirement: optional
    group: context
    from: base_event
    description: The size of the original event data (as captured in `raw_data`) in bytes, before OCSF normalization. Useful for metering and capacity planning.
  risk_details:
    caption: Risk Details
    type: string_t
    requirement: optional
    group: context
    profile: security_control
    from: base_event
    description: Describes the risk associated with the finding.
  risk_level:
    caption: Risk Level
    type: string_t
    requirement: optional
    group: context
    profile: security_control
    from: base_event
    description: The risk level, normalized to the caption of the risk_level_id value.
  risk_level_id:
    caption: Risk Level ID
    type: integer_t
    requirement: optional
    group: context
    profile: security_control
    from: base_event
    sibling: risk_level
    description: The normalized risk level id.
    enum:
      '0':
        caption: Info
      '1':
        caption: Low
      '2':
        caption: Medium
      '3':
        caption: High
      '4':
        caption: Critical
      '99':
        caption: Other
        description: The risk level is not mapped. See the `risk_level` attribute, which contains a data source specific value.
  risk_score:
    caption: Risk Score
    type: integer_t
    requirement: optional
    group: context
    profile: security_control
    from: base_event
    description: The risk score as reported by the event source.
  severity:
    caption: Severity
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event/finding severity label, normalized to the caption of the `severity_id` value. When `severity_id` is `99` (Other), this attribute must contain the source-specific severity label. For all other values, this should match the caption defined for that `severity_id` enum value (e.g., `"High"` for `severity_id: 4`).'
  severity_id:
    caption: Severity ID
    type: integer_t
    requirement: required
    group: classification
    from: base_event
    sibling: severity
    description: |-
      The normalized identifier of the event/finding severity.

      The normalized severity is a measurement the effort and expense required to manage and resolve an event or incident. Smaller numerical values represent lower impact events, and larger numerical values represent higher impact events.
    enum:
      '0':
        caption: Unknown
        description: The event/finding severity is unknown.
      '1':
        caption: Informational
        description: Informational message. No action required.
      '2':
        caption: Low
        description: The user decides if action is needed.
      '3':
        caption: Medium
        description: Action is required but the situation is not serious at this time.
      '4':
        caption: High
        description: Action is required immediately.
      '5':
        caption: Critical
        description: Action is required immediately and the scope is broad.
      '6':
        caption: Fatal
        description: An error occurred but it is too late to take remedial action.
      '99':
        caption: Other
        description: The event/finding severity is not mapped. See the `severity` attribute, which contains a data source specific value.
  src_url:
    caption: Source URL
    type: url_t
    requirement: recommended
    group: primary
    observable: 6
    description: A Url link used to access the original incident.
  start_time:
    caption: Start Time
    type: timestamp_t
    requirement: optional
    group: occurrence
    description: The time of the earliest event or finding that contributed to this incident.
  start_time_dt:
    caption: Start Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    description: The time of the earliest event or finding that contributed to this incident.
  status:
    caption: Status
    type: string_t
    requirement: recommended
    group: primary
    description: The incident lifecycle status label, normalized to the caption of the `status_id` value. When `status_id` is `99` (Other), this must contain the source-specific status label.
  status_code:
    caption: Status Code
    type: string_t
    requirement: recommended
    group: primary
    from: base_event
    description: The source-specific status or error code as reported by the event source. For example, a Windows logon failure code (`0x18`), an HTTP response code (`403`), or an AWS API error code. This preserves the original code for detailed troubleshooting beyond what `status_id` conveys.
  status_detail:
    caption: Status Detail
    type: string_t
    requirement: recommended
    group: primary
    from: base_event
    description: 'A human-readable description providing additional context about the event outcome. Use this to convey details that go beyond the normalized `status_id` and source-specific `status_code`, such as a failure reason or error message. For example: `"Account locked after 5 failed attempts."`.'
  status_id:
    caption: Status ID
    type: integer_t
    requirement: required
    group: primary
    sibling: status
    description: The normalized incident lifecycle status identifier. This tracks the incident management workflow from initial triage through resolution. Producers should set this to reflect the current state in their incident management system.
    enum:
      '0':
        caption: Unknown
        description: The status is unknown.
      '1':
        caption: New
        description: The service desk has received the incident but has not assigned it to an agent.
      '2':
        caption: In Progress
        description: The incident has been assigned to an agent but has not been resolved. The agent is actively working with the user to diagnose and resolve the incident.
      '3':
        caption: On Hold
        description: The incident requires some information or response from the user or from a third party.
      '4':
        caption: Resolved
        description: The service desk has confirmed that the incident is resolved.
      '5':
        caption: Closed
        description: The incident is resolved and no further action is necessary.
      '99':
        caption: Other
        description: The status is not mapped. See the `status` attribute, which contains a data source specific value.
  ticket:
    caption: Ticket
    type: object_t
    object: ticket
    requirement: optional
    group: context
    deprecated:
      since: 1.5.0
      message: Use `tickets` instead.
      superseded_by: [tickets]
    description: The linked ticket in the ticketing system.
  tickets:
    caption: Tickets
    type: object_t
    object: ticket
    array: true
    requirement: optional
    group: context
    description: The associated ticket(s) in the ticketing system. Each ticket contains details like ticket ID, status, etc.
  time:
    caption: Event Time
    type: timestamp_t
    requirement: required
    group: occurrence
    description: The incident creation time - when the incident was first opened, not when the underlying activity occurred. For the time range of contributing events, use `start_time` and `end_time`.
  time_dt:
    caption: Event Time
    type: datetime_t
    requirement: optional
    group: occurrence
    profile: datetime
    description: The incident creation time - when the incident was first opened, not when the underlying activity occurred. For the time range of contributing events, use `start_time` and `end_time`.
  timezone_offset:
    caption: Timezone Offset
    type: integer_t
    requirement: recommended
    group: occurrence
    from: base_event
    description: The number of minutes that the reported event `time` is ahead or behind UTC, in the range -1,080 to +1,080. This allows consumers to reconstruct the local time at the event source. For example, US Eastern Standard Time is `-300`. Populate this when the source provides local time zone information.
  type_name:
    caption: Type Name
    type: string_t
    requirement: optional
    group: classification
    from: base_event
    description: 'The event/finding type name, combining the class and activity (e.g., `"Detection Finding: Create"`). The value must match the `class_name` and `activity_name` joined by `": "`.'
  type_uid:
    caption: Type ID
    type: long_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event/finding type ID. It identifies the event''s semantics and structure. Producers and mappers must compute this as `class_uid * 100 + activity_id`. It uniquely identifies the combination of event class and activity across the entire schema. For example, `Detection Finding: Create` is `200401`.'
    enum:
      '200500':
        caption: 'Incident Finding: Unknown'
      '200501':
        caption: 'Incident Finding: Create'
        description: Reports the creation of an Incident.
      '200502':
        caption: 'Incident Finding: Update'
        description: Reports updates to an Incident.
      '200503':
        caption: 'Incident Finding: Close'
        description: Reports closure of an Incident .
      '200599':
        caption: 'Incident Finding: Other'
  unmapped:
    caption: Unmapped Data
    type: object_t
    object: object
    requirement: optional
    group: context
    from: base_event
    description: |-
      A container for source-specific attributes that do not map to any defined OCSF attribute. Use this to preserve valuable source data that would otherwise be lost during normalization. The keys and values are specific to the event source.

      Note: Consumers should not rely on a stable structure within this field. The preferred approach to unmapped attributes is to create a custom extension with the desired structure.
    references:
    - description: 'Schema FAQ: When should I use the unmapped attribute?'
      url: https://github.com/ocsf/ocsf-docs/blob/main/faqs/schema-faq.md#when-should-i-use-the-unmapped-attribute
    - description: OCSF Extensions
      url: https://github.com/ocsf/ocsf-schema/blob/main/CONTRIBUTING.md#ocsf-extensions
  vendor_attributes:
    caption: Vendor Attributes
    type: object_t
    object: vendor_attributes
    requirement: optional
    description: |-
      The Vendor Attributes object can be used to represent values of attributes populated by the Vendor/Finding Provider. It can help distinguish between the vendor-provided values and consumer-updated values, of key attributes like `severity_id`.
      The original finding producer should not populate this object. It should be populated by consuming systems that support data mutability.
  verdict:
    caption: Verdict
    type: string_t
    requirement: recommended
    group: primary
    description: The verdict assigned to an Incident finding.
  verdict_id:
    caption: Verdict ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: verdict
    description: The normalized verdict of an Incident.
    enum:
      '0':
        caption: Unknown
        description: The type is unknown.
      '1':
        caption: False Positive
        description: The incident is a false positive.
      '2':
        caption: True Positive
        description: The incident is a true positive.
      '3':
        caption: Disregard
        description: The incident can be disregarded as it is unimportant, an error or accident.
      '4':
        caption: Suspicious
        description: The incident is suspicious.
      '5':
        caption: Benign
        description: The incident is benign.
      '6':
        caption: Test
        description: The incident is a test.
      '7':
        caption: Insufficient Data
        description: The incident has insufficient data to make a verdict.
      '8':
        caption: Security Risk
        description: The incident is a security risk.
      '9':
        caption: Managed Externally
        description: The incident remediation or required actions are managed externally.
      '10':
        caption: Duplicate
        description: The incident is a duplicate.
      '99':
        caption: Other
        description: The type is not mapped. See the `type` attribute, which contains a data source specific value.

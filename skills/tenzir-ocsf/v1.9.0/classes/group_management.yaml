    definition: v1.9.0/classes/base_event.yaml
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event. The target of each activity is the `group` attribute.
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Assign Privileges
        description: Assign privileges to the group. Use `privileges` as privileges to be assigned.
      '2':
        caption: Revoke Privileges
        description: Revoke privileges from the group. Use `privileges` as privileges to be revoked.
      '3':
        caption: Add User
        description: Add a user or users to the group. Use `users` for the users to be added.
      '4':
        caption: Remove User
        description: Remove a user or users from the group. Use `users` for the users to be removed.
      '5':
        caption: Delete
        description: Delete the group.
      '6':
        caption: Create
        description: Create a group. Populate the `group` object with details of the group to be created.
      '7':
        caption: Add Subgroup
        description: Add a subgroup to the group. Use `sub_group` as the subgroup to be added.
      '8':
        caption: Remove Subgroup
        description: Remove a subgroup from the group. Use `sub_group` as the subgroup to be removed.
      '9':
        caption: Update
        description: Update the group. The updated group details should be populated in the `updated_group` attribute.
      '10':
        caption: Attach Policies
        description: Attach one or more IAM Policies to the group. Use `policies` as policies to be attached.
      '11':
        caption: Detach Policies
        description: Detach one or more IAM Policies from the group. Use `policies` as policies to be detached.
      '12':
        caption: Assign Roles
        description: Assign one or more roles to the group. Use `iam_roles` for the specific roles to be assigned.
      '13':
        caption: Remove Roles
        description: Remove one or more roles from the group. Use `iam_roles` for the specific roles to be removed.
      '99':
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.

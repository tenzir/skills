  device: {caption: Device, type: object_t, object: device, requirement: required, group: primary, observable: 20, from: system}
  metadata: {caption: Metadata, type: object_t, object: metadata, requirement: required, group: context, from: base_event}
  osint: {caption: OSINT, type: object_t, object: osint, array: true, requirement: required, group: primary, profile: osint, from: base_event}
  process:
    caption: Process
    type: object_t
    object: process
    requirement: required
    group: primary
    observable: 25
    description: The process that was launched, injected into, opened, or terminated.
  severity_id: {caption: Severity ID, type: integer_t, requirement: required, group: classification, sibling: severity, enum: {0: Unknown, 1: Informational, 2: Low, 3: Medium, 4: High, 5: Critical, 6: Fatal, 99: Other}, from: base_event}
  time: {caption: Event Time, type: timestamp_t, requirement: required, group: occurrence, from: base_event}
  type_uid:
    caption: Type ID
    type: long_t
    requirement: required
    group: classification
    sibling: type_name
    description: 'The event/finding type ID. It identifies the event''s semantics and structure. Producers and mappers must compute this as `class_uid * 100 + activity_id`. It uniquely identifies the combination of event class and activity across the entire schema. For example, `Detection Finding: Create` is `200401`.'
  action_id: {caption: Action ID, type: integer_t, requirement: recommended, group: primary, profile: security_control, sibling: action, enum: {0: Unknown, 1: Allowed, 2: Denied, 3: Observed, 4: Modified, 99: Other}, from: base_event}
  actual_permissions:
    caption: Actual Permissions
    type: integer_t
    requirement: recommended
    group: primary
    description: The permissions that were granted to the process in a platform-native format.
  ai_model: {caption: AI Model, type: object_t, object: ai_model, requirement: recommended, group: context, profile: ai_operation, from: system}
  confidence_id: {caption: Confidence ID, type: integer_t, requirement: recommended, group: context, profile: security_control, sibling: confidence, enum: {0: Unknown, 1: Low, 2: Medium, 3: High, 99: Other}, from: base_event}
  disposition_id:
    caption: Disposition ID
    type: integer_t
    requirement: recommended
    group: primary
    profile: security_control
    sibling: disposition
    enum:
      0: Unknown
      1: Allowed
      2: Blocked
      3: Quarantined
      4: Isolated
      5: Deleted
      6: Dropped
      7: Custom Action
      8: Approved
      9: Restored
      10: Exonerated
      11: Corrected
      12: Partially Corrected
      13: Uncorrected
      14: Delayed
      15: Detected
      16: No Action
      17: Logged
      18: Tagged
      19: Alert
      20: Count
      21: Reset
      22: Captcha
      23: Challenge
      24: Access Revoked
      25: Rejected
      26: Unauthorized
      27: Error
      99: Other
    from: base_event
  exit_code:
    caption: Exit Code
    type: integer_t
    requirement: recommended
    group: primary
    description: The exit code reported by a process when it terminates. The convention is that zero indicates success and any non-zero exit code indicates that some error occurred.
  injection_type:
    caption: Injection Type
    type: string_t
    requirement: recommended
    group: primary
    description: The process injection method, normalized to the caption of the injection_type_id value. In the case of 'Other', it is defined by the event source.
  injection_type_id:
    caption: Injection Type ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: injection_type
    description: The normalized identifier of the process injection method.
    enum:
      0:
        caption: Unknown
        description: The injection type is unknown.
      1:
        caption: Remote Thread
      2:
        caption: Load Library
      3:
        caption: Queue APC
      99:
        caption: Other
        description: The injection type is not mapped. See the `injection_type` attribute, which contains a data source specific value.
  is_alert: {caption: Alert, type: boolean_t, requirement: recommended, group: primary, profile: security_control, from: base_event}
  launch_type:
    caption: Launch Type
    type: string_t
    requirement: recommended
    group: primary
    description: The specific type of `Launch` activity, normalized to the caption of the `launch_type_id` value. In the case of `Other` it is defined by the event source.
  launch_type_id:
    caption: Launch Type ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: launch_type
    description: The normalized identifier for the specific type of `Launch` activity.
    enum:
      0:
        caption: Unknown
        description: The launch type is unknown or not specified.
      1:
        caption: Spawn
        description: Denotes that the `Launch` event represents atomic creation of a new process on Windows. This launch type ID may also be used to represent both steps of Unix process creation in a single `Launch` event.
      2:
        caption: Fork
        description: Denotes that the `Launch` event represents the "fork" step of Unix process creation, where a process creates a clone of itself in a parent-child relationship. WSL1 pico processes on Windows also use the 2-step Unix model.
      3:
        caption: Exec
        description: Denotes that the `Launch` event represents the "exec" step of Unix process creation, where a process replaces its executable image, command line, and environment. WSL1 pico processes on Windows also use the 2-step Unix model.
      99:
        caption: Other
        description: The launch type is not mapped. See the `launch_type` attribute, which contains a data source specific value.
    references:
    - description: fork() man page
      url: https://www.man7.org/linux/man-pages/man2/fork.2.html
    - description: execve() man page
      url: https://www.man7.org/linux/man-pages/man2/execve.2.html

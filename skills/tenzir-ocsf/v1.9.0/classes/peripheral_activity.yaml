name: peripheral_activity
caption: Peripheral Activity
uid: 1010
category: system
category_uid: 1
extends: system
description: Peripheral Activity events log a system's interactions with external, connectable, and detachable hardware. These events provide visibility into the external devices connected to and used by a system.
profiles: [ai_operation, cloud, container, data_classification, datetime, host, osint, record_integrity, security_control]
associations:
  actor.user: [device]
  device: [actor.user]
attributes:
  action:
    caption: Action
    requirement: optional
    profile: security_control
    definition: v1.9.0/classes/base_event.yaml
  action_id:
    caption: Action ID
    requirement: recommended
    profile: security_control
    definition: v1.9.0/classes/base_event.yaml
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event. Each event class defines its own set of activity values. Use `0` (Unknown) when the activity cannot be determined. Use `99` (Other) when the activity does not match any defined value, in which case `activity_name` must be populated with the source-specific label.
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Connect
        description: A peripheral device was connected to the system.
      '2':
        caption: Disconnect
        description: A peripheral device was disconnected from the system.
      '3':
        caption: Enable
        description: A peripheral device was enabled on the system.
      '4':
        caption: Disable
        description: A peripheral device was disabled on the system.
      '5':
        caption: Eject
        description: 'A peripheral device was ejected from the system. This is typically used for removable media devices. Note: For `Mount` and `Unmount` events, see the [File System Activity](file_activity) event class.'
      '99':
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.
  activity_name:
    caption: Activity
    requirement: optional
    definition: v1.9.0/classes/base_event.yaml

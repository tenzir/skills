  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event. Each event class defines its own set of activity values. Use `0` (Unknown) when the activity cannot be determined. Use `99` (Other) when the activity does not match any defined value, in which case `activity_name` must be populated with the source-specific label.
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Power On
        description: A power-on activity was reported for the system.
      '2':
        caption: Power Off
        description: A power-off activity was reported for the system, including graceful shutdowns and hard power-off events. For graceful or software-initiated shutdowns, the `actor` may be specified when known.
      '3':
        caption: Sleep
        description: A sleep activity was reported for the system.
      '4':
        caption: Hibernate
        description: A hibernate activity was reported for the system.
      '5':
        caption: Reboot
        description: A reboot activity was reported for the system.
      '6':
        caption: Wake
        description: A wake activity was reported for the system.
      '99':
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.

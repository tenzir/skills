  status_code: {caption: Status Code, type: string_t, requirement: recommended, group: primary, from: base_event}
  status_detail: {caption: Status Detail, type: string_t, requirement: recommended, group: primary, from: base_event}
  status_id:
    caption: Operational Status ID
    type: integer_t
    requirement: recommended
    group: primary
    sibling: status
    description: The normalized Operational status identifier for the Unmanned Aerial System (UAS).
    enum:
      0:
        caption: Unknown
        description: The status is unknown.
      1:
        caption: Undeclared
        description: The operational status is not reported.
      2:
        caption: Ground
        description: The Unmanned Aerial System (UAS) is grounded.
      3:
        caption: Airborne
        description: The Unmanned Aerial System (UAS) is airborne.
      4:
        caption: Emergency
        description: The Unmanned Aerial System (UAS) is reporting an emergency status.
      5:
        caption: Remote ID System Failure
        description: The Unmanned Aerial System (UAS) is reporting the Remote ID beacon or device is malfunctioning or has failed.
      6:
        caption: Reserved
        description: An ASTM Reserved status is reported.
      99:
        caption: Other
        description: The status is not mapped. See the `status` attribute, which contains a data source specific value.
  timezone_offset: {caption: Timezone Offset, type: integer_t, requirement: recommended, group: occurrence, from: base_event}

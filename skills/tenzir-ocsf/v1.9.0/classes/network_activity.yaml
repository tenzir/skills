name: network_activity
caption: Network Activity
uid: 4001
category: network
category_uid: 4
extends: network
description: Network Activity events report network connection and traffic activity.
profiles: [ai_operation, cloud, container, data_classification, datetime, host, load_balancer, network_proxy, osint, record_integrity, security_control]
constraints:
  at_least_one: [dst_endpoint, src_endpoint]
references:
- description: D3FEND™ Ontology d3f:NetworkConnectionEvent
  url: https://d3fend.mitre.org/event/d3f:NetworkConnectionEvent/
attributes:
  action:
    caption: Action
    requirement: optional
    profile: security_control
    definition: v1.9.0/classes/base_event.yaml
  action_id:
    caption: Action ID
    requirement: recommended
    profile: security_control
    definition: v1.9.0/classes/base_event.yaml
  activity_id:
    caption: Activity ID
    type: integer_t
    requirement: required
    group: classification
    sibling: activity_name
    description: The normalized identifier of the activity that triggered the event. Each event class defines its own set of activity values. Use `0` (Unknown) when the activity cannot be determined. Use `99` (Other) when the activity does not match any defined value, in which case `activity_name` must be populated with the source-specific label.
    enum:
      '0':
        caption: Unknown
        description: The event activity is unknown.
      '1':
        caption: Open
        description: A new network connection was opened.
      '2':
        caption: Close
        description: The network connection was closed.
      '3':
        caption: Reset
        description: The network connection was abnormally terminated or closed by a middle device like firewalls.
      '4':
        caption: Fail
        description: The network connection failed. For example a connection timeout or no route to host.
      '5':
        caption: Refuse
        description: The network connection was refused. For example an attempt to connect to a server port which is not open.
      '6':
        caption: Traffic
        description: Network traffic report.
      '7':
        caption: Listen
        description: A network endpoint began listening for new network connections.
      '99':
        caption: Other
        description: The event activity is not mapped. See the `activity_name` attribute, which contains a data source specific value.

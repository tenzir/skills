name: ftp_activity
caption: FTP Activity
uid: 4008
category: network
category_uid: 4
extends: network
description: File Transfer Protocol (FTP) Activity events report file transfers between a server and a client as seen on the network.
profiles: [ai_operation, cloud, container, data_classification, datetime, host, load_balancer, network_proxy, osint, record_integrity, security_control]
constraints:
  at_least_one: [dst_endpoint, src_endpoint]
references:
- description: D3FEND™ Ontology d3f:FTPEvent
  url: https://d3fend.mitre.org/event/d3f:FTPEvent/
attributes:
  action:
    caption: Action

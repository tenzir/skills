name: finding_info
caption: Finding Information
extends: object
supersedes:
- name: finding
  since: 1.0.0
description: The Finding Information object describes metadata related to a security finding generated by a security tool or system.
profiles: [data_classification, datetime]
referenced_by:
  classes:
    application_security_posture_finding: [finding_info]
    compliance_finding: [finding_info]
    data_security_finding: [finding_info]
    detection_finding: [finding_info]
    iam_analysis_finding: [finding_info]
    incident_finding: [finding_info_list]
    vulnerability_finding: [finding_info]
attributes:
  analytic:
    caption: Analytic
    type: object_t
    object: analytic
    requirement: recommended
    description: The analytic technique used to analyze and derive insights from the data or information that led to the finding or conclusion.
  attack_graph:
    caption: Attack Graph
    type: object_t
    object: graph
    requirement: optional
    group: context
    description: An Attack Graph describes possible routes an attacker could take through an environment. It describes relationships between resources and their findings, such as malware detections, vulnerabilities, misconfigurations, and other security actions.
    references:
    - description: MS Defender description of Attack Path
      url: https://learn.microsoft.com/en-us/azure/defender-for-cloud/how-to-manage-attack-path
    - description: SentinelOne Attack Path documentation
      url: https://www.sentinelone.com/cybersecurity-101/cybersecurity/attack-path-analysis/
  attacks:
    caption: MITRE ATT&CK® and ATLAS™ Details
    type: object_t
    object: attack
    array: true
    requirement: optional
    description: An array of attack objects, each describing a tactic, technique, and/or sub-technique associated with the finding.
    references:
    - description: MITRE ATT&CK®
      url: https://attack.mitre.org
  created_time:
    caption: Created Time
    type: timestamp_t
    requirement: optional
    description: The time when the finding was created.
  created_time_dt:
    caption: Created Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the finding was created.
  data_sources:
    caption: Data Sources
    type: string_t
    array: true
    requirement: optional
    description: A list of data sources utilized in generation of the finding.
  desc:
    caption: Description
    type: string_t
    requirement: optional
    description: The description of the reported finding.
  first_seen_time:
    caption: First Seen
    type: timestamp_t
    requirement: optional
    description: |-
      The time when the finding was first observed. e.g. The time when a vulnerability was first observed.

      It can differ from the `created_time` timestamp, which reflects the time this finding was created.
  first_seen_time_dt:
    caption: First Seen
    type: datetime_t
    requirement: optional
    profile: datetime
    description: |-
      The time when the finding was first observed. e.g. The time when a vulnerability was first observed.

      It can differ from the `created_time` timestamp, which reflects the time this finding was created.
  kill_chain:
    caption: Kill Chain
    type: object_t
    object: kill_chain_phase
    array: true
    requirement: optional
    description: The Kill Chain provides a detailed description of each phase and its associated activities within the broader context of a cyber attack.
    references:
    - description: Cyber Kill Chain®
      url: https://www.lockheedmartin.com/en-us/capabilities/cyber/cyber-kill-chain.html
  last_seen_time:
    caption: Last Seen
    type: timestamp_t
    requirement: optional
    description: |-
      The time when the finding was most recently observed. e.g. The time when a vulnerability was most recently observed.

      It can differ from the `modified_time` timestamp, which reflects the time this finding was last modified.
  last_seen_time_dt:
    caption: Last Seen
    type: datetime_t
    requirement: optional
    profile: datetime
    description: |-
      The time when the finding was most recently observed. e.g. The time when a vulnerability was most recently observed.

      It can differ from the `modified_time` timestamp, which reflects the time this finding was last modified.
  modified_time:
    caption: Modified Time
    type: timestamp_t
    requirement: optional
    description: The time when the finding was last modified.
  modified_time_dt:
    caption: Modified Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the finding was last modified.
  product:
    caption: Product
    type: object_t
    object: product
    requirement: optional
    description: Details about the product that reported the finding.
  product_uid:
    caption: Product Identifier
    type: string_t
    requirement: optional
    deprecated:
      since: 1.4.0
      message: Use the `product.uid` attribute instead.
      superseded_by: [product.uid]
    description: The unique identifier of the product that reported the finding.
  related_analytics:
    caption: Related Analytics
    type: object_t
    object: analytic
    array: true
    requirement: optional
    description: Other analytics related to this finding.
  related_events:
    caption: Related Events/Findings
    type: object_t
    object: related_event
    array: true
    requirement: optional
    description: Describes events and/or other findings related to the finding as identified by the security product. Note that these events may or may not be in OCSF.
  related_events_count:
    caption: Related Events/Findings Count
    type: integer_t
    requirement: optional
    description: Number of related events or findings.
  src_url:
    caption: Source URL
    type: url_t
    requirement: optional
    observable: 6
    description: The URL pointing to the source of the finding.
  tags:
    caption: Tags
    type: object_t
    object: key_value_object
    array: true
    requirement: optional
    description: The list of tags; `{key:value}` pairs associated with the finding.
  title:
    caption: Title
    type: string_t
    requirement: recommended
    description: A title or a brief phrase summarizing the reported finding.
  traits:
    caption: Traits
    type: object_t
    object: trait
    array: true
    requirement: optional
    description: The list of key traits or characteristics extracted from the finding.
  types:
    caption: Types
    type: string_t
    array: true
    requirement: optional
    description: One or more types of the reported finding.
  uid:
    caption: Unique ID
    type: string_t
    requirement: required
    description: The unique identifier of the reported finding.
  uid_alt:
    caption: Alternate ID
    type: string_t
    requirement: optional
    description: The alternative unique identifier of the reported finding.

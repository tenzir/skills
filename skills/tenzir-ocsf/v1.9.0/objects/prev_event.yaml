name: prev_event
caption: Previous Event
extends: object
description: The Previous Event object references the previous event in a chain of events. Refer to specific usage.
referenced_by:
  objects:
    attestation: [prev_event]
attributes:
  uid:
    caption: Unique ID
    type: string_t
    requirement: required
    description: The unique identifier of the previous event, as carried in that event's `metadata.uid`.
  type_uid:
    caption: Type ID
    type: long_t
    requirement: recommended
    sibling: type_name
    description: The event type identifier of the previous event, as carried in that event's `type_uid`. It directs a consumer to the event class, and therefore the table or store, where the previous event resides.
  fingerprint:
    caption: Fingerprint
    type: object_t
    object: fingerprint
    requirement: optional
    observable: 30
    description: The fingerprint of the previous event, binding this reference to the previous event's content so that altering or substituting the previous event breaks the link. Refer to specific usage.

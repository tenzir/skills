# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: product
caption: Product
extends: _entity
description: The Product object describes characteristics of a software product.
profiles: [data_classification]
constraints:
  at_least_one: [name, uid]
referenced_by:
  classes:
    application_lifecycle: [app]
    software_info: [product]
  objects:
    advisory: [product]
    application: [product]
    cve: [product]
    file: [product]
    finding: [product]
    finding_info: [product]
    kb_article: [product]
    logger: [product]
    metadata: [product]
    related_event: [product]
    sbom: [product]
    transformation_info: [product]
attributes:
  data_classification:
    caption: Data Classification
    type: object_t
    object: data_classification
    requirement: recommended
    group: context
    profile: data_classification
    deprecated:
      since: 1.4.0
      message: Use the attribute `data_classifications` instead
      superseded_by: [data_classifications]
    description: The Data Classification object includes information about data classification levels and data category types.
  data_classifications:
    caption: Data Classification
    type: object_t
    object: data_classification
    array: true
    requirement: recommended
    group: context
    profile: data_classification
    description: A list of Data Classification objects, that include information about data classification levels and data category types, identified by a classifier.
  name:
    caption: Name
    type: string_t
    requirement: recommended
    description: The name of the product.
  uid:
    caption: Unique ID
    type: string_t
    requirement: recommended
    description: The unique identifier of the product.
  vendor_name:
    caption: Vendor Name
    type: string_t
    requirement: recommended
    description: The name of the vendor of the product.
  version:
    caption: Version
    type: string_t
    requirement: recommended
    description: 'The version of the product, as defined by the event source. For example: `2013.1.3-beta`.'
  cpe_name:
    caption: The product CPE identifier
    type: string_t
    requirement: optional
    description: 'The Common Platform Enumeration (CPE) name. For example: `cpe:/a:apple:safari:16.2`.'
    references:
    - description: NIST Products
      url: https://nvd.nist.gov/products/cpe
  feature:
    caption: Feature
    type: object_t
    object: feature
    requirement: optional
    description: The feature that reported the event.
  lang:
    caption: Language
    type: string_t
    requirement: optional
    description: 'The two letter lower case language codes, as defined by ISO 639-1. For example: `en` (English), `de` (German), or `fr` (French).'
    references:
    - description: ISO 639-1
      url: https://en.wikipedia.org/wiki/ISO_639-1
  path:
    caption: Path
    type: string_t
    requirement: optional
    description: The installation path of the product.
  uid_numeric: {caption: Numeric Unique ID, type: long_t, requirement: optional, from: _entity}
  url_string:
    caption: URL String
    type: url_t
    requirement: optional
    observable: 6
    description: The URL pointing towards the product.

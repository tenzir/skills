# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: extension
caption: Schema Extension
extends: _entity
description: The OCSF Schema Extension object provides detailed information about the schema extension used to construct the event. The schema extensions are registered in the `extensions.md` file.
constraints:
  at_least_one: [name, uid]
references:
- description: OCSF Extensions
  url: https://github.com/ocsf/ocsf-schema/blob/main/extensions.md
referenced_by:
  objects:
    metadata: [extension, extensions]
attributes:
  version:
    caption: Version
    type: string_t
    requirement: required
    description: 'The schema extension version. For example: `1.0.0-alpha.2`.'
  name:
    caption: Name
    type: string_t
    requirement: recommended
    description: 'The schema extension name. For example: `dev`.'
  uid:
    caption: Unique ID
    type: string_t
    requirement: recommended
    description: 'The schema extension unique identifier. For example: `999`.'
  uid_numeric: {caption: Numeric Unique ID, type: long_t, requirement: optional, from: _entity}

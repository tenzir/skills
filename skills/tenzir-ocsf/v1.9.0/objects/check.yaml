name: check
caption: Check
extends: object
description: The check object defines a specific, testable compliance verification point that evaluates a target device against a standard, framework, or custom requirement. While checks are typically associated with formal standards (like CIS, NIST, or ISO), they can also represent custom or organizational requirements. When mapped to controls, checks can evaluate specific control_parameters to determine compliance status, but neither the control mapping nor control_parameters are required for a valid check.
profiles: [cloud, container, data_classification]
referenced_by:
  objects:
    compliance: [checks]
attributes:
  name:
    caption: Name
    type: string_t
    requirement: recommended
    description: 'The name or title of the compliance check. For example, CIS: `Ensure mounting of cramfs filesystems is disabled` or DISA STIG: `The Ubuntu operating system must implement DoD-approved encryption to protect the confidentiality of remote access sessions`.'
    references:
    - description: CIS Benchmark Rules
      url: https://www.cisecurity.org/cis-benchmarks
    - description: DISA STIG Requirements
      url: https://public.cyber.mil/stigs/downloads
  standards:
    caption: 'Compliance Standards: List'
    type: string_t
    array: true
    requirement: recommended
    description: The regulatory or industry standard this check is associated with. E.g., `PCI DSS 3.2.1`, `HIPAA Security Rule`, `NIST SP 800-53 Rev. 5`, or `ISO/IEC 27001:2013`.
    references:
    - description: PCI DSS 3.2.1
      url: https://www.pcisecuritystandards.org/document_library
    - description: HIPAA Security Rule
      url: https://www.hhs.gov/hipaa/for-professionals/security/laws-regulations/index.html
    - description: NIST SP 800-53 Rev. 5
      url: https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final
    - description: ISO/IEC 27001:2013
      url: https://www.iso.org/standard/54534.html
  status:
    caption: Status
    type: string_t
    requirement: recommended
    description: 'The resultant status of the compliance check normalized to the caption of the `status_id` value. For example, CIS Benchmark: `Pass` when all requirements are met, `Fail` when requirements are not met, or DISA STIG: `NotAFinding` (maps to status_id 1/Pass), `Open` (maps to status_id 3/Fail).'
    references:
    - description: CIS Benchmark Compliance Status
      url: https://www.cisecurity.org/cis-benchmarks
    - description: DISA STIG Status Types
      url: https://public.cyber.mil/stigs/srg-stig-tools/
  status_id:
    caption: Status ID
    type: integer_t
    requirement: recommended
    sibling: status
    description: The normalized status identifier of the compliance check.
    enum:
      0:
        caption: Unknown
        description: The status is unknown.
      1:
        caption: Pass
        description: The compliance check passed for all the evaluated resources.
      2:
        caption: Warning
        description: The compliance check did not yield a result due to missing information.
      3:
        caption: Fail
        description: The compliance check failed for at least one of the evaluated resources.
      99:
        caption: Other
        description: The event status is not mapped. See the `status` attribute, which contains a data source specific value.
  uid:
    caption: Unique ID
    type: string_t
    requirement: recommended
    description: The unique identifier of the compliance check within its standard or framework. For example, CIS Benchmark identifier `1.1.1.1`, DISA STIG identifier `V-230234`, or NIST control identifier `AC-17(2)`.
    references:
    - description: CIS Benchmark ID Format
      url: https://www.cisecurity.org/cis-benchmarks
    - description: DISA STIG ID Format
      url: https://public.cyber.mil/stigs/downloads
    - description: NIST SP 800-53 Control IDs
      url: https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final
  desc:
    caption: Description
    type: string_t
    requirement: optional
    description: 'The detailed description of the compliance check, explaining the security requirement, vulnerability, or configuration being assessed. For example, CIS: `The cramfs filesystem type is a compressed read-only Linux filesystem. Removing support for unneeded filesystem types reduces the local attack surface.` or DISA STIG: `Unauthorized access to the information system by foreign entities may result in loss or compromise of data.`'
    references:
    - description: CIS Benchmark Rationales
      url: https://www.cisecurity.org/cis-benchmarks
    - description: DISA STIG Vulnerability Discussions
      url: https://public.cyber.mil/stigs/downloads
  resource:
    caption: Resource
    type: object_t
    object: resource_details
    requirement: optional
    description: Describes details about the resource that this check evaluated.
  severity:
    caption: Severity
    type: string_t
    requirement: optional
    description: 'The severity level as defined in the source document. For example CIS Benchmarks, valid values are: `Level 1` (security-forward, essential settings), `Level 2` (security-focused environment, more restrictive), or `Scored/Not Scored` (whether compliance can be automatically checked). For DISA STIG, valid values are: `CAT I` (maps to severity_id 5/Critical), `CAT II` (maps to severity_id 4/High), or `CAT III` (maps to severity_id 3/Medium).'
    references:
    - description: CIS Benchmarks Levels
      url: https://www.cisecurity.org/cis-benchmarks
    - description: DISA STIGs Category Guide
      url: https://public.cyber.mil/stigs
  severity_id:
    caption: Severity ID
    type: integer_t
    requirement: optional
    sibling: severity
    description: 'The normalized severity identifier that maps severity levels to standard severity levels. For example CIS Benchmark: `Level 2` maps to `4` (High), `Level 1` maps to `3` (Medium). For DISA STIG: `CAT I` maps to `5` (Critical), `CAT II` maps to `4` (High), and `CAT III` maps to `3` (Medium).'
    enum:
      0:
        caption: Unknown
        description: The severity is unknown.
      1:
        caption: Informational
        description: Informational message. No action required.
      2:
        caption: Low
        description: The user decides if action is needed.
      3:
        caption: Medium
        description: Maps to CIS Benchmark `Level 1` - Essential security settings recommended for all systems, or DISA STIG `CAT III` - Action is required but the situation is not serious at this time.
      4:
        caption: High
        description: Maps to CIS Benchmark `Level 2` - More restrictive and security-focused settings for sensitive environments, or DISA STIG `CAT II` - Action is required immediately.
      5:
        caption: Critical
        description: Maps to DISA STIG `CAT I` - Action is required immediately and the scope is broad.
      6:
        caption: Fatal
        description: An error occurred but it is too late to take remedial action.
      99:
        caption: Other
        description: The severity is not mapped. See the `severity` attribute, which contains a data source specific value.
  version:
    caption: Version
    type: string_t
    requirement: optional
    description: 'The check version. For example, CIS Benchmark: `1.1.0` for Amazon Linux 2 or DISA STIG: `V2R1` for Windows 10.'
    references:
    - description: CIS Benchmark Versioning
      url: https://www.cisecurity.org/cis-benchmarks
    - description: DISA STIG Version Numbering
      url: https://public.cyber.mil/stigs/downloads

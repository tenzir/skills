name: service
caption: Service
extends: _entity
description: The Service object describes characteristics of a service,  `e.g. AWS EC2.`
constraints:
  at_least_one: [name, uid]
references:
- description: D3FEND™ Ontology d3f:ServiceApplication.
  url: https://d3fend.mitre.org/dao/artifact/d3f:ServiceApplication/
referenced_by:
  classes:
    authentication: [service]
    service_query: [service]
  objects:
    api: [service]
    message_context: [service]
    query_evidence: [service]
    span: [service]
    trace: [service]
attributes:
  labels:
    caption: Labels
    type: string_t
    array: true
    requirement: optional
    description: The list of labels associated with the service.
  name:
    caption: Name
    type: string_t
    requirement: recommended
    description: The name of the service.
  tags:
    caption: Tags
    type: object_t
    object: key_value_object
    array: true
    requirement: optional
    description: The list of tags; `{key:value}` pairs associated to the service.
  uid:
    caption: Unique ID
    type: string_t
    requirement: recommended
    description: The unique identifier of the service.
  uid_numeric:
    caption: Numeric Unique ID
    type: long_t
    requirement: optional
    from: _entity
    description: |-
      The `uid` attribute in numeric form where applicable.
      Note: Producers may populate `uid_numeric` only in addition to `uid` and not as an alternative to it.
  version:
    caption: Version
    type: string_t
    requirement: recommended
    description: The version of the service.

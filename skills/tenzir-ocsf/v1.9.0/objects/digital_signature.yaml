name: digital_signature
caption: Digital Signature
extends: object
description: The Digital Signature object contains information about the cryptographic mechanism used to verify the authenticity, integrity, and origin of the file or application.
profiles: [datetime]
referenced_by:
  objects:
    attestation: [signatures]
    file: [signature, signatures]
    osint: [signatures]
attributes:
  algorithm:
    caption: Algorithm
    type: string_t
    requirement: optional
    description: The digital signature algorithm used to create the signature, normalized to the caption of 'algorithm_id'. In the case of 'Other', it is defined by the event source.
  algorithm_id:
    caption: Algorithm ID
    type: integer_t
    requirement: required
    sibling: algorithm
    description: The identifier of the normalized digital signature algorithm.
    enum:
      '0':
        caption: Unknown
        description: The algorithm is unknown.
      '1':
        caption: DSA
        description: Digital Signature Algorithm (DSA).
      '2':
        caption: RSA
        description: Rivest-Shamir-Adleman (RSA) Algorithm.
      '3':
        caption: ECDSA
        description: Elliptic Curve Digital Signature Algorithm.
      '4':
        caption: Authenticode
        description: Authenticode Digital Signature Algorithm.
        references:
        - description: Windows Authenticode Portable Executable Signature Format (Microsoft, 2008)
          url: https://download.microsoft.com/download/9/c/5/9c5b2167-8017-4bae-9fde-d599bac8184a/Authenticode_PE.docx
      '5':
        caption: Code Signing
        description: Code Signing Algorithm.
        references:
        - description: 'TN3126: Inside Code Signing: Hashes'
          url: https://developer.apple.com/documentation/technotes/tn3126-inside-code-signing-hashes
      '6':
        caption: App Package
        description: Application Package Signing Algorithm.
        references:
        - description: Sign an MSIX package
          url: https://learn.microsoft.com/en-us/windows/msix/package/signing-package-overview
      '99':
        caption: Other
        description: The algorithm is not mapped. See the `algorithm` attribute, which contains a data source specific value.
  certificate:
    caption: Certificate
    type: object_t
    object: certificate
    requirement: recommended
    description: The certificate object containing information about the digital certificate.
  created_time:
    caption: Created Time
    type: timestamp_t
    requirement: optional
    description: The time when the digital signature was created.
  created_time_dt:
    caption: Created Time
    type: datetime_t
    requirement: optional
    profile: datetime
    description: The time when the digital signature was created.
  developer_uid:
    caption: Developer UID
    type: string_t
    requirement: optional
    description: The developer ID on the certificate that signed the file.
  digest:
    caption: Message Digest
    type: object_t
    object: fingerprint
    requirement: optional
    observable: 30
    description: The message digest attribute contains the fixed length message hash representation and the corresponding hashing algorithm information.
  serialization:
    caption: Serialization
    type: string_t
    requirement: optional
    description: The canonical serialization or signing-envelope scheme used to produce the deterministic byte sequence that was signed, normalized to the caption of `serialization_id`. In the case of `Other`, it is defined by the event source.
  serialization_id:
    caption: Serialization ID
    type: integer_t
    requirement: recommended
    sibling: serialization
    description: The identifier of the normalized canonical serialization or signing-envelope scheme used to produce the deterministic byte sequence that was signed. A verifier must apply the same scheme to reproduce the signing input. Use `Flat` where the signed data is an opaque byte sequence, such as file content, to which no canonical serialization was applied. Distinct from `algorithm_id`, which identifies how the resulting bytes were signed; some signing formats (e.g. `Authenticode`) define their own canonicalization and populate both fields.
    enum:
      '0':
        caption: Unknown
      '1':
        caption: Flat
        description: No canonical serialization or signing envelope was applied; the signature is computed over the data's raw byte sequence, such as the content of a disk file or any other opaque byte stream.
      '2':
        caption: JCS
        description: JSON Canonicalization Scheme - deterministic JSON serialization of the structured data prior to signing.
        references:
        - description: RFC 8785
          url: https://www.rfc-editor.org/rfc/rfc8785
      '3':
        caption: JWS
        description: JSON Web Signature - the JWS Signing Input, i.e. BASE64URL(protected header) '.' BASE64URL(payload).
        references:
        - description: RFC 7515
          url: https://www.rfc-editor.org/rfc/rfc7515
      '4':
        caption: COSE
        description: CBOR Object Signing and Encryption - the CBOR Sig_structure used as the binary signing input.
        references:
        - description: RFC 9052
          url: https://www.rfc-editor.org/rfc/rfc9052
      '5':
        caption: DSSE
        description: 'Dead Simple Signing Envelope - the PAE (Pre-Authentication Encoding) canonical signing input. Note: DSSE is a signing-envelope scheme, not a hash algorithm; any payload hash is carried separately in the fingerprint object.'
        references:
        - description: DSSE specification (secure-systems-lab)
          url: https://github.com/secure-systems-lab/dsse
      '6':
        caption: Authenticode
        description: 'The Portable Executable (PE) Image Hash procedure that canonicalizes the PE structure into the byte sequence fed to the digest, excluding specified header fields and digesting sections in a defined order. Authenticode bundles canonicalization and signing format: when used, `algorithm_id` is also set to the `Authenticode` enum value.'
        references:
        - description: Windows Authenticode Portable Executable Signature Format (Microsoft, 2008)
          url: https://download.microsoft.com/download/9/c/5/9c5b2167-8017-4bae-9fde-d599bac8184a/Authenticode_PE.docx
      '7':
        caption: Code Signing
        description: The procedure that describes how hashes of code and other structures form the Code Directory message that is signed. When used, `algorithm_id` is also set to the `Code Signing` enum value.
        references:
        - description: 'TN3126: Inside Code Signing: Hashes'
          url: https://developer.apple.com/documentation/technotes/tn3126-inside-code-signing-hashes
      '8':
        caption: App Package
        description: The Windows Application Package signing procedure that describes how file hashes are stored in the manifest, and how that manifest is signed.
        references:
        - description: Sign an MSIX package
          url: https://learn.microsoft.com/en-us/windows/msix/package/signing-package-overview
      '99':
        caption: Other
  state:
    caption: State
    type: string_t
    requirement: optional
    description: The digital signature state defines the signature state, normalized to the caption of 'state_id'. In the case of 'Other', it is defined by the event source.
  state_id:
    caption: State ID
    type: integer_t
    requirement: optional
    sibling: state
    description: The normalized identifier of the signature state.
    enum:
      '0':
        caption: Unknown
        description: The state is unknown.
      '1':
        caption: Valid
        description: The digital signature is valid.
      '2':
        caption: Expired
        description: The digital signature is invalid because its timestamp does not fall within the certificate's validity period.
      '3':
        caption: Revoked
        description: The digital signature is invalid due to certificate revocation.
      '4':
        caption: Suspended
        description: The digital signature is invalid due to certificate suspension.
      '5':
        caption: Pending
        description: The digital signature state is pending.
      '6':
        caption: Untrusted
        description: The digital signature is invalid because the certificate is rooted in an untrusted CA or is an untrusted self-signed certificate.
      '7':
        caption: Distrusted
        description: The digital signature is invalid because the certificate is explicitly distrusted. Note that whereas revocation is global, distrust reflects local IT/security policy.
      '8':
        caption: WrongUsage
        description: The digital signature is invalid because the certificate is not intended for code signing purposes.
      '9':
        caption: Bad
        description: The digital signature is cryptographically invalid, e.g. a mismatched digest. This indicates possible tampering.
      '10':
        caption: Broken
        description: The digital signature is malformed and could not be processed.
      '99':
        caption: Other
        description: The state is not mapped. See the `state` attribute, which contains a data source specific value.

# Attributes with `from` but no description are inherited unchanged. Their
# descriptions are in the file of the item that `from` names.
name: rule
caption: Rule
extends: _entity
description: The Rule object describes characteristics of a rule associated with a policy or an event.
constraints:
  at_least_one: [name, uid]
referenced_by:
  objects:
    affected_code: [rule]
    cis_benchmark_result: [rule]
    discovery_details: [rule]
attributes:
  name:
    caption: Name
    type: string_t
    requirement: recommended
    description: The name of the rule that generated the event.
  uid:
    caption: Unique ID
    type: string_t
    requirement: recommended
    description: The unique identifier of the rule that generated the event.
  category:
    caption: Category
    type: string_t
    requirement: optional
    description: The rule category.
  desc:
    caption: Description
    type: string_t
    requirement: optional
    description: The description of the rule that generated the event.
  type:
    caption: Type
    type: string_t
    requirement: optional
    description: The rule type.
  uid_numeric: {caption: Numeric Unique ID, type: long_t, requirement: optional, from: _entity}
  version:
    caption: Version
    type: string_t
    requirement: optional
    description: 'The rule version. For example: `1.1`.'

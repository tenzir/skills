name: _entity
caption: Entity
abstract: true
extends: object
description: The Entity object is an unordered collection of attributes, with a name and unique identifier. It serves as a base object that defines a set of attributes and default constraints available in all objects that extend it.
constraints:
  at_least_one: [name, uid]
attributes:
  name:
    caption: Name
    type: string_t
    requirement: recommended
    description: The name of the entity.
  uid:
    caption: Unique ID
    type: string_t
    requirement: recommended
    description: The unique identifier of the entity.
  uid_numeric:
    caption: Numeric Unique ID
    type: long_t
    requirement: optional
    description: |-
      The `uid` attribute in numeric form where applicable.
      Note: Producers may populate `uid_numeric` only in addition to `uid` and not as an alternative to it.

name: discovery_details
caption: Discovery Details
extends: object
description: The Discovery Details object describes results of a discovery task/job. Each result may be due to the violation of a `rule` associated with a `policy` and have multiple `occurrences`.
referenced_by:
  objects:
    data_classification: [discovery_details]
    data_security: [discovery_details]
attributes:
  count:
    caption: Count
    type: integer_t
    requirement: recommended
    description: The number of discovered entities of the specified type.
  occurrence_details:
    caption: Occurrence Details
    type: object_t
    object: occurrence_details
    requirement: optional
    deprecated:
      since: 1.4.0
      message: Use `occurrences` instead.
      superseded_by: [occurrences]
    description: Details about where in the target entity, specified information was discovered. Only the attributes, relevant to the target entity type should be populated.
  occurrences:
    caption: Occurrences
    type: object_t
    object: occurrence_details
    array: true
    requirement: optional
    description: Details about where in the target entity, specified information was discovered. Only the attributes, relevant to the target entity type should be populated.
  rule:
    caption: Rule
    type: object_t
    object: rule
    requirement: recommended
    description: The rule associated with this discovery, usually part of the higher level `policy` from an enclosing class or object.
  type:
    caption: Type
    type: string_t
    requirement: recommended
    description: The specific type of information that was discovered. e.g. `name, phone_number, etc.`
  value:
    caption: Value
    type: string_t
    requirement: optional
    description: Optionally, the specific value of discovered information.

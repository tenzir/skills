attributes:
  algorithm:
    caption: Algorithm
    type: string_t
    requirement: optional
    description: The algorithm or scheme used to create the fingerprint, normalized to the caption of `algorithm_id`. In the case of `Other`, it is defined by the event source.
  algorithm_id:
    caption: Algorithm ID
    type: integer_t
    requirement: required
    sibling: algorithm
    description: The identifier of the normalized algorithm or scheme, which was used to create the fingerprint.
    enum:
      '0':
        caption: Unknown
        description: The algorithm is unknown.
      '1':
        caption: MD5
        description: MD5 message-digest algorithm producing a 128-bit (16-byte) hash value.
        references:
        - description: RFC 1321
          url: https://www.rfc-editor.org/rfc/rfc1321
      '2':
        caption: SHA-1
        description: Secure Hash Algorithm 1 producing a 160-bit (20-byte) hash value.
        references:
        - description: FIPS 180
          url: https://csrc.nist.gov/pubs/fips/180-4/upd1/final
      '3':
        caption: SHA-256
        description: Secure Hash Algorithm 2 producing a 256-bit (32-byte) hash value.
        references:
        - description: FIPS 180
          url: https://csrc.nist.gov/pubs/fips/180-4/upd1/final
      '4':
        caption: SHA-512
        description: Secure Hash Algorithm 2 producing a 512-bit (64-byte) hash value.
        references:
        - description: FIPS 180
          url: https://csrc.nist.gov/pubs/fips/180-4/upd1/final
      '5':
        caption: CTPH
        description: The ssdeep generated fuzzy checksum. Also known as Context Triggered Piecewise Hash (CTPH).
      '6':
        caption: TLSH
        description: The TLSH fuzzy hashing algorithm.
      '7':
        caption: quickXorHash
        description: Microsoft simple non-cryptographic hash algorithm that works by XORing the bytes in a circular-shifting fashion.
      '8':
        caption: SHA-224
        description: Secure Hash Algorithm 2 producing a 224-bit (28-byte) hash value.
        references:
        - description: FIPS 180
          url: https://csrc.nist.gov/pubs/fips/180-4/upd1/final
      '9':
        caption: SHA-384
        description: Secure Hash Algorithm 2 producing a 384-bit (48-byte) hash value.
        references:
        - description: FIPS 180
          url: https://csrc.nist.gov/pubs/fips/180-4/upd1/final
      '10':
        caption: SHA-512/224
        description: Secure Hash Algorithm 2 producing a 512-bit (64-byte) hash value truncated to a 224-bit (28-byte) hash value.
        references:
        - description: FIPS 180
          url: https://csrc.nist.gov/pubs/fips/180-4/upd1/final
      '11':
        caption: SHA-512/256
        description: Secure Hash Algorithm 2 producing a 512-bit (64-byte) hash value truncated to a 256-bit (32-byte) hash value.
        references:
        - description: FIPS 180
          url: https://csrc.nist.gov/pubs/fips/180-4/upd1/final
      '12':
        caption: SHA3-224
        description: Secure Hash Algorithm 3 producing a 224-bit (28-byte) hash value.
        references:
        - description: FIPS 202
          url: https://csrc.nist.gov/pubs/fips/202/final
      '13':
        caption: SHA3-256
        description: Secure Hash Algorithm 3 producing a 256-bit (32-byte) hash value.
        references:
        - description: FIPS 202
          url: https://csrc.nist.gov/pubs/fips/202/final
      '14':
        caption: SHA3-384
        description: Secure Hash Algorithm 3 producing a 384-bit (48-byte) hash value.
        references:
        - description: FIPS 202
          url: https://csrc.nist.gov/pubs/fips/202/final
      '15':
        caption: SHA3-512
        description: Secure Hash Algorithm 3 producing a 512-bit (64-byte) hash value.
        references:
        - description: FIPS 202
          url: https://csrc.nist.gov/pubs/fips/202/final
      '16':
        caption: xxHash H3 64-bit
        description: xxHash H3 producing a 64-bit hash value.
        references:
        - description: xxHASH H3
          url: https://xxhash.com/doc/v0.8.3/group___x_x_h3__family.html
      '17':
        caption: xxHash H3 128-bit
        description: xxHash H3 producing a 128-bit hash value.
        references:
        - description: xxHASH H3
          url: https://xxhash.com/doc/v0.8.3/group___x_x_h3__family.html
      '18':
        caption: Imphash
        description: Import hash (imphash) based on the import table of a Portable Executable (PE) file producing a 128-bit (16-byte) hash value.
        references:
        - description: Tracking Malware with Import Hashing
          url: https://cloud.google.com/blog/topics/threat-intelligence/tracking-malware-import-hashing/
      '19':
        caption: NPF
        description: Network Protocol Fingerprint (NPF) used to identify network protocols and applications.
        references:
        - description: Mercury Network Protocol Fingerprint Documentation
          url: https://github.com/cisco/mercury/blob/main/doc/npf.md
      '20':
        caption: HASSH
        description: HASSH is a network fingerprinting standard which can be used to identify specific SSH client and server implementations.
      '99':
        caption: Other
        description: The algorithm is not mapped. See the `algorithm` attribute, which contains a data source specific value.
  encoding:
    caption: Encoding
    type: string_t
    requirement: optional
    description: The encoding of the `value` attribute, normalized to the caption of `encoding_id`. In the case of `Other`, it is defined by the event source.
  encoding_id:
    caption: Encoding ID
    type: integer_t
    requirement: recommended
    sibling: encoding
    description: The normalized identifier of the encoding used to represent the fingerprint bytes as the string in `value`. A verifier must decode `value` using this encoding to recover the raw hash bytes.
    enum:
      '0':
        caption: Unknown
        description: The encoding of the fingerprint value is not known.
      '1':
        caption: Hex
        description: The fingerprint value is encoded as a lowercase or uppercase hexadecimal string.
      '2':
        caption: Base64
        description: The fingerprint value is encoded using standard Base64.
        references:
        - description: RFC 4648, Section 4
          url: https://www.rfc-editor.org/rfc/rfc4648#section-4
      '3':
        caption: Base64URL
        description: The fingerprint value is encoded using URL- and filename-safe Base64.
        references:
        - description: RFC 4648, Section 5
          url: https://www.rfc-editor.org/rfc/rfc4648#section-5
      '99':
        caption: Other
        description: The encoding of the fingerprint value is not mapped. See the `encoding` attribute, which contains a data source specific value.
  serialization:
    caption: Serialization
    type: string_t
    requirement: optional
    description: The canonical serialization scheme used to produce the deterministic byte sequence that was fingerprinted, normalized to the caption of `serialization_id`. In the case of `Other`, it is defined by the event source.
  serialization_id:
    caption: Serialization ID
    type: integer_t
    requirement: optional
    sibling: serialization
    description: The identifier of the normalized canonical serialization scheme used to produce the deterministic byte sequence that was fingerprinted. A verifier must apply the same scheme to reproduce the fingerprinted input. Use `Flat` where the fingerprinted data is an opaque byte sequence, such as file content, to which no canonical serialization was applied. Distinct from `algorithm_id`, which identifies how the resulting bytes were hashed.
    enum:
      '0':
        caption: Unknown
      '1':
        caption: Flat
        description: No canonical serialization was applied; the fingerprint is computed over the data's raw byte sequence, such as the content of a disk file or any other opaque byte stream.
      '2':
        caption: JCS
        description: JSON Canonicalization Scheme - deterministic JSON serialization of the structured data prior to hashing.
        references:
        - description: RFC 8785
          url: https://www.rfc-editor.org/rfc/rfc8785
      '3':
        caption: JWS
        description: JSON Web Signature - the JWS Signing Input, i.e. BASE64URL(protected header) '.' BASE64URL(payload).
        references:
        - description: RFC 7515
          url: https://www.rfc-editor.org/rfc/rfc7515
      '4':
        caption: COSE
        description: CBOR Object Signing and Encryption - the CBOR Sig_structure used as the binary input.
        references:
        - description: RFC 9052
          url: https://www.rfc-editor.org/rfc/rfc9052
      '5':
        caption: DSSE
        description: 'Dead Simple Signing Envelope - the PAE (Pre-Authentication Encoding) canonical input. Note: DSSE is a signing-envelope scheme, not a hash algorithm; the hash algorithm is carried in `algorithm_id`.'
        references:
        - description: DSSE specification (secure-systems-lab)
          url: https://github.com/secure-systems-lab/dsse
      '6':
        caption: Authenticode
        description: The Portable Executable (PE) Image Hash procedure that canonicalizes the PE structure into the byte sequence fed to the digest, excluding specified header fields and digesting sections in a defined order.
        references:
        - description: Windows Authenticode Portable Executable Signature Format (Microsoft, 2008)
          url: https://download.microsoft.com/download/9/c/5/9c5b2167-8017-4bae-9fde-d599bac8184a/Authenticode_PE.docx
      '7':
        caption: Code Signing
        description: The procedure that describes how hashes of code and other structures form the Code Directory message that is digested.
        references:
        - description: 'TN3126: Inside Code Signing: Hashes'
          url: https://developer.apple.com/documentation/technotes/tn3126-inside-code-signing-hashes
      '8':
        caption: App Package
        description: The Windows Application Package signing procedure that describes how file hashes are stored in the manifest, and how that manifest is signed.
        references:
        - description: Sign an MSIX package
          url: https://learn.microsoft.com/en-us/windows/msix/package/signing-package-overview
      '99':
        caption: Other
  value:
    caption: Value
    type: file_hash_t
    requirement: required
    observable: 8
    description: |-
      The fingerprint value.

      Note: This uses type `file_hash_t` ("Hash"), which has been generalized for all fingerprints but retains the same name and caption for backwards compatibility.
